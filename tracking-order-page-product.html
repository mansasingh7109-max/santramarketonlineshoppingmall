<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking - SANTRA - V23 Undefined Fix</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
body{font-family:Arial;background:#f1f3f6;padding:8px}
.card{background:#fff;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.step{display:flex;gap:10px;margin:14px 0}
.circle{width:32px;height:32px;border-radius:50%;background:#e5e7eb;color:#9ca3af;display:flex;align-items:center;justify-content:center;font-weight:bold;border:2px solid #d1d5db}
.circle.green{background:#10b981;color:#fff;border-color:#10b981}
.circle.active{box-shadow:0 0 0 4px rgba(16,185,129,.2)}
.line{width:2px;background:#e5e7eb;margin-left:15px;height:18px}
.line.green{background:#10b981}
.info b{font-size:12px}
.info small{font-size:11px;color:#555;display:block;margin-top:3px;line-height:1.6}
</style>
</head><body>
<div id="root"><div class="card" style="text-align:center">Loading Tracking - V23...</div></div>
<script>
function getDB(){try{if(window.db&&window.db.collection)return window.db;if(!firebase.apps.length){let c=window.firebaseConfig||window.SANTRA_CONFIG||{apiKey:"AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",authDomain:"santramarketshoppingmall.firebaseapp.com",projectId:"santramarketshoppingmall"};firebase.initializeApp(c);}return firebase.firestore();}catch(e){return firebase.firestore();}}
var db=getDB();
async function load(){
let p=new URLSearchParams(location.search);let oid=p.get('orderId')||p.get('id')||localStorage.getItem('lastOrderId')||'';
if(!oid){document.getElementById('root').innerHTML='<div class="card">Order ID nahi mila</div>';return;}
let doc=await db.collection('orders').doc(oid).get();if(!doc.exists){document.getElementById('root').innerHTML='<div class="card">Order nahi mila</div>';return;}
let o=doc.data();o.id=doc.id;
let s=(o.status||'').toLowerCase();let idx=0;
if(s.includes('pending')) idx=0; if(s.includes('confirm')) idx=1; if(s.includes('pack')) idx=2; if(s.includes('shipping')&&!s.includes('shipped')) idx=3; if(s.includes('shipped')) idx=4; if(s.includes('out for')) idx=5; if(s.includes('delivered')&&!s.includes('out')) idx=6;
let safe = (v, fallback='Team will update shortly') => { if(v===undefined||v===null||v==''||v=='--'|| (typeof v==='string'&&v.includes('undefined'))) return fallback; return v; };
let steps=[
{title:'Order Confirmed',desc:`Tracking Location: ${safe(o.currentTrackingLocation,'Santrajet Mall Warehouse, Jaipur - Ready to Ship')}<br>Status: ${safe(o.status,'Pending - OTP Wait')} | Courier: ${safe(o.courierName,'Delhivery / Ekart')}<br>AWB: ${safe(o.trackingNumber,'Team will update shortly')}<br>Date: ${safe(o.dateTimeHamesha,'')}<br><span style="color:#10b981">You will receive every update</span>`},
{title:'Order Packed',desc: o.packedDate ? `${safe(o.packedDate)}<br>Location: ${safe(o.currentTrackingLocation)}` : `Team will update after packing`},
{title:'Package Shipped',desc: o.shippedDate ? `${safe(o.shippedDate)}<br>Courier: ${safe(o.courierName)} | AWB: ${safe(o.trackingNumber)}` : `Team will update after shipping`},
{title:'Out For Delivery',desc: o.outForDeliveryDate ? `${safe(o.outForDeliveryDate)}<br>City: ${safe(o.trackingCity)}` : `Team will update - Out for delivery soon`},
{title:'Order Delivered',desc: o.deliveredDate ? `${safe(o.deliveredDate)}` : `Will update after delivery`},
];
let html=`<div class="card"><b>Order: ${o.id}</b> | SANTRAJET MALL</div><div class="card" style="background:#111;color:#fff;font-weight:800;text-align:center">FOLLOW YOUR ORDER</div><div class="card">`;
steps.forEach((st,i)=>{
let green=i<=idx;let cls=green?'circle green'+(i==idx?' active':''):'circle';let tick=green?'✓':'○';
let icons=['📋✅','📦','🚚','🏃📦','📦'];
html+=`<div class="step"><div class="${cls}">${tick}</div><div class="info"><b style="color:${green?'#10b981':'#9ca3af'}">${icons[i]} ${st.title}</b><small>${st.desc}</small></div></div>`;
if(i<steps.length-1) html+=`<div class="line ${i<idx?'green':''}"></div>`;
});
html+=`</div>`;
let items=o.items||o.cart||[];let sub=0;let itemHtml='';
if(Array.isArray(items)){items.forEach((it,k)=>{let q=it.qty||1;let pr=it.price||0;sub+=q*pr;let size=it.size||'M';itemHtml+=`${k+1}. ${it.name||'Product'} (Size ${size}) - Qty: ${q} x ₹${pr} = ₹${q*pr}<br>`;});}
let infoMsg = safe(o.customerMessage||o.trackingAIMessage||o.adminNote||`Your product has left ${safe(o.currentTrackingLocation,'Santrajet Mall Warehouse')} - ${safe(o.trackingCity,'Jaipur')}`,'Your product has left warehouse - Team will update shortly');
html+=`<div class="card" style="border:2px dashed #f59e0b;background:#fffbeb"><b>SANTRA MALL - Order Screenshot - V23 Per Customer</b><br>Order ID: ${o.id}<br>Date: ${safe(o.dateTimeHamesha)}<br>Sold By: Santra Mall<br><br>${itemHtml}<br>Subtotal: ₹${o.subtotal||sub} | Delivery: ₹${o.deliveryCharge||49} | <b>Grand Total: ₹${o.grandTotal||sub+49}</b><br>Payment: ${o.paymentMethod||'COD'}<br>Customer: ${o.customerName||''} | ${o.mobile||''}<br><br><b>Information from Santrajet Mall:</b><br>${infoMsg}</div>`;
document.getElementById('root').innerHTML=html;
}
window.addEventListener('load',load);
</script></body></html>
