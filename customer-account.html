// ✅ NAYA CODE: window se config lo - SAFE HAI
const firebaseConfig = window.firebaseConfig || {
  apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
  authDomain: "santramarketshoppingmall.firebaseapp.com",
  projectId: "santramarketshoppingmall",
  storageBucket: "santramarketshoppingmall.appspot.com",
  messagingSenderId: "398490252924",
  appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
  measurementId: "G-ZW1ZR8HETY",
  databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com/"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ✅ CUSTOMER_KEY constants.js se
const CUSTOMER_KEY = window.CUSTOMER_KEY || "santra_customer";

// ✅ Iframe height auto adjust
function resizeIframe(obj) {
  setTimeout(() => {
    try {
      obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
    } catch(e) {
      console.warn('Iframe resize error:', e);
    }
  }, 200);
}

// ✅ Login ya Profile update hone pe header photo update karo
window.addEventListener('message', function(e) {
  if (e.data.type === 'loginSuccess' || e.data.type === 'profileUpdated') {
    loadHeaderPhoto();
    document.getElementById('profileFrame').contentWindow.location.reload();
  }
  if (e.data.type === 'resizeIframe') {
    // Child iframe se height aayi
    const iframe = document.getElementById(e.data.iframeId);
    if (iframe) iframe.style.height = e.data.height + 'px';
  }
});

// ✅ Header photo load karo - CUSTOMER_KEY use karo
function loadHeaderPhoto() {
  const mobile = localStorage.getItem(CUSTOMER_KEY + '_whatsapp_mobile');
  if (mobile) {
    db.collection('customers').doc(mobile).get().then(doc => {
      if (doc.exists && doc.data().photo) {
        document.getElementById('headerPhoto').src = doc.data().photo;
      }
    }).catch(err => {
      console.warn('Header photo load error:', err);
    });
  }
}

window.addEventListener('load', loadHeaderPhoto);
</script>
