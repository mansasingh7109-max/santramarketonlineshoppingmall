const firebaseConfig = window.firebaseConfig || {
  apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
  authDomain: "santramarketshoppingmall.firebaseapp.com",
  projectId: "santramarketshoppingmall",
  storageBucket: "santramarketshoppingmall.appspot.com",
  messagingSenderId: "398490252924",
  appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
  measurementId: "G-ZW1ZR8HETY",
  databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com/"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const CUSTOMER_KEY = window.CUSTOMER_KEY || "santra_customer";
const BASE_URL = window.BASE_URL || "https://santramarketshoppingmall.web.app";

// ✅ Single resize function - Duplicate hata diya
function resizeIframe(obj){
  setTimeout(()=>{
    try{
      let h = obj.contentWindow.document.documentElement.scrollHeight;
      if(h>100) obj.style.height = h + 30 + 'px';
    }catch(e){}
  }, 400);
}

function checkLoginAndToggle(){
  const mobile = localStorage.getItem(CUSTOMER_KEY + '_whatsapp_mobile') || localStorage.getItem(CUSTOMER_KEY + '_customer_mobile');
  const loginFrame = document.getElementById('loginFrame');
  const profileFrame = document.getElementById('profileFrame');
  const badge = document.getElementById('loginBadge');
  
  if(mobile){
    loginFrame.classList.add('hide');
    profileFrame.classList.remove('hide');
    badge.innerHTML = `✅ Logged in: ${mobile} | <a href="orders.html" style="color:#e40046;font-weight:bold">📦 My Orders</a> | OTP 4 hours valid`;
    loadHeaderPhoto();
    profileFrame.src = 'profile.html?v=' + Date.now();
  } else {
    loginFrame.classList.remove('hide');
    profileFrame.classList.remove('hide');
    badge.innerHTML = `🔐 Login OTP 4 hours valid - Har Order pe naya OTP - Pehle Login karo`;
    document.getElementById('headerPhoto').src = 'https://via.placeholder.com/45?text=👤';
  }
}

window.addEventListener('message', function(e){
  if(e.data.type === 'loginSuccess'){
    setTimeout(()=>{ checkLoginAndToggle(); }, 800);
  }
  if(e.data.type === 'profileUpdated'){
    loadHeaderPhoto();
    checkLoginAndToggle();
  }
  if(e.data.type === 'logout'){
    localStorage.removeItem(CUSTOMER_KEY + '_whatsapp_mobile');
    localStorage.removeItem(CUSTOMER_KEY + '_customer_mobile');
    checkLoginAndToggle();
    document.getElementById('loginFrame').src = 'customer-login.html?v=' + Date.now();
  }
  if(e.data.type === 'resizeIframe' && e.data.height){
    let iframe = document.getElementById(e.data.iframeId);
    if(iframe) iframe.style.height = e.data.height + 'px';
  }
});

function loadHeaderPhoto(){
  const mobile = localStorage.getItem(CUSTOMER_KEY + '_whatsapp_mobile');
  if(!mobile) return;
  db.collection('customers').doc(mobile).get().then(doc=>{
    if(doc.exists && doc.data().photo){
      document.getElementById('headerPhoto').src = doc.data().photo;
    }
  }).catch(()=>{});
}

window.addEventListener('load', ()=>{
  checkLoginAndToggle();
  loadHeaderPhoto();
  setInterval(()=>{
    document.querySelectorAll('iframe').forEach(f=>{
      try{ 
        let h = f.contentWindow.document.documentElement.scrollHeight;
        if(h>150) f.style.height = h+30+'px';
      }catch(e){}
    });
  }, 1200);
});

console.log("✅ customer-account.html FINAL CLEAN 15 JULY - NO DUPLICATE");
