<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile - SANTRA MALL</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#f1f3f6;display:flex;flex-direction:column;min-height:100vh}
    .header{background:#1a1a2e;color:white;padding:15px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
    .header img{width:45px;height:45px;border-radius:50%;border:2px solid #e94560;object-fit:cover;background:#f0f0f0}
    .header h1{color:#e94560;font-size:22px}
    .container{padding:20px;max-width:600px;margin:0 auto;flex:1}
    .footer{background:#1a1a2e;color:white;text-align:center;padding:15px;font-size:14px;margin-top:auto}
    .footer span{color:#e94560;font-weight:bold}
    iframe{width:100%;border:none;border-radius:15px;margin-bottom:20px;background:white;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
  </style>
</head>
<body>

<div class="header">
  <img id="headerPhoto" src="https://via.placeholder.com/45?text=👤">
  <h1>Customer Profile</h1>
</div>

<div class="container">
  <!-- ✅ 1ST POPUP: Customer Login -->
  <iframe id="loginFrame" src="customer-login.html" onload="resizeIframe(this)"></iframe>

  <!-- ✅ 2ND POPUP: Profile Details -->
  <iframe id="profileFrame" src="profile.html" onload="resizeIframe(this)"></iframe>
</div>

<div class="footer">
  Powered by <span>santrajet mall</span>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXX",
  authDomain: "santramarketshoppingmall.firebaseapp.com",
  projectId: "santramarketshoppingmall"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ✅ Iframe height auto adjust
function resizeIframe(obj) {
  setTimeout(() => {
    obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
  }, 200);
}

// ✅ Login ya Profile update hone pe header photo update karo
window.addEventListener('message', function(e) {
  if (e.data.type === 'loginSuccess' || e.data.type === 'profileUpdated') {
    loadHeaderPhoto();
    document.getElementById('profileFrame').contentWindow.location.reload();
  }
});

// ✅ Header photo load karo
function loadHeaderPhoto() {
  const mobile = localStorage.getItem('santra_whatsapp_mobile');
  if (mobile) {
    db.collection('customers').doc(mobile).get().then(doc => {
      if (doc.exists && doc.data().photo) {
        document.getElementById('headerPhoto').src = doc.data().photo;
      }
    });
  }
}

window.addEventListener('load', loadHeaderPhoto);
</script>
</body>
</html>
