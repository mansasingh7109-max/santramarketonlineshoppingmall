<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SANTRA MALL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f1f3f6; }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .hide { display: none !important; }
        .login-box h2 { color: #e40046; text-align: center; margin-bottom: 15px; }
        .login-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        .login-box button { width: 100%; padding: 14px; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .profile-header { text-align: center; }
        .profile-pic { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #e40046; margin-bottom: 10px; }
        .stats { display: flex; gap: 10px; margin-top: 15px; }
        .stat-box { flex: 1; background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-box b { display: block; font-size: 24px; color: #e40046; }
        .stat-box span { font-size: 12px; color: #666; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #333; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .save-btn { width: 100%; padding: 14px; background: #e40046; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .logout-btn { width: 100%; padding: 12px; background: #666; color: white; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        .mychoice-item, .order-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .mychoice-item:last-child, .order-item:last-child { border-bottom: none; }
        .mychoice-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; float: left; margin-right: 10px; }
        .mychoice-item p { font-size: 13px; margin: 0; }
        .mychoice-item b { color: #e40046; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- LOGIN BOX -->
        <div class="card login-box" id="loginBox">
            <h2>🔐 Login with WhatsApp OTP</h2>
            <p style="color:#666;font-size:13px;margin-bottom:15px;text-align:center">Profile dekhne ke liye login kare</p>
            
            <div id="step1_mobile">
                <input type="tel" id="loginMobile" placeholder="WhatsApp Mobile Number *" maxlength="10">
                <button id="sendOtpBtn" onclick="sendOTP()">📱 Send OTP on WhatsApp</button>
            </div>

            <div id="otpBox" class="hide">
                <div style="background:#fff3cd;border-left:4px solid #ffc107;padding:15px;border-radius:8px;margin:15px 0">
                    <h3 style="margin:0 0 8px 0;color:#856404;font-size:16px">🔐 OTP Verification Required</h3>
                    <p style="margin:5px 0;color:#856404;font-size:13px">Santrajet ne aapke WhatsApp <b id="showMobileOTP"></b> pe OTP bheja hai.</p>
                </div>
                <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" style="width:100%;padding:15px;margin:10px 0;border:2px solid #ffc107;border-radius:8px;text-align:center;font-size:20px;letter-spacing:10px;font-weight:bold">
                <button onclick="verifyOTP()" style="width:100%;padding:14px;background:#25D366;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:10px;cursor:pointer">✅ Verify & Continue</button>
                <button onclick="changeNumber()" style="width:100%;padding:12px;background:#666;color:white;border:none;border-radius:8px;margin-top:8px;cursor:pointer">← Login as Other Number</button>
            </div>
        </div>

        <!-- PROFILE BOX -->
        <div class="card profile-box hide" id="profileBox">
            <div class="profile-header">
                <img id="profilePic" class="profile-pic" src="https://cdn-icons-png.flaticon.com/128/1077/1077114.png" alt="Profile">
                <input type="file" id="photoInput" accept="image/*" style="display:none">
                <button onclick="document.getElementById('photoInput').click()" style="background:#e40046;color:white;border:none;padding:8px 15px;border-radius:5px;font-size:12px;cursor:pointer">Change Photo</button>
            </div>

            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="mobileNum" readonly style="background:#f5f5f5">
            </div>
            <div class="form-group">
                <label>Email (Optional)</label>
                <input type="email" id="emailId" placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Full Address</label>
                <input type="text" id="fullAddress" placeholder="House no, Street, City, PIN">
            </div>

            <button class="save-btn" onclick="saveProfile()">💾 Save Profile</button>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>

        <!-- STATS -->
        <div class="stats" id="stats">
            <div class="stat-box">
                <b id="totalOrders">0</b>
                <span>Total Orders</span>
            </div>
            <div class="stat-box">
                <b id="totalSpent">₹0</b>
                <span>Total Spent</span>
            </div>
        </div>

        <!-- MY CHOICE -->
        <div class="card" id="myChoiceCard">
            <h3 style="color:#e40046;margin-bottom:15px">😍 My Choice</h3>
            <div id="myChoiceList"></div>
            <button onclick="window.location.href='mychoice.html'" style="width:100%;padding:12px;background:#e40046;color:white;border:none;border-radius:8px;margin-top:10px;font-weight:bold;cursor:pointer">View All My Choice →</button>
        </div>

        <!-- MY ORDERS -->
        <div class="card" id="ordersCard">
            <h3 style="color:#e40046;margin-bottom:15px">📦 My Orders</h3>
            <div id="ordersList"></div>
            <button onclick="window.location.href='orders.html'" style="width:100%;padding:12px;background:#ff9800;color:white;border:none;border-radius:8px;margin-top:10px;font-weight:bold;cursor:pointer">View All Orders →</button>
        </div>

    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="./secrets.js"></script>
    
    <!-- ✅ JS FILE LINK KAR - YAHI SAHI TAREEKA HAI -->
    <script src="customer-account.js"></script>
</body>
</html>
