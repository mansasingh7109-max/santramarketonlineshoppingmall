<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Profile - SANTRA MALL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f3f6;display:flex;flex-direction:column;min-height:100vh}
.header{background:#1a1a2e;color:white;padding:12px;display:flex;align-items:center;justify-content:center;gap:10px}
.header img{width:40px;height:40px;border-radius:50%;border:2px solid #e94560;object-fit:cover;background:#fff}
.header h1{color:#e94560;font-size:20px}
.container{padding:15px;max-width:650px;margin:0 auto;flex:1;width:100%}
.footer{background:#1a1a2e;color:white;text-align:center;padding:12px;font-size:13px;margin-top:auto}
.footer span{color:#e94560;font-weight:bold}
iframe{width:100%;border:none;border-radius:12px;margin-bottom:18px;background:white;box-shadow:0 4px 15px rgba(0,0,0,0.08);min-height:350px}
</style>
</head>
<body>
<div class="header">
<img id="headerPhoto" src="https://via.placeholder.com/40?text=👤">
<h1>Customer Profile</h1>
</div>

<div class="container">
<!-- Photo 1 jaisa - 2 iframe simple - Pehle jaisa -->
<iframe id="loginFrame" src="customer-login.html?v=3" onload="resizeIframe(this)"></iframe>
<iframe id="profileFrame" src="profile.html?v=3" onload="resizeIframe(this)"></iframe>
</div>

<div class="footer">Powered by <span>santrajet mall</span></div>

<!-- ✅ ORDER: constants.js -> config.js - Tere master files -->
<script src="constants.js?v=3"></script>
<script src="config.js?v=8"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
/*
⚠️ OLD CODE SAVE - 25 JUNE WALA - KUCH HATAYA NAHI

// ✅ NAYA - TERA constants.js + config.js FOLLOW - FINAL 15 JULY
if(typeof window.CUSTOMER_KEY === 'undefined'){ window.CUSTOMER_KEY = "santra_customer"; }
if(typeof window.firebaseConfig === 'undefined'){
  window.firebaseConfig = {
    apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
    authDomain: "santramarketshoppingmall.firebaseapp.com",
    projectId: "santramarketshoppingmall",
    storageBucket: "santramarketshoppingmall.appspot.com",
    messagingSenderId: "398490252924",
    appId: "1:398490252924:web:d1b6348b549183b93b7bf9"
  };
}
try{
  if(typeof window.initFirebaseOnce === 'function'){
    window.initFirebaseOnce(window.firebaseConfig);
  } else if(!firebase.apps.length){
    firebase.initializeApp(window.firebaseConfig);
  }
}catch(e){ console.log("Firebase:", e.message); }

const db = window.db || firebase.firestore();
const CUSTOMER_KEY = window.CUSTOMER_KEY;

console.log("✅ Account - Following YOUR constants.js - CART_KEY:", window.CART_KEY, "BASE_URL:", window.BASE_URL);

function resizeIframe(obj){
  setTimeout(()=>{
    try{
      let h = obj.contentWindow.document.documentElement.scrollHeight;
      if(h>100) obj.style.height = (h+40)+'px';
    }catch(e){}
  },400);
}
window.resizeIframe = resizeIframe;

window.addEventListener('message', function(e){
  if(e.data.type==='loginSuccess' || e.data.type==='profileUpdated'){
    loadHeaderPhoto();
    try{ 
      const pf = document.getElementById('profileFrame');
      if(pf && pf.contentWindow) pf.contentWindow.location.reload(); 
    }catch(err){}
    // Login iframe bhi reload karo - Success dikhane ke liye
    try{
      const lf = document.getElementById('loginFrame');
      if(lf && e.data.type==='loginSuccess') lf.contentWindow.location.reload();
    }catch(err){}
  }
  if(e.data.type==='logout'){
    localStorage.removeItem(CUSTOMER_KEY+'_whatsapp_mobile');
    localStorage.removeItem(CUSTOMER_KEY+'_customer_mobile');
    localStorage.removeItem(CUSTOMER_KEY+'_profile');
    localStorage.removeItem('santra_whatsapp_mobile');
    localStorage.removeItem('santra_customer_mobile');
    document.getElementById('headerPhoto').src = "https://via.placeholder.com/40?text=👤";
    setTimeout(()=> location.reload(), 500);
  }
  if(e.data.type==='resizeIframe' && e.data.height){
    let f = document.getElementById(e.data.iframeId) || document.getElementById('profileFrame');
    if(e.data.iframeId){
      f = document.getElementById(e.data.iframeId);
    }
    if(f && e.data.height > 100) f.style.height = e.data.height+'px';
  }
});

function loadHeaderPhoto(){
  const m = localStorage.getItem(CUSTOMER_KEY+'_whatsapp_mobile') || localStorage.getItem('santra_whatsapp_mobile');
  if(!m) return;
  db.collection('customers').doc(m).get().then(d=>{
    if(d.exists && d.data().photo){
      document.getElementById('headerPhoto').src = d.data().photo; // Base64 bhi chalega - Free plan!
    }
  }).catch(()=>{});
}
window.addEventListener('load', function(){
  loadHeaderPhoto();
  console.log("✅ Customer account loaded - Photo 1 jaisa");
});
</script>
</body>
</html>
