<script>

if(typeof window.CUSTOMER_KEY === 'undefined'){ window.CUSTOMER_KEY = "santra_customer"; }
if(typeof window.firebaseConfig === 'undefined'){
  window.firebaseConfig = {
    apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
    authDomain: "santramarketshoppingmall.firebaseapp.com",
    projectId: "santramarketshoppingmall",
    storageBucket: "santramarketshoppingmall.appspot.com",
    messagingSenderId: "398490252924",
    appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
    measurementId: "G-ZW1ZR8HETY",
    databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com/"
  };
}
try{
  if(typeof window.initFirebaseOnce === 'function'){ window.initFirebaseOnce(window.firebaseConfig); }
  else if(!firebase.apps.length){ firebase.initializeApp(window.firebaseConfig); }
}catch(e){}

const db = window.db || firebase.firestore();
const CUSTOMER_KEY = window.CUSTOMER_KEY;

console.log("✅ Account V20 - Login No = OTP + Extra Delivery - CART_KEY:", window.CART_KEY, "BASE_URL:", window.BASE_URL);

function resizeIframe(obj){
  setTimeout(()=>{
    try{
      let h = obj.contentWindow.document.documentElement.scrollHeight;
      if(h>100) obj.style.height = (h+40)+'px';
    }catch(e){}
  },400);
}
window.resizeIframe = resizeIframe;

window.addEventListener('message', function(e){
  // V20 - Login+Extra flow
  if(e.data.type==='loginSuccess' || e.data.type==='profileUpdated'){
    let loginMob = e.data.mobile || e.data.loginMobile || '';
    let deliveryMob = e.data.deliveryMobile || e.data.extraDeliveryMobile || '';
    if(loginMob) localStorage.setItem('santra_mobile', loginMob);
    if(deliveryMob) localStorage.setItem('santra_deliveryMobile', deliveryMob);
    if(loginMob) localStorage.setItem('santra_whatsapp_mobile', loginMob);
    // Update header and reload profile
    loadHeaderPhoto();
    try{ 
      const pf = document.getElementById('profileFrame');
      if(pf && pf.contentWindow) pf.contentWindow.location.reload(); 
    }catch(err){}
    try{
      const lf = document.getElementById('loginFrame');
      if(lf && e.data.type==='loginSuccess') lf.contentWindow.location.reload();
    }catch(err){}
  }
  if(e.data.type==='logout'){
    localStorage.removeItem(CUSTOMER_KEY+'_whatsapp_mobile');
    localStorage.removeItem(CUSTOMER_KEY+'_customer_mobile');
    localStorage.removeItem(CUSTOMER_KEY+'_profile');
    localStorage.removeItem(CUSTOMER_KEY+'_login_mobile');
    localStorage.removeItem(CUSTOMER_KEY+'_delivery_mobile');
    localStorage.removeItem('santra_whatsapp_mobile');
    localStorage.removeItem('santra_mobile');
    localStorage.removeItem('santra_deliveryMobile');
    document.getElementById('headerPhoto').src = "https://via.placeholder.com/40?text=👤";
    setTimeout(()=> location.reload(), 500);
  }
  if(e.data.type==='resizeIframe' && e.data.height){
    let f = document.getElementById(e.data.iframeId) || document.getElementById('profileFrame');
    if(e.data.iframeId){ f = document.getElementById(e.data.iframeId); }
    if(f && e.data.height > 100) f.style.height = e.data.height+'px';
  }
});

function loadHeaderPhoto(){
  const m = localStorage.getItem(CUSTOMER_KEY+'_whatsapp_mobile') || localStorage.getItem('santra_whatsapp_mobile') || localStorage.getItem('santra_mobile');
  if(!m) return;
  db.collection('customers').doc(m).get().then(d=>{
    if(d.exists){
      let data = d.data();
      if(data.photo){ document.getElementById('headerPhoto').src = data.photo; }
      // Also sync delivery mobile if exists
      let dm = data.deliveryMobile || data.extraDeliveryMobile || data.alternateMobile || '';
      if(dm) localStorage.setItem('santra_deliveryMobile', dm);
      // Sync full customer object for orders.html V25
      try{
        let existing = {}; try{ existing = JSON.parse(localStorage.getItem('santra_customer')||'{}'); }catch(e){}
        let updated = {...existing, ...data, loginMobile: data.loginMobile||data.whatsappMobile||m, deliveryMobile: dm, extraDeliveryMobile: dm};
        localStorage.setItem('santra_customer', JSON.stringify(updated));
      }catch(e){}
    }
  }).catch(()=>{});
}

window.addEventListener('load', function(){
  loadHeaderPhoto();
  console.log("✅ Customer account V20 loaded - Login No=OTP + Extra Mobile for Delivery - OLD SAVE");
});
</script>
