<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - SANTRA MALL</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
    body{background:#f5f5f5;display:flex;justify-content:center;align-items:center;height:100vh}
   .box{background:white;padding:30px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.1);width:100%;max-width:400px}
    h2{text-align:center;color:#e40046;margin-bottom:20px}
    input{width:100%;padding:14px;margin:10px 0;border:2px solid #ddd;border-radius:8px;font-size:16px}
    button{width:100%;padding:14px;background:#e40046;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:10px;font-weight:600}
    button:hover{background:#c20038}
   .msg{padding:12px;border-radius:6px;margin:10px 0;text-align:center;font-weight:bold;font-size:14px;display:none}
   .msg-error{background:#7f1d1d;color:#fecaca}
   .link-box{text-align:center;margin-top:15px;font-size:14px;}
   .link-box a{color:#e40046;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="box">
    <h2>🛒 SANTRA MALL Admin</h2>
    <div id="msgBox" class="msg msg-error"></div>
    <input type="email" id="email" placeholder="Admin Email" value="mansasingh7109@gmail.com">
    <input type="password" id="password" placeholder="Password">
    <button onclick="adminLogin()">Login</button>
    
    <!-- Yaha se Forgot Password ka link jayega 👇 -->
    <div class="link-box" id="passwordLinkBox">
      <a href="admin-password-reset.html">🔓 Forgot Password?</a>
    </div>
    
    <p style="text-align:center;margin-top:10px;font-size:13px;color:#666;">
      <a href="index.html" style="color:#e40046;text-decoration:none;">← Back to Website</a>
    </p>
  </div>

<script src="db.js"></script>
<script>
function showMsg(text){
  let box = document.getElementById('msgBox');
  box.innerText = text;
  box.style.display = 'block';
  setTimeout(() => box.style.display = 'none', 3000);
}

function adminLogin(){
  let email = document.getElementById('email').value.trim();
  let pass = document.getElementById('password').value.trim();
  
  if(!email || !pass){
    showMsg('Email aur Password dono daalo');
    return;
  }
  
  let admin = SANTRA_DB.users.find(u => 
    u.role === 'admin' && 
    u.email.toLowerCase() === email.toLowerCase() && 
    u.pass === pass
  );
  
  if(admin){
    localStorage.setItem('current_admin', JSON.stringify(admin));
    localStorage.setItem('admin_logged_in', 'true');
    alert('✅ Login Successful!');
    window.location.href = 'admin-panel-final.html';
  } else {
    showMsg('❌ Invalid Email ya Password');
  }
}

// Login hai to Change Password dikhao, nahi to Forgot Password
function checkAdminLoginStatus(){
  let isLoggedIn = localStorage.getItem('admin_logged_in');
  let linkBox = document.getElementById('passwordLinkBox');
  
  if(isLoggedIn === 'true'){
    linkBox.innerHTML = '<a href="admin-change-password.html">🔑 Change Password</a>';
  } else {
    linkBox.innerHTML = '<a href="admin-password-reset.html">🔓 Forgot Password?</a>';
  }
}

checkAdminLoginStatus();

document.getElementById('password').addEventListener('keypress', function(e){
  if(e.key === 'Enter') adminLogin();
});
</script>
</body>
</html>
