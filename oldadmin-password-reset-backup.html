<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Password Reset - SANTRA MALL</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
    .box{background:white;padding:30px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.1);width:100%;max-width:400px;text-align:center}
    h2{color:#333;margin-bottom:10px;font-size:24px}
    p{color:#666;margin-bottom:25px;font-size:14px}
    .btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin:8px 0;font-weight:600;display:block;text-decoration:none}
    .btn-email{background:#1e88e5;color:white}
    .btn-email:hover{background:#1565c0}
    .btn-sms{background:#e64a19;color:white}
    .btn-sms:hover{background:#d84315}
    .back-link{margin-top:20px;font-size:14px;color:#e40046;text-decoration:none;display:inline-block}
    #recaptcha-container{margin-top:15px}
  </style>
</head>
<body>
  <div class="box">
    <h2>🔐 Admin Password Reset</h2>
    <p>Choose any one method</p>
    
    <button class="btn btn-email" id="emailBtn">📧 Reset via Email Link</button>
    <button class="btn btn-sms" id="smsBtn">📱 Reset via SMS OTP</button>
    
    <div id="recaptcha-container"></div>
    
    <a href="admin-login.html" class="back-link">← Back to Login</a>
  </div>

<script type="module">
  // Firebase SDK import
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, sendPasswordResetEmail, signInWithPhoneNumber, RecaptchaVerifier, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // ========== TERA FIREBASE CONFIG ==========
  // Tere paas secrets.js file hai to usse import kar
  import { firebaseConfig } from './secret.js'; 
  // Agar secret.js me ADMIN_EMAIL aur ADMIN_PHONE nahi hai to neeche manually daal
  // ==========================================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Admin details - secret.js me nahi hai to yaha daal
  const ADMIN_EMAIL = "mansasingh7109@gmail.com"; 
  const ADMIN_PHONE = "+919876543210"; // Apna number +91 ke saath

  // 1. EMAIL LINK SE RESET
  document.getElementById('emailBtn').addEventListener('click', () => {
    sendPasswordResetEmail(auth, ADMIN_EMAIL)
      .then(() => {
        alert("✅ Password reset link " + ADMIN_EMAIL + " par bhej diya gaya hai. Spam folder bhi check karo.");
      })
      .catch((error) => {
        console.error("Email Error:", error);
        if (error.code === 'auth/user-not-found') {
          alert("❌ Ye email Firebase Authentication me add nahi hai. Pehle Firebase Console me user banao.");
        } else if (error.code === 'auth/unauthorized-domain') {
          alert("❌ Firebase me localhost authorized nahi hai. Settings me jaake add karo.");
        } else {
          alert("❌ Error: " + error.message);
        }
      });
  });

  // 2. SMS OTP SE RESET
  let confirmationResult = null;
  
  document.getElementById('smsBtn').addEventListener('click', () => {
    // Recaptcha setup
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      'size': 'invisible',
      'callback': (response) => {
        // reCAPTCHA solved
      }
    });

    signInWithPhoneNumber(auth, ADMIN_PHONE, window.recaptchaVerifier)
      .then((result) => {
        confirmationResult = result;
        const otp = prompt("📱 " + ADMIN_PHONE + " par aaya 6 digit OTP daalo");
        if(!otp) {
          window.recaptchaVerifier.clear();
          return;
        }
        return confirmationResult.confirm(otp);
      })
      .then((result) => {
        if(!result) return;
        const newPassword = prompt("🔑 Naya password daalo (min 6 characters)");
        if(!newPassword || newPassword.length < 6) {
          alert("Password 6 character se bada hona chahiye");
          return;
        }
        // Firebase v9 me updatePassword function alag se import hota hai
        return updatePassword(result.user, newPassword);
      })
      .then(() => {
        alert("✅ Password successfully change ho gaya! Ab login karo.");
        window.location.href = "admin-login.html";
      })
      .catch((error) => {
        console.error("SMS Error:", error);
        alert("❌ OTP ya Password me error: " + error.message);
        // Recaptcha reset karo taaki dubara try kar sake
        if(window.recaptchaVerifier) window.recaptchaVerifier.clear();
      });
  });
</script>
</body>
</html>
