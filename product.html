*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",Arial,sans-serif}
body{background:#f1f3f6;padding-bottom:90px}
.header{background:var(--accent);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}

.slide-img{max-width:100%;max-height:100%;object-fit:contain;display:none}

<div class="header">
<button class="back-btn" onclick="history.back()">←</button>
<h1 id="headerTitle">Product Details</h1>
<div class="header-icons">
<a href="mychoice.html" class="header-icon">😍<span class="header-badge" id="choiceBadge">0</span></a>
<a href="cart.html" class="header-icon">🛒<span class="header-badge" id="cartBadge">0</span></a>
</div>

<script>
let currentProduct=null, selectedVariant=null, selectedVariantData=null, selectedQty=1;
function getIdFromURL(){
  let p=new URLSearchParams(location.search);
  return (p.get('id')||p.get('productId')||p.get('code')||'').toString().trim();
}
const productId = getIdFromURL();
if (!productId) { showError("Product ID missing", "URL me?id= add karo"); }
else { loadProduct(productId); }

function getBaseIds(fullId){
  let clean=String(fullId).trim();
  let ids=[clean];
  if(clean.includes('-')){
    let base=clean.substring(0, clean.lastIndexOf('-'));
    if(base.length>5) ids.push(base);
  }
  ids.push(clean.toLowerCase(), clean.toUpperCase());
  return [...new Set(ids)];
}

async function loadProduct(id){
  try{
    let tryIds=getBaseIds(id);
    currentProduct=null;
    for(let clean of tryIds){
      if(currentProduct) break;
      try{
        let d=await window.db.collection("products").doc(clean).get();
        if(d.exists){ currentProduct={id:d.id,...d.data(),dbType:"firestore"}; break; }
      }catch(e){}
      try{
        let snap=await window.rtdb.ref("products/"+clean).once("value");
        if(snap.exists()){ currentProduct={id:clean,...snap.val(),dbType:"rtdb"}; break; }
      }catch(e){}
    }
    if(!currentProduct){
      let local=[]; try{local=JSON.parse(localStorage.getItem("santraProducts")||"[]");}catch(e){}
      for(let clean of tryIds){
        currentProduct=local.find(x=>String(x.id).trim()===clean || String(x.code).trim()===clean);
        if(currentProduct){ currentProduct.dbType="local"; break; }
      }
    }
    if(!currentProduct){
      try{
        for(let clean of tryIds){
          if(window.SANTRA_ALL_URLS && window.SANTRA_ALL_URLS[clean]){ currentProduct={id:clean,name:clean,price:450,images:[window.SANTRA_ALL_URLS[clean]],dbType:"all-url"}; break; }
          if(window.SANTRA_IMAGES && window.SANTRA_IMAGES[clean]){ currentProduct={id:clean,name:clean,price:450,images:[window.SANTRA_IMAGES[clean]],dbType:"master"}; break; }
          if(window.getProductImageUrl){ let u=window.getProductImageUrl(clean); if(u){ currentProduct={id:clean,name:clean,price:450,images:[u],dbType:"system"}; break; } }
        }
        if(!currentProduct){
          let backup=[]; try{backup=JSON.parse(localStorage.getItem('lastOrderCartBackup')||'[]');}catch(e){}
          for(let clean of tryIds){
            let f=backup.find(x=>String(x.id).trim()===clean);
            if(f){ currentProduct={id:clean,name:f.name||clean,price:f.price||450,images:[f.image||f.imageUrl],...f,dbType:"backup"}; break; }
          }
        }
      }catch(e){}
    }
    if(!currentProduct) return showError("Product Not Found","ID: "+id+" - Firestore me base ID check karo");
    document.getElementById("headerTitle").innerText=currentProduct.name;
    renderProduct(currentProduct);
    document.getElementById("actionBtns").style.display="flex";
  }catch(e){ showError("Error",e.message); }
}

function getProductImages(p){
  let imgs=[];
  if(p && p.images && Array.isArray(p.images)) imgs=p.images.filter(i=>i && i.trim().length>10);
  if(imgs.length===0 ||!imgs[0].includes('firebasestorage.googleapis.com')){
    let ff=['image','imageUrl','productImage','thumbnail','firebaseImage'];
    for(let f of ff){ let v=p[f]; if(v && v.includes('firebasestorage.googleapis.com') && v.startsWith('http')){ imgs=[v]; break; } }
  }
  if(imgs.length===0){
    let fields=['image','img','imageUrl','productImage','thumbnail','photo','picture','src','url','mainImage','cloudinaryUrl','driveUrl','googleDriveUrl'];
    for(let f of fields){ let v=p[f]; if(v && typeof v==="string" && v.startsWith('http') && v.length>15 &&!v.includes('ibb.co')){ imgs=[v]; break; } }
  }
  if(imgs.length===0){
    try{
      let id=(p.id||'').trim();
      for(let k of [id, id.toLowerCase()]){
        if(window.SANTRA_ALL_URLS && window.SANTRA_ALL_URLS[k]){ imgs=[window.SANTRA_ALL_URLS[k]]; break; }
        if(window.SANTRA_IMAGES && window.SANTRA_IMAGES[k]){ imgs=[window.SANTRA_IMAGES[k]]; break; }
      }
    }catch(e){}
  }
  if(imgs.length===0){
    let v=p.image||p.imageUrl||''; if(v && v.startsWith('data:image')) imgs=[v];
  }
  if(imgs.length===0) imgs=["https://via.placeholder.com/500?text=No+Image"];
  return imgs;
}
function getProductThumbnail(p){ return getProductImages(p)[0]||"https://via.placeholder.com/500"; }
function renderProduct(p){
  let images=getProductImages(p);
  let variants=p.variants||p.sizes||p.size||[];
  if(typeof variants==="string") variants=variants.split(",").map(v=>v.trim());
  let discount=p.mrp&&p.price?Math.round(((p.mrp-p.price)/p.mrp)*100):0;
  let slider=`<div class="image-slider-box"><div class="slider-container">${images.map((img,i)=>`<img src="${img}" class="slide-img ${i===0?"active":""}" onerror="this.src='https://via.placeholder.com/500'">`).join("")}</div>${images.length>1?`<button class="slide-btn prev" onclick="changeSlide(-1)">‹</button><button class="slide-btn next" onclick="changeSlide(1)">›</button>`:``}</div>`;
  let variantHTML=variants.map(v=>{
    let n=typeof v==="object"?v.name||v.size:v;
    return `<button class="variant-btn" data-variant='${JSON.stringify(v).replace(/'/g,"&apos;")}' >${n}</button>`;
  }).join("");
  document.getElementById("productContainer").innerHTML=`<div class="container">${slider}<div class="details"><h1 class="product-name">${p.name}</h1><div class="product-meta"><span>📦 ${p.code||p.id}</span><span>📁 ${p.category||"General"}</span><span>🔗 ${p.dbType} Firebase Permanent</span></div><div class="price-box"><span class="price" id="productPrice">₹${p.price}</span>${p.mrp?`<span class="mrp">₹${p.mrp}</span>`:""}${discount>0?`<span class="discount">${discount}% OFF</span>`:""}</div>${variants.length?`<div class="section"><h3>Select Variant:</h3><div class="variant-grid">${variantHTML}</div></div>`:""}<div class="qty-box"><span>Quantity:</span><button onclick="changeQty(-1)">-</button><span id="qtyDisplay">1</span><button onclick="changeQty(1)">+</button></div><div class="section"><h3>Description:</h3><div class="desc">${p.description||"Premium quality product - Firebase Permanent Link."}</div></div><div class="features"><p>✅ Firebase Storage Permanent - No Payment</p><p>✅ Past Present Future - 6 Jagah Universal</p><p>🚚 Free Delivery Above ₹500</p></div></div>`;
  window.productImages=images; window.currentSlideIndex=0;
  setTimeout(()=>{
    document.querySelectorAll(".variant-btn").forEach(b=>{ b.onclick=e=>{ selectVariant(JSON.parse(b.dataset.variant),b); }; });
    let firstBtn=document.querySelector(".variant-btn");
    if(firstBtn &&!selectedVariant){ firstBtn.click(); }
    document.getElementById("cartBtn").onclick=function(){
      let hasVariants=currentProduct.variants||currentProduct.sizes||currentProduct.size;
      if(hasVariants&&hasVariants.length&&!selectedVariant){ showToast("Please select a size first"); return; }
      let productToAdd={...currentProduct};
      if(selectedVariant){ productToAdd.variant=selectedVariant; productToAdd.id=currentProduct.id+"-"+selectedVariant; }
      if(selectedVariantData&&selectedVariantData.price) productToAdd.price=selectedVariantData.price;
      productToAdd.qty=selectedQty;
      productToAdd.image=getProductThumbnail(currentProduct);
      productToAdd.imageUrl=getProductThumbnail(currentProduct);
      window.addToCart(productToAdd);
    };
    document.getElementById("buyBtn").onclick=function(){ document.getElementById("cartBtn").click(); setTimeout(()=>window.location="cart.html",500); };
    document.getElementById("wishBtn").onclick=addToMyChoice;
  },100);
}
function selectVariant(v,btn){ document.querySelectorAll(".variant-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); selectedVariant=typeof v==="object"?v.name||v.size:v; selectedVariantData=v; }
function changeSlide(d){ let s=window.productImages.length; window.currentSlideIndex=(window.currentSlideIndex+d+s)%s; goToSlide(window.currentSlideIndex); }
function goToSlide(i){ window.currentSlideIndex=i; document.querySelectorAll(".slide-img").forEach((im,idx)=>im.classList.toggle("active",idx===i)); }
function changeQty(c){ selectedQty=Math.max(1,Math.min(10,selectedQty+c)); document.getElementById("qtyDisplay").innerText=selectedQty; }
function showToast(m){ const t=document.createElement("div"); t.innerText=m; t.style.cssText="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#e40046;color:white;padding:10px 20px;border-radius:8px;z-index:9999;font-size:13px"; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
function addToMyChoice(){
  let wish=JSON.parse(localStorage.getItem(window.MYCHOICE_KEY||"myChoice")||"[]");
  let itemId=currentProduct.id+(selectedVariant?"-"+selectedVariant:"");
  if(!wish.find(x=>x.id===itemId)){
    wish.push({id:itemId,productId:currentProduct.id,name:currentProduct.name,price:selectedVariantData?.price||currentProduct.price,image:getProductThumbnail(currentProduct),variant:selectedVariant});
    localStorage.setItem(window.MYCHOICE_KEY||"myChoice",JSON.stringify(wish));
    showToast("✓ Added to My Choice");
  } else { showToast("Already in My Choice"); }
}
function showError(t,m){ document.getElementById("productContainer").innerHTML=`<div style="padding:40px;text-align:center"><h2>❌ ${t}</h2><p>${m}</p><p><a href="index.html">← Home</a></p></div>`; }
</script>
