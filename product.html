<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product - SANTRA MALL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="config.js?v=2"></script>
    <script src="secrets.js?v=6"></script>
    <!-- ✅ ZARURI: cart.js sabse pehle load karo -->
    <script src="cart.js?v=3"></script>
    <style>
    :root { --accent:#e40046; --text:#212121; --green:#10b981; --orange:#f59e0b; }
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",Arial,sans-serif}
    body{background:#f1f3f6;padding-bottom:85px}
   .header{background:var(--accent);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
   .back-btn{background:none;border:none;color:white;font-size:22px;cursor:pointer}
   .header h1{font-size:18px;flex:1}
   .header-icons{display:flex;align-items:center;gap:15px}
   .header-icon{color:white;text-decoration:none;font-size:24px;position:relative}
   .header-badge{position:absolute;top:-8px;right:-8px;background:#ffeb3b;color:#000;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:bold;display:none;align-items:center;justify-content:center}
   .container{max-width:600px;margin:0 auto;background:white}
   .image-slider-box{position:relative;width:100%;height:400px;background:#f9f9;overflow:hidden}
   .slider-container{width:100%;height:100%;position:relative}
   .slide-img{width:100%;height:100%;object-fit:contain;display:none;position:absolute;top:0;left:0}
   .slide-img.active{display:block}
   .slide-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);color:white;border:none;width:45px;height:45px;border-radius:50%;font-size:28px;cursor:pointer;z-index:10;font-weight:bold}
   .slide-btn.prev{left:10px}.slide-btn.next{right:10px}
   .slide-dots{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
   .dot{width:10px;height:10px;background:rgba(255,255,255,0.5);border-radius:50%;cursor:pointer;border:2px solid white}
   .dot.active{background:white;width:25px;border-radius:5px}
   .img-count{position:absolute;top:15px;right:15px;background:rgba(0,0,0,0.7);color:white;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold;z-index:10}
   .details{padding:20px}
   .product-name{font-size:22px;margin-bottom:8px;font-weight:bold;color:var(--text);line-height:1.3}
   .product-meta{color:#666;font-size:13px;margin-bottom:15px;display:flex;gap:15px;flex-wrap:wrap}
   .product-meta span{background:#f3f4f6;padding:4px 10px;border-radius:4px}
   .price-box{display:flex;align-items:center;gap:12px;margin:20px 0;padding:15px;background:#fff5f7;border-radius:8px}
   .price{font-size:34px;font-weight:bold;color:var(--accent)}
   .mrp{text-decoration:line-through;color:#999;font-size:20px}
   .discount{background:var(--green);color:white;padding:5px 12px;border-radius:6px;font-size:14px;font-weight:bold}
   .section{margin:25px 0;padding-top:20px;border-top:1px solid #eee}
   .variant-grid{display:flex;flex-wrap:wrap;gap:10px}
   .variant-btn{padding:12px 22px;border:2px solid #ddd;background:white;border-radius:8px;cursor:pointer;font-weight:bold;min-width:65px;text-align:center;font-size:15px;transition:all 0.2s;position:relative}
   .variant-btn.active{border-color:var(--accent);background:#fff0f5;color:var(--accent)}
   .variant-btn:disabled{opacity:0.35;cursor:not-allowed;background:#f5f5f5}
   .variant-price{font-size:11px;display:block;color:#666;margin-top:2px}
   .variant-stock{font-size:10px;margin-top:2px;display:block;color:var(--green)}
   .desc{line-height:1.8;color:#555;font-size:15px;white-space:pre-wrap}
   .features{background:linear-gradient(135deg,#f9f9f9,#fff);padding:18px;border-radius:10px;margin:15px 0;border:1px solid #eee}
   .action-btns{position:fixed;bottom:0;left:0;right:0;background:white;padding:12px;display:flex;gap:8px;box-shadow:0 -4px 15px rgba(0,0,0,0.1);max-width:600px;margin:0 auto;z-index:50}
   .btn{flex:1;padding:16px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
   .btn-wish{width:60px;background:#fff0f5;color:var(--accent);font-size:28px}
   .btn-cart{background:white;border:2px solid var(--accent);color:var(--accent)}
   .btn-buy{background:var(--accent);color:white}
   .qty-box{display:flex;align-items:center;gap:15px;margin:20px 0;padding:15px;background:#f9f9f9;border-radius:8px}
   .qty-box button{width:40px;height:40px;border:2px solid var(--accent);background:white;color:var(--accent);border-radius:8px;font-size:20px;cursor:pointer;font-weight:bold}
   .qty-box span{font-size:20px;font-weight:bold;min-width:30px;text-align:center}
   .loader{padding:40px;text-align:center}
    </style>
</head>

<body>
    <div class="header">
        <button class="back-btn" onclick="window.history.back()">←</button>
        <h1 id="headerTitle">Product Details</h1>
        <div class="header-icons">
            <a href="mychoice.html" class="header-icon">😍<span class="header-badge" id="choiceBadge">0</span></a>
            <a href="cart.html" class="header-icon">🛒<span class="header-badge" id="cartBadge">0</span></a>
        </div>
    </div>
    <div id="productContainer"><div class="loader">Loading product...</div></div>
    <div class="action-btns" id="actionBtns" style="display:none">
        <button class="btn btn-wish" id="wishBtn">🤍</button>
        <button class="btn btn-cart" id="cartBtn">🛒 ADD TO CART</button>
        <button class="btn btn-buy" id="buyBtn">⚡ BUY NOW</button>
    </div>

<script>
const firebaseConfig={apiKey:"AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",authDomain:"santramarketshoppingmall.firebaseapp.com",databaseURL:"https://santramarketshoppingmall-default-rtdb.firebaseio.com/",projectId:"santramarketshoppingmall",storageBucket:"santramarketshoppingmall.appspot.com",messagingSenderId:"398490252924",appId:"1:398490252924:web:d1b6348b549183b93b7bf9",measurementId:"G-ZW1ZR8HETY"};
window.initFirebaseOnce(firebaseConfig);
var rtdb=window.rtdb;var db=window.db;var auth=window.auth;

document.addEventListener("DOMContentLoaded",function(){loadData();});

let currentProduct=null, selectedVariant=null, selectedVariantData=null, selectedQty=1;

function getProductImages(p){
  if(p&&p.images&&Array.isArray(p.images)&&p.images.length>0){
    return p.images.filter(i=>i&&typeof i==="string"&&i.trim()!=="")
  }else if(p&&p.image&&typeof p.image==="string"&&p.image.trim()!==""){
    return[p.image]
  }
  return["https://via.placeholder.com/500x500?text=No+Image"]
}

function getProductThumbnail(p){
  if(p&&p.image)return p.image;
  if(p&&p.images&&p.images.length)return p.images[0];
  return"https://via.placeholder.com/500"
}

const productId=new URLSearchParams(window.location.search).get("id");
if(!productId){
  showError("Product ID missing","URL me?id= add karo")
}else{
  loadProduct(productId);
  if(typeof updateCartBadge === 'function') updateCartBadge();
}

async function loadProduct(id){
  try{
    let clean = String(id).trim();
    currentProduct = null;
    try {
      let d = await db.collection("products").doc(clean).get();
      if(d.exists) currentProduct = {id:d.id,...d.data(), dbType:"firestore"}
    } catch(e){}
    if(!currentProduct){
      let local = [];
      try{ local = JSON.parse(localStorage.getItem('santraProducts')||'[]'); }catch(e){}
      if(!local.length){ try{ local = JSON.parse(localStorage.getItem('products')||'[]'); }catch(e){} }
      currentProduct = local.find(x=> String(x.id)===clean || String(x.code)===clean );
      if(currentProduct) currentProduct.dbType = "local";
    }
    if(!currentProduct) return showError("Product Not Found","Home se dobara click karo - ID: "+id);
    document.getElementById("headerTitle").innerText=currentProduct.name;
    document.title=currentProduct.name+" - SANTRA MALL";
    renderProduct(currentProduct);
    document.getElementById("actionBtns").style.display="flex";
  }catch(e){showError("Error",e.message)}
}

function renderProduct(p){
  let images=getProductImages(p);
  let variants=p.variants||p.sizes||p.size||[];
  if(typeof variants==="string")variants=variants.split(",").map(v=>v.trim());
  let discount=p.mrp&&p.price?Math.round(((p.mrp-p.price)/p.mrp)*100):0;

  let slider=`<div class="image-slider-box"><div class="slider-container" id="imgSlider">${images.map((img,i)=>`<img src="${img}" class="slide-img ${i===0?"active":""}" onerror="this.src='https://via.placeholder.com/500'">`).join("")}</div>${images.length>1?`<button class="slide-btn prev" onclick="changeSlide(-1)">‹</button><button class="slide-btn next" onclick="changeSlide(1)">›</button><div class="slide-dots">${images.map((_,i)=>`<span class="dot ${i===0?"active":""}" onclick="goToSlide(${i})"></span>`).join("")}</div><div class="img-count">📷 ${images.length}</div>`:""}</div>`;

  let variantHTML=variants.map(v=>{
    let n=typeof v==="object"?v.name||v.size:v;
    let pr=typeof v==="object"?v.price:p.price;
    let st=typeof v==="object"?v.stock??999:999;
    let out=st<=0;
    return`<button class="variant-btn" data-variant='${JSON.stringify(v).replace(/'/g,"&apos;")}' ${out?"disabled":""}>${n}${pr&&pr!==p.price?`<span class="variant-price">₹${pr}</span>`:""}<span class="variant-stock">${out?"Out of stock":st+" left"}</span></button>`
  }).join("");

  document.getElementById("productContainer").innerHTML=`<div class="container">${slider}<div class="details"><h1 class="product-name">${p.name}</h1><div class="product-meta"><span>📦 Code: ${p.code||p.id}</span><span>📁 ${p.category||"General"}</span></div><div class="price-box"><span class="price" id="productPrice">₹${p.price}</span>${p.mrp?`<span class="mrp">₹${p.mrp}</span>`:""}${discount>0?`<span class="discount">${discount}% OFF</span>`:""}</div>${variants.length?`<div class="section"><h3>Select Variant:</h3><div class="variant-grid">${variantHTML}</div></div>`:""}<div class="qty-box"><span style="font-weight:bold">Quantity:</span><button onclick="changeQty(-1)">-</button><span id="qtyDisplay">1</span><button onclick="changeQty(1)">+</button></div><div class="section"><h3>Product Description:</h3><div class="desc">${p.description||"Premium quality product from SANTRA MALL."}</div></div><div class="features"><p>✅ 100% Original & Authentic</p><p>🚚 Free Delivery Above ₹500</p><p>↩️ Easy 7 Days Return</p><p>💵 Cash on Delivery</p></div></div>`;

  window.productImages=images;
  window.currentSlideIndex=0;

  setTimeout(()=>{
    document.querySelectorAll(".variant-btn:not(:disabled)").forEach(b=>{
      b.onclick=(e)=>{
        e.stopPropagation();
        selectVariant(JSON.parse(b.dataset.variant),b)
      }
    });

    // ✅ FIX: cart.js wale function call karo
    document.getElementById("cartBtn").onclick=function(){
        let hasVariants = currentProduct.variants||currentProduct.sizes||currentProduct.size;
        if(hasVariants && hasVariants.length &&!selectedVariant){
            showToast('Please select a size first');
            return;
        }
        let productToAdd = {...currentProduct};
        if(selectedVariant){
            productToAdd.variant = selectedVariant;
            productToAdd.id = currentProduct.id + '-' + selectedVariant;
        }
        if(selectedVariantData && selectedVariantData.price){
            productToAdd.price = selectedVariantData.price;
        }
        productToAdd.qty = selectedQty;
        window.addToCart(productToAdd); // ✅ cart.js ka function
    };

    document.getElementById("buyBtn").onclick=function(){
        document.getElementById("cartBtn").click();
        setTimeout(()=>window.location='cart.html',500);
    };

    document.getElementById("wishBtn").onclick=addToMyChoice;
  },100);
}

function selectVariant(v,btn){
  document.querySelectorAll('.variant-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selectedVariant=typeof v==="object"?v.name||v.size:v;
  selectedVariantData=v;
  if(typeof v==="object"&&v.price){document.getElementById('productPrice').innerText='₹'+v.price}
}

function changeSlide(d){
  let s=window.productImages.length;
  window.currentSlideIndex=(window.currentSlideIndex+d+s)%s;
  goToSlide(window.currentSlideIndex)
}

function goToSlide(i){
  window.currentSlideIndex=i;
  document.querySelectorAll('.slide-img').forEach((im,idx)=>im.classList.toggle('active',idx===i));
  document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('active',idx===i))
}

function changeQty(c){
  selectedQty=Math.max(1,Math.min(10,selectedQty+c));
  document.getElementById("qtyDisplay").innerText=selectedQty
}

function showToast(m){
  const t=document.createElement("div");
  t.innerText=m;
  t.style.cssText="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#e40046;color:white;padding:14px 24px;border-radius:8px;z-index:9999;font-weight:bold";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000)
}

function addToMyChoice(){
  if(!currentProduct)return;
  let hasVariants = currentProduct.variants||currentProduct.sizes||currentProduct.size;
  if(hasVariants && hasVariants.length &&!selectedVariant){
    showToast('Please select a size first');
    return;
  }
  const WISH_KEY='santraMyChoice_v2';
  let wish=JSON.parse(localStorage.getItem(WISH_KEY)||'[]');
  let itemId=currentProduct.id+(selectedVariant?'-'+selectedVariant:'');
  if(!wish.find(x=>x.id===itemId)){
    wish.push({
      id:itemId,
      productId:currentProduct.id,
      name:currentProduct.name,
      price:currentProduct.price,
      image:getProductThumbnail(currentProduct),
      variant:selectedVariant
    });
    localStorage.setItem(WISH_KEY,JSON.stringify(wish));
    if(typeof updateCartBadge === 'function') updateCartBadge();
    document.getElementById('wishBtn').innerText='❤️';
    showToast('✓ Added to My Choice');
  }else{
    showToast('Already in My Choice');
  }
}

function showError(t,m){
  document.getElementById("productContainer").innerHTML=`<div style="padding:40px;text-align:center"><h2>❌ ${t}</h2><p>${m}</p><p><a href="index.html">← Back to Home</a></p></div>`
}

function loadData(){
    if(typeof updateCartBadge === 'function') updateCartBadge();
}
</script>
</body>
</html>
