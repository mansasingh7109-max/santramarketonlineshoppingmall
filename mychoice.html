<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>😍 My Choice - SANTRA MALL</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

<script src="constants.js"></script>

<style>
:root{--bg:#f1f3f6;--card:#fff;--accent:#e40046;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:var(--bg);padding-bottom:85px}
.header{background:var(--accent);color:#fff;padding:15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.header h1{font-size:18px;flex:1}
.choice-card{background:var(--card);margin:12px 15px;border-radius:12px;padding:12px;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);align-items:center}
.choice-card img{width:90px;height:90px;object-fit:contain;background:#f9f9f9;border-radius:8px}
.item-info{flex:1}.item-info h3{font-size:14px;margin-bottom:4px}.item-price{color:var(--accent);font-weight:700;font-size:15px}
.btn-move-cart,.btn-remove{color:#fff;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;flex:1}
.btn-move-cart{background:var(--green)}.btn-remove{background:#ef4444}
.empty{text-align:center;padding:80px 20px;color:#999}
.top-bar{background:#fff;margin:15px 15px 0 15px;padding:10px 12px;border-radius:10px;display:none;align-items:center;gap:10px}
</style>
<script src="santra-image-link-fix.js"></script>
</head>
<body>
<div class="header"><button class="back-btn" onclick="location.href='index.html'">←</button><h1>😍 My Choice (<span id="myChoiceCount">0</span>)</h1><a href="cart.html" style="color:#fff">🛒</a></div>
<div class="top-bar" id="topBar"><label style="font-size:13px"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)"> Select All</label><button onclick="moveSelectedToCart()" style="background:#10b981;color:#fff;margin-left:auto">Move to Cart →</button><button onclick="removeSelected()" style="background:#fee2e2;color:#e40046">Remove</button></div>
<div id="myChoiceList"><div style="text-align:center;padding:50px">Loading...</div></div>

<script>
// ==================== OLD MYCHOICE.HTML BACKUP - 25 JUNE 2026 - SAFE ====================
// aapka purana wala code safe hai upar
</script>
<script>
var MYCHOICE_KEY = window.MYCHOICE_KEY || "santraMallMyChoice_v2";
var CART_KEY = window.CART_KEY || "santraMallCart_v2";
// WITHOUT VERSION FIX - home_ prefix case-insensitive hatana
function norm(id){ return String(id||"").replace(/^home_/i,'').trim(); }
function normLow(id){ return norm(id).toLowerCase(); }

function getThumb(p){
  if(!p) return "https://via.placeholder.com/90?text=No+Image";
  if(p.image &&!String(p.image).includes("placeholder")) return p.image;
  if(p.thumbnail) return p.thumbnail;
  if(p.images && p.images[0] && typeof p.images[0]==='string') return p.images[0];
  return "https://via.placeholder.com/90?text=No+Image";
}

function cleanDuplicateWishlist(){
  let r=localStorage.getItem(MYCHOICE_KEY)||"[]"; let a=[];
  try{ a=JSON.parse(r); if(!Array.isArray(a)) a=Object.values(a||{});}catch(e){ a=[]; }
  let s={}; let c=[];
  a.forEach(function(it){
    if(!it||!it.id) return;
    if(it.name==="Product" && (!it.price||it.price===0)) return;
    if(String(it.id).length>30 && (!it.price||it.price===0)) return; // uPjvg wala kachra
    let b = normLow(it.id); // home_ hata ke lower
    if(!b || b.length<2 || b.length>40) return;
    if(s[b]) return; s[b]=1;
    it.id = b; it.code = it.code||b;
    if(!it.image || String(it.image).includes('placeholder')) it.image = getThumb(it);
    c.push(it);
  });
  localStorage.setItem(MYCHOICE_KEY,JSON.stringify(c));
  return c;
}

let myChoice=[];
function loadMyChoice(){ myChoice = cleanDuplicateWishlist(); renderMyChoice(); }

function renderMyChoice(){
  let cont=document.getElementById("myChoiceList");
  let topBar=document.getElementById("topBar");
  if(!cont) return;
  document.getElementById("myChoiceCount").innerText=myChoice.length;
  if(myChoice.length===0){
    cont.innerHTML=`<div class="empty"><h3>😍 My Choice is Empty</h3><p>Add products you love</p><button onclick="location.href='index.html'" style="margin-top:15px;padding:12px 24px;background:#e40046;color:white;border:none;border-radius:8px">Start Shopping</button></div>`;
    if(topBar) topBar.style.display="none"; return;
  }
  if(topBar) topBar.style.display="flex";
  cont.innerHTML=myChoice.map(function(item,idx){
    let price=item.price||0; let img=getThumb(item); let size=item.size||'M';
    return `<div class="choice-card"><input type="checkbox" class="choice-check" data-idx="${idx}" style="width:18px;height:18px"><img src="${img}" onclick="location.href='product.html?id=${item.id}'"><div class="item-info"><h3>${item.name||"Product"}</h3><div class="item-price">₹${price}</div><div style="font-size:11px;color:#666">Size: ${size} | Code: ${item.code||item.id}</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn-move-cart" onclick="moveToCart(${idx})">🛒 Move to Cart</button><button class="btn-remove" onclick="removeFromChoice(${idx})">🗑️</button></div></div></div>`;
  }).join("");
}

function moveToCart(idx){
  let item=myChoice[idx]; if(!item) return;
  let cart=[]; try{ cart=JSON.parse(localStorage.getItem(CART_KEY)||"[]"); }catch(e){ cart=[]; }
  cart.push({...item, qty:1, image:getThumb(item)});
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  localStorage.setItem("santraMallCart_v2", JSON.stringify(cart));
  removeFromChoice(idx);
}
function removeFromChoice(idx){
  myChoice.splice(idx,1);
  localStorage.setItem(MYCHOICE_KEY, JSON.stringify(myChoice));
  try{ window.dispatchEvent(new CustomEvent('mychoice:updated',{detail:myChoice})); }catch(e){}
  renderMyChoice();
}
function toggleSelectAll(checked){ document.querySelectorAll(".choice-check").forEach(function(ch){ ch.checked = checked; }); }
function moveSelectedToCart(){
  let checks=[...document.querySelectorAll(".choice-check:checked")]; if(!checks.length) return alert("Pehle item select karo");
  let idxs=checks.map(c=>parseInt(c.dataset.idx)).sort((a,b)=>b-a); let cart=[]; try{cart=JSON.parse(localStorage.getItem(CART_KEY)||"[]");}catch(e){cart=[];}
  idxs.forEach(i=>{ let item=myChoice[i]; if(item) cart.push({...item,qty:1,image:getThumb(item)}); });
  localStorage.setItem(CART_KEY, JSON.stringify(cart)); localStorage.setItem("santraMallCart_v2", JSON.stringify(cart));
  myChoice=myChoice.filter((_,i)=>!idxs.includes(i)); localStorage.setItem(MYCHOICE_KEY, JSON.stringify(myChoice));
  try{ window.dispatchEvent(new CustomEvent('mychoice:updated',{detail:myChoice})); }catch(e){} renderMyChoice();
}
function removeSelected(){
  let checks=[...document.querySelectorAll(".choice-check:checked")]; if(!checks.length) return alert("Pehle item select karo");
  let idxs=checks.map(c=>parseInt(c.dataset.idx)).sort((a,b)=>b-a); idxs.forEach(i=>myChoice.splice(i,1));
  localStorage.setItem(MYCHOICE_KEY, JSON.stringify(myChoice));
  try{ window.dispatchEvent(new CustomEvent('mychoice:updated',{detail:myChoice})); }catch(e){} renderMyChoice();
}

document.addEventListener('DOMContentLoaded', loadMyChoice);
setTimeout(loadMyChoice, 800);
</script>
</body>
</html>
