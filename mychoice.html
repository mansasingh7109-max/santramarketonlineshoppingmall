<script>

// ==================== MYCHOICE.HTML - FINAL FIXED 21 JULY 2026 - LOADING + HOME TAB + SELECT FIX ====================
var rtdb = window.rtdb;
var db = window.db;
var auth = window.auth;
var MYCHOICE_KEY = window.MYCHOICE_KEY || "santraMallMyChoice_v2";
var CART_KEY = window.CART_KEY || "santraMallCart_v2";
var OLD_WISH_KEYS = ["santraMallMyChoice_v2","santrajet_mychoice","santraMyChoice_v2","santraMallWishlist","sm_wishlist_v1","myChoice","wishlist"];

function getThumb(p){
  if(!p) return "https://via.placeholder.com/90?text=No+Image";
  if(p.image &&!String(p.image).includes("placeholder")) return p.image;
  if(p.imageUrl) return p.imageUrl;
  if(p.thumbnail) return p.thumbnail;
  if(p.img) return p.img;
  if(p.media && p.media[0]) return p.media[0].url||p.media[0];
  if(p.images && p.images[0]) return typeof p.images[0]==="string"?p.images[0]:p.images[0].url||p.images[0].imageUrl;
  try{
    let cache=JSON.parse(localStorage.getItem('santra_all_products_cache')||"[]");
    let f=cache.find(x=>String(x.id).toLowerCase()===String(p.id).toLowerCase());
    if(f && f.image) return f.image;
  }catch{}
  return "https://via.placeholder.com/90?text=No+Image";
}

function cleanDuplicateWishlist(){
  let merged=[];
  let seen={};
  // ✅ Saare keys ko merge karo, khali [] ko ignore nahi karo
  for(let k of OLD_WISH_KEYS){
    try{
      let raw=localStorage.getItem(k);
      if(!raw) continue;
      let arr=JSON.parse(raw);
      if(!Array.isArray(arr)) arr=Object.values(arr);
      arr.forEach(it=>{
        if(!it||!it.id) return;
        let id=String(it.id).replace(/^home_/,'').toLowerCase().trim();
        if(!id) return; // ✅ length>35 filter hata diya - yahi bug tha
        let sz=String(it.size||it.variant||"M").toUpperCase();
        let key=id+"_"+sz;
        if(seen[key]) return;
        seen[key]=1;
        it.id=id; it.code=id;
        if(!it.image || String(it.image).includes('placeholder')){
          let img=getThumb(it);
          if(img &&!img.includes('No+Image')) it.image=img;
        }
        merged.push(it);
      });
    }catch{}
  }
  localStorage.setItem(MYCHOICE_KEY, JSON.stringify(merged));
  localStorage.setItem("santrajet_mychoice", JSON.stringify(merged));
  console.log("✅ cleanDuplicateWishlist merged count:",merged.length);
  return merged;
}

let myChoice=[];
function loadMyChoice(){
  console.log("✅ loadMyChoice called");
  myChoice = cleanDuplicateWishlist();
  renderMyChoice(); // ✅ Pehle local se turant dikhao, Loading khatam

  // Firebase se sync - agar hai to update karo
  if(auth && typeof auth.onAuthStateChanged === 'function'){
    auth.onAuthStateChanged(user=>{
      if(user && rtdb){
        rtdb.ref('users/'+user.uid+'/myChoice').once('value').then(snap=>{
          if(snap.exists()){
            let fbList=[];
            snap.forEach(c=>{ fbList.push(c.val()); });
            if(fbList.length>myChoice.length){
              myChoice=cleanDuplicateWishlist(fbList);
              localStorage.setItem(MYCHOICE_KEY, JSON.stringify(myChoice));
              renderMyChoice();
            }
          }
        }).catch(()=>{});
      }
    });
  }
}

function renderMyChoice(){
  let c=document.getElementById("myChoiceList");
  let topBar=document.getElementById("topBar");
  if(!c) return;
  document.getElementById("myChoiceCount").innerText=myChoice.length;
  let choiceBadge=document.getElementById("homeChoiceBadge");
  if(choiceBadge){ choiceBadge.innerText=myChoice.length; choiceBadge.style.display=myChoice.length>0?"flex":"none"; }

  if(myChoice.length===0){
    c.innerHTML=`<div class="empty"><h3>😍 My Choice is Empty</h3><p>Add products you love</p><button onclick="window.location.href='index.html'" style="margin-top:15px;padding:12px 24px;background:#e40046;color:white;border:none;border-radius:8px">Start Shopping</button></div>`;
    if(topBar) topBar.style.display="none";
    updateBadge(); return;
  }
  if(topBar) topBar.style.display="flex";
  c.innerHTML=myChoice.map((item,idx)=>{
    let price=item.price||0;
    let img=getThumb(item);
    let size=item.size||item.variant||'M';
    return `<div class="choice-card">
      <input type="checkbox" class="choice-check" data-idx="${idx}" style="width:18px;height:18px">
      <img src="${img}" onerror="this.src='https://via.placeholder.com/90?text=No+Image'" onclick="location.href='product.html?id=${item.id}'">
      <div class="item-info">
        <h3>${item.name||"Product"}</h3>
        <div class="item-price">₹${price}</div>
        <div style="font-size:11px;color:#666">Size: ${size} | Code: ${item.code||item.id}</div>
        <div class="item-actions">
          <button class="btn-move-cart" onclick="moveToCart(${idx})">🛒 Move to Cart</button>
          <button class="btn-remove" onclick="removeFromChoice(${idx})">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join("");
  updateBadge();
}

function moveToCart(idx){
  let item=myChoice[idx]; if(!item) return;
  let cart=[]; try{cart=JSON.parse(localStorage.getItem(CART_KEY)||"[]"); if(!Array.isArray(cart)) cart=Object.values(cart);}catch{cart=[];}
  let exist=cart.findIndex(x=>String(x.id).toLowerCase()===String(item.id).toLowerCase() && (x.size||"M")===(item.size||"M"));
  if(exist>=0) cart[exist].qty=(cart[exist].qty||1)+1;
  else cart.push({...item,qty:1,image:getThumb(item)});
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  localStorage.setItem("santraMallCart_v2", JSON.stringify(cart));
  removeFromChoice(idx);
}

function removeFromChoice(idx){
  myChoice.splice(idx,1);
  localStorage.setItem(MYCHOICE_KEY, JSON.stringify(myChoice));
  localStorage.setItem("santrajet_mychoice", JSON.stringify(myChoice));
  renderMyChoice();
  if(window.SM_LOCK?.backup) window.SM_LOCK.backup();
}

function toggleSelectAll(checked){
  document.querySelectorAll(".choice-check").forEach(ch=> ch.checked = checked);
}
function moveSelectedToCart(){
  let checks = [...document.querySelectorAll(".choice-check:checked")];
  if(!checks.length) return alert("Pehle item select karo");
  let idxs = checks.map(c=>parseInt(c.dataset.idx)).sort((a,b)=>b-a);
  let cart=[]; try{cart=JSON.parse(localStorage.getItem(CART_KEY)||"[]"); if(!Array.isArray(cart)) cart=Object.values(cart);}catch{cart=[];}
  idxs.forEach(i=>{ let item=myChoice[i]; if(item) cart.push({...item,qty:1,image:getThumb(item)}); });
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  localStorage.setItem("santraMallCart_v2", JSON.stringify(cart));
  myChoice = myChoice.filter((_,i)=>!idxs.includes(i));
  localStorage.setItem(MYCHOICE_KEY, JSON.stringify(myChoice));
  localStorage.setItem("santrajet_mychoice", JSON.stringify(myChoice));
  renderMyChoice();
}
function removeSelected(){
  let checks = [...document.querySelectorAll(".choice-check:checked")];
  if(!checks.length) return alert("Pehle item select karo");
  let idxs = checks.map(c=>parseInt(c.dataset.idx)).sort((a,b)=>b-a);
  idxs.forEach(i=> myChoice.splice(i,1));
  localStorage.setItem(MYCHOICE_KEY, JSON.stringify(myChoice));
  localStorage.setItem("santrajet_mychoice", JSON.stringify(myChoice));
  renderMyChoice();
}

function updateBadge(){
  let cart=[]; try{cart=JSON.parse(localStorage.getItem(CART_KEY)||"[]"); if(!Array.isArray(cart)) cart=Object.values(cart);}catch{cart=[];}
  let qty=cart.reduce((s,i)=>s+(i.qty||1),0);
  let b=document.getElementById("cartBadge");
  if(b){b.innerText=qty; b.style.display=qty>0?"inline-block":"none";}
}

document.addEventListener('DOMContentLoaded', loadMyChoice);
window.addEventListener('load', loadMyChoice);
// Safety - agar Firebase late ho to bhi 1 sec me render karo
setTimeout(loadMyChoice, 1000);
</script>
