<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - SANTRA MALL</title>
  <style>
    :root{--accent:#e40046;--bg:#f1f3f6;--card:#fff}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:var(--bg);padding:20px;}
    .header{background:var(--card);padding:15px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 5px rgba(0,0,0,0.1);display:flex;justify-content:space-between;align-items:center;}
    .header h1{color:var(--accent);}
    .logout-btn{padding:8px 15px;background:#f44336;color:white;border:none;border-radius:4px;cursor:pointer;}
    .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    .tab-btn{padding:10px 20px;background:#ddd;border:none;border-radius:4px;cursor:pointer;font-weight:bold;}
    .tab-btn.active{background:var(--accent);color:white;}
    .tab-content{background:var(--card);padding:20px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
    .hide{display:none!important;}
    input,select,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:4px;}
    label{font-weight:bold;margin-top:10px;display:block;}
    button{padding:10px 20px;background:var(--accent);color:white;border:none;border-radius:4px;cursor:pointer;margin:5px 0;}
    .product-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;margin-top:20px;}
    .product-item{border:1px solid #ddd;padding:10px;border-radius:6px;}
    .product-item img{width:100%;height:120px;object-fit:cover;border-radius:4px;}
    .order-item{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:6px;background:#fafafa;}
    .btn-delete{background:#f44336!important;}
    .btn-edit{background:#2196F3!important;}
    .media-preview{margin:10px 0;}
    .media-preview img,.media-preview video{max-width:200px;border-radius:4px;}
    .flex{display:flex;gap:10px;}
    .flex > *{flex:1;}
  </style>
</head>
<body>

<div class="header">
  <h1>🛍️ SANTRA MALL - Admin Panel</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="openTab('products')">Products</button>
  <button class="tab-btn" onclick="openTab('orders')">Orders</button>
  <button class="tab-btn" onclick="openTab('customers')">Customers</button>
  <button class="tab-btn" onclick="openTab('settings')">Settings</button>
</div>

<!-- PRODUCTS TAB -->
<div id="products" class="tab-content">
  <h3>Add / Edit Product</h3>
  <form id="productForm">
    <input type="hidden" id="productId">
    <label>Product Name *</label>
    <input type="text" id="pName" required>
    
    <div class="flex">
      <div>
        <label>MRP</label>
        <input type="number" id="pMrp">
      </div>
      <div>
        <label>Price *</label>
        <input type="number" id="pPrice" required>
      </div>
      <div>
        <label>Stock *</label>
        <input type="number" id="pStock" required>
      </div>
    </div>

    <label>Category</label>
    <input type="text" id="pCategory" placeholder="General">

    <label>Description</label>
    <textarea id="pDesc" rows="3"></textarea>

    <h4 style="margin-top:20px;">Media Upload - Unlimited</h4>
    
    <label>Upload from Device - Image/Video/Audio/Document</label>
    <input type="file" id="pMediaFile" accept="image/*,video/*,audio/*,.pdf" multiple>
    <div id="filePreview" class="media-preview"></div>

    <label>OR Enter Media URL</label>
    <input type="url" id="pMediaUrl" placeholder="https://example.com/image.jpg">
    
    <label>Media Type</label>
    <select id="pMediaType">
      <option value="image">Image</option>
      <option value="video">Video</option>
      <option value="audio">Audio</option>
      <option value="document">Document/PDF</option>
    </select>

    <button type="button" onclick="saveProduct()">💾 Save Product</button>
    <button type="button" onclick="clearForm()" style="background:#999;">Clear</button>
  </form>

  <h3 style="margin-top:30px;">All Products</h3>
  <div id="productList" class="product-list"></div>
</div>

<!-- ORDERS TAB -->
<div id="orders" class="tab-content hide">
  <h3>Customer Orders</h3>
  <div id="orderList"></div>
</div>

<!-- CUSTOMERS TAB -->
<div id="customers" class="tab-content hide">
  <h3>Customer Form Fields - Checkout Pe Dikhega</h3>
  <p style="color:#666;font-size:14px;margin-bottom:15px;">Yahan se extra fields add karo jo customer se order ke time mangne hain</p>
  
  <div style="border:1px solid #ddd;padding:15px;border-radius:6px;margin-bottom:20px;">
    <h4>Add New Field</h4>
    <input type="text" id="fieldLabel" placeholder="Field Label e.g. GST Number">
    <input type="text" id="fieldName" placeholder="Field Name e.g. gst_number">
    <select id="fieldType">
      <option value="text">Text</option>
      <option value="number">Number</option>
      <option value="email">Email</option>
      <option value="tel">Phone</option>
      <option value="textarea">Textarea</option>
      <option value="select">Dropdown</option>
    </select>
    <input type="text" id="fieldPlaceholder" placeholder="Placeholder text">
    <input type="text" id="fieldOptions" placeholder="Dropdown options comma separated" style="display:none;">
    <label><input type="checkbox" id="fieldRequired"> Required Field</label>
    <button onclick="addCustomField()">Add Field</button>
  </div>

  <h4>Current Fields</h4>
  <div id="customFieldsList"></div>
</div>

<!-- SETTINGS TAB -->
<div id="settings" class="tab-content hide">
  <h3>Website Settings</h3>
  
  <label>Logo Text</label>
  <input type="text" id="setLogo" placeholder="🛍️ SANTRA MALL">
  
  <label>Primary Color</label>
  <input type="color" id="setColor" value="#e40046">
  
  <label>Help Desk Phone</label>
  <input type="text" id="setPhone" placeholder="9829508335">
  
  <label>Help Desk WhatsApp</label>
  <input type="text" id="setWhatsapp" placeholder="9829508335">
  
  <label>Help Desk Email</label>
  <input type="email" id="setEmail" placeholder="mansasingh7109@gmail.com">
  
  <label>Help Desk Hours</label>
  <input type="text" id="setHours" placeholder="Mon-Sat: 12 AM - 12 PM">
  
  <label>About Us</label>
  <textarea id="setAbout" rows="3"></textarea>

  <button onclick="saveSettings()">💾 Save Settings</button>
</div>

<script src="db.js"></script>
<script>
// CHECK ADMIN LOGIN
window.onload = function(){
  let admin = localStorage.getItem('current_admin');
  if(!admin){
    alert('Please login from Help Desk first!');
    window.location.href = 'index.html';
    return;
  }
  loadProducts();
  loadOrders();
  loadCustomFields();
  loadSettings();
}

function logout(){
  localStorage.removeItem('current_admin');
  window.location.href = 'index.html';
}

function openTab(tabName){
  document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hide'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabName).classList.remove('hide');
  event.target.classList.add('active');
}

// PRODUCT FUNCTIONS
function clearForm(){
  document.getElementById('productForm').reset();
  document.getElementById('productId').value = '';
  document.getElementById('filePreview').innerHTML = '';
}

document.getElementById('pMediaFile').addEventListener('change', function(e){
  let files = e.target.files;
  let preview = document.getElementById('filePreview');
  preview.innerHTML = '';
  
  for(let file of files){
    let reader = new FileReader();
    reader.onload = function(event){
      if(file.type.startsWith('image/')){
        preview.innerHTML += `<img src="${event.target.result}" style="max-width:100px;margin:5px;">`;
      } else if(file.type.startsWith('video/')){
        preview.innerHTML += `<video src="${event.target.result}" controls style="max-width:100px;margin:5px;"></video>`;
      } else {
        preview.innerHTML += `<p>📄 ${file.name}</p>`;
      }
    }
    reader.readAsDataURL(file);
  }
});

function saveProduct(){
  let id = document.getElementById('productId').value;
  let name = document.getElementById('pName').value;
  let mrp = document.getElementById('pMrp').value;
  let price = document.getElementById('pPrice').value;
  let stock = document.getElementById('pStock').value;
  let category = document.getElementById('pCategory').value;
  let desc = document.getElementById('pDesc').value;
  let mediaUrl = document.getElementById('pMediaUrl').value;
  let mediaType = document.getElementById('pMediaType').value;
  
  if(!name ||!price ||!stock){
    alert('Please fill required fields!');
    return;
  }

  // Handle file upload - Convert to base64
  let fileInput = document.getElementById('pMediaFile');
  if(fileInput.files.length > 0){
    let file = fileInput.files[0];
    let reader = new FileReader();
    reader.onload = function(e){
      mediaUrl = e.target.result;
      saveProductData(id, name, mrp, price, stock, category, desc, mediaUrl, mediaType);
    }
    reader.readAsDataURL(file);
  } else {
    saveProductData(id, name, mrp, price, stock, category, desc, mediaUrl, mediaType);
  }
}

function saveProductData(id, name, mrp, price, stock, category, desc, mediaUrl, mediaType){
  if(!SANTRA_DB.products) SANTRA_DB.products = [];
  
  if(id){
    // Edit
    let idx = SANTRA_DB.products.findIndex(p => p.id == id);
    if(idx > -1){
      SANTRA_DB.products[idx] = {id:parseInt(id), name, mrp, price, stock, category, desc, mediaUrl, mediaType, img: mediaUrl};
    }
  } else {
    // Add
    SANTRA_DB.products.push({
      id: Date.now(),
      name, mrp, price, stock, category, desc, mediaUrl, mediaType, img: mediaUrl
    });
  }
  
  saveDB();
  alert('✅ Product saved!');
  clearForm();
  loadProducts();
}

function loadProducts(){
  let container = document.getElementById('productList');
  if(!SANTRA_DB.products || SANTRA_DB.products.length === 0){
    container.innerHTML = '<p>No products yet</p>';
    return;
  }
  
  container.innerHTML = SANTRA_DB.products.map(p => {
    let mediaHtml = '';
    if(p.mediaType === 'image' || !p.mediaType){
      mediaHtml = `<img src="${p.img || p.mediaUrl}" alt="${p.name}">`;
    } else if(p.mediaType === 'video'){
      mediaHtml = `<video src="${p.mediaUrl}" controls></video>`;
    } else if(p.mediaType === 'audio'){
      mediaHtml = `<audio src="${p.mediaUrl}" controls style="width:100%"></audio>`;
    } else {
      mediaHtml = `<a href="${p.mediaUrl}" target="_blank">📄 Document</a>`;
    }
    
    return `
      <div class="product-item">
        ${mediaHtml}
        <h4>${p.name}</h4>
        <p>₹${p.price} | Stock: ${p.stock}</p>
        <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
        <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
      </div>
    `;
  }).join('');
}

function editProduct(id){
  let p = SANTRA_DB.products.find(pr => pr.id == id);
  if(!p) return;
  
  document.getElementById('productId').value = p.id;
  document.getElementById('pName').value = p.name;
  document.getElementById('pMrp').value = p.mrp || '';
  document.getElementById('pPrice').value = p.price;
  document.getElementById('pStock').value = p.stock;
  document.getElementById('pCategory').value = p.category || '';
  document.getElementById('pDesc').value = p.desc || '';
  document.getElementById('pMediaUrl').value = p.mediaUrl || '';
  document.getElementById('pMediaType').value = p.mediaType || 'image';
  window.scrollTo(0,0);
}

function deleteProduct(id){
  if(confirm('Delete this product?')){
    SANTRA_DB.products = SANTRA_DB.products.filter(p => p.id != id);
    saveDB();
    loadProducts();
  }
}

// ORDERS FUNCTIONS
function loadOrders(){
  let container = document.getElementById('orderList');
  if(!SANTRA_DB.orders || SANTRA_DB.orders.length === 0){
    container.innerHTML = '<p>No orders yet</p>';
    return;
  }
  
  container.innerHTML = SANTRA_DB.orders.reverse().map(o => `
    <div class="order-item">
      <h4>Order #${o.id} - ${o.status}</h4>
      <p><b>Customer:</b> ${o.customerName} | ${o.mobile}</p>
      <p><b>Address:</b> ${o.address}</p>
      <p><b>Total:</b> ₹${o.total} | <b>Payment:</b> ${o.paymentMode}</p>
      <p><b>Items:</b> ${o.items.map(i => i.name + ' x' + i.qty).join(', ')}</p>
      <p><b>Date:</b> ${new Date(o.time).toLocaleString()}</p>
      <select onchange="updateOrderStatus(${o.id}, this.value)">
        <option value="Confirmed" ${o.status==='Confirmed'?'selected':''}>Confirmed</option>
        <option value="Shipped" ${o.status==='Shipped'?'selected':''}>Shipped</option>
        <option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option>
        <option value="Canceled" ${o.status==='Canceled'?'selected':''}>Canceled</option>
      </select>
    </div>
  `).join('');
}

function updateOrderStatus(id, status){
  let order = SANTRA_DB.orders.find(o => o.id == id);
  if(order){
    order.status = status;
    saveDB();
    alert('Status updated!');
  }
}

// CUSTOM FIELDS FUNCTIONS
document.getElementById('fieldType').addEventListener('change', function(){
  document.getElementById('fieldOptions').style.display = this.value === 'select' ? 'block' : 'none';
});

function addCustomField(){
  let label = document.getElementById('fieldLabel').value;
  let name = document.getElementById('fieldName').value;
  let type = document.getElementById('fieldType').value;
  let placeholder = document.getElementById('fieldPlaceholder').value;
  let options = document.getElementById('fieldOptions').value;
  let required = document.getElementById('fieldRequired').checked;
  
  if(!label ||!name){
    alert('Label and Name required!');
    return;
  }
  
  let fields = JSON.parse(localStorage.getItem('CUSTOMER_FORM_FIELDS')) || [];
  fields.push({label, name, type, placeholder, options, required});
  localStorage.setItem('CUSTOMER_FORM_FIELDS', JSON.stringify(fields));
  
  document.getElementById('fieldLabel').value = '';
  document.getElementById('fieldName').value = '';
  document.getElementById('fieldPlaceholder').value = '';
  document.getElementById('fieldOptions').value = '';
  
  loadCustomFields();
  alert('Field added!');
}

function loadCustomFields(){
  let fields = JSON.parse(localStorage.getItem('CUSTOMER_FORM_FIELDS')) || [];
  let container = document.getElementById('customFieldsList');
  
  if(fields.length === 0){
    container.innerHTML = '<p>No custom fields yet</p>';
    return;
  }
  
  container.innerHTML = fields.map((f, idx) => `
    <div style="border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:4px;">
      <b>${f.label}</b> (${f.type}) ${f.required ? ' *' : ''}
      <button onclick="deleteField(${idx})" style="float:right;background:#f44336;">Delete</button>
    </div>
  `).join('');
}

function deleteField(idx){
  let fields = JSON.parse(localStorage.getItem('CUSTOMER_FORM_FIELDS')) || [];
  fields.splice(idx, 1);
  localStorage.setItem('CUSTOMER_FORM_FIELDS', JSON.stringify(fields));
  loadCustomFields();
}

// SETTINGS FUNCTIONS
function loadSettings(){
  if(!SANTRA_DB.settings) SANTRA_DB.settings = {};
  document.getElementById('setLogo').value = SANTRA_DB.settings.logo || '🛍️ SANTRA MALL';
  document.getElementById('setColor').value = SANTRA_DB.settings.primaryColor || '#e40046';
  document.getElementById('setPhone').value = SANTRA_DB.settings.helpdeskPhone || '';
  document.getElementById('setWhatsapp').value = SANTRA_DB.settings.helpdeskWhatsapp || '';
  document.getElementById('setEmail').value = SANTRA_DB.settings.helpdeskEmail || '';
  document.getElementById('setHours').value = SANTRA_DB.settings.helpdeskHours || '';
  document.getElementById('setAbout').value = SANTRA_DB.settings.helpdeskAbout || '';
}

function saveSettings(){
  if(!SANTRA_DB.settings) SANTRA_DB.settings = {};
  SANTRA_DB.settings.logo = document.getElementById('setLogo').value;
  SANTRA_DB.settings.primaryColor = document.getElementById('setColor').value;
  SANTRA_DB.settings.helpdeskPhone = document.getElementById('setPhone').value;
  SANTRA_DB.settings.helpdeskWhatsapp = document.getElementById('setWhatsapp').value;
  SANTRA_DB.settings.helpdeskEmail = document.getElementById('setEmail').value;
  SANTRA_DB.settings.helpdeskHours = document.getElementById('setHours').value;
  SANTRA_DB.settings.helpdeskAbout = document.getElementById('setAbout').value;
  saveDB();
  alert('✅ Settings saved!');
}
</script>

</body>
</html>
