<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANTRA MALL - ADMIN PANEL</title>
  <style>
    :root{--accent:#e40046;--sidebar:#1e1b4b;--bg:#f1f3f6;--card:#fff;--green:#10b981;--blue:#3b82f6;--red:#ef4444}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:var(--bg)}
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:#fff;padding:40px;border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,0.3);max-width:400px;width:90%}
.login-box h2{color:#5b21b6;text-align:center;margin-bottom:25px;font-size:28px}
.login-box input{width:100%;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:8px;font-size:15px}
.login-box button{width:100%;padding:14px;background:#5b21b6;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:15px}
.login-method{display:flex;gap:10px;margin-bottom:20px}
.login-method button{flex:1;padding:10px;border:2px solid #5b21b6;background:#fff;color:#5b21b6;border-radius:8px;cursor:pointer;font-weight:bold;margin:0}
.login-method button.active{background:#5b21b6;color:#fff}
.hide{display:none!important}
.msg{padding:12px;border-radius:6px;margin:10px 0;text-align:center;font-weight:bold;font-size:14px}
.msg-success{background:#d4edda;color:#155724}
.msg-error{background:#f8d7da;color:#721c24}
.msg-hint{background:#fff3cd;color:#856404;border:1px solid #ffeaa7}
.admin-layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--sidebar);color:white;position:fixed;left:0;top:0;bottom:0;overflow-y:auto}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar-header h2{font-size:20px;display:flex;align-items:center;gap:10px}
.menu-item{padding:14px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:15px;border-left:3px solid transparent}
.menu-item:hover{background:rgba(255,255,255,0.1);border-left-color:#5b21b6}
.menu-item.active{background:#5b21b6;border-left-color:white}
.main-content{margin-left:260px;flex:1}
.top-bar{background:var(--card);padding:20px 30px;box-shadow:0 2px 5px rgba(0,0,0,0.05);display:flex;justify-content:space-between;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:28px;color:#1f2937}
.content-area{padding:30px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:30px}
.stat-box{padding:25px;border-radius:12px;color:white;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.stat-box h2{font-size:42px;margin-bottom:8px;font-weight:bold}
.stat-purple{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.stat-green{background:linear-gradient(135deg,#10b981 0%,#059669 100%)}
.stat-orange{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%)}
.stat-pink{background:linear-gradient(135deg,#ec4899 0%,#db2777 100%)}
.card{background:var(--card);padding:25px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);margin-bottom:20px}
 @media(max-width:768px){.sidebar{width:100%;position:relative;height:auto}.main-content{margin-left:0}.stats-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>🔐 Admin Login</h2>

    <div class="login-method">
      <button type="button" id="firebaseBtn" class="active">🔥 Firebase</button>
      <button type="button" id="localBtn">💾 Local</button>
    </div>

    <div id="loginMsg"></div>

    <input type="email" id="adminEmail" placeholder="Admin Email" value="mansasingh7109@gmail.com">
    <input type="password" id="adminPassword" placeholder="Enter Password">

    <button type="button" onclick="showPasswordHint()" style="background:#f59e0b;margin:5px 0;padding:10px;">💡 Show Password Hint</button>
    <button type="button" onclick="resetToDefaultPassword()" style="background:#10b981;margin:5px 0;padding:10px;">🔄 Reset Local Password</button>

    <button type="button" id="loginBtn">Login</button>

    <p style="text-align:center;font-size:12px;color:#666;margin-top:15px;" id="methodInfo">Firebase Auth se login hoga</p>
  </div>
</div>

<div id="adminDashboard" class="hide">
  <div class="admin-layout">
    <div class="sidebar">
      <div class="sidebar-header"><h2>🛡️ Admin Panel</h2></div>
      <div class="sidebar-menu">
        <div class="menu-item active" onclick="showPage('dashboard',this)">📊 Dashboard</div>
        <div class="menu-item" onclick="window.open('index.html','_blank')">🏠 Back to Website</div>
        <div class="menu-item" onclick="adminLogout()">🚪 Logout</div>
      </div>
    </div>
    <div class="main-content">
      <div class="top-bar">
        <h1 id="pageTitle">Dashboard</h1>
        <div>Welcome, <b id="adminName">Admin</b> | <span id="loginMethodBadge" style="font-size:12px;background:#10b981;color:white;padding:2px 8px;border-radius:10px;"></span></div>
      </div>
      <div class="content-area">
        <div id="pageDashboard" class="page-content">
          <div class="stats-grid">
            <div class="stat-box stat-purple"><h2 id="statProducts">0</h2><p>Total Products</p></div>
            <div class="stat-box stat-green"><h2 id="statOrders">0</h2><p>Total Orders</p></div>
            <div class="stat-box stat-orange"><h2 id="statCustomers">0</h2><p>Total Customers</p></div>
            <div class="stat-box stat-pink"><h2 id="statRevenue">₹0</h2><p>Total Revenue</p></div>
          </div>
          <div class="card">
            <h3>✅ Login Successful!</h3>
            <p>Old data safe hai. Products: <span id="productCount">0</span> | Orders: <span id="orderCount">0</span></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { DB, saveDB } from './db.js';
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // Updated email yaha hai
  const ADMIN_EMAILS = ["mansasingh7109@gmail.com"];
  const DEFAULT_PASSWORD = "Manisha7";

  var CURRENT_ADMIN = null;
  var LOGIN_METHOD = 'firebase';

  document.getElementById('firebaseBtn').onclick = function(){
    LOGIN_METHOD = 'firebase';
    document.getElementById('firebaseBtn').classList.add('active');
    document.getElementById('localBtn').classList.remove('active');
    document.getElementById('methodInfo').innerText = 'Firebase Auth se login hoga';
  }

  document.getElementById('localBtn').onclick = function(){
    LOGIN_METHOD = 'local';
    document.getElementById('localBtn').classList.add('active');
    document.getElementById('firebaseBtn').classList.remove('active');
    document.getElementById('methodInfo').innerText = 'Local DB.js se login hoga';
  }

  function showMsg(text, type){
    document.getElementById('loginMsg').innerHTML = `<div class="msg msg-${type}">${text}</div>`;
    setTimeout(()=>{document.getElementById('loginMsg').innerHTML=''},4000);
  }

  window.showPasswordHint = function(){
    showMsg(`💡 Default Password: ${DEFAULT_PASSWORD}`, "hint");
  }

  window.resetToDefaultPassword = function(){
    let email = document.getElementById('adminEmail').value.trim();
    let admin = DB.users.find(u=>u.role==='admin' && u.email===email);
    if(admin){
      admin.pass = DEFAULT_PASSWORD;
      saveDB();
      showMsg(`✅ Local password reset to: ${DEFAULT_PASSWORD}`, "success");
      document.getElementById('adminPassword').value = DEFAULT_PASSWORD;
    } else {
      DB.users.push({email: email, pass: DEFAULT_PASSWORD, role: 'admin', name: 'Admin'});
      saveDB();
      showMsg(`✅ Admin created with password: ${DEFAULT_PASSWORD}`, "success");
      document.getElementById('adminPassword').value = DEFAULT_PASSWORD;
    }
  }

  document.getElementById("loginBtn").onclick = async function() {
    let email = document.getElementById('adminEmail').value.trim();
    let password = document.getElementById('adminPassword').value.trim();

    if(!email ||!password) {
      showMsg("❌ Email aur Password daalo!", "error");
      return;
    }

    if(!ADMIN_EMAILS.includes(email)){
      showMsg("❌ Ye email admin nahi hai!", "error");
      return;
    }

    if(LOGIN_METHOD === 'firebase'){
      try {
        const auth = getAuth();
        await signInWithEmailAndPassword(auth, email, password);
        CURRENT_ADMIN = { email: email };
        sessionStorage.setItem('loginMethod', 'firebase');
        showMsg("✅ Firebase Login successful!", "success");
        loginSuccess(email, 'firebase');
      } catch (error) {
        if(error.code === 'auth/wrong-password'){
          showMsg(`❌ Wrong Password! Firebase me password check kar`, "error");
        } else if(error.code === 'auth/user-not-found'){
          showMsg("❌ User nahi mila Firebase me. Pehle Add user se add kar", "error");
        } else {
          showMsg("❌ Error: " + error.message, "error");
        }
      }
    } else {
      let admin = DB.users.find(u=>u.role==='admin' && u.email===email);
      if(admin && admin.pass===password){
        CURRENT_ADMIN = admin;
        sessionStorage.setItem('loginMethod', 'local');
        sessionStorage.setItem('adminLoggedIn', email);
        showMsg("✅ Local Login successful!", "success");
        loginSuccess(email, 'local');
      } else {
        showMsg(`❌ Wrong Password! "Reset Local Password" button daba`, "error");
      }
    }
  };

  document.getElementById('adminPassword').addEventListener("keypress", (e) => {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });

  function loginSuccess(email, method){
    setTimeout(() => {
      document.getElementById('loginScreen').classList.add('hide');
      document.getElementById('adminDashboard').classList.remove('hide');
      document.getElementById('adminName').innerText = email.split('@')[0];
      document.getElementById('loginMethodBadge').innerText = method === 'firebase'? '🔥 Firebase' : '💾 Local';
      loadDashboard();
    }, 500);
  }

  window.onload = function(){
    let method = sessionStorage.getItem('loginMethod');
    if(method === 'local'){
      let loggedEmail = sessionStorage.getItem('adminLoggedIn');
      if(loggedEmail){
        let admin = DB.users.find(u=>u.role==='admin' && u.email===loggedEmail);
        if(admin){
          CURRENT_ADMIN = admin;
          LOGIN_METHOD = 'local';
          loginSuccess(loggedEmail, 'local');
        }
      }
    }
  }

  window.adminLogout = function(){
    sessionStorage.removeItem('adminLoggedIn');
    sessionStorage.removeItem('loginMethod');
    location.reload();
  }

  function loadDashboard(){
    document.getElementById('statProducts').innerText = DB.products.length;
    document.getElementById('statOrders').innerText = DB.orders.length;
    document.getElementById('statCustomers').innerText = DB.users.filter(u=>u.role==='customer').length;
    document.getElementById('statRevenue').innerText = '₹' + DB.orders.reduce((s,o)=>s+o.total,0);
    document.getElementById('productCount').innerText = DB.products.length;
    document.getElementById('orderCount').innerText = DB.orders.length;
  }

  window.showPage = function(page, el){
    document.querySelectorAll('.page-content').forEach(p => p.classList.add('hide'));
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1)).classList.remove('hide');
    el.classList.add('active');
    document.getElementById('pageTitle').innerText = page.charAt(0).toUpperCase() + page.slice(1);
    if(page==='dashboard') loadDashboard();
  }
</script>
</body>
</html>
