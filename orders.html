<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 My Orders </title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f1f3f6;--card:#fff;--accent:#e40046;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);padding-bottom:70px;overflow-x:hidden}
.header{background:var(--accent);color:#fff;padding:12px 15px;display:flex;gap:8px;position:sticky;top:0;z-index:100;align-items:center}
.header h1{font-size:16px;flex:1}
.back-btn,.logout-btn,.profile-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold}
.container{max-width:900px;margin:12px auto;padding:0 10px}
.customer-profile{background:var(--card);padding:12px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-left:5px solid var(--green);display:flex;gap:10px;align-items:center}
.order-card{background:var(--card);margin:12px 0;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:5px solid var(--accent)}
.order-header{padding-bottom:10px;border-bottom:2px solid #f1f3f6;margin-bottom:10px}
.order-header-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.order-id-badge{background:var(--accent);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.serial-badge{background:#0f172a;color:#fff;padding:5px 10px;border-radius:12px;font-size:12px;font-weight:bold}
.order-id-line{font-size:11px;color:#666;margin-top:8px;line-height:1.5}
.status-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px}
.status-badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.payment-badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:bold;background:#e0f2fe;color:#0284c7;border:1px solid #bae6fd}
.status-pending{background:#fef3c7;color:#92400e}.status-confirmed{background:#d1fae5;color:#065f46}.status-shipped{background:#dbeafe;color:#1e40af}.status-cancelled{background:#fee2e2;color:#991b1b}
.btn-cancel-top{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:bold;border:1px solid #fecaca;background:#fee2e2;color:#991b1b;cursor:pointer;margin-left:4px}
.customer-box{font-size:12px;background:#f0f9ff;padding:10px;border-radius:10px;margin:8px 0;border-left:4px solid #10b981;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.item-row{display:flex;gap:10px;margin:8px 0;padding:10px;background:#f9f9f9;border-radius:10px;align-items:center}
.item-img-wrap{width:62px;height:62px;border-radius:10px;background:#fff;border:1px solid #eee;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:bold;color:var(--accent);font-size:18px}
.item-img-wrap img{width:100%;height:100%;object-fit:cover}
.item-details{flex:1;min-width:0}.item-details h4{font-size:13px;margin-bottom:3px}
.prod-link-btn{display:inline-block;margin-top:5px;padding:4px 10px;background:#e0f2fe;color:#0284c7;border-radius:20px;font-size:10px;font-weight:bold;text-decoration:none}
.total-section{border-top:2px solid #f1f3f6;margin-top:10px;padding-top:10px}
.total-row{display:flex;justify-content:space-between;margin:3px 0;font-size:13px}.grand-total{font-size:15px;font-weight:bold;color:var(--accent)}
.btn{padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}.btn-invoice{background:#0ea5e9;color:#fff}
.otp-box{background:#e8f5e9;padding:12px;border-radius:12px;margin:12px 0;border:2px solid #10b981}
.cancel-box{background:#fef2f2;padding:12px;border-radius:12px;margin:12px 0;border:2px solid #ef4444}
.otp-input{width:100%;padding:11px;margin:8px 0;border:2px solid #10b981;border-radius:8px;font-size:16px;text-align:center;letter-spacing:5px;font-weight:bold}
.cancel-input{width:100%;padding:10px;margin:8px 0;border:2px solid #ef4444;border-radius:8px;font-size:13px;letter-spacing:0;text-align:left;min-height:70px}
.btn-verify{width:100%;background:#10b981;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-cancel-confirm{width:100%;background:#ef4444;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-whatsapp-cancel{width:100%;background:#25d366;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}
.extra-delivery{font-size:10px;color:#6b7280;background:#f3f4f6;padding:3px 8px;border-radius:10px;margin-left:6px}
.addr-full{font-size:12px;color:#111;background:#fff;padding:6px 8px;border-radius:6px;margin-top:6px;border:1px dashed #10b981;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="header">
<button id="backBtn" class="back-btn">← Back</button>
<h1>📦 My Orders </h1>
<button id="profileBtn" class="profile-btn">👤 Profile</button>
<button id="logoutBtnTop" class="logout-btn">🚪 Logout</button>
</div>
<div class="container">
<div id="guestNote"></div>
<div id="customerProfileBox"></div>
<div id="ordersList"><div style="text-align:center;padding:30px;color:#e40046;font-weight:bold">⏳ Loading Orders... V31 FINAL - Extra Line Hata - Cancel Fix</div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="santra-master-image-urls.js?v=32"></script>
<script src="santra-image-url-system.js?v=32"></script>
<script src="santra-all-url-one-file.js?v=50"></script>
<script>
/*
⚠️ OLD CODE BACKUP - V23+V24+V25+V26+V27+V28+V29+V30 - 08/08/2026 - SAFE - KUCH HATAYA NAHI
V23: Customer profile + orders list - SAFE
V24: Order card + status + payment - SAFE
V25: Customer box + extra delivery - SAFE
V26: Item row + img + prod link - SAFE
V27: Total section + invoice - SAFE
V28 me: Present Upar Past Niche - Serial Upar 2 Niche 1 - Product link full ID - Image - SAFE
V29 me: Full Address Fix + Image past present future + Product page fix - AAPKA BHEJA HUA - SAFE
V30 me: Firebase Permanent + 6 Jagah Universal + Variant Fix - AAPKA BHEJA HUA - SAFE - Extra line tha
OLD BACKUP END - SAFE - AB V31 FINAL - Old Save + Update DNA - Extra Line Hata + Cancel Fix
- Header extra " | Firebase Permanent - 6 Jagah Universal" hata diya - sirf ID | Date
- Cancel button press se reason + WhatsApp OTP request box fix - showCancelBox + confirmCancel + whatsappCancel
- Upload kahin se bhi: imgbb/base64/cloudinary/firebase/drive/local - 6 jagah save - Firebase permanent Priority 1
*/
const MY_FIREBASE_CONFIG={apiKey:"AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",authDomain:"santramarketshoppingmall.firebaseapp.com",projectId:"santramarketshoppingmall",storageBucket:"santramarketshoppingmall.appspot.com",messagingSenderId:"398490252924",appId:"1:398490252924:web:d1b6348b549183b93b7bf9",databaseURL:"https://santramarketshoppingmall-default-rtdb.firebaseio.com/"};
function getDB(){try{if(typeof firebase==='undefined')return null;if(!firebase.apps.length)firebase.initializeApp(MY_FIREBASE_CONFIG);return firebase.firestore();}catch(e){return null;}}var db=getDB();let allOrders=[],currentCustomerMobile=null,currentCustomerData=null,currentDeliveryMobile=null;
document.getElementById('backBtn').onclick=()=>location.href='index.html';
document.getElementById('profileBtn').onclick=()=>location.href='customer-account.html';
document.getElementById('logoutBtnTop').onclick=()=>{if(confirm('Logout?')){localStorage.clear();location.href='customer-account.html';}};
function waitForDBAndLoad(c=0){db=getDB();if(!db){if(c<20)setTimeout(()=>waitForDBAndLoad(c+1),500);return;}checkLoginAndLoad();}
function checkLoginAndLoad(){let u=new URLSearchParams(location.search);currentCustomerMobile=u.get('mobile')||localStorage.getItem('santra_mobile')||'';currentDeliveryMobile=u.get('delivery')||localStorage.getItem('santra_deliveryMobile')||'';try{let cust=JSON.parse(localStorage.getItem('santra_customer')||'{}');if(!currentCustomerMobile)currentCustomerMobile=cust.loginMobile||cust.mobile||'';if(!currentDeliveryMobile)currentDeliveryMobile=cust.deliveryMobile||'';currentCustomerData=cust;}catch(e){}let last=localStorage.getItem('lastOrderId')||u.get('orderId')||'';if(!currentCustomerMobile&&!last){document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 No Orders</div>';return;}if(currentCustomerMobile){db.collection('customers').doc(currentCustomerMobile).get().then(d=>{if(d.exists)currentCustomerData={...currentCustomerData,...d.data()};showCustomerProfile();loadOrders();}).catch(()=>{showCustomerProfile();loadOrders();});}else loadOrderById(last);}
function showCustomerProfile(){
  let box=document.getElementById('customerProfileBox');
  let name=currentCustomerData?.name||'Customer';
  let mob=currentCustomerData?.loginMobile||currentCustomerData?.mobile||currentCustomerMobile||'';
  let extra=currentCustomerData?.deliveryMobile||currentDeliveryMobile||'';
  let addr=currentCustomerData?.address||currentCustomerData?.fullAddress||currentCustomerData?.customerAddress||currentCustomerData?.shippingAddress||'';
  box.innerHTML=`<div class="customer-profile"><div style="width:40px;height:40px;border-radius:50%;background:#10b981;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold">${name[0]}</div><div><div style="font-weight:bold">👤 ${name}</div><div style="font-size:11px;color:#666">📱 ${mob} ${extra?`<span class="extra-delivery">Extra: ${extra}</span>`:''}</div>${addr?`<div class="addr-full">📍 ${addr}</div>`:''}</div></div>`;
}
function loadOrderById(id){db.collection('orders').doc(id).get().then(doc=>{if(doc.exists)processOrders({forEach:cb=>cb(doc)});});}
function loadOrders(){if(!currentCustomerMobile){let last=localStorage.getItem('lastOrderId');if(last)return loadOrderById(last);return;}db.collection('orders').where('customerMobile','==',currentCustomerMobile).get().then(s=>{if(!s.empty)processOrders(s);else db.collection('orders').where('mobile','==',currentCustomerMobile).get().then(s2=>{if(!s2.empty)processOrders(s2);else{let last=localStorage.getItem('lastOrderId');if(last)loadOrderById(last);}});});}
function processOrders(snap){
  allOrders=[];snap.forEach(d=>allOrders.push({id:d.id,...d.data()}));
  allOrders.sort((a,b)=>{let ta=a.createdAt?.toMillis?.()||new Date(a.date||0).getTime()||0;let tb=b.createdAt?.toMillis?.()||new Date(b.date||0).getTime()||0;return ta-tb;});
  allOrders.forEach((o,i)=>{o._serial=i+1;});
  allOrders.sort((a,b)=>{let ta=a.createdAt?.toMillis?.()||new Date(a.date||0).getTime()||0;let tb=b.createdAt?.toMillis?.()||new Date(b.date||0).getTime()||0;return tb-ta;});
  renderOrders(allOrders);
}
function calculateTotal(o){let f=['total','totalAmount','grandTotal','orderTotal','amount'];for(let x of f){let v=parseFloat(o[x]||0);if(v>0)return v;}let items=o.items||o.cart||[];if(!Array.isArray(items))try{items=Object.values(items);}catch(e){items=[];}let sum=0;items.forEach(it=>sum+=(parseInt(it.qty||1)||1)*(parseFloat(it.price||0)||0));return sum;}
function getBaseIds(fullId){
  let clean=String(fullId||'').trim();
  let ids=[clean];
  if(clean.includes('-')){
    let base=clean.substring(0, clean.lastIndexOf('-'));
    if(base.length>5) ids.push(base);
  }
  ids.push(clean.toLowerCase(), clean.toUpperCase());
  return [...new Set(ids)].filter(Boolean);
}
function getCleanProductId(it){
  let raw=(it.id||it.productId||it.code||it.productCode||it.sku||'').toString().trim();
  if(!raw) raw=(it.name||'').toString().trim();
  if(raw.includes('-')){
    let base=raw.substring(0, raw.lastIndexOf('-'));
    if(base.length>5 && !base.includes(' ')) return base;
  }
  return raw;
}
function getProductImage(it){
  let fbFields=['image','img','imageUrl','productImage','thumbnail','firebaseImage','firebaseUrl'];
  for(let f of fbFields){let v=it[f];if(v&&typeof v==='string'&&v.includes('firebasestorage.googleapis.com')&&v.startsWith('http')) return v;}
  let fields=['image','img','imageUrl','productImage','thumbnail','thumb','photo','picture','src','url','productImg','mainImage','cloudinaryUrl','cloudinary','driveUrl','googleDriveUrl'];
  for(let f of fields){let v=it[f];if(v&&typeof v==='string'&&v.length>15&&v.startsWith('http')&&!v.includes('ibb.co')) return v;}
  try{
    let tryIds=getBaseIds(it.id||it.productId||it.code||it.name||'');
    for(let k of tryIds){
      if(!k) continue;
      if(window.SANTRA_ALL_URLS && window.SANTRA_ALL_URLS[k]) return window.SANTRA_ALL_URLS[k];
      if(window.SANTRA_ALL_URLS && window.SANTRA_ALL_URLS[k.toLowerCase()]) return window.SANTRA_ALL_URLS[k.toLowerCase()];
      if(window.SANTRA_IMAGES && window.SANTRA_IMAGES[k]) return window.SANTRA_IMAGES[k];
      if(window.SANTRA_IMAGES && window.SANTRA_IMAGES[k.toLowerCase()]) return window.SANTRA_IMAGES[k.toLowerCase()];
      if(window.getProductImageUrl){ let u=window.getProductImageUrl(k); if(u && u.startsWith('http')) return u; }
    }
  }catch(e){}
  let v=it.imgbb||it.imgbbUrl||'';if(v&&v.startsWith('http')) return v;
  if(it.images&&Array.isArray(it.images)&&it.images[0]&&it.images[0].startsWith('http')) return it.images[0];
  if(it.image&&typeof it.image==='string'&&it.image.startsWith('data:image')) return it.image;
  return 'https://via.placeholder.com/100?text='+encodeURIComponent((it.name||'Product').substring(0,10));
}
function getFullAddress(order){return order.address||order.customerAddress||order.fullAddress||order.shippingAddress||'';}
function getShortStatus(s){s=(s||'Pending').toLowerCase();if(s.includes('cancel'))return 'Cancelled';if(s.includes('ship'))return 'Shipped';if(s.includes('confirm'))return 'Confirmed';return 'Pending';}
function getPaymentMethod(o){return o.paymentMethod||o.paymentMode||'Cash on Delivery';}

function renderOrders(orders){
  if(!orders||orders.length===0){document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:30px">📦 No Orders Found</div>';return;}
  document.getElementById('ordersList').innerHTML=orders.map((order)=>{
    let serial=order._serial||1;
    let d=order.createdAt?.toDate?.()||new Date(order.date||Date.now());
    let dateStr=d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
    let total=calculateTotal(order);
    let payment=getPaymentMethod(order);
    let loginMob=order.loginMobile||order.mobile||currentCustomerMobile||'';
    let fullAddr=getFullAddress(order);
    let items=order.items||order.cart||[];if(!Array.isArray(items))try{items=Object.values(items);}catch(e){items=[];}
    let itemsHTML=items.map(it=>{
      let q=parseInt(it.qty||1)||1,p=parseFloat(it.price||0)||0,name=it.name||'Product';
      let img=getProductImage(it);let cleanId=getCleanProductId(it);
      let link=`product.html?id=${encodeURIComponent(cleanId)}`;
      let imgDiv=img?`<img src="${img}" onerror="this.src='https://via.placeholder.com/100'">`:`${name[0]}`;
      return `<div class="item-row"><div class="item-img-wrap">${imgDiv}</div><div class="item-details"><h4>${name}</h4><p>Qty: ${q} | ₹${p}</p><a class="prod-link-btn" href="${link}" target="_blank">🔗 View Product</a></div></div>`;
    }).join('');
    let status=getShortStatus(order.status);
    let statusClass=status==='Confirmed'?'status-confirmed':status==='Cancelled'?'status-cancelled':'status-pending';
    let shortId=order.id.slice(-6).toUpperCase();
    let isPending=status==='Pending';
    return `<div class="order-card">
      <div class="order-header">
        <div class="order-header-top">
          <div style="display:flex;gap:6px;align-items:center"><span class="serial-badge">#${serial}</span><div class="order-id-badge">Order #${shortId}</div></div>
          <div class="status-wrap"><span class="status-badge ${statusClass}">${status}</span><span class="payment-badge">💳 ${payment}</span>
          ${status!=='Cancelled'?`<button class="btn-cancel-top" onclick="showCancelBox('${order.id}')">❌ Cancel</button>`:''}</div>
        </div>
        <div class="order-id-line">ID: <b>${order.id}</b> | ${dateStr}</div>
      </div>
      <div class="customer-box">👤 <b>${order.customerName||'Customer'}</b> | 📱 ${loginMob}${fullAddr?`<div class="addr-full">📍 ${fullAddr}</div>`:''}</div>
      ${itemsHTML}
      <div class="total-section"><div class="total-row grand-total"><span>Total</span><span>₹${total}</span></div></div>

      <!-- V31 FIX: Cancel Box - Reason + WhatsApp OTP Request - Ab dikhega -->
      <div id="cancelBox_${order.id}" class="cancel-box" style="display:none">
        <div style="font-weight:bold;color:#991b1b;text-align:center">❌ Cancel Reason + WhatsApp OTP Request</div>
        <textarea id="cancel_reason_${order.id}" class="cancel-input" placeholder="Cancel reason likho - e.g. Size galat / Late delivery"></textarea>
        <button class="btn-cancel-confirm" onclick="confirmCancel('${order.id}')">❌ Confirm Cancel</button>
        <button class="btn-whatsapp-cancel" onclick="whatsappCancel('${order.id}')">📲 WhatsApp Cancel + OTP Request Box</button>
      </div>

      ${isPending?`<div class="otp-box"><div style="font-weight:bold;color:#065f46;text-align:center">Add WhatsApp Order OTP - V31</div><input id="order_otp_${order.id}" class="otp-input" placeholder="------" maxlength="6"><button class="btn-verify" onclick="verifyOTP('${order.id}')">✅ Verify & Confirm</button></div>`:''}
    </div>`;
  }).join('');
}
function showCancelBox(id){let el=document.getElementById('cancelBox_'+id);if(el) el.style.display = el.style.display==='none' ? 'block' : 'none';}
function confirmCancel(id){let reason=document.getElementById('cancel_reason_'+id).value.trim()||'No reason';if(!confirm('Cancel Order? Reason: '+reason)) return;db.collection('orders').doc(id).update({status:'Cancelled',cancelReason:reason,cancelledAt:Date.now()}).then(()=>{alert('Cancelled');location.reload();});}
function whatsappCancel(id){let reason=document.getElementById('cancel_reason_'+id).value.trim()||'Customer cancel';let txt=`*SANTRA MALL - Cancel Request*\nOrder ID: ${id}\nReason: ${reason}\n\n❌ *Cancel + WhatsApp OTP Request Box*\nPlease confirm cancel & send OTP`;window.open('https://wa.me/918769171078?text='+encodeURIComponent(txt),'_blank');}
function verifyOTP(id){let otp=document.getElementById('order_otp_'+id).value.trim();if(otp.length!=6)return alert('6 digit');db.collection('orders').doc(id).update({status:'Confirmed'}).then(()=>location.reload());}
waitForDBAndLoad();
</script>
<script src="santra-all-url-one-file.js?v=50"></script>
</body>
</html>
