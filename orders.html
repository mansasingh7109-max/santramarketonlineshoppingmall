let allOrders=[],currentCustomerMobile=null,currentCustomerData=null,currentDeliveryMobile=null,productCache={},productCacheLoaded=false,unsubscribeOrders=null;
document.getElementById('backBtn').onclick=()=>location.href='index.html';

function waitForDBAndLoad(c=0){db=getDB();if(!db){if(c<20)setTimeout(()=>waitForDBAndLoad(c+1),500);return;}checkLoginAndLoad();}

    // ✅ FIX - Order ID hamesha URL se lo - localStorage se nahi - tracking fix

function showCustomerProfile(){
  let box=document.getElementById('customerProfileBox');
  let latestName = currentCustomerData?.name || '';
  let latestAddr = currentCustomerData?.address || currentCustomerData?.fullAddress || '';
  let latestEmail = currentCustomerData?.email || '';
  if(allOrders.length>0){
    let latestOrder = allOrders[0];
    if(latestOrder.customerName && latestOrder.customerName!=='__________' && latestOrder.customerName.trim()!==''){ latestName = latestOrder.customerName; }
    let orderAddr = latestOrder.address||latestOrder.customerAddress||latestOrder.fullAddress||latestOrder.shippingAddress||'';
    if(orderAddr && orderAddr!=='__________' && orderAddr.trim()!=='' ){ if(latestAddr==='__________' ||!latestAddr || latestAddr.trim()===''){ latestAddr = orderAddr; } }
    if(latestOrder.email && latestOrder.email!=='__________'){ if(!latestEmail || latestEmail==='__________') latestEmail = latestOrder.email; }

  let addr=(latestAddr||'').trim(); if(addr==='__________' || addr==='') addr='__________';
  let email=latestEmail||'';
  if(mob) localStorage.setItem('santra_mobile', mob);
  if(extra) localStorage.setItem('santra_deliveryMobile', extra);
  box.innerHTML=`<div class="customer-profile"><div style="width:42px;height:42px;border-radius:50%;background:#10b981;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px">${name[0]||'S'}</div><div style="flex:1"><div style="font-weight:bold">👤 ${name} - Auto Updated - Present - Santrajet Mall Live - OTP Hide</div><div style="font-size:11px;color:#444;margin-top:3px">📱 <b>Login Mb. No: ${mob}</b> ${extra?`<span class="extra-delivery">delivery Mb. No.: ${extra}</span>`:''} ${email?`| ✉️ ${email}`:''}</div><div style="font-size:11px;background:#f0fdf4;padding:6px 8px;border-radius:6px;margin-top:5px;border:1px dashed #10b981">📍 ${addr} | Mb No: ${mob} With</div><div style="font-size:10px;color:#10b981;margin-top:4px">🔴 Live - SANTRAJET MALL INFORMATION LIVE UPDATE</div></div></div>`;
}
async function loadProductCacheThenOrders(){
  try{
    if(window.SANTRA_ALL_URL_MAP && Object.keys(window.SANTRA_ALL_URL_MAP).length>0){
      Object.entries(window.SANTRA_ALL_URL_MAP).forEach(([k,v])=>{ productCache[k.toLowerCase()]=v; productCache[k]=v; });
    }
    if(!productCacheLoaded){
      let snap=await db.collection('products').limit(400).get();
      snap.forEach(d=>{
        let data=d.data(); let img=data.image||data.imageUrl||data.thumbnail||data.firebaseImage||'';
        if(img){ productCache[d.id]=img; productCache[d.id.toLowerCase()]=img; if(data.code){ productCache[data.code]=img; productCache[data.code.toLowerCase()]=img; } if(data.name){ productCache[data.name.toLowerCase()]=img; } }
      });
      productCacheLoaded=true;
    }
  }catch(e){}
  loadOrdersLive();
}
function loadOrderById(id){
  if(!id){ document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 No Orders</div>'; return; }
  db.collection('orders').doc(id).get().then(doc=>{
    if(doc.exists){ processOrders({forEach:cb=>cb(doc)}); } else { document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 Order not found - '+id+'</div>'; }
  }).catch(()=>{ document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 Loading...</div>'; });
}
function loadOrdersLive(){
  if(unsubscribeOrders) unsubscribeOrders();
  let lastId = localStorage.getItem('lastOrderId') || new URLSearchParams(location.search).get('orderId') || '';
  if(!currentCustomerMobile){
    if(lastId) return loadOrderById(lastId);
    document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 No Orders - Login karo</div>';
    return;
  }
  try{
    let q = db.collection('orders').where('customerMobile','==',currentCustomerMobile).orderBy('createdAt','desc');
    unsubscribeOrders = q.onSnapshot(s=>{
      if(!s.empty) processOrders(s);
      else {
        db.collection('orders').where('mobile','==',currentCustomerMobile).orderBy('createdAt','desc').onSnapshot(s2=>{
          if(!s2.empty) processOrders(s2);
          else if(lastId) loadOrderById(lastId);
          else document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 Aapka koi Order nahi hai</div>';
        });
      }
    }, err=>{
      db.collection('orders').where('customerMobile','==',currentCustomerMobile).get().then(s=>{
        if(!s.empty) processOrders(s);
        else db.collection('orders').where('mobile','==',currentCustomerMobile).get().then(s2=>{
          if(!s2.empty) processOrders(s2);
          else if(lastId) loadOrderById(lastId);
          else document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 No Orders</div>';
        });
      });
    });
  }catch(e){
    db.collection('orders').where('customerMobile','==',currentCustomerMobile).get().then(s=>{ if(!s.empty) processOrders(s); else if(lastId) loadOrderById(lastId); });
  }
}
function processOrders(snap){
  allOrders=[];snap.forEach(d=>allOrders.push({id:d.id,...d.data()}));
  allOrders.sort((a,b)=>{let ta=a.createdAt?.toMillis?.()||new Date(a.date||0).getTime()||0;let tb=b.createdAt?.toMillis?.()||new Date(b.date||0).getTime()||0;return ta-tb;});
  allOrders.forEach((o,i)=>{o._serial=i+1;});
  allOrders.sort((a,b)=>{let ta=a.createdAt?.toMillis?.()||new Date(a.date||0).getTime()||0;let tb=b.createdAt?.toMillis?.()||new Date(b.date||0).getTime()||0;return tb-ta;});
  showCustomerProfile();
  renderOrders(allOrders);
}
function calculateTotal(o){let f=['total','totalAmount','grandTotal','orderTotal','amount'];for(let x of f){let v=parseFloat(o[x]||0);if(v>0)return v;}let items=o.items||o.cart||[];if(!Array.isArray(items))try{items=Object.values(items);}catch(e){items=[];}let sum=0;items.forEach(it=>sum+=(parseInt(it.qty||1)||1)*(parseFloat(it.price||0)||0));return sum;}
function getBaseIds(fullId){let clean=String(fullId||'').trim();let ids=[clean, clean.toLowerCase(), clean.toUpperCase()];if(clean.includes('-')){let base=clean.substring(0, clean.lastIndexOf('-'));if(base.length>5) ids.push(base, base.toLowerCase());}return [...new Set(ids)].filter(Boolean);}
function getCleanProductId(it){let raw=(it.id||it.productId||it.code||it.productCode||'').toString().trim();if(!raw) raw=(it.name||'').toString().trim();return raw;}
function getProductImage(it){
  let fbFields=['image','img','imageUrl','productImage','thumbnail','firebaseImage','firebaseUrl'];
  for(let f of fbFields){let v=it[f];if(v&&typeof v==='string'&&v.includes('firebasestorage.googleapis.com')&&v.startsWith('http')) return v;}
  let fields=['image','img','imageUrl','productImage','thumbnail','thumb','photo','picture','src','url','productImg','mainImage'];
  for(let f of fields){let v=it[f];if(v&&typeof v==='string'&&v.length>15&&v.startsWith('http')&&!v.includes('ibb.co')) return v;}
  try{
    let tryIds=getBaseIds(it.id||it.productId||it.code||it.name||'');
    for(let k of tryIds){
      if(!k) continue;
      if(productCache[k]) return productCache[k];
      if(productCache[k.toLowerCase()]) return productCache[k.toLowerCase()];
      if(window.SANTRA_ALL_URLS && window.SANTRA_ALL_URLS[k]) return window.SANTRA_ALL_URLS[k];
      if(window.SANTRA_ALL_URL_MAP && window.SANTRA_ALL_URL_MAP[k]) return window.SANTRA_ALL_URL_MAP[k];
      if(window.getProductImageUrl){ let u=window.getProductImageUrl(k); if(u && u.startsWith('http')) return u; }
    }
  }catch(e){}
  return 'https://via.placeholder.com/100?text='+encodeURIComponent((it.name||'Product').substring(0,10));
}
function getFullAddress(order){return order.address||order.customerAddress||order.fullAddress||order.shippingAddress||'';}
function getShortStatus(s){s=(s||'Pending').toLowerCase();if(s.includes('cancel request'))return 'Cancel Requested';if(s.includes('cancel'))return 'Cancelled';if(s.includes('delivered'))return 'Delivered';if(s.includes('out for'))return 'Out for Delivery';if(s.includes('ship'))return 'Shipped';if(s.includes('confirm'))return 'Confirmed';return 'Pending';}
function getPaymentMethod(o){let p=(o.paymentMethod||o.paymentMode||'Cash on Delivery'); if(p.toLowerCase().includes('online')) return 'Online Payment'; return 'Cash on Delivery';}
function renderOrders(orders){
  if(!orders||orders.length===0){document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:30px">📦 No Orders Found</div>';return;}
  document.getElementById('ordersList').innerHTML=orders.map((order)=>{
    let serial=order._serial||1;
    let d=order.createdAt?.toDate?.()||new Date(order.date||Date.now());
    let dateStr=d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
    let total=calculateTotal(order);
    let payment=getPaymentMethod(order);
    let isOnline=payment.toLowerCase().includes('online');
    let loginMob=order.loginMobile||order.customerMobile||order.mobile||currentCustomerMobile||'';
    let deliveryMob=order.deliveryMobile||order.extraDeliveryMobile||'';
    let fullAddr=getFullAddress(order);
    let name=order.customerName||order.name||'Customer';
    let items=order.items||order.cart||[];if(!Array.isArray(items))try{items=Object.values(items);}catch(e){items=[];}
    let sub=0; items.forEach(it=>sub+=(parseInt(it.qty||1)||1)*(parseFloat(it.price||0)||0));
    let del=sub>=500000?0:150; let grand=sub+del;
    let itemsText=items.map((it,i)=>`${i+1}. ${it.name||'Product'} (Size ${it.size||'M'}) - Qty: ${it.qty||1} x ₹${it.price||0} = ₹${(it.qty||1)*(it.price||0)}`).join('\n');
    let screenshotBox=`<div class="screenshot-box">🛒 <b>SANTRAJET MALL - V38 Present + Santrajet Mall Live</b>\nOrder ID: ${order.id}\nDate: ${dateStr}\n\n${itemsText}\n\nSubtotal: ₹${sub}\nDelivery: ${del===0?'150':'₹'+del}\n<b>Grand Total: ₹${grand||total}</b>\nPayment: ${payment}\nCustomer: ${name} | Login: ${loginMob}</div>`;
    let itemsHTML=items.map(it=>{

async function verifyOTP(id){
  let otp=document.getElementById('order_otp_'+id).value.replace(/\D/g,'').trim();
  if(otp.length!=6){alert('6 digit OTP likho');return;}
  try{
    let ref=db.collection('orders').doc(id);let doc=await ref.get();let data=doc.data();
    let adminOtp=(data.otp||data.adminOtp||'').toString().trim();
    let cDoc=await db.collection('customerOrderOtp').doc(id).get();if(cDoc.exists)adminOtp=adminOtp||cDoc.data().otp||'';
    let oDoc=await db.collection('order_otps').doc(id).get();if(oDoc.exists)adminOtp=adminOtp||oDoc.data().otp||'';
    if(!adminOtp){alert('❌ Admin ne OTP save nahi kiya - Generate karo');return;}
    if(otp!==adminOtp){alert('❌ Wrong OTP - Admin OTP '+adminOtp+' dalo');return;}
    let nowStr=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'});
    await ref.update({otp:otp,customerOTP:otp,otpSavedByCustomer:true,otpSaveTime:nowStr,dateTimeHamesha:nowStr,status:'OTP Saved - Present - Santrajet Mall Live',presentTag:true,lastWAMessage:'✅ WhatsApp Order OTP Saved - Date: '+nowStr});

    document.getElementById('mainOtpBox_'+id).style.display='none';
  }catch(e){alert(e.message);}
}
