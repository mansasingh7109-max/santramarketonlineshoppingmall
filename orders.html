<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 My Orders - SANTRA MALL</title>
  <style>
    :root{--bg:#f1f3f6;--card:#ffffff;--accent:#e40046;--text:#212121;--border:#e0e0;--green:#10b981;--orange:#f59e0b;--blue:#3b82f6}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:var(--bg);color:var(--text);padding-bottom:70px}
   .header{background:var(--accent);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
   .header h1{font-size:18px;flex:1}
    .back-btn{background:none;border:none;color:white;font-size:20px;cursor:pointer}
  .logout-btn{background:rgba(255,255,255,0.2);border:none;color:white;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold}
  .container{max-width:900px;margin:15px auto;padding:0 15px}
  .search-box{background:var(--card);padding:15px;border-radius:8px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
  .search-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
  .order-card{background:var(--card);margin:15px 0;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
  .order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:15px;border-bottom:2px solid #e0e0e0}
  .order-id{font-size:14px;color:#666}
  .order-id b{color:var(--text);font-size:16px}
  .order-num{background:#e94560;color:white;padding:3px 8px;border-radius:5px;font-weight:bold;font-size:12px}
  .status-badge{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold;text-transform:uppercase}
  .status-pending{background:#fef3c7;color:#92400e}
  .status-otp_pending{background:#fef3c7;color:#92400e}
  .status-confirmed{background:#d1fae5;color:#065f46}
  .status-shipped{background:#dbeafe;color:#1e40af}
  .status-delivered{background:#d1fae5;color:#065f46}
  .status-cancelled{background:#fee2e2;color:#991b1b}
  .status-buying{background:#2196F3;color:white}
  .order-info{margin:15px 0}
  .info-row{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
  .info-row span:first-child{color:#666}
  .info-row span:last-child{font-weight:bold;color:var(--text)}
  .items-list{margin:15px 0;border-top:1px solid #e0e0e0;padding-top:15px}
  .item-row{display:flex;gap:10px;margin:10px 0;padding:10px;background:#f9f9f9;border-radius:8px}
  .item-row img{width:60px;height:60px;object-fit:cover;background:white;border-radius:6px;cursor:pointer;border:2px solid #e40046}
  .item-details{flex:1}
  .item-details h4{font-size:13px;margin-bottom:4px}
  .item-details p{font-size:12px;color:#666;margin:2px 0}
  .item-link{font-size:11px;color:#3b82f6;text-decoration:none;font-weight:bold}
  .item-link:hover{text-decoration:underline}
  .total-section{border-top:2px solid #e0e0e0;margin-top:15px;padding-top:15px}
  .total-row{display:flex;justify-content:space-between;margin:6px 0;font-size:14px}
  .grand-total{font-size:18px;font-weight:bold;color:var(--accent)}
  .btn{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
  .btn-cancel{background:#ef4444;color:white;border:none;padding:10px 16px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px;margin-top:10px}
  .empty{text-align:center;padding:60px 20px;color:#999}
  .loader{text-align:center;padding:40px;color:var(--accent);font-weight:bold}
  .address-box{background:#f0f9ff;border-left:4px solid var(--blue);padding:12px;border-radius:6px;margin:10px 0}
  .address-box p{font-size:13px;margin:4px 0;color:#1e40af}
  .msg-box{background:#fff3cd;padding:10px;border-radius:6px;margin:10px 0;border-left:4px solid #f59e0b}
  .date-text{color:#6b7280;font-size:13px;margin:5px 0}
  .otp-box{background:#fff3cd;padding:15px;border-radius:8px;margin:15px 0;border-left:4px solid #f59e0b}
  .otp-input{width:100%;padding:12px;margin:10px 0;border:2px solid #ff9800;border-radius:8px;font-size:18px;text-align:center;letter-spacing:10px;font-weight:bold}
  .btn-verify{width:100%;background:#ff6b00;color:white;border:none;padding:14px;border-radius:8px;margin-top:10px;font-weight:bold;cursor:pointer;font-size:16px}
  .btn-verify:hover{background:#e55a00}
  .timeline{margin:20px 0}
  .timeline-item{display:flex;gap:10px;margin:10px 0}
  .timeline-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
  .timeline-dot.done{background:#10b981;color:white}
  .timeline-dot.current{background:#e40046;color:white}
  .timeline-content h4{margin:0;font-size:13px}
  .timeline-content p{margin:2px 0;font-size:11px;color:#666}
  .customer-info{background:#e8f5e9;padding:12px;border-radius:8px;margin-bottom:15px;border-left:4px solid #4caf50}
  .customer-info p{margin:4px 0;font-size:13px;color:#2e7d32}
  .badge-old{background:#ff6b00;color:white;padding:4px 8px;border-radius:5px;font-size:11px;font-weight:bold;margin-left:5px}
  .badge-new{background:#00bcd4;color:white;padding:4px 8px;border-radius:5px;font-size:11px;font-weight:bold;margin-left:5px}
  .nav-links{text-align:center;margin:15px 0}
  .nav-links a{color:var(--accent);text-decoration:none;margin:0 10px;font-size:14px;font-weight:bold}
  .profile-btn{background:rgba(255,255,255,0.2);border:none;color:white;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold}
  .hide{display:none}
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="window.location.href='index.html'">←</button>
  <h1>📦 My Orders</h1>
  <button class="profile-btn hide" id="profileBtn" onclick="window.location.href='customer-account.html'">👤 My Profile</button>
  <button class="logout-btn" onclick="logoutCustomer()">🚪 Logout</button>
</div>

<div class="container">
  <div id="customerInfoBox"></div>

  <div class="nav-links">
    <a href="index.html">🏠 Home</a> |
    <a href="cart.html">🛒 Cart</a> |
    <a href="customer-account.html">👤 Profile</a>
  </div>

  <div class="search-box">
    <input type="text" id="searchOrder" placeholder="🔍 Search by Order ID or Mobile Number" onkeyup="filterOrders()">
  </div>
  
  <div id="ordersList">
    <div class="loader">⏳ Loading your orders...</div>
  </div>
</div>

<!-- ✅ NEW: SANTRA AUTH CONNECT -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="santra-auth.js"></script>

<script>
/*

OLD CODE BACKUP - 10/06/2026 - SAFE

Tera purana code yahan save hai, kuch gadbad ho to wapas use kar lena.
Main changes: 
1. secrets.js hata ke santra-auth.js add kiya
2. Login check santraRequireLogin() se
3. currentCustomerMobile = santraGetCustomer()

*/

const db = firebase.firestore();
let allOrders = [];
let currentCustomerMobile = null;
let currentCustomerData = null;

document.addEventListener('DOMContentLoaded', function() {
  checkLoginAndLoad();
});

function checkLoginAndLoad() {
  // ✅ NEW: santra-auth se login check
  currentCustomerMobile = santraGetCustomer();
  
  if(currentCustomerMobile){
    // Profile data load
    db.collection('customers').doc(currentCustomerMobile).get().then(doc => {
      if(doc.exists) {
        currentCustomerData = doc.data();
        localStorage.setItem('santra_customer', JSON.stringify(currentCustomerData));
      }
    });
    
    showCustomerInfo();
    document.getElementById('profileBtn').classList.remove('hide');
    loadOrders();
  } else {
    document.getElementById('ordersList').innerHTML = `
      <div class="empty">
        😔 Please login first<br><br>
        <button class="btn" onclick="window.location.href='customer-login.html'">🔐 Login with WhatsApp OTP</button>
      </div>
    `;
  }
}

function logoutCustomer() {
  if(confirm('Logout karna hai?')) {
    localStorage.removeItem('santra_whatsapp_mobile');
    localStorage.removeItem('santra_customer');
    alert('✅ Logged out!');
    window.location.href = 'customer-login.html';
  }
}

function showCustomerInfo() {
  if(currentCustomerMobile) {
    document.getElementById('customerInfoBox').innerHTML = `
      <div class="customer-info">
        <p><b>👤 Logged in:</b> ${currentCustomerMobile}</p>
        <p><b>✅ Connected to Profile & Orders</b></p>
      </div>
    `;
  }
}

function loadOrders() {
  db.collection('orders')
    .where('customerMobile', '==', currentCustomerMobile)
    .onSnapshot((snapshot) => {
        allOrders = [];
        snapshot.forEach(doc => {
          allOrders.push({id: doc.id,...doc.data()});
        });
        allOrders.sort((a,b) => (b.orderTime || 0) - (a.orderTime || 0));
        renderOrders(allOrders);
      });
}

function renderOrders(orders) {
  let container = document.getElementById('ordersList');
  if(orders.length === 0) {
    container.innerHTML = `<div class="empty">📦 No orders yet<br><br><button class="btn" onclick="window.location.href='index.html'">Start Shopping</button></div>`;
    return;
  }
  
  container.innerHTML = orders.map(order => {
    let orderDate = order.createdAt? order.createdAt.toDate() : new Date();
    let dateStr = orderDate.toLocaleString('en-IN', {timeZone:'Asia/Kolkata'});
    let statusClass = 'status-' + (order.status || 'pending').toLowerCase();
    
    return `
      <div class="order-card">
        <div class="order-header">
          <div>
            <span class="order-num">#${order.id.slice(-6)}</span>
            <div class="order-id">Order ID: <b>${order.id}</b></div>
            <p class="date-text">📅 ${dateStr}</p>
          </div>
          <span class="status-badge ${statusClass}">${order.status || 'Pending'}</span>
        </div>
        <div class="total-section">
          <div class="total-row grand-total"><span>Total:</span><span>₹${order.totalAmount || order.total || 0}</span></div>
        </div>
        ${order.status === 'pending' ? `
          <div class="otp-box">
            <b>🔐 Order OTP Required</b>
            <input type="text" id="order_otp_${order.id}" class="otp-input" placeholder="------" maxlength="6">
            <button class="btn-verify" onclick="verifyOrderOTP('${order.id}')">✅ Verify OTP</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function verifyOrderOTP(orderId) {
  const otp = document.getElementById('order_otp_' + orderId).value;
  if(otp.length !== 6) return alert('6 digit OTP daalo');
  
  db.collection('order_otps').doc(orderId).get().then(doc => {
    if(doc.exists && doc.data().otp === otp) {
      db.collection('orders').doc(orderId).update({status:'confirmed', otpVerified:true});
      alert('✅ Order Confirmed!');
      loadOrders();
    } else {
      alert('❌ Wrong OTP');
    }
  });
}

function filterOrders() {
  const term = document.getElementById('searchOrder').value.toLowerCase();
  const filtered = allOrders.filter(o => o.id.toLowerCase().includes(term) || (o.customerMobile||'').includes(term));
  renderOrders(filtered);
}
</script>
</body>
</html>
