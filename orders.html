<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 My Orders - SANTRA MALL</title>
  <style>
    :root{--bg:#f1f3f6;--card:#ffffff;--accent:#e40046;--text:#212121;--border:#e0e0;--green:#10b981;--orange:#f59e0b;--blue:#3b82f6}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:var(--bg);color:var(--text);padding-bottom:70px}
 .header{background:var(--accent);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
 .header h1{font-size:18px}
 .back-btn{background:none;border:none;color:white;font-size:20px;cursor:pointer}
 .container{max-width:700px;margin:15px auto;padding:0 15px}
 .search-box{background:var(--card);padding:15px;border-radius:8px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
 .search-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
 .order-card{background:var(--card);margin:15px 0;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
 .order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:15px;border-bottom:2px solid var(--border)}
 .order-id{font-size:14px;color:#666}
 .order-id b{color:var(--text);font-size:16px}
 .order-num{background:#e94560;color:white;padding:3px 8px;border-radius:5px;font-weight:bold;font-size:12px}
 .status-badge{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold;text-transform:uppercase}
 .status-pending{background:#fef3c7;color:#92400e}
 .status-confirmed{background:#d1fae5;color:#065f46}
 .status-shipped{background:#dbeafe;color:#1e40af}
 .status-delivered{background:#d1fae5;color:#065f46}
 .status-cancelled{background:#fee2e2;color:#991b1b}
 .order-info{margin:15px 0}
 .info-row{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
 .info-row span:first-child{color:#666}
 .info-row span:last-child{font-weight:bold;color:var(--text)}
 .items-list{margin:15px 0;border-top:1px solid var(--border);padding-top:15px}
 .item-row{display:flex;gap:10px;margin:10px 0;padding:10px;background:#f9f9f9;border-radius:8px}
 .item-row img{width:60px;height:60px;object-fit:cover;background:white;border-radius:6px;cursor:pointer;border:2px solid #e40046}
 .item-details{flex:1}
 .item-details h4{font-size:13px;margin-bottom:4px}
 .item-details p{font-size:12px;color:#666;margin:2px 0}
 .item-link{font-size:11px;color:#3b82f6;text-decoration:none;font-weight:bold}
 .item-link:hover{text-decoration:underline}
 .total-section{border-top:2px solid var(--border);margin-top:15px;padding-top:15px}
 .total-row{display:flex;justify-content:space-between;margin:6px 0;font-size:14px}
 .grand-total{font-size:18px;font-weight:bold;color:var(--accent)}
 .btn{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
 .empty{text-align:center;padding:60px 20px;color:#999}
 .loader{text-align:center;padding:40px;color:var(--accent);font-weight:bold}
 .address-box{background:#f0f9ff;border-left:4px solid var(--blue);padding:12px;border-radius:6px;margin:10px 0}
 .address-box p{font-size:13px;margin:4px 0;color:#1e40af}
 .msg-box{background:#fff3cd;padding:10px;border-radius:6px;margin:10px 0;border-left:4px solid #f59e0b}
 .date-text{color:#6b7280;font-size:13px;margin:5px 0}
 .otp-box{background:#fff3cd;padding:15px;border-radius:8px;margin:15px 0;border-left:4px solid #f59e0b}
 .otp-input{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:5px;font-size:16px;text-align:center;letter-spacing:8px}
 .timeline{margin:20px 0}
 .timeline-item{display:flex;gap:10px;margin:10px 0}
 .timeline-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
 .timeline-dot.done{background:#10b981;color:white}
 .timeline-dot.current{background:#e40046;color:white}
 .timeline-content h4{margin:0;font-size:13px}
 .timeline-content p{margin:2px 0;font-size:11px;color:#666}
 .otp-required-msg{text-align:center;padding:30px;color:#e40046;font-weight:bold;font-size:16px}
 .customer-info{background:#e8f5e9;padding:12px;border-radius:8px;margin-bottom:15px;border-left:4px solid #4caf50}
 .customer-info p{margin:4px 0;font-size:13px;color:#2e7d32}
 .whatsapp-otp-popup{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px}
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="window.location.href='index.html'">←</button>
  <h1>📦 My Orders</h1>
</div>

<div class="container">
  <div id="customerInfoBox"></div>
  <div class="search-box">
    <input type="text" id="searchOrder" placeholder="🔍 Search by Order ID or Mobile Number" onkeyup="filterOrders()">
  </div>
  <div id="myOrderDiv"></div>
  <div id="ordersList">
    <div class="loader">⏳ Loading your orders...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="secrets.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

let allOrders = [];
let currentCustomerMobile = null;
let currentCustomerData = null;
const ADMIN_WHATSAPP = "917725960293";

document.addEventListener('DOMContentLoaded', function() {
  checkLoginAndLoad();
});

// ✅ 1. Login + OTP Check - SABSE PEHLE
function checkLoginAndLoad() {
  // 1. Pehle pendingOTP check karo - Agar OTP process chal raha hai
  let pendingOTP = localStorage.getItem('pendingOTP');
  
  if(pendingOTP) {
    pendingOTP = JSON.parse(pendingOTP);
    // 30 min se purana nahi hai to OTP popup dikhao
    if(Date.now() - pendingOTP.time < 60 * 60 * 1000) { // ✅ 60 min
      showWhatsAppOTPPopup(pendingOTP.mobile, pendingOTP.name);
      return; // Orders load mat karo, OTP popup dikhao
    } else {
      localStorage.removeItem('pendingOTP');
    }
  }
  
  // 2. Agar OTP nahi to santra_customer check karo
  let customer = localStorage.getItem('santra_customer');
  if(customer){
    currentCustomerData = JSON.parse(customer);
    currentCustomerMobile = currentCustomerData.mobile;
    showCustomerInfo();
    
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');
    if(orderId) {
      loadSingleOrder(orderId);
    } else {
      loadOrders();
    }
  } else {
    // 3. Login nahi hai to customer-login.html pe bhejo
    document.getElementById('ordersList').innerHTML = `
      <div class="empty">
        😔 Please login first to see your orders<br><br>
        <button class="btn" onclick="window.location.href='customer-login.html'">🔐 Login with WhatsApp OTP</button>
      </div>
    `;
  }
  
  const urlParams = new URLSearchParams(window.location.search);
  const orderIdParam = urlParams.get('orderId');
  if(orderIdParam) {
    setTimeout(() => {
      document.getElementById('searchOrder').value = orderIdParam;
      filterOrders();
    }, 1000);
  }
}

// ✅ 2. WhatsApp OTP Popup - Auto khulega agar pendingOTP hai
function showWhatsAppOTPPopup(mobile, name) {
  document.getElementById('ordersList').innerHTML = `
    <div class="whatsapp-otp-popup">
      <div style="background:white;padding:28px;border-radius:18px;width:100%;max-width:420px;box-shadow:0 15px 50px rgba(0,0,0,0.4)">
        <h3 style="color:#e40046;text-align:center;margin-bottom:18px;font-size:22px">🔐 WhatsApp OTP Verify</h3>
        <div style="background:linear-gradient(135deg,#e8f5e9,#c8e6c9);padding:15px;border-radius:12px;margin-bottom:18px;border-left:5px solid #4caf50">
          <b style="color:#1b5e20;font-size:16px">✅ Request Active!</b><br>
          <span style="font-size:13px;color:#2e7d32">Hi ${name}, Admin OTP bhejega:<br><b style="font-size:15px">+91 ${mobile}</b></span>
        </div>
        <p style="text-align:center;color:#333;font-weight:600;margin-bottom:12px;font-size:15px">WhatsApp se OTP copy karke yahan daalo 👇</p>
        <input type="tel" id="orderOtpInput" maxlength="6" placeholder="000000" style="width:100%;padding:20px;text-align:center;font-size:32px;letter-spacing:12px;border:3px solid #e40046;border-radius:12px;margin:12px 0;font-weight:bold;color:#e40046;background:#fff5f7">
        <button onclick="verifyWhatsAppOTP('${mobile}')" style="width:100%;padding:16px;background:linear-gradient(135deg,#e40046,#ff1744);color:white;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin-bottom:12px;box-shadow:0 5px 20px rgba(228,0,70,0.4)">✅ Verify & See Orders</button>
        <button onclick="resendWhatsAppOTP('${mobile}','${name}')" style="width:100%;padding:14px;background:#ff9800;color:white;border:none;border-radius:12px;cursor:pointer;margin-bottom:10px;font-weight:bold">🔄 OTP Nahi Mila? Wapas Bhejo</button>
        <button onclick="cancelOTPAndLogin()" style="width:100%;padding:13px;background:#757575;color:white;border:none;border-radius:12px;cursor:pointer;font-weight:bold">❌ Cancel</button>
        <p style="text-align:center;color:#999;font-size:12px;margin-top:15px">⏰ Admin 2-5 min me OTP bhejega</p>
      </div>
    </div>
  `;
  
  setTimeout(() => document.getElementById('orderOtpInput')?.focus(), 300);
  
  // Back button handle
  history.pushState(null, null, location.href);
  window.onpopstate = function() {
    window.location.href = 'customer-login.html';
  };
  
  // Real-time auto-fill if admin enters OTP
  db.collection('login_requests').doc(mobile).onSnapshot((doc) => {
    if(doc.exists && doc.data().otp && doc.data().otp!== '') {
      let input = document.getElementById('orderOtpInput');
      if(input &&!input.value) {
        input.value = doc.data().otp;
        input.style.background = '#e8f5e9';
        input.style.borderColor = '#4caf50';
      }
    }
  });
}

// ✅ 3. OTP Verify + Login Save
async function verifyWhatsAppOTP(mobile) {
  let enteredOTP = document.getElementById('orderOtpInput').value.trim();
  if(enteredOTP.length!== 6) {
    alert('❌ 6 digit OTP daalo!');
    return;
  }
  
  try {
    const doc = await db.collection('login_requests').doc(mobile).get();
    if(!doc.exists) {
      alert('❌ Session expire! Wapas login karo');
      localStorage.removeItem('pendingOTP');
      window.location.href = 'customer-login.html';
      return;
    }
    
    let data = doc.data();
    
    if(data.otp === enteredOTP && data.otp!== '') {
      // ✅ 1. santra_customer me save karo - Login complete
      localStorage.setItem('santra_customer', JSON.stringify({
        name: data.name,
        mobile: data.mobile,
        email: data.email,
        loginTime: new Date().toISOString()
      }));
      
      // 2. Firebase update
      await db.collection('login_requests').doc(mobile).update({
        status: 'verified',
        verifiedTime: new Date().toLocaleString('en-IN')
      });
      
      // 3. pendingOTP hatao
      localStorage.removeItem('pendingOTP');
      
      alert('✅ Login Successful! Welcome ' + data.name);
      location.reload(); // Orders load honge
      
    } else if(data.otp === '') {
      alert('⏳ Admin ne abhi OTP nahi bheja!\nWhatsApp check karo ya 2 min wait karo');
    } else {
      alert('❌ Galat OTP! WhatsApp me sahi OTP check karo');
      document.getElementById('orderOtpInput').value = '';
    }
  } catch(error) {
    console.error('OTP Error:', error);
    alert('❌ Error: ' + error.message);
  }
}

function resendWhatsAppOTP(mobile, name) {
  let msg = `Hello Admin,\n🔐 OTP wapas bhejo\nName: ${name}\nMobile: ${mobile}`;
  window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
  alert('✅ WhatsApp me message bhej diya!\nAdmin jaldi OTP bhejega');
}

function cancelOTPAndLogin() {
  localStorage.removeItem('pendingOTP');
  window.location.href = 'customer-login.html';
}

function showCustomerInfo() {
  if(currentCustomerData) {
    document.getElementById('customerInfoBox').innerHTML = `
      <div class="customer-info">
        <p><b>👤 Logged in as:</b> ${currentCustomerData.name}</p>
        <p><b>📱 Mobile:</b> ${currentCustomerData.mobile}</p>
        ${currentCustomerData.email? `<p><b>📧 Email:</b> ${currentCustomerData.email}</p>` : ''}
      </div>
    `;
  }
}

async function loadSingleOrder(orderId) {
  document.getElementById('ordersList').style.display = 'none';
  document.getElementById('myOrderDiv').innerHTML = '<div class="loader">⏳ Loading order...</div>';
  try {
    let doc = await db.collection('orders').doc(orderId).get();
    if(doc.exists){
      let d = doc.data();
      let dateObj = d.createdAt? d.createdAt.toDate() : new Date();
      let dateStr = dateObj.toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'});
      let docId = String(doc.id);
      let orderNum = d.orderNumber || 'SM' + docId.slice(-6);
      document.getElementById('myOrderDiv').innerHTML = await renderSingleOrderCard({id: docId,...d}, orderNum, dateStr);
    } else {
      document.getElementById('myOrderDiv').innerHTML = '<div class="empty">❌ Order not found</div>';
    }
  } catch(e) {
    document.getElementById('myOrderDiv').innerHTML = `<div class="empty">❌ Error: ${e.message}</div>`;
  }
}

async function loadOrders() {
  try {
    const snapshot = await db.collection('orders').where('mobile', '==', currentCustomerMobile).get();
    allOrders = [];
    snapshot.forEach(doc => {
      allOrders.push({id: doc.id,...doc.data()});
    });
    allOrders.sort((a,b) => {
      let dateA = a.createdAt? a.createdAt.toDate() : new Date(0);
      let dateB = b.createdAt? b.createdAt.toDate() : new Date(0);
      return dateB - dateA;
    });
    await renderOrders(allOrders);
  } catch(error) {
    console.error('Error:', error);
    document.getElementById('ordersList').innerHTML = `<div class="empty">❌ Error loading orders: ${error.message}</div>`;
  }
}

function buildItemsHTML(items) {
  if(!items ||!Array.isArray(items) || items.length === 0) {
    return '<p style="color:#999">No items found in this order</p>';
  }
  return items.map(item => {
    let imgSrc = item.imageUrl || item.image || item.img || item.photo || '';
    if(!imgSrc && item.id) {
      imgSrc = `https://firebasestorage.googleapis.com/v0/b/santramarketshoppingmall.appspot.com/o/products%2F${item.id}.jpg?alt=media`;
    }
    if(!imgSrc) imgSrc = 'https://via.placeholder.com/60x60?text=No+Image';
    let productLink = item.product_link || item.url || item.link || `https://santramarketshoppingmall.firebaseapp.com/product.html?id=${item.id}`;
    return `
      <div class="item-row">
        <a href="${productLink}" target="_blank">
          <img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/60x60?text=No+Image'" alt="${item.name}">
        </a>
        <div class="item-details">
          <h4>${item.name}</h4>
          <p>Qty: ${item.qty} × ₹${item.price} = ₹${item.price * item.qty}</p>
          <p>Code: ${item.product_code || item.id} | Category: ${item.category || 'General'}</p>
          <p>Series: ${item.serial_no || 'N/A'}</p>
          <a href="${productLink}" target="_blank" class="item-link">🔗 View Product</a>
        </div>
      </div>
    `;
  }).join('');
}

async function renderOrders(orders) {
  let container = document.getElementById('ordersList');
  if(orders.length === 0) {
    container.innerHTML = `
      <div class="empty">
        📦 No orders found<br><br>
        <button class="btn" onclick="window.location.href='index.html'">Start Shopping</button>
      </div>
    `;
    return;
  }
  container.innerHTML = orders.map(order => {
    let orderDate = order.createdAt? order.createdAt.toDate() : new Date(order.orderDate || Date.now());
    let dateStr = orderDate.toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'});
    let orderIdStr = String(order.id);
    let orderNum = order.orderNumber || 'SM' + orderDate.getFullYear() + ('0' + (orderDate.getMonth() + 1)).slice(-2) + orderIdStr.slice(-4);
    let displayName = order.customerName || order.name || order.customer_name || 'Customer';
    let statusColor = 'status-' + (order.status || 'Pending').toLowerCase().replace(' ', '_');
    let statusText = getStatusText(order.status);
    let isOTPpending = ['Pending', 'PENDING', 'pending_otp', 'OTP Pending'].includes(order.status);
    let otpSection = '';
    if(isOTPpending) {
      otpSection = `
        <div class="otp-box">
          <h3>🔐 OTP Verification Required</h3>
          <p>Admin ne aapke WhatsApp pe OTP bheja hai. WhatsApp OTP add kare yahan enter karein:</p>
          <input type="text" class="otp-input" id="otp_${order.id}" maxlength="6" placeholder="WhatsApp OTP add kare">
          <button class="btn" onclick="verifyOTP('${order.id}')" style="background:var(--green)">✅ Verify OTP</button>
          <p style="font-size:11px;margin-top:10px;color:#999">OTP nahi mila? Admin se WhatsApp pe contact karein</p>
        </div>
      `;
    }
    let orderDetails = '';
    if(!isOTPpending) {
      let itemsHTML = buildItemsHTML(order.items);
      let addressBox = '';
      if(order.customerLandmark || order.customerPincode || order.customerCity || order.customerState) {
        addressBox = `
          <div class="address-box">
            ${order.customerLandmark? `<p><b>📍 Landmark:</b> ${order.customerLandmark}</p>` : ''}
            ${order.customerPincode? `<p><b>📮 Pincode:</b> ${order.customerPincode}</p>` : ''}
            ${order.customerCity? `<p><b>🏙️ City:</b> ${order.customerCity}</p>` : ''}
            ${order.customerState? `<p><b>🗺️ State:</b> ${order.customerState}</p>` : ''}
          </div>
        `;
      }
      orderDetails = `
        <div class="order-info">
          <div class="info-row"><span>Order Date:</span><span>${order.orderDateString || dateStr}</span></div>
          <div class="info-row"><span>Customer:</span><span>${displayName}</span></div>
          <div class="info-row"><span>Mobile:</span><span>${order.mobile || order.customerMobile}</span></div>
          ${order.email? `<div class="info-row"><span>Email:</span><span>${order.email}</span></div>` : ''}
          <div class="info-row"><span>Payment:</span><span>${order.paymentMode || 'COD'}</span></div>
          <div class="info-row"><span>Delivery Address:</span><span style="text-align:right;max-width:60%">${order.customerAddress || order.address}</span></div>
        </div>
        ${addressBox}
        ${order.customerMessage? `<div class="msg-box"><b>💬 Your Message:</b><br>${order.customerMessage}</div>` : ''}
        <p class="date-text">🔗 Source: ${order.source || 'Website'} ${order.referenceLink? `| <a href="${order.referenceLink}" target="_blank">View Page</a>` : ''}</p>
        <div class="items-list">
          <h4 style="margin-bottom:10px;font-size:14px">📦 Order Items (${order.items? order.items.length : 0})</h4>
          ${itemsHTML}
        </div>
        <div class="total-section">
          <div class="total-row"><span>Subtotal:</span><span>₹${order.subtotal || order.total}</span></div>
          <div class="total-row"><span>Delivery:</span><span style="color:#10b981">${order.delivery === 0? 'FREE' : '₹' + (order.delivery || 0)}</span></div>
          <div class="total-row grand-total"><span>Total Amount:</span><span>₹${order.totalAmount || order.total}</span></div>
        </div>
        ${getTimeline(order.status)}
        ${!isOTPpending? `<button class="btn" style="background:var(--blue)" onclick="downloadInvoice('${order.id}')">📄 Download Invoice</button>` : ''}
      `;
    } else {
      orderDetails = `<div class="otp-required-msg">🔒 Complete OTP verification to view order details</div>`;
    }
    return `
      <div class="order-card" id="order_${order.id}">
        <div class="order-header">
          <div>
            <span class="order-num">#${orderNum}</span>
            <div class="order-id" style="margin-top:5px">Order ID: <b>${order.orderId || order.id}</b></div>
            <p class="date-text">📅 ${dateStr}</p>
          </div>
          <span class="status-badge ${statusColor}">${statusText}</span>
        </div>
        ${otpSection}
        ${orderDetails}
      </div>
    `;
  }).join('');
}

async function renderSingleOrderCard(order, orderNum, dateStr) {
  let displayName = order.customerName || order.name || order.customer_name || 'Customer';
  let statusColor = 'status-' + (order.status || 'Pending').toLowerCase().replace(' ', '_');
  let statusText = getStatusText(order.status);
  let isOTPpending = ['Pending', 'PENDING', 'pending_otp', 'OTP Pending'].includes(order.status);
  let otpSection = '';
  if(isOTPpending) {
    otpSection = `
      <div class="otp-box">
        <h3>🔐 OTP Verification Required</h3>
        <p>Admin ne aapke WhatsApp pe OTP bheja hai. WhatsApp OTP add kare yahan enter karein:</p>
        <input type="text" class="otp-input" id="otp_${order.id}" maxlength="6" placeholder="WhatsApp OTP add kare">
        <button class="btn" onclick="verifyOTP('${order.id}')" style="background:var(--green)">✅ Verify OTP</button>
        <p style="font-size:11px;margin-top:10px;color:#999">OTP nahi mila? Admin se WhatsApp pe contact karein</p>
      </div>
    `;
  }
  let orderDetails = '';
  if(!isOTPpending) {
    let itemsHTML = buildItemsHTML(order.items);
    let addressBox = '';
    if(order.customerLandmark || order.customerPincode || order.customerCity || order.customerState) {
      addressBox = `
        <div class="address-box">
          ${order.customerLandmark? `<p><b>📍 Landmark:</b> ${order.customerLandmark}</p>` : ''}
          ${order.customerPincode? `<p><b>📮 Pincode:</b> ${order.customerPincode}</p>` : ''}
          ${order.customerCity? `<p><b>🏙️ City:</b> ${order.customerCity}</p>` : ''}
          ${order.customerState? `<p><b>🗺️ State:</b> ${order.customerState}</p>` : ''}
        </div>
      `;
    }
    orderDetails = `
      <div class="order-info">
        <div class="info-row"><span>Order Date:</span><span>${order.orderDateString || dateStr}</span></div>
        <div class="info-row"><span>Customer:</span><span>${displayName}</span></div>
        <div class="info-row"><span>Mobile:</span><span>${order.mobile || order.customerMobile}</span></div>
        ${order.email? `<div class="info-row"><span>Email:</span><span>${order.email}</span></div>` : ''}
        <div class="info-row"><span>Payment:</span><span>${order.paymentMode || 'COD'}</span></div>
        <div class="info-row"><span>Delivery Address:</span><span style="text-align:right;max-width:60%">${order.customerAddress || order.address}</span></div>
      </div>
      ${addressBox}
      ${order.customerMessage? `<div class="msg-box"><b>💬 Your Message:</b><br>${order.customerMessage}</div>` : ''}
      <p class="date-text">🔗 Source: ${order.source || 'Website'} ${order.referenceLink? `| <a href="${order.referenceLink}" target="_blank">View Page</a>` : ''}</p>
      <div class="items-list">
        <h4 style="margin-bottom:10px;font-size:14px">📦 Order Items (${order.items? order.items.length : 0})</h4>
        ${itemsHTML}
      </div>
      <div class="total-section">
        <div class="total-row"><span>Subtotal:</span><span>₹${order.subtotal || order.total}</span></div>
        <div class="total-row"><span>Delivery:</span><span style="color:#10b981">${order.delivery === 0? 'FREE' : '₹' + (order.delivery || 0)}</span></div>
        <div class="total-row grand-total"><span>Total Amount:</span><span>₹${order.totalAmount || order.total}</span></div>
      </div>
      ${getTimeline(order.status)}
      ${!isOTPpending? `<button class="btn" style="background:var(--blue)" onclick="downloadInvoice('${order.id}')">📄 Download Invoice</button>` : ''}
    `;
  } else {
    orderDetails = `<div class="otp-required-msg">🔒 Complete OTP verification to view order details</div>`;
  }
  return `
    <div class="order-card" id="order_${order.id}">
      <div class="order-header">
        <div>
          <span class="order-num">#${orderNum}</span>
          <div class="order-id" style="margin-top:5px">Order ID: <b>${order.orderId || order.id}</b></div>
          <p class="date-text">📅 ${dateStr}</p>
        </div>
        <span class="status-badge ${statusColor}">${statusText}</span>
      </div>
      ${otpSection}
      ${orderDetails}
    </div>
  `;
}

function getStatusText(status) {
  const statusMap = {
    'pending_otp': '⏳ OTP Pending',
    'pending': '⏳ Pending',
    'Pending': '⏳ Pending',
    'PENDING': '⏳ Pending',
    'OTP Pending': '⏳ OTP Pending',
    'confirmed': '✅ Confirmed',
    'Confirmed': '✅ Confirmed',
    'shipped': '🚚 Shipped',
    'Shipped': '🚚 Shipped',
    'delivered': '📦 Delivered',
    'Delivered': '📦 Delivered',
    'cancelled': '❌ Cancelled',
    'Cancelled': '❌ Cancelled'
  };
  return statusMap[status] || status;
}

function getTimeline(status) {
  const steps = [
    {key: 'pending_otp', label: 'Order Placed', desc: 'Waiting for OTP verification'},
    {key: 'confirmed', label: 'Confirmed', desc: 'Order confirmed by admin'},
    {key: 'shipped', label: 'Shipped', desc: 'Out for delivery'},
    {key: 'delivered', label: 'Delivered', desc: 'Order delivered successfully'}
  ];
  let checkStatus = status.toLowerCase();
  if(checkStatus === 'pending' || checkStatus === 'otp pending') checkStatus = 'pending_otp';
  const currentIndex = steps.findIndex(s => s.key === checkStatus);
  return `
    <div class="timeline">
      <h4 style="margin-bottom:15px;font-size:14px">📍 Order Timeline</h4>
      ${steps.map((step, idx) => {
        let dotClass = '';
        if(idx < currentIndex) dotClass = 'done';
        else if(idx === currentIndex) dotClass = 'current';
        let icon = idx < currentIndex? '✓' : (idx === currentIndex? '•' : '');
        return `
          <div class="timeline-item ${idx <= currentIndex? 'active' : ''}">
            <div class="timeline-dot ${dotClass}">${icon}</div>
            <div class="timeline-content">
              <h4>${step.label}</h4>
              <p>${step.desc}</p>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}
