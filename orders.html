<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 My Orders - SANTRA MALL</title>
<style>
:root{--bg:#f1f3f6;--card:#ffffff;--accent:#e40046;--text:#212121;--green:#10b981;--orange:#f59e0b;--blue:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:70px}
.header{background:var(--accent);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;flex:1}
.back-btn{background:none;border:none;color:white;font-size:20px;cursor:pointer}
.logout-btn,.profile-btn{background:rgba(255,255,255,0.2);border:none;color:white;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;margin-left:6px}
.container{max-width:900px;margin:15px auto;padding:0 15px}
.search-box{background:var(--card);padding:15px;border-radius:8px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.search-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.order-card{background:var(--card);margin:15px 0;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1);border-left:5px solid var(--accent)}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:2px solid #f1f3f6}
.order-id{font-size:12px;color:#666}
.order-id b{color:var(--text);font-size:14px}
.order-num{background:var(--accent);color:white;padding:4px 10px;border-radius:20px;font-weight:bold;font-size:12px}
.status-badge{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:bold;text-transform:uppercase}
.status-pending,.status-otp_pending{background:#fef3c7;color:#92400e}
.status-confirmed,.status-delivered{background:#d1fae5;color:#065f46}
.status-shipped{background:#dbeafe;color:#1e40af}
.status-cancelled{background:#fee2e2;color:#991b1b}
.items-list{margin:12px 0;border-top:1px solid #f1f3f6;padding-top:12px}
.item-row{display:flex;gap:10px;margin:10px 0;padding:10px;background:#f9f9f9;border-radius:8px}
.item-row img{width:60px;height:60px;object-fit:cover;background:white;border-radius:6px;cursor:pointer;border:2px solid #e40046}
.item-details{flex:1}
.item-details h4{font-size:13px;margin-bottom:4px}
.item-details p{font-size:12px;color:#666;margin:2px 0}
.total-section{border-top:2px solid #f1f3f6;margin-top:12px;padding-top:12px}
.total-row{display:flex;justify-content:space-between;margin:6px 0;font-size:14px}
.grand-total{font-size:18px;font-weight:bold;color:var(--accent)}
.btn{padding:12px;background:var(--accent);color:white;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer}
.btn-wa{background:#25D366;color:white}
.btn-light{background:#f1f3f6;color:#333;border:1px solid #ddd}
.btn-cancel{background:#ef4444;color:white;border:none;padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:12px}
.empty{text-align:center;padding:60px 20px;color:#999}
.loader{text-align:center;padding:40px;color:var(--accent);font-weight:bold}
.address-box{background:#f0f9ff;border-left:4px solid var(--blue);padding:12px;border-radius:6px;margin:10px 0}
.address-box p{font-size:13px;margin:4px 0;color:#1e40af}
.otp-box{background:#fff8e1;padding:15px;border-radius:10px;margin:15px 0;border:2px dashed #f59e0b}
.otp-input{width:100%;padding:12px;margin:10px 0;border:2px solid #ff9800;border-radius:8px;font-size:18px;text-align:center;letter-spacing:8px;font-weight:bold}
.btn-verify{width:100%;background:#ff6b00;color:white;border:none;padding:12px;border-radius:8px;margin-top:8px;font-weight:bold;cursor:pointer;font-size:15px}
.timeline{margin:12px 0;display:flex;gap:6px}
.timeline-step{flex:1;text-align:center;font-size:11px;padding:6px;background:#f1f3f6;border-radius:6px;font-weight:bold}
.timeline-step.active{background:var(--accent);color:white}
.timeline-step.done{background:var(--green);color:white}
.customer-info{background:#e8f5e9;padding:12px;border-radius:8px;margin-bottom:15px;border-left:4px solid #4caf50}
.customer-info p{margin:4px 0;font-size:13px;color:#2e7d32}
.nav-links{text-align:center;margin:12px 0}
.nav-links a{color:var(--accent);text-decoration:none;margin:0 8px;font-size:13px;font-weight:bold}
.hide{display:none}
.toast{position:fixed;top:20px;right:20px;background:#4caf50;color:white;padding:12px 18px;border-radius:8px;display:none;z-index:9999}
.toast.show{display:block}
.toast.error{background:#f44336}
</style>
</head>
<body>

<div class="header">
<button class="back-btn" id="backBtn" type="button">←</button>
<h1>📦 My Orders</h1>
<button class="profile-btn" id="profileBtn" type="button">👤 Profile</button>
<button class="logout-btn" id="logoutBtnTop" type="button">🚪 Logout</button>
</div>

<div class="container">
<div id="customerInfoBox"></div>
<div class="nav-links">
<a href="index.html">🏠 Home</a> |
<a href="cart.html">🛒 Cart</a> |
<a href="customer-account.html">👤 Profile</a>
</div>

<div class="search-box">
<input type="text" id="searchOrder" placeholder="🔍 Search by Order ID">
</div>

<div id="ordersList">
<div class="loader">⏳ Loading your orders...</div>
</div>
</div>

<div class="toast" id="toast"></div>

<!-- ✅ ORDER: constants.js -> config.js - Tere master -->
<script src="constants.js?v=3"></script>
<script src="config.js?v=8"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
/*
⚠️ OLD CODE BACKUP - 10/06/2026 - SAFE - TERA PURANA FILE YAHAN HIDE HAI - KUCH HATAYA NAHI

Tera purana code:
const db = firebase.firestore();
let allOrders = [];
let currentCustomerMobile = null;
function checkLoginAndLoad() { currentCustomerMobile = santraGetCustomer(); ... }
function loadOrders() { db.collection('orders').where('customerMobile', '==', currentCustomerMobile).onSnapshot(...) }
function renderOrders() { ... }
function verifyOrderOTP(orderId) { ... }
function filterOrders() { ... }

OLD CODE BACKUP END

⚠️ SECOND BACKUP - 15 JULY WALA - BHI SAVE HAI
const firebaseConfig = { apiKey: ... };
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const CUSTOMER_KEY = window.CUSTOMER_KEY || "santra_customer";
... processOrders, requestOrderOTP etc...
*/

// ✅ NAYA - TERA constants.js + config.js FOLLOW + NO BLAZE + BUTTON FIX
if(typeof window.CUSTOMER_KEY === 'undefined'){ window.CUSTOMER_KEY = "santra_customer"; }
if(typeof window.COLLECTIONS === 'undefined'){ window.COLLECTIONS = { CUSTOMERS: 'customers', ORDERS: 'orders', LOGIN_OTPS: 'login_otps', LOGIN_REQUESTS: 'login_requests' }; }
if(typeof window.ADMIN_WHATSAPP === 'undefined'){ window.ADMIN_WHATSAPP = "918769171078"; }
if(typeof window.BASE_URL === 'undefined'){ window.BASE_URL = "https://santramarketshoppingmall.web.app"; }
if(typeof window.firebaseConfig === 'undefined'){
  window.firebaseConfig = {
    apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
    authDomain: "santramarketshoppingmall.firebaseapp.com",
    projectId: "santramarketshoppingmall",
    storageBucket: "santramarketshoppingmall.appspot.com",
    messagingSenderId: "398490252924",
    appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
    databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com"
  };
}
try{
  if(typeof window.initFirebaseOnce === 'function'){
    window.initFirebaseOnce(window.firebaseConfig);
  } else if(!firebase.apps.length){
    firebase.initializeApp(window.firebaseConfig);
  }
}catch(e){ console.log("Firebase init:", e.message); }

const db = window.db || firebase.firestore();
const CUSTOMER_KEY = window.CUSTOMER_KEY;
const BASE_URL = window.BASE_URL;
const ADMIN_WHATSAPP = window.ADMIN_WHATSAPP;
const COLLECTIONS = window.COLLECTIONS;

console.log("✅ Orders - CART_KEY:", window.CART_KEY, "CUSTOMER_KEY:", CUSTOMER_KEY);

let allOrders = [];
let currentCustomerMobile = null;
let currentCustomerData = null;

document.addEventListener('DOMContentLoaded', function(){
  console.log("✅ Orders DOM ready");
  document.getElementById('backBtn').onclick = ()=> window.location.href='index.html';
  document.getElementById('profileBtn').onclick = ()=> window.location.href='customer-account.html';
  document.getElementById('logoutBtnTop').onclick = logoutCustomer;
  document.getElementById('searchOrder').onkeyup = filterOrders;
  checkLoginAndLoad();
});

function checkLoginAndLoad() {
  // ✅ 5 jagah se mobile dhoondo - Login se connect - Pehle jaisa
  currentCustomerMobile = localStorage.getItem(CUSTOMER_KEY + '_whatsapp_mobile') || localStorage.getItem(CUSTOMER_KEY + '_customer_mobile') || localStorage.getItem('santra_whatsapp_mobile') || localStorage.getItem('santra_customer_login_mobile') || localStorage.getItem(CUSTOMER_KEY + '_login_mobile');
  
  if(!currentCustomerMobile){
    // Old backup se bhi try
    try{
      let old = JSON.parse(localStorage.getItem('santra_customer')||'{}');
      if(old && old.mobile) currentCustomerMobile = old.mobile;
      if(old && old.loginMobile) currentCustomerMobile = old.loginMobile;
    }catch(e){}
  }

  if(!currentCustomerMobile){
    document.getElementById('ordersList').innerHTML = `<div class="empty">😔 Login nahi hai<br><br><button class="btn" type="button" onclick="window.location.href='customer-account.html'">🔐 Login Karo</button></div>`;
    return;
  }

  // Profile load - Header info ke liye
  db.collection(COLLECTIONS.CUSTOMERS).doc(currentCustomerMobile).get().then(doc => {
    if(doc.exists){
      currentCustomerData = doc.data();
      showCustomerInfo();
    }
  }).catch(()=>{});

  loadOrders();
}

function showCustomerInfo(){
  const box = document.getElementById('customerInfoBox');
  if(!box) return;
  if(currentCustomerData){
    box.innerHTML = `<div class="customer-info"><p><b>👤 ${currentCustomerData.name||'Customer'}</b> | 📱 ${currentCustomerMobile}</p><p>📍 ${currentCustomerData.location||currentCustomerData.address||''}</p><p><b>✅ ${allOrders.length} Orders Connected - WhatsApp Login Active</b></p></div>`;
  } else {
    box.innerHTML = `<div class="customer-info"><p><b>📱 ${currentCustomerMobile}</b></p><p><b>✅ Orders Loading...</b></p></div>`;
  }
}

function logoutCustomer(){
  if(confirm('Logout?')){
    localStorage.removeItem(CUSTOMER_KEY + '_whatsapp_mobile');
    localStorage.removeItem(CUSTOMER_KEY + '_customer_mobile');
    localStorage.removeItem(CUSTOMER_KEY + '_profile');
    localStorage.removeItem('santra_whatsapp_mobile');
    localStorage.removeItem('santra_customer');
    localStorage.setItem(CUSTOMER_KEY + '_logout_signal', Date.now());
    showToast('✅ Logged out');
    setTimeout(()=> window.location.href='customer-account.html', 800);
  }
}

function loadOrders(){
  const listDiv = document.getElementById('ordersList');
  listDiv.innerHTML = `<div class="loader">⏳ Loading your orders - ${currentCustomerMobile}...</div>`;

  // ✅ FIX: 3 tarah se try - Tera purana data bhi aayega
  db.collection('orders').where('customerMobile','==',currentCustomerMobile).get().then(snap => {
    if(!snap.empty){
      processOrders(snap);
    } else {
      db.collection('orders').where('mobile','==',currentCustomerMobile).get().then(snap2 => {
        if(!snap2.empty){
          processOrders(snap2);
        } else {
          // Client filter - Saare orders me se tere wale filter - Free plan ke liye
          db.collection('orders').orderBy('createdAt','desc').limit(80).get().then(snap3 => {
            let temp = [];
            snap3.forEach(doc => {
              let d = doc.data();
              if((d.customerMobile==currentCustomerMobile) || (d.mobile==currentCustomerMobile) || (d.customerPhone==currentCustomerMobile) || (d.loginMobile==currentCustomerMobile) || (d.whatsappMobile==currentCustomerMobile)){
                temp.push({id:doc.id,...d});
              }
            });
            if(temp.length>0){
              allOrders = temp;
              allOrders.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
              renderOrders(allOrders);
              showCustomerInfo();
            } else {
              listDiv.innerHTML=`<div class="empty">📦 Abhi koi order nahi hai<br>Mobile: ${currentCustomerMobile}<br><br><button class="btn" type="button" onclick="window.location.href='index.html'">🛍️ Shopping Shuru Karo</button></div>`;
              // Real-time listener
              startRealtimeListener();
            }
          }).catch(err=>{
            console.error(err);
            listDiv.innerHTML=`<div class="empty">❌ Error: ${err.message}<br>Firestore Rules me orders: allow read if true karo</div>`;
            startRealtimeListener();
          });
        }
      });
    }
  }).catch(err=>{
    listDiv.innerHTML=`<div class="empty">❌ ${err.message}</div>`;
    startRealtimeListener();
  });
}

function startRealtimeListener(){
  // ✅ Real-time - Naya order hote hi dikhega - Pehle jaisa connect
  try{
    db.collection('orders').where('customerMobile','==',currentCustomerMobile).onSnapshot(snap=>{
      if(!snap.empty) processOrders(snap);
    });
    db.collection('orders').where('mobile','==',currentCustomerMobile).onSnapshot(snap=>{
      if(!snap.empty) processOrders(snap);
    });
  }catch(e){ console.log("Realtime:", e.message); }
}

function processOrders(snapshot){
  allOrders=[];
  snapshot.forEach(doc=>{ allOrders.push({id:doc.id,...doc.data()}); });
  allOrders.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
  renderOrders(allOrders);
  showCustomerInfo();
}

function renderOrders(orders){
  let container = document.getElementById('ordersList');
  if(orders.length==0){
    container.innerHTML=`<div class="empty">📦 No orders yet<br><br><button class="btn" type="button" onclick="window.location.href='index.html'">Start Shopping</button></div>`;
    return;
  }
  container.innerHTML = orders.map(order=>{
    let orderDate = order.createdAt? order.createdAt.toDate() : new Date(order.orderTime || Date.now());
    let dateStr = orderDate.toLocaleString('en-IN',{timeZone:'Asia/Kolkata', dateStyle:'medium', timeStyle:'short'});
    let status = (order.status||'pending').toLowerCase();
    let statusClass='status-'+status;

    // ✅ Timeline - Confirm/Pending dekhne ke liye - Requirement
    let timeline = `
      <div class="timeline">
        <div class="timeline-step ${['pending','otp_pending','confirmed','shipped','delivered'].includes(status)?'done':''}">Ordered</div>
        <div class="timeline-step ${['confirmed','shipped','delivered'].includes(status)?'done':(status=='otp_pending'?'active':'')}">Confirmed</div>
        <div class="timeline-step ${['shipped','delivered'].includes(status)?'done':''}">Shipped</div>
        <div class="timeline-step ${status=='delivered'?'done':''}">Delivered</div>
      </div>`;

    // ✅ WhatsApp me jo detail gayi - Wahi yahan dikhe - Requirement
    let itemsHTML='';
    if(order.items && Array.isArray(order.items)){
      itemsHTML = order.items.map(item=>`
        <div class="item-row">
          <img src="${item.image||'https://via.placeholder.com/60'}" onclick="window.open('${BASE_URL}/product.html?id=${item.id}','_blank')">
          <div class="item-details">
            <h4>${item.name||item.title||'Product'}</h4>
            <p>Size: ${item.size||'M'} | Qty: ${item.qty||item.quantity||1} | ₹${item.price||0}</p>
            <a href="${BASE_URL}/product.html?id=${item.id||''}" target="_blank" style="font-size:11px;color:#3b82f6;font-weight:bold">View Product →</a>
          </div>
        </div>`).join('');
    }

    let orderLink = `${BASE_URL}/customer-orders.html?order=${order.id}`;
    let isPending = (status=='pending' || status=='otp_pending');

    // ✅ Customer detail - Jo WhatsApp me gaya - Checkout se
    let waDetail = `
      <div class="address-box">
        <p><b>📍 Delivery:</b> ${order.address||order.shippingAddress||currentCustomerData?.location||''}</p>
        <p><b>👤 ${order.customerName||currentCustomerData?.name||''}</b> | 📱 ${order.customerMobile||order.mobile||currentCustomerMobile}</p>
        ${order.paymentMethod?`<p><b>💳 Payment:</b> ${order.paymentMethod}</p>`:''}
        ${order.whatsappMessage?`<p style="font-size:11px;color:#666;margin-top:6px"><b>WhatsApp Msg:</b> ${order.whatsappMessage.slice(0,120)}...</p>`:''}
      </div>`;

    return `
      <div class="order-card" id="order_${order.id}">
        <div class="order-header">
          <div>
            <span class="order-num">#${order.id.slice(-6).toUpperCase()}</span>
            <div class="order-id">Order ID: <b>${order.id}</b></div>
            <p style="font-size:11px;color:#666">📅 ${dateStr}</p>
          </div>
          <span class="status-badge ${statusClass}">${status.replace('_',' ').toUpperCase()}</span>
        </div>

        ${timeline}
        ${waDetail}

        <div class="items-list"><b>🛒 Items (${order.items?.length||0}) - WhatsApp Detail Same:</b>${itemsHTML}</div>

        <div class="total-section">
          <div class="total-row"><span>Subtotal</span><span>₹${order.totalAmount||order.total||0}</span></div>
          <div class="total-row grand-total"><span>Total</span><span>₹${order.totalAmount||order.total||0}</span></div>
        </div>

        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn btn-light" type="button" style="flex:1" onclick="copyLink('${orderLink}')">🔗 Copy Link</button>
          <button class="btn btn-wa" type="button" style="flex:1" onclick="shareOrderWhatsApp('${order.id}')">💬 Share Order</button>
        </div>

        ${isPending ? `
          <div class="otp-box">
            <b>🔐 Order Confirm OTP - Har Order Pe OTP</b>
            <p style="font-size:12px;color:#666;margin:6px 0">Checkout se Place Order pe jo WhatsApp message admin ko gaya - Us Order ka OTP Admin ne aapke WhatsApp pe bheja hai. Yahan daalo toh Order Confirm hoga.</p>
            <p style="font-size:11px;background:white;padding:6px;border-radius:4px">Order: <b>${order.id}</b> | Date: ${dateStr} | Total: ₹${order.totalAmount||0}</p>
            <input type="tel" id="order_otp_${order.id}" class="otp-input" placeholder="------" maxlength="6">
            <button class="btn-verify" type="button" onclick="verifyOrderOTP('${order.id}')">✅ Verify & Confirm Order</button>
            <button class="btn" type="button" style="background:#f59e0b;margin-top:6px;width:100%" onclick="requestOrderOTP('${order.id}')">📲 Request OTP on WhatsApp (Admin)</button>
            <p style="font-size:10px;color:#999;margin-top:6px">OTP 4 hours valid | Firebase: order_otps/${order.id} | Admin panel me bhi save</p>
          </div>
        ` : `<div style="background:#d1fae5;padding:10px;border-radius:8px;margin-top:10px;text-align:center;color:#065f46;font-weight:bold">✅ Order ${status.toUpperCase()} - OTP Verified | Admin panel me confirmed</div>`}

      </div>`;
  }).join('');
}

function copyLink(link){
  navigator.clipboard.writeText(link).then(()=> showToast('✅ Order Link Copied')).catch(()=>{ prompt('Copy link:', link); });
}

function shareOrderWhatsApp(orderId){
  let order = allOrders.find(o=>o.id==orderId);
  let msg = `📦 *MY ORDER - SANTRA MALL*\n\nOrder ID: ${orderId}\nCustomer: ${currentCustomerData?.name||''} | ${currentCustomerMobile}\nDate: ${order.createdAt?order.createdAt.toDate().toLocaleString('en-IN'):''}\nStatus: ${order.status}\nTotal: ₹${order.totalAmount||order.total}\nAddress: ${order.address||''}\nItems: ${order.items?.map(i=>i.name).join(', ')}\n\nLink: ${BASE_URL}/customer-orders.html?order=${orderId}\n\nTrack karo!`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
}

function requestOrderOTP(orderId){
  let order = allOrders.find(o=>o.id==orderId);
  if(!order) return;
  let adminMsg = `🔐 *ORDER OTP REQUEST - SANTRA MALL*\n\nOrder ID: ${orderId}\nCustomer: ${currentCustomerData?.name||''} | ${currentCustomerMobile}\nDate: ${new Date().toLocaleString('en-IN')}\nTotal: ₹${order.totalAmount||order.total}\nItems: ${order.items?.map(i=>`${i.name} x${i.qty||1}`).join(', ')}\nAddress: ${order.address||''}\n\nKripya is Order ke liye OTP bheje - Customer orders page pe wait kar raha hai.\nLink: ${BASE_URL}/admin-orders.html?order=${orderId}`;
  window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(adminMsg)}`,'_blank');
  showToast('✅ Admin ko Order OTP Request bhej di!');
  
  // Firebase me request - Admin panel me dikhega
  db.collection('order_otp_requests').doc(orderId+'_'+Date.now()).set({
    orderId: orderId,
    customerMobile: currentCustomerMobile,
    customerName: currentCustomerData?.name||'',
    total: order.totalAmount||order.total,
    items: order.items||[],
    address: order.address||'',
    status:'pending',
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});
}

function verifyOrderOTP(orderId){
  const input = document.getElementById('order_otp_'+orderId);
  if(!input) return;
  const otp = input.value.trim();
  if(otp.length!==6) return showToast('❌ 6 digit OTP daalo', true);
  
  showToast('⏳ Verifying...');
  db.collection('order_otps').doc(orderId).get().then(doc=>{
    if(!doc.exists) return showToast('❌ OTP nahi mila! Pehle Request OTP dabao', true);
    let data=doc.data();
    let otpTime = data.timestamp?.toDate?.() || new Date();
    let diffHours = (new Date()-otpTime)/1000/60/60;
    if(diffHours>4) return showToast('❌ OTP expire! Naya mangao', true);
    
    if(data.otp==otp){
      db.collection('orders').doc(orderId).update({status:'confirmed', otpVerified:true, confirmedAt: firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{
        showToast('✅ Order Confirmed! 🎉');
        db.collection('order_otps').doc(orderId).delete().catch(()=>{});
        setTimeout(()=> loadOrders(), 800);
      });
    } else showToast('❌ Galat OTP', true);
  }).catch(err=> showToast('❌ '+err.message, true));
}

function filterOrders(){
  const term=document.getElementById('searchOrder').value.toLowerCase().trim();
  if(!term){ renderOrders(allOrders); return; }
  const filtered = allOrders.filter(o=> o.id.toLowerCase().includes(term) || (o.customerMobile||'').includes(term) || (o.mobile||'').includes(term) );
  renderOrders(filtered);
}

function showToast(msg, isError=false){
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  if(isError) t.classList.add('error');
  setTimeout(()=>{ t.classList.remove('show'); t.classList.remove('error'); },3000);
}
