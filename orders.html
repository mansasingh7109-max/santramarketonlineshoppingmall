window.BASE_URL = window.BASE_URL || "https://santramarketshoppingmall.web.app";
const MY_FIREBASE_CONFIG={apiKey:"AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",authDomain:"santramarketshoppingmall.firebaseapp.com",projectId:"santramarketshoppingmall",storageBucket:"santramarketshoppingmall.appspot.com",messagingSenderId:"398490252924",appId:"1:398490252924:web:d1b6348b549183b93b7bf9",databaseURL:"https://santramarketshoppingmall-default-rtdb.firebaseio.com/"};
function getDB(){try{if(!firebase.apps.length)firebase.initializeApp(MY_FIREBASE_CONFIG);return firebase.firestore();}catch(e){return null;}}var db=getDB();
let allOrders=[],currentCustomerMobile=null,currentCustomerData=null,currentDeliveryMobile=null,productCache={},productCacheLoaded=false,unsubscribeOrders=null;
document.getElementById('backBtn').onclick=()=>location.href='index.html';
document.getElementById('profileBtn').onclick=()=>location.href='customer-account.html';
document.getElementById('logoutBtnTop').onclick=()=>{if(confirm('Logout?')){localStorage.clear();location.href='customer-account.html';}};
function waitForDBAndLoad(c=0){db=getDB();if(!db){if(c<20)setTimeout(()=>waitForDBAndLoad(c+1),500);return;}checkLoginAndLoad();}
function checkLoginAndLoad(){
  let u=new URLSearchParams(location.search);
  currentCustomerMobile=u.get('mobile')||localStorage.getItem('santra_mobile')||'';
  currentDeliveryMobile=u.get('delivery')||localStorage.getItem('santra_deliveryMobile')||'';
  try{let cust=JSON.parse(localStorage.getItem('santra_customer')||'{}');if(!currentCustomerMobile)currentCustomerMobile=cust.loginMobile||cust.mobile||'';if(!currentDeliveryMobile)currentDeliveryMobile=cust.deliveryMobile||'';currentCustomerData=cust;}catch(e){}
  let last=localStorage.getItem('lastOrderId')||u.get('orderId')||'';
  if(!currentCustomerMobile&&!last){document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 No Orders - Login karo</div>';return;}
  if(currentCustomerMobile){
    db.collection('customers').doc(currentCustomerMobile).get().then(d=>{
      if(d.exists){currentCustomerData={...currentCustomerData,...d.data()}; localStorage.setItem('santra_customer', JSON.stringify(currentCustomerData));}
      showCustomerProfile(); loadProductCacheThenOrders();
    }).catch(()=>{showCustomerProfile(); loadProductCacheThenOrders();});
  } else loadOrderById(last);
}
function showCustomerProfile(){
  let box=document.getElementById('customerProfileBox');
  let latestName = currentCustomerData?.name || '';
  let latestAddr = currentCustomerData?.address || currentCustomerData?.fullAddress || '';
  let latestEmail = currentCustomerData?.email || '';
  if(allOrders.length>0){
    let latestOrder = allOrders[0];

    if(orderAddr && orderAddr!=='__________' && orderAddr.trim()!=='' ){
      if(latestAddr==='__________' ||!latestAddr || latestAddr.trim()===''){
        latestAddr = orderAddr;
        if(currentCustomerMobile) db.collection('customers').doc(currentCustomerMobile).set({address:latestAddr}, {merge:true});
      }
    }
    if(latestOrder.email && latestOrder.email!=='__________'){
      if(!latestEmail || latestEmail==='__________') latestEmail = latestOrder.email;

  }
  let name=latestName||'Customer';

  let addr=(latestAddr||'').trim();
  if(addr==='__________' || addr==='') addr='__________';

  box.innerHTML=`<div class="customer-profile"><div style="width:42px;height:42px;border-radius:50%;background:#10b981;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px">${name[0]||'S'}</div><div style="flex:1"><div style="font-weight:bold">👤 ${name} - Auto Updated - 1st Time Add</div><div style="font-size:11px;color:#444;margin-top:3px">📱 <b>Login/OTP No: ${mob}</b> ${extra?`<span class="extra-delivery">Extra: ${extra}</span>`:''} ${email?`| ✉️ ${email}`:''}</div><div style="font-size:11px;background:#f0fdf4;padding:6px 8px;border-radius:6px;margin-top:5px;border:1px dashed #10b981">📍 ${addr} | Mb No: ${mob} With</div><div style="font-size:10px;color:#10b981;margin-top:4px">🔴 Live - SANTRAJET MALL INFORMATION LIVE UPDATE</div></div></div>`;
}
async function loadProductCacheThenOrders(){
  try{
    if(window.SANTRA_ALL_URL_MAP && Object.keys(window.SANTRA_ALL_URL_MAP).length>0){
      Object.entries(window.SANTRA_ALL_URL_MAP).forEach(([k,v])=>{ productCache[k.toLowerCase()]=v; productCache[k]=v; });
    }
    if(!productCacheLoaded){
      let snap=await db.collection('products').limit(400).get();
      snap.forEach(d=>{
        let data=d.data(); let img=data.image||data.imageUrl||data.thumbnail||data.firebaseImage||'';
        if(img){ productCache[d.id]=img; productCache[d.id.toLowerCase()]=img; if(data.code){ productCache[data.code]=img; productCache[data.code.toLowerCase()]=img; } if(data.name){ productCache[data.name.toLowerCase()]=img; } }
      });
      productCacheLoaded=true;
    }
  }catch(e){}
  loadOrdersLive();
}
function loadOrderById(id){
  if(!currentCustomerMobile){
    document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 Login karo - Apna Order dekho</div>';
    return;
  }
  db.collection('orders').doc(id).get().then(doc=>{if(doc.exists){ let data=doc.data(); if((data.customerMobile||data.mobile)==currentCustomerMobile) processOrders({forEach:cb=>cb(doc)}); }});
}
function loadOrdersLive(){
  if(unsubscribeOrders) unsubscribeOrders();
  if(!currentCustomerMobile){document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 No Orders - Login karo</div>';return;}
  try{
    let q = db.collection('orders').where('customerMobile','==',currentCustomerMobile).orderBy('createdAt','desc');
    unsubscribeOrders = q.onSnapshot(s=>{
      if(!s.empty) processOrders(s);
      else db.collection('orders').where('mobile','==',currentCustomerMobile).orderBy('createdAt','desc').onSnapshot(s2=>{ if(!s2.empty) processOrders(s2); else document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 Aapka koi Order nahi hai - Khud ka Order hi dikhega</div>'; });
    }, err=>{
      db.collection('orders').where('customerMobile','==',currentCustomerMobile).get().then(s=>{ if(!s.empty) processOrders(s); else db.collection('orders').where('mobile','==',currentCustomerMobile).get().then(s2=>{ if(!s2.empty) processOrders(s2); else document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:20px">📦 No Orders</div>'; }); });
    });
  }catch(e){
    db.collection('orders').where('customerMobile','==',currentCustomerMobile).get().then(s=>{ if(!s.empty) processOrders(s); });
  }
}
function processOrders(snap){
  allOrders=[];snap.forEach(d=>allOrders.push({id:d.id,...d.data()}));
  allOrders.sort((a,b)=>{let ta=a.createdAt?.toMillis?.()||new Date(a.date||0).getTime()||0;let tb=b.createdAt?.toMillis?.()||new Date(b.date||0).getTime()||0;return ta-tb;});
  allOrders.forEach((o,i)=>{o._serial=i+1;});
  allOrders.sort((a,b)=>{let ta=a.createdAt?.toMillis?.()||new Date(a.date||0).getTime()||0;let tb=b.createdAt?.toMillis?.()||new Date(b.date||0).getTime()||0;return tb-ta;});
  showCustomerProfile();
  renderOrders(allOrders);
}
function calculateTotal(o){let f=['total','totalAmount','grandTotal','orderTotal','amount'];for(let x of f){let v=parseFloat(o[x]||0);if(v>0)return v;}let items=o.items||o.cart||[];if(!Array.isArray(items))try{items=Object.values(items);}catch(e){items=[];}let sum=0;items.forEach(it=>sum+=(parseInt(it.qty||1)||1)*(parseFloat(it.price||0)||0));return sum;}
function getBaseIds(fullId){let clean=String(fullId||'').trim();let ids=[clean, clean.toLowerCase(), clean.toUpperCase()];if(clean.includes('-')){let base=clean.substring(0, clean.lastIndexOf('-'));if(base.length>5) ids.push(base, base.toLowerCase());}return [...new Set(ids)].filter(Boolean);}
function getCleanProductId(it){let raw=(it.id||it.productId||it.code||it.productCode||'').toString().trim();if(!raw) raw=(it.name||'').toString().trim();return raw;}
function getProductImage(it){
  let fbFields=['image','img','imageUrl','productImage','thumbnail','firebaseImage','firebaseUrl'];
  for(let f of fbFields){let v=it[f];if(v&&typeof v==='string'&&v.includes('firebasestorage.googleapis.com')&&v.startsWith('http')) return v;}
  let fields=['image','img','imageUrl','productImage','thumbnail','thumb','photo','picture','src','url','productImg','mainImage'];
  for(let f of fields){let v=it[f];if(v&&typeof v==='string'&&v.length>15&&v.startsWith('http')&&!v.includes('ibb.co')) return v;}
  try{
    let tryIds=getBaseIds(it.id||it.productId||it.code||it.name||'');
    for(let k of tryIds){
      if(!k) continue;
      if(productCache[k]) return productCache[k];
      if(productCache[k.toLowerCase()]) return productCache[k.toLowerCase()];
      if(window.SANTRA_ALL_URLS && window.SANTRA_ALL_URLS[k]) return window.SANTRA_ALL_URLS[k];
      if(window.SANTRA_ALL_URL_MAP && window.SANTRA_ALL_URL_MAP[k]) return window.SANTRA_ALL_URL_MAP[k];
      if(window.getProductImageUrl){ let u=window.getProductImageUrl(k); if(u && u.startsWith('http')) return u; }
    }
  }catch(e){}
  return 'https://via.placeholder.com/100?text='+encodeURIComponent((it.name||'Product').substring(0,10));
}
function getFullAddress(order){return order.address||order.customerAddress||order.fullAddress||order.shippingAddress||'';}
function getShortStatus(s){s=(s||'Pending').toLowerCase();if(s.includes('cancel request'))return 'Cancel Requested';if(s.includes('cancel'))return 'Cancelled';if(s.includes('delivered'))return 'Delivered';if(s.includes('out for'))return 'Out for Delivery';if(s.includes('ship'))return 'Shipped';if(s.includes('confirm'))return 'Confirmed';return 'Pending';}
function getPaymentMethod(o){let p=(o.paymentMethod||o.paymentMode||'Cash on Delivery'); if(p.toLowerCase().includes('online')) return 'Online Payment'; return 'Cash on Delivery';}
function renderOrders(orders){
  if(!orders||orders.length===0){document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:30px">📦 No Orders Found - Customer ko sirf apna Order dikhega</div>';return;}
  document.getElementById('ordersList').innerHTML=orders.map((order)=>{
    let serial=order._serial||1;
    let d=order.createdAt?.toDate?.()||new Date(order.date||Date.now());
    let dateStr=d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
    let total=calculateTotal(order);
    let payment=getPaymentMethod(order);
    let isOnline=payment.toLowerCase().includes('online');
    let loginMob=order.loginMobile||order.mobile||order.customerMobile||currentCustomerMobile||'';
    let deliveryMob=order.deliveryMobile||order.extraDeliveryMobile||'';
    let fullAddr=getFullAddress(order);
    let name=order.customerName||order.name||'Customer';
    let items=order.items||order.cart||[];if(!Array.isArray(items))try{items=Object.values(items);}catch(e){items=[];}
    let sub=0; items.forEach(it=>sub+=(parseInt(it.qty||1)||1)*(parseFloat(it.price||0)||0));
    let del=sub>=500?0:49; let grand=sub+del;
    let itemsText=items.map((it,i)=>`${i+1}. ${it.name||'Product'} (Size ${it.size||'M'}) - Qty: ${it.qty||1} x ₹${it.price||0} = ₹${(it.qty||1)*(it.price||0)}`).join('\n');
    let screenshotBox=`<div class="screenshot-box">🛒 <b>SANTRA MALL - Order Screenshot - Same as WhatsApp</b>\nOrder ID: ${order.id}\nDate: ${dateStr}\nSold By: Santra Mall\n\n${itemsText}\n\nSubtotal: ₹${sub}\nDelivery: ${del===0?'FREE':'₹'+del}\n<b>Grand Total: ₹${grand||total}</b>\nPayment: ${payment}\nCustomer: ${name} | 📱 ${loginMob}</div>`;
    let itemsHTML=items.map(it=>{
      let q=parseInt(it.qty||1)||1,p=parseFloat(it.price||0)||0,nameP=it.name||'Product';
      let img=getProductImage(it);let cleanId=getCleanProductId(it);
      let link=`product.html?id=${encodeURIComponent(cleanId)}`;
      return `<div class="item-row"><div class="item-img-wrap"><img src="${img}" onerror="this.src='https://via.placeholder.com/100'"></div><div class="item-details"><h4>${nameP}</h4><p style="font-size:11px;color:#666">Qty: ${q} | ₹${p} = ₹${q*p}</p><a class="prod-link-btn" href="${link}" target="_blank">🔗 View Product - ${cleanId}</a></div></div>`;
    }).join('');
    let status=getShortStatus(order.status);
    let statusClass=status==='Confirmed'?'status-confirmed':status==='Cancelled'?'status-cancelled':status==='Cancel Requested'?'status-cancel-req':status==='Shipped'?'status-shipped':'status-pending';
    let shortId=order.id.slice(-6).toUpperCase();
    let isPresent=(Date.now()-d.getTime())<3*24*60*60*1000;
    let presentTag=isPresent?'<span style="background:#10b981;color:#fff;padding:2px 6px;border-radius:10px;font-size:9px;margin-left:6px">Present 3 Days</span>':'<span style="background:#e5e7eb;color:#666;padding:2px 6px;border-radius:10px;font-size:9px;margin-left:6px">Old</span>';
    let isCancelRequested = status==='Cancel Requested' || order.cancelRequest;
    let topLine=`ID: <b>${order.id}</b> | ${dateStr} ${presentTag} | 📱 <b>${loginMob}</b>`;
    let addrLine=fullAddr?`📍 ${fullAddr} | Mb No: ${loginMob} With`:'';
    let showCancelOtp = isCancelRequested? 'block' : 'none';
    let showMainOtp = (status==='Pending' &&!isCancelRequested)? 'block' : 'none';
    return `<div class="order-card" style="border-left:5px solid ${status==='Cancelled'?'#ef4444':status==='Confirmed'?'#10b981':'#e40046'}">
      <div class="order-header">
        <div class="order-header-top">
          <div style="display:flex;gap:6px;align-items:center"><span class="serial-badge">#${serial}</span><div class="order-id-badge">Order #${shortId}</div></div>
          <div class="status-wrap"><span class="status-badge ${statusClass}">${status}</span><span class="payment-badge ${isOnline?'payment-online':'payment-cod'}">${isOnline?'💳 Online':'💵 COD'}</span><button class="btn-cancel-top" onclick="showCancelBox('${order.id}')">❌ Cancel</button></div>
        </div>
        <div class="order-id-line">${topLine}</div>
        ${addrLine?`<div class="order-addr-line">${addrLine}</div>`:''}
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="small-tab" onclick="toggleAddr('addr_${order.id}')">📍 Delivery Profile View - small popup</button><span class="small-tab" style="background:#f0fdf4;border-color:#10b981;color:#065f46">Live</span>${order.cancelReason?`<span class="small-tab" style="background:#fee2e2;border-color:#fecaca;color:#991b1b">❌ Cancel Requested: ${order.cancelReason.slice(0,25)}</span>`:''}${order.cancelRequest?`<span class="small-tab" style="background:#fef3c7">🕒 Cancel Request Sent</span>`:''}</div>
        <div id="addr_${order.id}" class="addr-full">👤 Name: ${name}\n📱 Login/OTP No: ${loginMob} - Jo Login No H\n📦 Extra Delivery No: ${deliveryMob||'Same as Login'}\n📍 Address: ${fullAddr} - Present Delivery Form Detail\n✉️ Email: ${order.email||''}\n💳 Payment: ${payment}\n📅 Date: ${dateStr}\n${order.cancelReason?'❌ Cancel Reason: '+order.cancelReason:''}</div>
      </div>
      ${itemsHTML}
      ${screenshotBox}
      <div class="total-section"><div class="total-row"><span>Subtotal</span><span>₹${sub}</span></div><div class="total-row"><span>Delivery</span><span>${del===0?'FREE':'₹'+del}</span></div><div class="total-row grand-total"><span>Grand Total - ${payment}</span><span>₹${grand||total}</span></div></div>
      <div id="cancelBox_${order.id}" class="cancel-box" style="display:none"><div style="font-weight:bold;color:#991b1b;text-align:center;font-size:13px">❌ Cancel Reason + WhatsApp - Old Popup Jesa</div><textarea id="cancel_reason_${order.id}" class="cancel-input" placeholder="Cancel reason likho - jaise: size issue, late delivery, Want to other..."></textarea><button class="btn-cancel-confirm" onclick="confirmCancel('${order.id}')">❌ Confirm Cancel</button><button class="btn-whatsapp-cancel" onclick="whatsappCancel('${order.id}')">📲 WhatsApp Cancel + OTP Request</button></div>
      <!-- Add Cancel OTP - Customer ko Firebase/Admin word nahi - Bas Santrajet word - 1 Save Button Only - Save info Firebase + Admin par show -->
      <div id="cancelOtpBox_${order.id}" class="otp-cancel-box" style="display:${showCancelOtp};max-width:360px;margin:10px auto;background:#fef2f2"><div style="font-weight:bold;color:#991b1b;text-align:center;font-size:13px">🔐 Add Cancel WhatsApp OTP</div><div style="font-size:11px;color:#666;text-align:center;margin:4px 0">save WhatsApp cancel OTP - submit in santrajet</div><input id="cancel_otp_${order.id}" class="otp-input-cancel" placeholder="------" maxlength="6" value="${order.cancelOTP||''}"><button class="btn-save-cancel" onclick="saveCancelOTP('${order.id}')">💾 Save Cancel OTP</button><div style="font-size:10px;color:#666;text-align:center;margin-top:4px">Status: ${status} - Santrajet verify karega</div></div>
      <div id="mainOtpBox_${order.id}" class="otp-box" style="display:${showMainOtp}"><div style="font-weight:bold;color:#065f46;text-align:center;font-size:12px">Add WhatsApp OTP - Chhota Medium Box 360px</div><input id="order_otp_${order.id}" class="otp-input" placeholder="------" maxlength="6"><button class="btn-verify" onclick="verifyOTP('${order.id}')">✅ Verify & Confirm</button><div style="font-size:10px;color:#666;text-align:center;margin-top:4px">Status: Pending - OTP Wait | Live | ${payment}</div></div>
      ${status==='Cancel Requested'?`<div style="background:#fef3c7;padding:8px;border-radius:8px;text-align:center;color:#92400e;font-size:12px;margin-top:8px">🕒 Cancel Requested - Reason: ${order.cancelReason||'Want to other'} - Save OTP after - It will be cancel by Santrajet</div>`:status==='Cancelled'?`<div style="background:#fee2e2;padding:8px;border-radius:8px;text-align:center;color:#991b1b;font-size:12px;margin-top:8px">❌ Cancelled - Reason: ${order.cancelReason||'No reason'}</div>`:`<div style="background:#d1fae5;padding:8px;border-radius:8px;text-align:center;color:#065f46;font-size:12px;margin-top:8px;display:${status==='Pending'?'none':'block'}">✅ ${status} - Payment: ${payment}</div>`}
    </div>`;
  }).join('');
}
function toggleAddr(id){let el=document.getElementById(id);if(el) el.style.display = el.style.display==='block'?'none':'block';}
function showCancelBox(id){let el=document.getElementById('cancelBox_'+id);if(el) el.style.display = el.style.display==='none'? 'block' : 'none';}
function confirmCancel(id){let reason=document.getElementById('cancel_reason_'+id).value.trim()||'No reason';if(!confirm('Cancel Order? Reason: '+reason)) return;db.collection('orders').doc(id).update({status:'Cancelled',cancelReason:reason,cancelledAt:Date.now(),cancelledBy:'customer'}).then(()=>{alert('Cancelled');});}
function whatsappCancel(id){
  let reason=document.getElementById('cancel_reason_'+id).value.trim()||'I want to other';
  let txt=`*SANTRA MALL - Cancel Request*\nOrder ID: ${id}\nReason: ${reason}\nMobile: ${currentCustomerMobile}\n\n❌ *Cancel OTP bhejo*`;
  window.open('https://wa.me/918769171078?text='+encodeURIComponent(txt),'_blank');
  document.getElementById('cancelBox_'+id).style.display='none';
  document.getElementById('cancelOtpBox_'+id).style.display='block';
  let mainOtp=document.getElementById('mainOtpBox_'+id);
  if(mainOtp) mainOtp.style.display='none';
  db.collection('orders').doc(id).update({cancelRequest:true,cancelReason:reason,cancelRequestedAt:Date.now(),status:'Cancel Requested'});
}
function saveCancelOTP(id){
  let otp=document.getElementById('cancel_otp_'+id).value.trim();
  if(otp.length!=6) return alert('6 digit Cancel OTP likho - WhatsApp se mila hua');
  db.collection('orders').doc(id).update({cancelOTP:otp,cancelOTPSavedByCustomer:true,cancelOTPSavedAt:Date.now(),status:'Cancel Requested - OTP Saved',updateInfo:'Firebase + Admin par save - Customer ko Santrajet word'}).then(()=>{alert('✅ OTP Save ho gaya - Santrajet verify karke Cancel karega');});
}
function verifyOTP(id){let otp=document.getElementById('order_otp_'+id).value.trim();if(otp.length!=6)return alert('6 digit OTP likho');db.collection('orders').doc(id).update({status:'Confirmed',otp:otp,otpVerified:true,verifiedAt:Date.now()}).then(()=>{alert('Verified');});}
waitForDBAndLoad();
</script>
<script src="santra-all-url-one-file.js"></script>
</body>
</html>
