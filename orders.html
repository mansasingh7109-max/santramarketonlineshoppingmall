<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 My Orders - FINAL - V23 - ID Date Fix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f1f3f6;--card:#fff;--accent:#e40046;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);padding-bottom:70px;overflow-x:hidden}
.header{background:var(--accent);color:#fff;padding:12px 15px;display:flex;gap:8px;position:sticky;top:0;z-index:100;align-items:center}
.header h1{font-size:16px;flex:1;min-width:0}
.back-btn,.logout-btn,.profile-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold;flex-shrink:0}
.container{max-width:900px;margin:12px auto;padding:0 10px;overflow-x:hidden}
.customer-profile{background:var(--card);padding:12px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-left:5px solid var(--green);display:flex;gap:10px;align-items:center}
.order-card{background:var(--card);margin:12px 0;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:5px solid var(--accent);overflow:hidden}
.order-header{padding-bottom:10px;border-bottom:2px solid #f1f3f6;margin-bottom:10px}
.order-header-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.order-id-badge{background:var(--accent);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold;white-space:nowrap}
.order-id-line{font-size:11px;color:#666;margin-top:8px;line-height:1.5;word-break:break-word;white-space:normal}
.order-id-line b{color:#333;word-break:break-all}
.status-wrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.status-badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:bold;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.status-pending{background:#fef3c7;color:#92400e}.status-confirmed{background:#d1fae5;color:#065f46}.status-shipped{background:#dbeafe;color:#1e40af}.status-cancelled{background:#fee2e2;color:#991b1b}.status-buying{background:#fef3c7;color:#92400e}
.btn-cancel-top{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:bold;border:1px solid #fecaca;background:#fee2e2;color:#991b1b;cursor:pointer;white-space:nowrap}
.customer-box{font-size:12px;background:#f0f9ff;padding:9px 10px;border-radius:8px;margin:8px 0;border-left:4px solid #10b981;line-height:1.5;word-break:break-word}
.item-row{display:flex;gap:10px;margin:8px 0;padding:10px;background:#f9f9f9;border-radius:10px;align-items:center;min-height:76px}
.item-img-wrap{width:62px;height:62px;border-radius:10px;background:#fff;border:1px solid #eee;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:bold;color:var(--accent);font-size:18px}
.item-img-wrap img{width:100%;height:100%;object-fit:cover}
.item-details{flex:1;min-width:0}
.item-details h4{font-size:13px;margin-bottom:3px;word-break:break-word;line-height:1.3}
.item-details p{font-size:11px;color:#666;margin:2px 0}
.prod-link-btn{display:inline-block;margin-top:5px;padding:4px 10px;background:#e0f2fe;color:#0284c7;border-radius:20px;font-size:10px;font-weight:bold;text-decoration:none}
.total-section{border-top:2px solid #f1f3f6;margin-top:10px;padding-top:10px}
.total-row{display:flex;justify-content:space-between;margin:3px 0;font-size:13px}.grand-total{font-size:15px;font-weight:bold;color:var(--accent)}
.btn{padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px;width:100%}.btn-invoice{background:#0ea5e9;color:#fff}.btn-wa{background:#25D366;color:#fff}
.otp-box{background:#e8f5e9;padding:12px;border-radius:12px;margin:12px 0;border:2px solid #10b981}
.cancel-box{background:#fff5f5;padding:12px;border-radius:12px;margin:12px 0;border:2px solid #fca5a5}
.otp-input,.cancel-otp-input{width:100%;padding:11px;margin:8px 0;border:2px solid #10b981;border-radius:8px;font-size:16px;text-align:center;letter-spacing:5px;font-weight:bold}
.cancel-otp-input{border-color:#ef4444}
.cancel-input{width:100%;padding:9px;margin:8px 0;border:1.5px solid #fca5a5;border-radius:8px;font-size:12px}
.btn-verify{width:100%;background:#10b981;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-cancel-submit{width:100%;background:#dc2626;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}
.loader{text-align:center;padding:30px;color:var(--accent);font-weight:bold}
</style>
</head>
<body>
<div class="header">
<button id="backBtn" class="back-btn">← Back</button>
<h1>📦 My Orders - FINAL</h1>
<button id="profileBtn" class="profile-btn">👤 Profile</button>
<button id="logoutBtnTop" class="logout-btn">🚪 Logout</button>
</div>
<div class="container">
<div id="customerProfileBox"></div>
<div id="ordersList"><div class="loader">⏳ Loading Orders...</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="constants.js?v=3"></script>
<script src="config.js?v=8"></script>
<script src="order-save.js"></script>
<script src="auto-loader.js"></script>

<script>
// V23 FINAL - Starting demo order sahi dike niche wale ese dike date time order id etc - ID Vertical Fix + Short Status + Hamesha Image + Layout Equal
const MY_FIREBASE_CONFIG = {
  apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
  authDomain: "santramarketshoppingmall.firebaseapp.com",
  projectId: "santramarketshoppingmall",
  storageBucket: "santramarketshoppingmall.appspot.com",
  messagingSenderId: "398490252924",
  appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
  databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com/"
};
function getDB(){
  try{
    if(typeof firebase==='undefined') return null;
    if(!firebase.apps.length){ firebase.initializeApp(MY_FIREBASE_CONFIG); }
    if(window.db && typeof window.db.collection==='function') return window.db;
    return firebase.firestore();
  }catch(e){ return null; }
}
var db = getDB();
let allOrders=[], currentCustomerMobile=null, currentCustomerData=null;
document.getElementById('backBtn').onclick=()=>location.href='index.html';
document.getElementById('profileBtn').onclick=()=>location.href='customer-account.html';
document.getElementById('logoutBtnTop').onclick=()=>{ if(confirm('Logout?')){ localStorage.clear(); location.href='customer-account.html'; } };

function waitForDBAndLoad(c=0){
  db = getDB();
  if(!db || typeof db.collection!=='function'){
    if(c<20){ setTimeout(()=>waitForDBAndLoad(c+1),500); return; }
    else{ document.getElementById('ordersList').innerHTML='<div style="text-align:center;color:red;padding:20px">❌ Firebase connect nahi hua</div>'; return; }
  }
  checkLoginAndLoad();
}
function checkLoginAndLoad(){
  currentCustomerMobile = new URLSearchParams(location.search).get('mobile') || localStorage.getItem('santra_mobile') || localStorage.getItem('customer_mobile') || '';
  if(!currentCustomerMobile){ document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:30px">🔐 Login karo</div>'; return; }
  db.collection('customers').doc(currentCustomerMobile).get().then(d=>{
    if(d.exists){ currentCustomerData=d.data(); showCustomerProfile(); }
    loadOrders();
  }).catch(()=>{ loadOrders(); });
}
function showCustomerProfile(){
  const box=document.getElementById('customerProfileBox'); if(!box ||!currentCustomerData) return;
  let name = currentCustomerData?.name||'Customer'; let addr = currentCustomerData?.address||currentCustomerData?.area||'Sastra';
  let photo=currentCustomerData?.photo||'https://via.placeholder.com/50';
  box.innerHTML=`<div class="customer-profile"><img src="${photo}" style="width:40px;height:40px;border-radius:50%" onerror="this.src='https://via.placeholder.com/50'"><div style="min-width:0"><div style="font-weight:bold">👤 ${name} - Latest</div><div style="font-size:11px;color:#666;word-break:break-word">📱 ${currentCustomerMobile} | 📍 ${addr}</div><div style="font-size:11px;color:#10b981">Sold By: Santra Mall | ID Date Fix</div></div></div>`;
}
function loadOrders(){
  if(!db) return waitForDBAndLoad();
  db.collection('orders').where('customerMobile','==',currentCustomerMobile).get().then(s=>{
    if(!s.empty) processOrders(s);
    else db.collection('orders').where('mobile','==',currentCustomerMobile).get().then(s2=>{ if(!s2.empty) processOrders(s2); else document.getElementById('ordersList').innerHTML='<div style="text-align:center;padding:30px">📦 No Orders</div>'; });
  });
}
function processOrders(snap){
  allOrders=[]; snap.forEach(d=>allOrders.push({id:d.id,...d.data()}));
  allOrders.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
  renderOrders(allOrders);
}
function calculateTotal(order){
  let fields = ['total','totalAmount','grandTotal','orderTotal','amount']; for(let f of fields){ let v=parseFloat(order[f]||0); if(v>0) return v; }
  let items = order.items||order.cart||[]; if(!Array.isArray(items)) try{ items=Object.values(items); }catch(e){ items=[]; }
  let sum=0; items.forEach(it=>{ sum+= (parseInt(it.qty||1)||1)*(parseFloat(it.price||0)||0); }); return sum>0?sum:1050;
}
function getCleanProductId(it){
  let raw = (it.id||it.productId||it.code||it.productCode||'').toString();
  let clean = raw.split('_')[0].split('-')[0].split(' ')[0];
  if(!clean || clean.length<3) clean = (it.name||'prod').replace(/\s+/g,'').substring(0,12);
  return clean;
}
function getProductImage(it){
  let fields = ['image','img','imageUrl','productImage','thumbnail','thumb','photo','picture','src','url'];
  for(let f of fields){ let v = it[f]; if(v && typeof v==='string' && v.startsWith('http')) return v; }
  if(it.images && Array.isArray(it.images) && it.images[0]) return it.images[0];
  return '';
}
function getShortStatus(longStatus){
  let s = (longStatus||'Pending').toString().toLowerCase();
  if(s.includes('cancel')) return 'Cancelled';
  if(s.includes('ship')) return 'Shipped';
  if(s.includes('confirm')) return 'Confirmed';
  if(s.includes('buying')) return 'Confirmed';
  if(s.includes('otp')||s.includes('redirect')||s.includes('pending')||s.includes('wait')) return 'Pending';
  return longStatus.length>20? longStatus.substring(0,15)+'..' : longStatus;
}
function renderOrders(orders){
  if(!orders || orders.length===0) return;
  let latestName = currentCustomerData?.name || orders[0]?.customerName || 'Customer';
  let latestAddress = currentCustomerData?.address || currentCustomerData?.area || orders[0]?.customerAddress || 'Sastra';

  document.getElementById('ordersList').innerHTML = orders.map(order=>{
    let d = order.createdAt?.toDate?.() || new Date(order.date||order.orderTime||Date.now());
    let dateStr = d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
    let statusFull = order.status||'Pending';
    let statusShort = getShortStatus(statusFull);
    let statusLower = statusFull.toLowerCase();
    let statusClass = statusLower.includes('confirm')?'status-confirmed':statusLower.includes('ship')?'status-shipped':statusLower.includes('cancel')?'status-cancelled':'status-pending';
    if(statusLower.includes('buying')) statusClass='status-confirmed';
    let total = calculateTotal(order);
    let items = order.items||order.cart||order.products||[];
    if(!Array.isArray(items)) try{ items=Object.values(items); }catch(e){ items=[]; }
    if(items.length===0 && total>0) items = [{name:'Order Items', price:total, qty:1, image:'', id:order.id}];

    let itemsHTML = items.map(it=>{
      let q=parseInt(it.qty||1)||1, p=parseFloat(it.price||0)||0;
      let name = (it.name||'Product').replace(/\s*\(Size M\)\s*\(Size M\)/gi,' (Size M)').replace(/\s*\(Size Default\)/gi,'').trim();
      let sizeRaw = it.size||it.variant||'';
      let sizeDisplay = '';
      if(sizeRaw &&!name.toLowerCase().includes('size')) sizeDisplay = ` (Size ${sizeRaw.toString().replace(/\(|\)/gi,'').trim()})`;
      let imgUrl = getProductImage(it);
      let cleanId = getCleanProductId(it);
      let link = `https://santramarketshoppingmall.web.app/product.html?id=${cleanId}`;
      let imgDiv = imgUrl? `<img src="${imgUrl}" onerror="this.parentElement.innerHTML='${(name[0]||'P').toUpperCase()}'">` : `${(name[0]||'P').toUpperCase()}`;
      return `<div class="item-row">
        <div class="item-img-wrap">${imgDiv}</div>
        <div class="item-details">
          <h4>${name}${sizeDisplay}</h4>
          <p>Qty: ${q} | ₹${p} | Via: 🛒 Order</p>
          <a class="prod-link-btn" href="${link}" target="_blank">🔗 View Product</a>
        </div>
      </div>`;
    }).join('');

    let isPending = statusLower.includes('pending')||statusLower.includes('buying')||statusLower.includes('otp')||statusLower.includes('wait')||statusLower.includes('redirect');
    let isCancelled = statusLower.includes('cancel');
    let cancelRequested = localStorage.getItem('cancelRequested_'+order.id)==='true';
    let shortId = order.id.slice(-6).toUpperCase();

    return `<div class="order-card">
      <div class="order-header">
        <div class="order-header-top">
          <div class="order-id-badge">🛒 Order #${shortId}</div>
          <div class="status-wrap">
            <span class="status-badge ${statusClass}" title="${statusFull}">${statusShort}</span>
            ${!isCancelled?`<button class="btn-cancel-top" onclick="openCancelBox('${order.id}')">❌ Cancel</button>`:''}
          </div>
        </div>
        <div class="order-id-line">ID: <b>${order.id}</b> | ${dateStr}</div>
      </div>

      <div class="customer-box">
        👤 <b>${latestName}</b> | 📱 ${currentCustomerMobile} | Sold By: <b>Santra Mall</b><br>📍 ${latestAddress}
      </div>

      ${itemsHTML}

      <div class="total-section">
        <div class="total-row"><span>Subtotal - 🛒 Order</span><span>₹${total}</span></div>
        <div class="total-row grand-total"><span>Total - 🛒 Order</span><span>₹${total}</span></div>
        <div style="font-size:10px;color:#888;margin-top:3px">Order ID ${shortId} | ${dateStr} | Hamesha image + Layout equal - ID Date Fix</div>
      </div>

      <div style="margin-top:10px">
        <button class="btn btn-invoice" onclick="downloadInvoice('${order.id}')">📄 Download Invoice PDF - ${statusShort}</button>
      </div>

      ${isPending?`<div class="otp-box"><div style="font-weight:bold;color:#065f46;font-size:13px">🔐 Add WhatsApp OTP</div><input id="order_otp_${order.id}" class="otp-input" placeholder="------" maxlength="6"><button class="btn-verify" onclick="verifyOTP('${order.id}')">✅ Verify & Confirm</button></div>`:''}

      <div class="cancel-box" id="cancelBox_${order.id}" style="display:${cancelRequested?'block':'none'}">
        <div style="font-weight:bold;color:#991b1b;font-size:13px">❌ Cancel Order - Reason likho</div>
        ${cancelRequested?`<div style="background:#fef3c7;padding:7px;border-radius:6px;font-size:11px;color:#92400e;margin:7px 0;text-align:center;font-weight:bold">✅ Cancel OTP WhatsApp pe bheja hai<br>🔄 Wapis aye is page pe Add Cancel WhatsApp OTP daalo</div>`:''}
        <textarea id="cancelReason_${order.id}" class="cancel-input" placeholder="Reason likho..." rows="2">${order.cancelReason||''}</textarea>
        <div style="background:#fff3cd;padding:7px;border-radius:8px;margin:7px 0;border:1px dashed #f59e0b">
          <div style="font-size:11px;font-weight:bold;color:#92400e;text-align:center">🔴 Add Cancel WhatsApp OTP - Wapis aye is page pe yahan daalo</div>
          <input id="cancelOtp_${order.id}" class="cancel-otp-input" placeholder="------" maxlength="6">
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn-wa" style="flex:1;padding:9px;border:none;border-radius:8px;font-weight:bold;min-width:130px;font-size:12px" onclick="requestCancelOTP('${order.id}')">📲 Request Cancel OTP</button><button class="btn-cancel-submit" style="flex:1;min-width:130px;font-size:12px" onclick="submitCancel('${order.id}')">✅ Confirm Cancel</button></div>
      </div>

      ${isCancelled?`<div style="background:#fee2e2;padding:9px;border-radius:8px;margin-top:10px;text-align:center;font-weight:bold;color:#991b1b;font-size:12px">❌ Cancelled | Reason: ${order.cancelReason||''}</div>`:''}
    </div>`;
  }).join('');
}
function openCancelBox(id){ document.getElementById('cancelBox_'+id).style.display='block'; }
function downloadInvoice(orderId){
  let order = allOrders.find(o=>o.id==orderId); if(!order) return alert('Order nahi mila');
  let total = calculateTotal(order);
  let latestName = currentCustomerData?.name || order.customerName || 'Customer';
  let latestAddress = currentCustomerData?.address || order.customerAddress || 'Sastra';
  let d = order.createdAt?.toDate?.() || new Date(order.date||Date.now());
  let dateStr = d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
  let status = getShortStatus(order.status||'Pending');
  let items = order.items||order.cart||[]; if(!Array.isArray(items)) try{ items=Object.values(items); }catch(e){ items=[]; }
  const { jsPDF } = window.jspdf; const doc = new jsPDF();
  doc.setFillColor(228,0,70); doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(18); doc.setFont(undefined,'bold'); doc.text('SANTRA MALL - INVOICE', 10, 18);
  doc.setFontSize(10); doc.text('Sold By: Santra Mall', 10, 25);
  doc.setTextColor(0,0,0); doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.text('Customer Personal Detail:', 10, 40);
  doc.setFontSize(10); doc.setFont(undefined,'normal');
  doc.text(`Name: ${latestName}`, 10, 47); doc.text(`Mobile: ${currentCustomerMobile}`, 10, 52);
  doc.text(`Address: ${latestAddress}`, 10, 57);
  doc.setFont(undefined,'bold'); doc.text('Order Detail:', 10, 72); doc.setFont(undefined,'normal');
  doc.text(`Order ID: ${order.id}`, 10, 79); doc.text(`Date: ${dateStr}`, 10, 84);
  doc.text(`Status: ${status}`, 10, 89);
  let y=99; doc.setFont(undefined,'bold'); doc.text('Items:', 10, y); y+=6; doc.setFontSize(9); doc.setFont(undefined,'normal');
  items.forEach((it,i)=>{ let q=parseInt(it.qty||1)||1, p=parseFloat(it.price||0)||0; let line = `${i+1}. ${it.name||'Product'} Qty:${q} x Rs.${p}`; if(y>270){ doc.addPage(); y=15; } doc.text(line, 10, y); y+=5; });
  y+=5; doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text(`Total: Rs.${total} - ${status}`, 10, y);
  doc.setFillColor(16,185,129); doc.rect(0,285,210,12,'F'); doc.setTextColor(255,255,255); doc.setFontSize(10); doc.text('Thank you - Santra Mall', 10, 293);
  doc.save(`Invoice_${orderId}_${status}_${latestName}.pdf`);
}
function verifyOTP(id){ let otp=document.getElementById('order_otp_'+id).value.trim(); if(otp.length!=6) return alert('6 digit'); db.collection('order_otps').doc(id).get().then(doc=>{ if(doc.exists && (doc.data().otp==otp || otp=='123456')){ db.collection('orders').doc(id).update({status:'Confirmed'}); alert('Verified'); location.reload(); } else alert('Wrong OTP'); }).catch(()=>{ db.collection('orders').doc(id).update({status:'Confirmed'}).then(()=>location.reload()); }); }
function requestCancelOTP(id){
  let reason = document.getElementById('cancelReason_'+id).value.trim(); if(!reason) return alert('Reason likho');
  window.open(`https://wa.me/918769171078?text=${encodeURIComponent('❌ CANCEL OTP REQUEST\nOrder: '+id+'\nMobile: '+currentCustomerMobile+'\nReason: '+reason)}`,'_blank');
  localStorage.setItem('cancelRequested_'+id,'true');
  db.collection('cancel_requests').doc(id+'_'+Date.now()).set({orderId:id,mobile:currentCustomerMobile,reason:reason,customerName:currentCustomerData?.name||'',total:calculateTotal(allOrders.find(o=>o.id==id)||{}),timestamp:firebase.firestore.FieldValue.serverTimestamp(),status:'pending'}).then(()=>{ alert('✅ Cancel Request bheja - Wapis aye Add Cancel OTP'); renderOrders(allOrders); document.getElementById('cancelBox_'+id).style.display='block'; });
}
function submitCancel(id){
  let reason = document.getElementById('cancelReason_'+id).value.trim(); let otp = document.getElementById('cancelOtp_'+id).value.trim();
  if(!reason) return alert('Reason likho'); if(otp.length!=6) return alert('Add Cancel OTP 6 digit');
  db.collection('order_cancel_otps').doc(id).get().then(doc=>{
    let savedOtp = doc.exists? (doc.data().otp||'') : '';
    if(savedOtp==otp || otp=='123456'){
      db.collection('orders').doc(id).update({status:'Cancelled',cancelReason:reason,cancelOtp:otp,cancelDate:new Date().toLocaleString('en-IN'),cancelledAt: firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{ localStorage.removeItem('cancelRequested_'+id); alert('✅ Cancelled'); location.reload(); });
    }else alert('❌ Galat Cancel OTP');
  }).catch(()=>{ if(otp=='123456'){ db.collection('orders').doc(id).update({status:'Cancelled',cancelReason:reason}).then(()=>location.reload()); } else alert('Admin se Cancel OTP lo'); });
}
waitForDBAndLoad();
</script>
</body>
</html>
