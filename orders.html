// ✅ NEW UPDATED CODE - HISTORY FOREVER + OTP BOX + STATUS UPDATE
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

let allOrders = [];
let currentCustomerMobile = null;
let currentCustomerData = null;
const ADMIN_WHATSAPP = "918769171078";

document.addEventListener('DOMContentLoaded', function() {
  checkLoginAndLoad();
});

// ✅ 1. Login Check + Header Update
function checkLoginAndLoad() {
  let customer = localStorage.getItem('santra_customer');
  if(customer){
    currentCustomerData = JSON.parse(customer);
    currentCustomerMobile = currentCustomerData.mobile;
    showCustomerInfo();
    
    // ✅ My Profile button show karo
    document.getElementById('profileBtn').classList.remove('hide');
    
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');
    if(orderId) {
      loadSingleOrder(orderId);
    } else {
      loadOrders();
    }
  } else {
    document.getElementById('ordersList').innerHTML = `
      <div class="empty">
        😔 Please login first to see your orders<br><br>
        <button class="btn" onclick="window.location.href='customer-login.html'">🔐 Login with WhatsApp OTP</button>
      </div>
    `;
  }
}

// ✅ 2. Logout - 1 button only
function logoutCustomer() {
  if(confirm('Are you sure you want to logout?')) {
    localStorage.removeItem('santra_customer');
    localStorage.removeItem('pendingOTP');
    auth.signOut().then(() => {
      alert('✅ Logged out successfully!');
      window.location.href = 'customer-login.html';
    });
  }
}

function showCustomerInfo() {
  if(currentCustomerData) {
    document.getElementById('customerInfoBox').innerHTML = `
      <div class="customer-info">
        <p><b>👤 Logged in as:</b> ${currentCustomerData.name}</p>
        <p><b>📱 Mobile:</b> ${currentCustomerData.mobile}</p>
        ${currentCustomerData.email? `<p><b>📧 Email:</b> ${currentCustomerData.email}</p>` : ''}
        ${currentCustomerData.isOldCustomer? `<p><b>🔥 Old Customer:</b> ${currentCustomerData.totalOrders || 0} past orders</p>` : '<p><b>🆕 New Customer</b></p>'}
      </div>
    `;
  }
}

// ✅ 3. FIX: Load All Orders - History Forever + Client-side sort
function loadOrders() {
  try {
    db.collection('orders')
    .where('customerMobile', '==', currentCustomerMobile)
    .onSnapshot((snapshot) => {
        allOrders = [];
        snapshot.forEach(doc => {
          allOrders.push({id: doc.id,...doc.data()});
        });
        // ✅ Client-side sort by orderTime desc - Latest upar, purane neeche
        allOrders.sort((a,b) => {
          let timeA = a.orderTime || a.createdAt?.toMillis() || 0;
          let timeB = b.orderTime || b.createdAt?.toMillis() || 0;
          return timeB - timeA;
        });
        renderOrders(allOrders);
      }, (error) => {
        console.error('Error:', error);
        document.getElementById('ordersList').innerHTML = `<div class="empty">❌ Error loading orders: ${error.message}</div>`;
      });
  } catch(error) {
    console.error('Error:', error);
    document.getElementById('ordersList').innerHTML = `<div class="empty">❌ Error loading orders: ${error.message}</div>`;
  }
}

function buildItemsHTML(items) {
  if(!items ||!Array.isArray(items) || items.length === 0) {
    return '<p style="color:#999">No items found in this order</p>';
  }
  return items.map(item => {
    let imgSrc = item.productImage || item.imageUrl || item.image || item.img || item.photo || '';
    if(!imgSrc && item.productId) {
      imgSrc = `https://firebasestorage.googleapis.com/v0/b/santramarketshoppingmall.appspot.com/o/products%2F${item.productId}.jpg?alt=media`;
    }
    if(!imgSrc) imgSrc = 'https://via.placeholder.com/60x60?text=No+Image';
    let productLink = item.productLink || item.url || item.link || `https://santramarketshoppingmall.firebaseapp.com/product.html?id=${item.productId}`;

    return `
      <div class="item-row">
        <a href="${productLink}" target="_blank">
          <img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/60x60?text=No+Image'" alt="${item.productName}">
        </a>
        <div class="item-details">
          <h4>${item.productName || item.name}</h4>
          <p>Qty: ${item.quantity || item.qty} × ₹${item.unitPrice || item.price} = ₹${(item.quantity || item.qty) * (item.unitPrice || item.price)}</p>
          <p>Code: ${item.productCode || item.productId} | Category: ${item.category || 'General'}</p>
          <p>Series: ${item.seriesNo || item.productCode || 'N/A'}</p>
          <a href="${productLink}" target="_blank" class="item-link">🔗 View Product</a>
        </div>
      </div>
    `;
  }).join('');
}

function renderOrders(orders) {
  let container = document.getElementById('ordersList');
  if(orders.length === 0) {
    container.innerHTML = `
      <div class="empty">
        📦 No orders found<br><br>
        <button class="btn" onclick="window.location.href='index.html'">Start Shopping</button>
      </div>
    `;
    return;
  }

  let totalOrdersCount = orders.length;
  let isOldCustomer = totalOrdersCount > 0;

  container.innerHTML = orders.map(order => {
    // ✅ DATE FIX: IST timezone + correct format
    let orderDate = order.createdAt? order.createdAt.toDate() : new Date(order.orderDate || order.orderTime || Date.now());
    let dateStr = orderDate.toLocaleString('en-IN', {
      day:'2-digit',
      month:'short',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit',
      hour12:true,
      timeZone: 'Asia/Kolkata'
    });

    let orderIdStr = String(order.id);
    let orderNum = order.orderNumber || 'SM' + orderDate.getFullYear() + ('0' + (orderDate.getMonth() + 1)).slice(-2) + orderIdStr.slice(-4);
    let displayName = order.customerName || order.name || order.customer_name || 'Customer';
    
    // ✅ Status check - OTP pending wale ke liye OTP box dikhao
    let statusClass = 'status-' + (order.status || 'pending').toLowerCase().replace(' ', '_');
    let statusText = getStatusText(order.status);
    
    let itemsHTML = buildItemsHTML(order.items || order.cartData);

    // ✅ Address Box
    let addressBox = '';
    if(order.customerLandmark || order.customerPincode || order.customerCity || order.customerState) {
      addressBox = `
        <div class="address-box">
          ${order.customerLandmark? `<p><b>📍 Landmark:</b> ${order.customerLandmark}</p>` : ''}
          ${order.customerPincode? `<p><b>📮 Pincode:</b> ${order.customerPincode}</p>` : ''}
          ${order.customerCity? `<p><b>🏙️ City:</b> ${order.customerCity}</p>` : ''}
          ${order.customerState? `<p><b>🗺️ State:</b> ${order.customerState}</p>` : ''}
        </div>
      `;
    }

    // ✅ OTP Box - order-otp-popup.js se
    let otpBox = renderOTPBoxForMyOrders(order, order.id);

    // ✅ Cancel Button - Only if Pending/Confirmed
    let cancelBtn = '';
    if(order.status === 'Pending' || order.status === 'pending' || order.status === 'Confirmed' || order.status === 'confirmed') {
      cancelBtn = `<button class="btn-cancel" onclick="cancelOrder('${order.id}')">❌ Cancel Order</button>`;
    }

    return `
      <div class="order-card" id="order_${order.id}">
        <div class="order-header">
          <div>
            <span class="order-num">#${orderNum}</span>
            ${isOldCustomer? '<span class="badge-old">🔥 OLD CUSTOMER</span>' : '<span class="badge-new">🆕 NEW</span>'}
            <div class="order-id" style="margin-top:5px">Order ID: <b>${order.orderId || order.id}</b></div>
            <p class="date-text">📅 ${dateStr}</p>
          </div>
          <span class="status-badge ${statusClass}">${statusText}</span>
        </div>
        <div class="order-info">
          <div class="info-row"><span>Order Date:</span><span>${dateStr}</span></div>
          <div class="info-row"><span>Customer:</span><span>${displayName}</span></div>
          <div class="info-row"><span>Mobile:</span><span>${order.mobile || order.customerMobile}</span></div>
          ${order.email? `<div class="info-row"><span>Email:</span><span>${order.email}</span></div>` : ''}
          <div class="info-row"><span>Payment:</span><span>${order.paymentMode || 'COD'}</span></div>
          <div class="info-row"><span>Delivery Address:</span><span style="text-align:right;max-width:60%">${order.customerAddress || order.address}</span></div>
        </div>
        ${addressBox}
        ${order.customerMessage? `<div class="msg-box"><b>💬 Your Message:</b><br>${order.customerMessage}</div>` : ''}
        <p class="date-text">🔗 Source: ${order.source || 'Website'} ${order.referenceLink? `| <a href="${order.referenceLink}" target="_blank">View Page</a>` : ''}</p>
        <div class="items-list">
          <h4 style="margin-bottom:10px;font-size:14px">📦 Order Items (${order.items? order.items.length : Object.keys(order.cartData || {}).length})</h4>
          ${itemsHTML}
        </div>
        <div class="total-section">
          <div class="total-row"><span>Subtotal:</span><span>₹${order.subtotal || order.total}</span></div>
          <div class="total-row"><span>Delivery:</span><span style="color:#10b981">${order.delivery === 0? 'FREE' : '₹' + (order.delivery || 0)}</span></div>
          <div class="total-row grand-total"><span>Total Amount:</span><span>₹${order.totalAmount || order.total}</span></div>
        </div>
        ${getTimeline(order.status)}
        ${otpBox}
        ${cancelBtn}
        <button class="btn" style="background:var(--blue)" onclick="downloadInvoice('${order.id}')">📄 Download Invoice</button>
      </div>
    `;
  }).join('');
}

function getStatusText(status) {
  const statusMap = {
    'pending_otp': '⏳ OTP Pending',
    'otp_pending': '⏳ OTP Pending',
    'pending': '⏳ Pending',
    'Pending': '⏳ Pending',
    'PENDING': '⏳ Pending',
    'OTP Pending': '⏳ OTP Pending',
    'confirmed': '✅ Confirmed',
    'Confirmed': '✅ Confirmed',
    'shipped': '🚚 Shipped',
    'Shipped': '🚚 Shipped',
    'delivered': '📦 Delivered',
    'Delivered': '📦 Delivered',
    'cancelled': '❌ Cancelled',
    'Cancelled': '❌ Cancelled',
    'buying': '🛒 Buying'
  };
  return statusMap[status] || status;
}

function getTimeline(status) {
  const steps = [
    {key: 'pending', label: 'Order Placed', desc: 'Waiting for confirmation'},
    {key: 'confirmed', label: 'Confirmed', desc: 'Order confirmed by admin'},
    {key: 'shipped', label: 'Shipped', desc: 'Out for delivery'},
    {key: 'delivered', label: 'Delivered', desc: 'Order delivered successfully'}
  ];
  let checkStatus = status ? status.toLowerCase() : 'pending';
  if(checkStatus === 'pending' || checkStatus === 'otp pending' || checkStatus === 'otp_pending') checkStatus = 'pending';
  if(checkStatus === 'buying') checkStatus = 'confirmed';
  const currentIndex = steps.findIndex(s => s.key === checkStatus);
  return `
    <div class="timeline">
      <h4 style="margin-bottom:15px;font-size:14px">📍 Order Timeline</h4>
      ${steps.map((step, idx) => {
        let dotClass = '';
        if(idx < currentIndex) dotClass = 'done';
        else if(idx === currentIndex) dotClass = 'current';
        let icon = idx < currentIndex? '✓' : (idx === currentIndex? '•' : '');
        return `
          <div class="timeline-item ${idx <= currentIndex? 'active' : ''}">
            <div class="timeline-dot ${dotClass}">${icon}</div>
            <div class="timeline-content">
              <h4>${step.label}</h4>
              <p>${step.desc}</p>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// ✅ NEW: Order OTP Verify - History Save + Status Update
function verifyOrderOTP(orderId) {
  const otpInput = document.getElementById('order_otp_' + orderId);
  
  if(!otpInput) {
    alert('❌ OTP input not found!');
    return;
  }
  
  const enteredOTP = otpInput.value.trim();
  
  if(enteredOTP.length !== 6) {
    alert('❌ 6 digit OTP daalo!');
    return;
  }
  
  // ✅ Firebase se OTP check karo
  db.collection('order_otp').doc(orderId).get().then((doc) => {
    if(!doc.exists) {
      alert('❌ OTP not found! Admin se contact karo');
      return;
    }
    
    const data = doc.data();
    const savedOTP = data.otp;
    const adminVerified = data.adminVerified;
    
    // ✅ Admin Verified OTP = Always Valid
    if(adminVerified && savedOTP === enteredOTP) {
      // ✅ Order status update karo - HISTORY SAVE RAHEGI
      db.collection('orders').doc(orderId).update({
        status: 'confirmed',
        otpVerified: true,
        verifiedTime: firebase.firestore.FieldValue.serverTimestamp(),
        verifiedTimeStamp: Date.now()
      }).then(() => {
        // ✅ Order OTP status bhi update karo
        db.collection('order_otp').doc(orderId).update({
          status: 'verified',
          verifiedBy: 'customer',
          verifiedTime: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        alert('✅ Order Confirmed Successfully!\n\nAb aapka order process hoga.\n\nOrder history me save ho gaya hai.');
        loadOrders(); // Refresh - Ab OTP box hat jayega, Confirmed badge aayega
      });
    } else if(savedOTP === enteredOTP) {
      // Normal OTP check
      db.collection('orders').doc(orderId).update({
        status: 'confirmed',
        otpVerified: true,
        verifiedTime: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert('✅ Order Confirmed!');
        loadOrders();
      });
    } else {
      alert('❌ Wrong OTP!\n\nWhatsApp pe check karo ya Admin se contact karo');
    }
  }).catch((err) => {
    alert('❌ Error: ' + err.message);
  });
}

// ✅ Cancel Order Function
async function cancelOrder(orderId) {
  if(!confirm('Are you sure you want to cancel this order?')) return;
  try {
    await db.collection('orders').doc(orderId).update({
      status: 'Cancelled',
      cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
      cancelledBy: 'customer'
    });
    alert('✅ Order Cancelled Successfully!');
  } catch(error) {
    alert('❌ Error: ' + error.message);
  }
}

function downloadInvoice(orderId) {
  alert('📄 Invoice download will be available soon!\n\nOrder ID: ' + orderId);
}

function filterOrders() {
  const searchTerm = document.getElementById('searchOrder').value.toLowerCase().trim();
  if(!searchTerm) {
    renderOrders(allOrders);
    return;
  }
  const filtered = allOrders.filter(order =>
    (order.orderId && String(order.orderId).toLowerCase().includes(searchTerm)) ||
    (order.mobile && order.mobile.includes(searchTerm)) ||
    (order.customerMobile && order.customerMobile.includes(searchTerm)) ||
    (order.orderNumber && String(order.orderNumber).toLowerCase().includes(searchTerm)) ||
    (order.customerName && order.customerName.toLowerCase().includes(searchTerm)) ||
    (order.name && order.name.toLowerCase().includes(searchTerm)) ||
    (order.id && String(order.id).toLowerCase().includes(searchTerm))
  );
  renderOrders(filtered);
}

// ✅ Page load pe orders load karo
window.onload = function() {
  loadOrders();
}
</script>
