<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:transparent;padding:25px;min-height:500px}
.card-title{color:#e40046;font-size:18px;margin-bottom:15px;text-align:center;font-weight:bold;border-bottom:2px solid #e40046;padding-bottom:10px}
.form-group{margin-bottom:15px}
.form-group label{font-weight:bold;color:#333;font-size:14px;display:block;margin-bottom:5px}
.form-group input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px;text-align:center}
.btn-request{width:100%;padding:12px;background:#25D366;color:white;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
.btn-request:disabled{background:#ccc}
.toast{position:fixed;top:20px;right:20px;background:#4caf50;color:white;padding:12px 18px;border-radius:8px;display:none;z-index:9999}
.toast.show{display:block}
.toast.error{background:#f44336}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center}
.modal-box{background:white;padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center;max-height:90vh;overflow-y:auto}
.modal-box h3{color:#e40046;margin-bottom:10px}
.modal-box p{font-size:13px;color:#666;margin-bottom:15px}
.modal-box input,.modal-box textarea{width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:14px;margin:6px 0;text-align:left}
.modal-box textarea{resize:none}
.btn-verify{width:100%;padding:12px;background:#3b82f6;color:white;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px}
.btn-cancel{width:100%;padding:10px;background:#ccc;color:#333;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;margin-top:8px}
#loginSuccess{display:none;text-align:center;padding:20px;color:#10b981;font-weight:bold}
</style>
</head>
<body>

<div class="card-title">📱 Customer Login</div>
<div id="loginForm">
<div class="form-group">
<label>WhatsApp Mobile Number *</label>
<input type="tel" id="loginMobile" placeholder="10 digit mobile" maxlength="10">
</div>
<button class="btn-request" id="requestOtpBtn">📲 Request OTP on WhatsApp</button>
<p style="font-size:12px;color:#666;text-align:center;margin-top:10px">Admin aapko WhatsApp pe OTP bhejega</p>
</div>

<div id="loginSuccess">
<div style="font-size:40px">✅</div>
<div>Login Successful!</div>
<div id="loginNumber" style="margin-top:10px;color:#333"></div>
<button class="btn-cancel" id="logoutBtn" style="margin-top:15px;background:#ef4444;color:white">🚪 Logout</button>
</div>

<div class="modal" id="profileModal">
<div class="modal-box">
<h3>📝 Profile Detail Bharo</h3>
<p>OTP request ke liye ye detail jaruri hai</p>
<input type="text" id="popupName" placeholder="Full Name *" required>
<input type="email" id="popupEmail" placeholder="Email (Optional)">
<input type="tel" id="popupDeliveryMobile" placeholder="Delivery Mobile *" maxlength="10" required>
<textarea id="popupLocation" placeholder="Full Address *" rows="2" required></textarea>
<button class="btn-verify" id="sendRequestBtn">💾 Save & Request OTP</button>
<button class="btn-cancel" id="cancelProfileBtn">Cancel</button>
</div>
</div>

<div class="modal" id="otpModal">
<div class="modal-box">
<h3>🔐 Enter OTP</h3>
<p>Admin ne aapke WhatsApp pe 6 digit OTP bheja hai</p>
<input type="tel" id="otpInput" placeholder="------" maxlength="6" style="letter-spacing:8px;text-align:center;font-size:18px">
<button class="btn-verify" id="verifyOtpBtn">✅ Verify OTP</button>
<button class="btn-cancel" id="cancelOtpBtn">Cancel</button>
<button class="btn-cancel" id="resendOtpBtn" style="background:#f59e0b;color:white">🔄 Resend Request</button>
<p style="font-size:11px;color:#999;margin-top:10px">OTP 4 hours me expire hoga</p>
</div>
</div>

<div class="toast" id="toast"></div>

<script src="constants.js?v=1"></script>
<script src="config.js?v=6"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
/*
⚠️ OLD CODE BACKUP - 14 JULY 2026 SE PEHLE WALA - SAFE HIDE
const firebaseConfig = { apiKey: "AIzaSyApX...", ... };
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ADMIN_WHATSAPP = "918769171078"; 
const CUSTOMER_KEY = "santra_customer";
... purana saveProfileAndRequest wala code ...
OLD CODE BACKUP END
*/

// ✅ NAYA CODE: 15 JULY 2026 - PERMISSION ERROR FIX + LOCAL FALLBACK
const firebaseConfig = window.firebaseConfig || {
 apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
 authDomain: "santramarketshoppingmall.firebaseapp.com",
 projectId: "santramarketshoppingmall",
 storageBucket: "santramarketshoppingmall.firebasestorage.app",
 messagingSenderId: "398490252924",
 appId: "1:398490252924:web:d1b6348b549183b93b7bf9"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ADMIN_WHATSAPP = window.ADMIN_WHATSAPP || "918769171078";
const CUSTOMER_KEY = window.CUSTOMER_KEY || "santra_customer";

window.addEventListener('load', function() {
    checkLoginStatus();
    document.getElementById('requestOtpBtn').addEventListener('click', openProfilePopup);
    document.getElementById('sendRequestBtn').addEventListener('click', saveProfileAndRequest);
    document.getElementById('cancelProfileBtn').addEventListener('click', () => {
        document.getElementById('profileModal').style.display = 'none';
    });
    document.getElementById('verifyOtpBtn').addEventListener('click', verifyOtp);
    document.getElementById('cancelOtpBtn').addEventListener('click', () => {
        document.getElementById('otpModal').style.display = 'none';
    });
    document.getElementById('resendOtpBtn').addEventListener('click', resendRequest);
    document.getElementById('logoutBtn').addEventListener('click', logout);
});

function checkLoginStatus() {
    const mobile = localStorage.getItem(CUSTOMER_KEY + '_whatsapp_mobile');
    if (mobile) showLoginSuccess(mobile);
}

function openProfilePopup() {
    const mobile = document.getElementById('loginMobile').value.trim();
    if (!mobile || mobile.length !== 10) return showToast('❌ 10 digit mobile daalo!', true);
    localStorage.setItem(CUSTOMER_KEY + '_login_mobile', mobile);
    document.getElementById('popupDeliveryMobile').value = mobile;
    document.getElementById('profileModal').style.display = 'flex';
}

function saveProfileAndRequest() {
    const whatsappMobile = document.getElementById('loginMobile').value.trim();
    const name = document.getElementById('popupName').value.trim();
    const email = document.getElementById('popupEmail').value.trim();
    const deliveryMobile = document.getElementById('popupDeliveryMobile').value.trim();
    const location = document.getElementById('popupLocation').value.trim();
    
    if (!name) return showToast('❌ Name daalo!', true);
    if (!deliveryMobile || deliveryMobile.length !== 10) return showToast('❌ Delivery Mobile daalo!', true);
    if (!location) return showToast('❌ Address daalo!', true);
    
    const btn = document.getElementById('sendRequestBtn');
    btn.disabled = true;
    btn.innerText = '⏳ Saving...';
    
    const profileData = {
        name: name,
        loginMobile: whatsappMobile,
        mobile: deliveryMobile,
        email: email,
        location: location,
        photo: '',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    // ✅ LOCAL me bhi save karo - Firebase fail bhi ho to kaam chalega
    localStorage.setItem('temp_profile_' + whatsappMobile, JSON.stringify(profileData));

    db.collection('customers').doc(whatsappMobile).set(profileData, { merge: true }).then(() => {
        afterProfileSaved(whatsappMobile, profileData, btn);
    }).catch(err => {
        console.error("Firebase error:", err);
        // ✅ Agar permission error bhi aaye to bhi aage badho - Local se kaam chalao
        if(err.code === 'permission-denied' || err.message.includes('permissions')){
          showToast('⚠️ Firebase Rule pending hai - Local se request bhej raha hu', false);
          afterProfileSaved(whatsappMobile, profileData, btn);
        } else {
          showToast('❌ Error: ' + err.message, true);
          btn.disabled = false;
          btn.innerText = '💾 Save & Request OTP';
        }
    });
}

function afterProfileSaved(whatsappMobile, profileData, btn){
    document.getElementById('profileModal').style.display = 'none';
    const requestId = whatsappMobile + '_' + Date.now();
    db.collection('login_requests').doc(requestId).set({
        mobile: whatsappMobile,
        profile: profileData,
        status: 'pending',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
        sendRequestToAdmin(whatsappMobile, profileData);
        btn.disabled = false;
        btn.innerText = '💾 Save & Request OTP';
    }).catch(()=>{
        // Request fail bhi ho to WhatsApp to khulega hi
        sendRequestToAdmin(whatsappMobile, profileData);
        btn.disabled = false;
        btn.innerText = '💾 Save & Request OTP';
    });
}

function sendRequestToAdmin(mobile, profileData) {
    const btn = document.getElementById('requestOtpBtn');
    btn.disabled = true;
    btn.innerText = '⏳ Request Bheja Ja Raha...';
    let message = `🔐 *LOGIN OTP REQUEST*\n\nCustomer Mobile: ${mobile}\nTime: ${new Date().toLocaleString('en-IN')}\n\n*Profile:*\nName: ${profileData.name}\nEmail: ${profileData.email || 'N/A'}\nDelivery: ${profileData.mobile}\nAddress: ${profileData.location}\n\nKripya OTP bheje.`;
    const waLink = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(message)}`;
    window.open(waLink, '_blank');
    showToast('✅ Admin ko request bhej di!');
    setTimeout(() => {
        document.getElementById('otpModal').style.display = 'flex';
        btn.disabled = false;
        btn.innerText = '📲 Request OTP on WhatsApp';
    }, 1500);
}

function resendRequest(){ /* same as before */ 
    const mobile = localStorage.getItem(CUSTOMER_KEY + '_login_mobile');
    if (!mobile) return;
    let p = localStorage.getItem('temp_profile_' + mobile);
    if(p) sendRequestToAdmin(mobile, JSON.parse(p));
}

function verifyOtp() {
    const mobile = document.getElementById('loginMobile').value.trim();
    const otp = document.getElementById('otpInput').value.trim();
    if (!otp || otp.length !== 6) return showToast('❌ 6 digit OTP daalo!', true);
    const btn = document.getElementById('verifyOtpBtn');
    btn.disabled = true;
    btn.innerText = '⏳ Verifying...';
    db.collection('login_otps').doc(mobile).get({source: 'server'}).then(doc => {
        if (!doc.exists) { showToast('❌ OTP nahi mila! Admin se contact karo', true); btn.disabled=false; btn.innerText='✅ Verify OTP'; return; }
        const data = doc.data();
        const savedOtp = data.otp;
        const otpTime = data.timestamp.toDate();
        const now = new Date();
        const diffHours = (now - otpTime) / 1000 / 60 / 60;
        if (diffHours > 4) { showToast('❌ OTP expire! Resend dabao', true); btn.disabled=false; btn.innerText='✅ Verify OTP'; return; }
        if (otp === savedOtp) {
            localStorage.setItem(CUSTOMER_KEY + '_whatsapp_mobile', mobile);
            localStorage.setItem(CUSTOMER_KEY + '_customer_mobile', mobile);
            localStorage.removeItem(CUSTOMER_KEY + '_login_mobile');
            document.getElementById('otpModal').style.display = 'none';
            showLoginSuccess(mobile);
            showToast('✅ Login Successful!');
            window.parent.postMessage({type: 'loginSuccess'}, '*');
        } else { showToast('❌ Galat OTP!', true); }
        btn.disabled = false; btn.innerText = '✅ Verify OTP'; document.getElementById('otpInput').value = '';
    }).catch(err => { showToast('❌ Error: ' + err.message, true); btn.disabled=false; btn.innerText='✅ Verify OTP'; });
}

function showLoginSuccess(mobile) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('loginSuccess').style.display = 'block';
    document.getElementById('loginNumber').innerText = `Mobile: ${mobile}`;
}
function logout() {
    localStorage.removeItem(CUSTOMER_KEY + '_whatsapp_mobile');
    localStorage.removeItem(CUSTOMER_KEY + '_customer_mobile');
    location.reload();
}
function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.classList.add('show');
    if (isError) toast.classList.add('error');
    setTimeout(() => { toast.classList.remove('show'); toast.classList.remove('error'); }, 3000);
}
</script>
</body>
</html>
