<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Customer Login - SANTRA MALL</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#f1f3f6;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .login-box{background:white;padding:30px;border-radius:15px;box-shadow:0 5px 30px rgba(0,0,0,0.2);width:100%;max-width:400px}
    .login-box h2{color:#e40046;text-align:center;margin-bottom:25px}
    .login-box input{width:100%;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:8px;font-size:16px}
    .login-box input:focus{border-color:#e40046;outline:none}
    .btn{width:100%;padding:15px;background:#25D366;color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
    .btn:active{transform:scale(0.98)}
    .info{background:#e8f5e9;padding:12px;border-radius:8px;margin:15px 0;font-size:13px;color:#2e7d32;border-left:4px solid #4caf50}
    .back{text-align:center;margin-top:15px}
    .back a{color:#666;text-decoration:none}
  </style>
</head>
<body>

<div class="login-box">
  <h2>🛒 SANTRA MALL Login</h2>
  
  <div class="info">
    <b>📱 WhatsApp OTP Login</b><br>
    Step 1: Apne WhatsApp se Admin ko message bhejo<br>
    Step 2: Admin OTP WhatsApp pe bhejega<br>
    Step 3: OTP website pe daalo
  </div>

  <input type="text" id="custName" placeholder="Full Name *" required>
  <input type="tel" id="custMobile" placeholder="Apna WhatsApp Number *" maxlength="10" required>
  <input type="email" id="custEmail" placeholder="Email (Optional)">
  
  <button class="btn" onclick="sendOTPRequest()">📲 Admin Ko WhatsApp Karo</button>
  
  <div class="back">
    <a href="index.html">← Back to Home</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="secrets.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ADMIN_WHATSAPP = "917725960293"; // ✅ Tera number

function sendOTPRequest() {
  const name = document.getElementById('custName').value.trim();
  const mobile = document.getElementById('custMobile').value.trim();
  const email = document.getElementById('custEmail').value.trim();
  
  if (!name || mobile.length !== 10) {
    alert('❌ Name aur 10 digit mobile required hai!');
    return;
  }
  
  // ✅ 1. Firebase me request save karo
  db.collection('login_requests').doc(mobile).set({
    name: name,
    mobile: mobile,
    email: email,
    otp: '', // Admin bharenga
    status: 'pending',
    requestedAt: new Date().toLocaleString('en-IN'),
    requestedTime: Date.now()
  });
  
  // ✅ 2. LocalStorage me save karo
  localStorage.setItem('pendingOTP', JSON.stringify({
    name: name,
    mobile: mobile,
    email: email,
    time: Date.now()
  }));
  
  // ✅ 3. Customer ke WhatsApp se Admin ko message
  let msg = `🔐 *LOGIN OTP REQUEST - SANTRA MALL*\n\n👤 Name: ${name}\n📱 My Number: ${mobile}\n${email ? '📧 Email: ' + email : ''}\n\n⚡ *Admin:* Please reply with 6-digit OTP on this WhatsApp number.\n\nMain index.html pe "Verify OTP" button dabake wait kar raha hun.`;
  
  window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
  
  // ✅ 4. Home page pe bhejo
  alert('✅ WhatsApp khul gaya!\n\nAdmin ko message send karo.\n\nAdmin 2-5 min me isi WhatsApp pe OTP bhejega.\nFir Home page pe "🔐 Verify OTP" dabake OTP daalna.');
  window.location.href = 'index.html';
}

// Agar pehle se pendingOTP hai to direct home bhej do
window.onload = function() {
  let pending = localStorage.getItem('pendingOTP');
  if(pending) {
    pending = JSON.parse(pending);
    if(Date.now() - pending.time < 60 * 60 * 1000) { // ✅ 60 min
      if(confirm('✅ Aapki OTP request active hai!\n\nAdmin ne WhatsApp pe OTP bhej diya?\n\nHome page pe "Verify OTP" se daalo.\n\nHome page pe jana hai?')) {
        window.location.href = 'index.html';
      }
    } else {
      localStorage.removeItem('pendingOTP');
    }
  }
}
</script>
</body>
</html>
