<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:transparent;padding:25px;min-height:500px}
.card-title{color:#e40046;font-size:18px;margin-bottom:15px;text-align:center;font-weight:bold;border-bottom:2px solid #e40046;padding-bottom:10px}
.form-group{margin-bottom:15px}
.form-group label{font-weight:bold;color:#333;font-size:14px;display:block;margin-bottom:5px}
.form-group input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px;text-align:center}
.btn-request{width:100%;padding:12px;background:#25D366;color:white;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
.btn-request:active{background:#128C7E}
.toast{position:fixed;top:20px;right:20px;background:#4caf50;color:white;padding:12px 18px;border-radius:8px;display:none;z-index:9999}
.toast.show{display:block}
.toast.error{background:#f44336}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center}
.modal-box{background:white;padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center}
.modal-box h3{color:#e40046;margin-bottom:10px}
.modal-box input,.modal-box textarea{width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:14px;margin:6px 0;text-align:left}
.btn-verify{width:100%;padding:12px;background:#3b82f6;color:white;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px}
.btn-cancel{width:100%;padding:10px;background:#ccc;color:#333;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;margin-top:8px}
#loginSuccess{display:none;text-align:center;padding:20px;color:#10b981;font-weight:bold}
</style>
</head>
<body>

<div class="card-title">📱 Customer Login</div>
<div id="loginForm">
<div class="form-group">
<label>WhatsApp Mobile Number *</label>
<input type="tel" id="loginMobile" placeholder="10 digit mobile" maxlength="10">
</div>
<button class="btn-request" id="requestOtpBtn" type="button">📲 Request OTP on WhatsApp</button>
<p style="font-size:12px;color:#666;text-align:center;margin-top:10px">Admin aapko WhatsApp pe OTP bhejega</p>
</div>

<div id="loginSuccess">
<div style="font-size:40px">✅</div>
<div>Login Successful!</div>
<div id="loginNumber" style="margin-top:10px;color:#333"></div>
<button class="btn-cancel" id="logoutBtn" type="button" style="margin-top:15px;background:#ef4444;color:white">🚪 Logout</button>
</div>

<div class="modal" id="profileModal">
<div class="modal-box">
<h3>📝 Profile Detail Bharo</h3>
<p style="font-size:13px;color:#666;margin-bottom:10px">OTP request ke liye ye detail jaruri hai</p>
<input type="text" id="popupName" placeholder="Full Name *" required>
<input type="email" id="popupEmail" placeholder="Email (Optional)">
<input type="tel" id="popupDeliveryMobile" placeholder="Delivery Mobile *" maxlength="10" required>
<textarea id="popupLocation" placeholder="Full Address *" rows="2" required></textarea>
<button class="btn-verify" id="sendRequestBtn" type="button">💾 Save & Request OTP</button>
<button class="btn-cancel" id="cancelProfileBtn" type="button">Cancel</button>
</div>
</div>

<div class="modal" id="otpModal">
<div class="modal-box">
<h3>🔐 Enter OTP</h3>
<p style="font-size:13px;color:#666;margin-bottom:10px">Admin ne WhatsApp pe OTP bheja hai</p>
<input type="tel" id="otpInput" placeholder="------" maxlength="6" style="letter-spacing:8px;text-align:center;font-size:18px">
<button class="btn-verify" id="verifyOtpBtn" type="button">✅ Verify OTP</button>
<button class="btn-cancel" id="cancelOtpBtn" type="button">Cancel</button>
<button class="btn-cancel" id="resendOtpBtn" type="button" style="background:#f59e0b;color:white">🔄 Resend Request</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script src="constants.js?v=3"></script>
<script src="config.js?v=8"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="time-fix.js"></script>
<script>
// Bas ye 1 line kahi bhi add karo - Sahi IST Time mil jayega
let t = getISTNow();
console.log(t.presentTime, t.presentDate, t.istDateKey, t.dateTimeIST);
// Output: 07:27 pm, 17/7/2026, 2026-07-17, 17/7/2026, 7:27:53 pm
</script>
<script src="time-fix.html"></script>

<script>
// ✅ TERA constants.js + config.js FOLLOW - No duplicate
if(typeof window.CUSTOMER_KEY === 'undefined'){ window.CUSTOMER_KEY = "santra_customer"; }
if(typeof window.ADMIN_WHATSAPP === 'undefined'){ window.ADMIN_WHATSAPP = "918769171078"; }
if(typeof window.COLLECTIONS === 'undefined'){ window.COLLECTIONS = { CUSTOMERS: 'customers', LOGIN_REQUESTS: 'login_requests', LOGIN_OTPS: 'login_otps' }; }
if(typeof window.firebaseConfig === 'undefined'){
  window.firebaseConfig = {
    apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
    authDomain: "santramarketshoppingmall.firebaseapp.com",
    projectId: "santramarketshoppingmall",
    storageBucket: "santramarketshoppingmall.appspot.com",
    messagingSenderId: "398490252924",
    appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
    measurementId: "G-ZW1ZR8HETY",// ← Comma zaroori hai
    databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com/" // ← Last me / nahi lagana
  };
}
try{
  if(typeof window.initFirebaseOnce === 'function'){
    window.initFirebaseOnce(window.firebaseConfig);
  } else if(!firebase.apps.length){
    firebase.initializeApp(window.firebaseConfig);
  }
}catch(e){ console.log("Firebase:", e.message); }

const db = window.db || firebase.firestore();
const CUSTOMER_KEY = window.CUSTOMER_KEY;
const ADMIN_WHATSAPP = window.ADMIN_WHATSAPP || window.SANTRA?.ADMIN?.WHATSAPP || "918769171078";
const COLLECTIONS = window.COLLECTIONS;

console.log("✅ Login - CART_KEY:", window.CART_KEY, "BASE_URL:", window.BASE_URL);

document.addEventListener('DOMContentLoaded', function(){
    checkLoginStatus();
    document.getElementById('requestOtpBtn').onclick = openProfilePopup;
    document.getElementById('sendRequestBtn').onclick = saveProfileAndRequest;
    document.getElementById('cancelProfileBtn').onclick = ()=> document.getElementById('profileModal').style.display='none';
    document.getElementById('verifyOtpBtn').onclick = verifyOtp;
    document.getElementById('cancelOtpBtn').onclick = ()=> document.getElementById('otpModal').style.display='none';
    document.getElementById('resendOtpBtn').onclick = resendRequest;
    document.getElementById('logoutBtn').onclick = logout;
});

function checkLoginStatus() {
    const mobile = localStorage.getItem(CUSTOMER_KEY + '_whatsapp_mobile') || localStorage.getItem('santra_whatsapp_mobile');
    const loginMobile = localStorage.getItem(CUSTOMER_KEY + '_login_mobile');
    if (mobile) {
        showLoginSuccess(mobile);
    } else if (loginMobile) {
        document.getElementById('loginMobile').value = loginMobile;
        document.getElementById('otpModal').style.display = 'flex';
    }
}

function openProfilePopup() {
    const mobile = document.getElementById('loginMobile').value.trim();
    if (!mobile || mobile.length !== 10) return showToast('❌ 10 digit mobile daalo!', true);
    localStorage.setItem(CUSTOMER_KEY + '_login_mobile', mobile);
    document.getElementById('popupDeliveryMobile').value = mobile;
    db.collection(COLLECTIONS.CUSTOMERS).doc(mobile).get().then(doc=>{
        if(doc.exists){
            const d = doc.data();
            document.getElementById('popupName').value = d.name || '';
            document.getElementById('popupEmail').value = d.email || '';
            document.getElementById('popupLocation').value = d.location || d.address || '';
        }
    });
    document.getElementById('profileModal').style.display = 'flex';
}

function saveProfileAndRequest() {
    const whatsappMobile = document.getElementById('loginMobile').value.trim();
    const name = document.getElementById('popupName').value.trim();
    const email = document.getElementById('popupEmail').value.trim();
    const deliveryMobile = document.getElementById('popupDeliveryMobile').value.trim();
    const location = document.getElementById('popupLocation').value.trim();
    if (!name) return showToast('❌ Name daalo!', true);
    if (!deliveryMobile || deliveryMobile.length !== 10) return showToast('❌ 10 digit Delivery Mobile!', true);
    if (!location) return showToast('❌ Address daalo!', true);
    const btn = document.getElementById('sendRequestBtn');
    btn.disabled = true; btn.innerText = '⏳ Saving...';
    const profileData = {
        name, loginMobile: whatsappMobile, mobile: deliveryMobile, email, location,
        photo: '', updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    db.collection(COLLECTIONS.CUSTOMERS).doc(whatsappMobile).set(profileData, { merge: true }).then(() => {
        document.getElementById('profileModal').style.display = 'none';
        const requestId = whatsappMobile + '_' + Date.now();
        return db.collection(COLLECTIONS.LOGIN_REQUESTS).doc(requestId).set({
            mobile: whatsappMobile, profile: profileData, status: 'pending',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
    }).then(() => {
        sendRequestToAdmin(whatsappMobile, {name, email, mobile: deliveryMobile, location});
        btn.disabled = false; btn.innerText = '💾 Save & Request OTP';
    }).catch(err => {
        showToast('❌ '+err.message, true);
        btn.disabled = false; btn.innerText = '💾 Save & Request OTP';
    });
}

function sendRequestToAdmin(mobile, profileData) {
    const btn = document.getElementById('requestOtpBtn');
    btn.disabled = true; btn.innerText = '⏳ Request Bheja...';
    let message = `🔐 *LOGIN OTP REQUEST*\n\nMobile: ${mobile}\nName: ${profileData.name}\nDelivery: ${profileData.mobile}\nAddress: ${profileData.location}`;
    const waLink = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(message)}`;
    window.open(waLink, '_blank');
    showToast('✅ Admin ko request bhej di!');
    setTimeout(() => {
        document.getElementById('otpModal').style.display = 'flex';
        btn.disabled = false; btn.innerText = '📲 Request OTP on WhatsApp';
    }, 1000);
}

function resendRequest() {
    const mobile = localStorage.getItem(CUSTOMER_KEY + '_login_mobile');
    if (!mobile) return;
    db.collection(COLLECTIONS.CUSTOMERS).doc(mobile).get().then(doc => {
        if (doc.exists) {
            const requestId = mobile + '_' + Date.now();
            return db.collection(COLLECTIONS.LOGIN_REQUESTS).doc(requestId).set({
                mobile, profile: doc.data(), status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(()=> sendRequestToAdmin(mobile, doc.data()));
        }
    });
}

function verifyOtp() {
    const mobile = document.getElementById('loginMobile').value.trim() || localStorage.getItem(CUSTOMER_KEY+'_login_mobile');
    const otp = document.getElementById('otpInput').value.trim();
    if (!otp || otp.length !== 6) return showToast('❌ 6 digit OTP!', true);
    const btn = document.getElementById('verifyOtpBtn');
    btn.disabled = true; btn.innerText = '⏳ Verifying...';
    db.collection(COLLECTIONS.LOGIN_OTPS).doc(mobile).get().then(doc => {
        if (!doc.exists) {
            showToast('❌ OTP nahi mila! Admin se bolo', true);
            btn.disabled = false; btn.innerText = '✅ Verify OTP'; return;
        }
        const data = doc.data();
        const diffHours = (new Date() - data.timestamp.toDate()) / 1000 / 60 / 60;
        if (diffHours > 4) {
            showToast('❌ OTP expire! Resend karo', true);
            btn.disabled = false; btn.innerText = '✅ Verify OTP'; return;
        }
        if (otp === data.otp) {
            localStorage.setItem(CUSTOMER_KEY + '_whatsapp_mobile', mobile);
            localStorage.setItem(CUSTOMER_KEY + '_customer_mobile', data.mobile || mobile);
            localStorage.setItem('santra_whatsapp_mobile', mobile);
            localStorage.removeItem(CUSTOMER_KEY + '_login_mobile');
            document.getElementById('otpModal').style.display = 'none';
            showLoginSuccess(mobile);
            showToast('✅ Login Successful!');
            window.parent.postMessage({type: 'loginSuccess', mobile: mobile}, '*');
        } else {
            showToast('❌ Galat OTP!', true);
        }
        btn.disabled = false; btn.innerText = '✅ Verify OTP';
        document.getElementById('otpInput').value = '';
    }).catch(err => {
        showToast('❌ '+err.message, true);
        btn.disabled = false; btn.innerText = '✅ Verify OTP';
    });
}

function showLoginSuccess(mobile) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('loginSuccess').style.display = 'block';
    document.getElementById('loginNumber').innerText = `Mobile: ${mobile}`;
    setTimeout(() => {
        window.parent.postMessage({type: 'resizeIframe', height: document.body.scrollHeight, iframeId: 'loginFrame'}, '*');
    }, 100);
}

function logout() {
    localStorage.removeItem(CUSTOMER_KEY + '_whatsapp_mobile');
    localStorage.removeItem(CUSTOMER_KEY + '_customer_mobile');
    localStorage.removeItem(CUSTOMER_KEY + '_login_mobile');
    localStorage.removeItem('santra_whatsapp_mobile');
    localStorage.setItem(CUSTOMER_KEY + '_logout_signal', Date.now());
    window.parent.postMessage({type: 'logout'}, '*');
    location.reload();
}

function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.classList.add('show');
    if (isError) toast.classList.add('error');
    setTimeout(() => { toast.classList.remove('show'); toast.classList.remove('error'); }, 3000);
}
</script>
</body>
</html>
