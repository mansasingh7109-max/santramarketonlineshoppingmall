<div class="login-box">

// ✅ NEW UPDATED CODE - Permanent History Save + Backup
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ADMIN_WHATSAPP = "917725960293"; // ✅ Tera number

function sendOTPRequest() {
  const name = document.getElementById('custName').value.trim();
  const mobile = document.getElementById('custMobile').value.trim();
  const email = document.getElementById('custEmail').value.trim();
  
  if (!name || mobile.length !== 10) {
    alert('❌ Name aur 10 digit mobile required hai!');
    return;
  }
  
  // ✅ 1. Login request save karo - OTP ke liye
  db.collection('login_requests').doc(mobile).set({
    name: name,
    mobile: mobile,
    email: email,
    otp: '', // Admin bharenga
    status: 'pending',
    requestedAt: new Date().toLocaleString('en-IN'),
    requestedTime: Date.now()
  }).then(() => {
    // ✅ 2. Customers collection me permanent save - History hamesha rahegi
    db.collection('customers').doc(mobile).set({
      name: name,
      mobile: mobile,
      email: email,
      createdAt: new Date().toLocaleString('en-IN'),
      createdTime: Date.now(),
      status: 'pending_otp',
      totalOrders: 0,
      lastLogin: Date.now()
    }, { merge: true }); // merge: true se purana data delete nahi hoga, update hoga
    
    console.log('✅ Customer permanent save ho gaya - admin-customer.html me dikhega');
    console.log('✅ History backup: customers + login_requests dono me save');
  }).catch(err => {
    alert('❌ Error: ' + err.message);
    return;
  });
  
  // ✅ 3. LocalStorage me save karo - browser backup
  localStorage.setItem('pendingOTP', JSON.stringify({
    name: name,
    mobile: mobile,
    email: email,
    time: Date.now()
  }));
  
  // ✅ 4. Customer ke WhatsApp se Admin ko message
  let msg = `🔐 *LOGIN OTP REQUEST - SANTRA MALL*\n\n👤 Name: ${name}\n📱 My Number: ${mobile}\n${email ? '📧 Email: ' + email : ''}\n\n⚡ *Admin:* Please reply with 6-digit OTP on this WhatsApp number.\n\nMain index.html pe "Verify OTP" button dabake wait kar raha hun.`;
  
  window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
  
  // ✅ 5. Home page pe bhejo
  alert('✅ WhatsApp khul gaya!\n\nAdmin ko message send karo.\n\nAdmin 2-5 min me isi WhatsApp pe OTP bhejega.\nFir Home page pe "🔐 Verify OTP" dabake OTP daalna.\n\n✅ Aapka data permanent save ho gaya hai.');
  window.location.href = 'index.html';
}

// Agar pehle se pendingOTP hai to direct home bhej do
window.onload = function() {
  let pending = localStorage.getItem('pendingOTP');
  if(pending) {
    pending = JSON.parse(pending);
    if(Date.now() - pending.time < 60 * 60 * 1000) { // ✅ 60 min
      if(confirm('✅ Aapki OTP request active hai!\n\nAdmin ne WhatsApp pe OTP bhej diya?\n\nHome page pe "Verify OTP" se daalo.\n\nHome page pe jana hai?')) {
        window.location.href = 'index.html';
      }
    } else {
      localStorage.removeItem('pendingOTP');
    }
  }
}

<script>
// ✅ WhatsApp OTP Request - Ye function call karo button pe
function sendLoginOTP() {
  const name = document.getElementById('custName').value.trim();
