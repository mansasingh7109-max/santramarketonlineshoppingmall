<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Order - SANTRA MALL</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
        body{background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
       .container{max-width:500px;width:100%;background:white;border-radius:12px;box-shadow:0 5px 20px rgba(0,0.1);overflow:hidden}
       .header{background:#e40046;color:white;padding:20px;text-align:center}
       .header h1{font-size:24px;margin-bottom:5px}
       .content{padding:25px}
       .btn{width:100%;padding:14px;background:#e40046;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
       .btn:hover{background:#c20038}
       .btn:disabled{background:#ccc;cursor:not-allowed}
       .btn-whatsapp{background:#25D366}
       .btn-whatsapp:hover{background:#1ea952}
       .form-group{margin-bottom:15px}
       .form-group label{display:block;margin-bottom:6px;font-weight:500;color:#333}
       .form-group input,.form-group textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px}
       .form-group input:focus,.form-group textarea:focus{border-color:#e40046;outline:none}
       .product-summary{background:#f9f9f9;padding:15px;border-radius:8px;margin-bottom:20px}
       .product-summary img{width:80px;height:80px;object-fit:cover;border-radius:8px;float:left;margin-right:15px}
       .hidden{display:none}
       .error{color:red;font-size:14px;margin-top:5px}
       .success{text-align:center;padding:30px}
       .success-icon{font-size:60px;color:#25D366;margin-bottom:15px}
       .loader{display:none;text-align:center;padding:10px;color:#e40046;font-weight:bold}
    </style>

    <script>
      // ===== FIREBASE CONFIG - APNI REAL KEYS DAAL DE =====

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 SANTRA MALL</h1>
            <p>Complete Your Order</p>
        </div>

        <div class="content">
            <!-- Step 1: Customer Details Form - OTP REMOVED -->
            <div id="detailsSection">
                <h2 style="margin-bottom:20px">Delivery Details</h2>

                <div class="product-summary" id="productSummary"></div>

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="custName" placeholder="Enter your name">
                    <div id="nameError" class="error hidden">Name is required</div>
                </div>

                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="tel" id="custMobile" placeholder="10 digit mobile" maxlength="10">
                    <div id="mobileError" class="error hidden">Valid 10 digit mobile required</div>
                </div>

                <div class="form-group">
                    <label>Email (Optional)</label>
                    <input type="email" id="custEmail" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label>House No. / Building *</label>
                    <input type="text" id="custAddress1" placeholder="Flat no, Building name">
                    <div id="address1Error" class="error hidden">Address is required</div>
                </div>

                <div class="form-group">
                    <label>Area / Street / Landmark *</label>
                    <input type="text" id="custAddress2" placeholder="Area, Street, Landmark">
                    <div id="address2Error" class="error hidden">Area is required</div>
                </div>

                <div class="loader" id="loader">📲 Saving order to Firebase...</div>
                <button class="btn btn-whatsapp" id="submitBtn" onclick="submitFinalOrder()">📲 Send Order on WhatsApp</button>
            </div>

            <!-- Step 2: Success -->
            <div id="successSection" class="hidden">
                <div class="success">
                    <div class="success-icon">✅</div>
                    <h2>Order Sent!</h2>
                    <p>Your order has been sent to admin on WhatsApp.<br>We will contact you soon.</p>
                    <button class="btn" onclick="window.location.href='index.html'">Continue Shopping</button>
                </div>
            </div>
        </div>
    </div>

<script>
// Get product from URL
let urlParams = new URLSearchParams(window.location.search);
let productId = urlParams.get('product');
let pendingOrder = null;

// Load pending order from localStorage
if(productId){
    let data = localStorage.getItem('pending_whatsapp_order_' + productId);
    if(data){
        pendingOrder = JSON.parse(data);
        showProductSummary();
        // Auto-fill if customer logged in
        const customer = localStorage.getItem('santra_customer');
        if(customer){
            const custData = JSON.parse(customer);
            document.getElementById('custName').value = custData.name || '';
            document.getElementById('custMobile').value = custData.mobile || '';
        }
    } else {
        alert('Order session expired. Please start again.');
        window.location.href = 'index.html';
    }
}

// Show product details
function showProductSummary(){
    let seriesText = pendingOrder.serial_no ? ` | Series: ${pendingOrder.serial_no}` : '';
    document.getElementById('productSummary').innerHTML = `
        <img src="${pendingOrder.productImage}" alt="${pendingOrder.productName}">
        <h3>${pendingOrder.productName}</h3>
        <p><b>Price:</b> ₹${pendingOrder.productPrice}</p>
        <p><b>Code:</b> ${pendingOrder.productCode}${seriesText}</p>
        <div style="clear:both"></div>
    `;
}

/* === OLD CODE BACKUP - 23/5/2026 - OTP SECTION REMOVED ===
function moveNext(input, index){
    if(input.value.length === 1 && index < 3){
        document.getElementsByClassName('otp-input')[index + 1].focus();
    }
}

function verifyOTP(){
    let inputs = document.getElementsByClassName('otp-input');
    let enteredOTP = '';
    for(let i = 0; i < inputs.length; i++){
        enteredOTP += inputs[i].value;
    }

    if(enteredOTP == pendingOrder.otp){
        document.getElementById('otpSection').classList.add('hidden');
        document.getElementById('detailsSection').classList.remove('hidden');
        document.getElementById('otpError').classList.add('hidden');
    } else {
        document.getElementById('otpError').classList.remove('hidden');
    }
}
=== END OLD CODE BACKUP === */

// Validate and Submit - FIREBASE BACKUP ADDED
async function submitFinalOrder(){
    let name = document.getElementById('custName').value.trim();
    let mobile = document.getElementById('custMobile').value.trim();
    let email = document.getElementById('custEmail').value.trim();
    let addr1 = document.getElementById('custAddress1').value.trim();
    let addr2 = document.getElementById('custAddress2').value.trim();

    // Reset errors
    document.querySelectorAll('.error').forEach(e => e.classList.add('hidden'));

    // Validation
    let valid = true;
    if(name.length < 3){ document.getElementById('nameError').classList.remove('hidden'); valid = false; }
    if(mobile.length!== 10 || isNaN(mobile)){ document.getElementById('mobileError').classList.remove('hidden'); valid = false; }
    if(addr1.length < 3){ document.getElementById('address1Error').classList.remove('hidden'); valid = false; }
    if(addr2.length < 3){ document.getElementById('address2Error').classList.remove('hidden'); valid = false; }

    if(!valid) return;

    document.getElementById('loader').style.display = 'block';
    document.getElementById('submitBtn').disabled = true;

    // ========== NEW CODE - 24/5/2026 - FIREBASE SAVE ADDED ==========
    let productCode = pendingOrder.productCode || pendingOrder.productId;
    let productLink = window.location.origin + '/product.php?code=' + encodeURIComponent(productCode);
    let seriesNo = pendingOrder.serial_no || 'N/A';
    let category = pendingOrder.category || pendingOrder.cat || 'General';
    const orderId = 'SM' + Date.now();
    const orderDate = new Date().toLocaleString('en-IN', {timeZone: 'Asia/Kolkata'});

    const orderData = {
      orderId: orderId,
      customerName: name,
      customerMobile: mobile,
      customerEmail: email,
      customerAddress: addr1 + ', ' + addr2,
      items: [{
        id: pendingOrder.productId,
        name: pendingOrder.productName,
        price: pendingOrder.productPrice,
        qty: 1,
        imageUrl: pendingOrder.productImage,
        product_code: productCode,
        category: category,
        serial_no: seriesNo,
        product_link: productLink
      }],
      subtotal: pendingOrder.productPrice,
      delivery: 0,
      totalAmount: pendingOrder.productPrice,
      paymentMode: 'Cash on Delivery',
      status: "pending_otp",
      orderDate: firebase.firestore.FieldValue.serverTimestamp(),
      orderDateString: orderDate,
      source: 'whatsapp_order_page'
    };

    try {
      // 1. Save to Firebase First
      await db.collection("orders").add(orderData);
      console.log('✅ Order saved to Firebase');

      // 2. Build WhatsApp Message
      let message = `🛒 *NEW ORDER - SANTRA MALL*\n` +
        `*ORDER REQUEST* ✅\n\n` +
        `*PRODUCT DETAILS:*\n` +
        `Category: ${category}\n` +
        `Series No: ${seriesNo}\n` +
        `Code: ${productCode}\n` +
        `Name: ${pendingOrder.productName}\n` +
        `Price: ₹${pendingOrder.productPrice}\n` +
        `Link: ${productLink}\n\n` +
        `*CUSTOMER PROFILE:*\n` +
        `Name: ${name}\n` +
        `Mobile: ${mobile}\n` +
        `Email: ${email || 'Not provided'}\n` +
        `Address: ${addr1}, ${addr2}\n\n` +
        `*Payment:* Cash on Delivery\n` +
        `*Time:* ${orderDate}\n\n` +
        `⚠️ ACTION: Confirm order with customer on WhatsApp`;

      // 3. Save to localStorage for admin panel backup
      let allOrders = JSON.parse(localStorage.getItem('santra_orders')) || [];
      allOrders.push({
          time: Date.now(),
          orderId: orderId,
          customerName: name,
          mobile: mobile,
          email: email,
          address: addr1 + ', ' + addr2,
          productName: pendingOrder.productName,
          productCode: productCode,
          category: category,
          serial_no: seriesNo,
          price: pendingOrder.productPrice,
          status: 'New'
      });
      localStorage.setItem('santra_orders', JSON.stringify(allOrders));

      // 4. Open WhatsApp
      window.open(`https://wa.me/918769171078?text=${encodeURIComponent(message)}`, '_blank');

      // 5. Show success
      document.getElementById('detailsSection').classList.add('hidden');
      document.getElementById('successSection').classList.remove('hidden');

      // 6. Clear pending order
      localStorage.removeItem('pending_whatsapp_order_' + productId);

    } catch (error) {
      console.error('Order Error:', error);
      alert('❌ Error saving order: ' + error.message);
      document.getElementById('loader').style.display = 'none';
      document.getElementById('submitBtn').disabled = false;
    }
    // ========== NEW CODE END ==========

    /* === OLD CODE BACKUP - 11/5/2026 - WITHOUT FIREBASE ===
    let productCode = pendingOrder.productCode || pendingOrder.productId;
    let productLink = window.location.origin + '/product.php?code=' + encodeURIComponent(productCode);

    let message = `🛒 *NEW ORDER - SANTRA MALL*\n` +
      `*OTP Verified:* ${pendingOrder.otp} ✅\n\n` +
      `*PRODUCT DETAILS:*\n` +
      `Code: ${productCode}\n` +
      `Name: ${pendingOrder.productName}\n` +
      `Price: ₹${pendingOrder.productPrice}\n` +
      `Link: ${productLink}\n\n` +
      `*CUSTOMER PROFILE:*\n` +
      `Name: ${name}\n` +
      `Mobile: ${mobile}\n` +
      `Email: ${email || 'Not provided'}\n` +
      `Address: ${addr1}, ${addr2}\n\n` +
      `*Payment:* Cash on Delivery\n` +
      `*Time:* ${new Date().toLocaleString('en-IN')}`;

    let allOrders = JSON.parse(localStorage.getItem('santra_orders')) || [];
    allOrders.push({
        time: Date.now(),
        customerName: name,
        mobile: mobile,
        email: email,
        address: addr1 + ', ' + addr2,
        productName: pendingOrder.productName,
        productCode: productCode,
        category: category,
        serial_no: seriesNo,
        price: pendingOrder.productPrice,
        status: 'New'
    });
    localStorage.setItem('santra_orders', JSON.stringify(allOrders));

    window.open(`https://wa.me/919829508335?text=${encodeURIComponent(message)}`, '_blank');

    document.getElementById('detailsSection').classList.add('hidden');
    document.getElementById('successSection').classList.remove('hidden');

    localStorage.removeItem('pending_whatsapp_order_' + productId);
    === END OLD CODE BACKUP === */
}
</script>
<script src="theme.js"></script>
</body>
