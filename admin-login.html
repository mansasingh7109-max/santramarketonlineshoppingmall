<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - SANTRA MALL</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#f1f3f6;display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .box{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);width:90%;max-width:380px;text-align:center;}
    h2{color:#e40046;margin-bottom:20px;}
    input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:6px;font-size:15px;}
    button{width:100%;padding:12px;background:#e40046;color:white;border:none;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;}
    button:disabled{background:#ccc;cursor:not-allowed;}
    .msg{padding:10px;border-radius:6px;margin:10px 0;font-size:14px;display:none;}
    .msg-error{background:#ffebee;color:#c62828;display:block;}
    .msg-success{background:#e8f5e9;color:#2e7d32;display:block;}
    .link{color:#e40046;cursor:pointer;margin-top:15px;font-size:14px;}
  </style>
</head>
<body>

<div class="box">
  <h2>🛒 SANTRA MALL Admin</h2>
  <div id="msg"></div>
  <input type="email" id="email" placeholder="Admin Email" value="mansasingh7109@gmail.com">
  <input type="password" id="pass" placeholder="Password" onkeypress="if(event.key==='Enter') doLogin()">
  <button id="loginBtn" onclick="doLogin()">Login</button>
  <div class="link" onclick="forgotPass()">🔒 Forgot Password?</div>
  <div class="link" onclick="window.location.href='index.html'">← Back to Website</div>
</div>

<!-- ✅ secrets.js sabse pehle load kar -->
<script src="secrets.js"></script>

<!-- ✅ Ek hi module script -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
  
  // ✅ window se config le
  const app = initializeApp(window.FIREBASE_CONFIG);
  const auth = getAuth(app);
  
  // ✅ Admin email bhi window se
  const ADMIN_EMAIL = window.BUSINESS_CONFIG.EMAIL;

  function showMsg(text, type){
    const msgDiv = document.getElementById('msg');
    msgDiv.className = `msg msg-${type}`;
    msgDiv.innerHTML = text;
  }

  window.doLogin = async function(){
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value.trim();
    const btn = document.getElementById('loginBtn');
    
    if(!email || !pass){ 
      showMsg('Email aur Password dalo', 'error'); 
      return; 
    }
    
    if(email !== ADMIN_EMAIL){ 
      showMsg('Sirf Admin login kar sakta hai', 'error'); 
      return; 
    }
    
    btn.disabled = true;
    btn.innerText = 'Checking...';
    showMsg('Login ho raha hai...', 'success');
    
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      showMsg('✅ Login Success! Redirecting...', 'success');
      setTimeout(() => { 
        window.location.href = 'admin.html'; 
      }, 800);
      
    } catch(err) {
      let errorMsg = 'Login Failed: ';
      if(err.code === 'auth/invalid-credential') errorMsg += 'Email ya Password galat hai';
      else if(err.code === 'auth/too-many-requests') errorMsg += 'Bahut try kar liya. 5 min baad try karo';
      else errorMsg += err.message;
      
      showMsg('❌ ' + errorMsg, 'error');
      btn.disabled = false;
      btn.innerText = 'Login';
    }
  }

  window.forgotPass = async function(){
    const email = document.getElementById('email').value.trim();
    if(!email){ 
      showMsg('Pehle email dalo', 'error'); 
      return; 
    }
    
    try {
      await sendPasswordResetEmail(auth, email);
      showMsg('✅ Password reset link bhej diya! Gmail check karo: ' + email, 'success');
    } catch(err) {
      showMsg('❌ Error: ' + err.message, 'error');
    }
  }
</script>

</body>
</html>
