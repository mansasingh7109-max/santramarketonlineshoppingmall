<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - SANTRA MALL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {--accent: #e40046;--text: #212121;--green: #10b981;}
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: "Poppins", Arial, sans-serif;}
        body {background: #f1f3f6;padding-bottom: 85px;}
   .header {background: var(--accent);color: white;padding: 15px;display: flex;align-items: center;gap: 10px;position: sticky;top: 0;z-index: 100;}
   .back-btn {background: none;border: none;color: white;font-size: 22px;cursor: pointer;}
   .header h1 {font-size: 18px;flex: 1;}
   .container {max-width: 600px;margin: 15px auto;padding: 0 15px;}
   .section {background: white;border-radius: 12px;padding: 20px;margin-bottom: 15px;box-shadow: 0 2px 8px rgba(0,0,0,0.08);}
   .section h3 {font-size: 16px;margin-bottom: 15px;color: var(--text);display: flex;align-items: center;gap: 8px;}
   .form-group {margin-bottom: 15px;}
   .form-group label {display: block;margin-bottom: 6px;font-weight: 600;font-size: 14px;color: var(--text);}
   .form-group input,.form-group textarea {width: 100%;padding: 12px;border: 2px solid #e0e0e0;border-radius: 8px;font-size: 15px;}
   .form-group input:focus,.form-group textarea:focus {outline: none;border-color: var(--accent);}
   .summary-row {display: flex;justify-content: space-between;margin: 10px 0;font-size: 14px;}
   .total-row {font-weight: 700;font-size: 18px;border-top: 2px solid #e0e0e0;padding-top: 12px;margin-top: 12px;}
   .place-order-btn {width: 100%;padding: 16px;background: var(--accent);color: white;border: none;border-radius: 8px;font-weight: 700;font-size: 16px;cursor: pointer;margin-top: 15px;}
   .place-order-btn:disabled {background: #ccc;cursor: not-allowed;}
   .error {background: #fee;padding: 12px;border-radius: 8px;color: #c00;font-size: 14px;margin-bottom: 15px;display: none;}
   .success {background: #efe;padding: 12px;border-radius: 8px;color: #060;font-size: 14px;margin-bottom: 15px;display: none;}
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="window.location.href = 'cart.html'">←</button>
        <h1>Checkout</h1>
    </div>

    <div class="container">
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>

        <!-- OLD CODE BACKUP SAFE -->
        <div class="section">
            <h3>📍 Delivery Address</h3>
            <div class="form-group"><label>Full Name *</label><input type="text" id="fullName" required></div>
            <div class="form-group"><label>Mobile Number *</label><input type="tel" id="mobile" maxlength="10" required></div>
            <div class="form-group"><label>Email *</label><input type="email" id="email" required></div>
            <div class="form-group"><label>Pincode *</label><input type="text" id="pincode" maxlength="6" required></div>
            <div class="form-group"><label>House No *</label><input type="text" id="address1" required></div>
            <div class="form-group"><label>Area *</label><input type="text" id="address2" required></div>
            <div class="form-group"><label>City *</label><input type="text" id="city" required></div>
            <div class="form-group"><label>State *</label><input type="text" id="state" required></div>
        </div>

        <div class="section">
            <h3>📦 Order Summary</h3>
            <div id="orderItems"></div>
            <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
            <div class="summary-row"><span>Delivery</span><span id="delivery" style="color: var(--green);">FREE</span></div>
            <div class="summary-row total-row"><span>Total</span><span id="total">₹0</span></div>
        </div>

        <button class="place-order-btn" id="placeOrderBtn" onclick="placeOrderWithOTP()">🛒 Place Order - OTP Verify</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="santra-auth.js"></script>

    <script>
        const db = firebase.firestore();
        const CART_KEY = "santrajet_cart";
        const ADMIN_WHATSAPP = "918769171078";
        let cart = {};

        // ✅ LOGIN CHECK - santra-auth se
        const customerMobile = localStorage.getItem('santra_whatsapp_mobile');
        if (!customerMobile) {
            alert('❌ Pehle login karo!');
            window.location.href = 'customer-login.html';
        } else {
            document.getElementById('mobile').value = customerMobile;
            // Auto-fill from profile
            db.collection('customers').doc(customerMobile).get().then(doc => {
                if(doc.exists) {
                    const d = doc.data();
                    if(d.name) document.getElementById('fullName').value = d.name;
                    if(d.email) document.getElementById('email').value = d.email;
                }
            });
        }

        function loadCart() {
            try {
                let cartArray = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
                cart = {};
                cartArray.forEach(item => { cart[item.id] = item; });
            } catch(e){ cart = {}; }
            renderOrderSummary();
        }

        function renderOrderSummary() {
            const container = document.getElementById('orderItems');
            const keys = Object.keys(cart);
            if(keys.length === 0){ container.innerHTML = '<p>Cart empty</p>'; return; }

            let subtotal = 0;
            container.innerHTML = keys.map(k => {
                const i = cart[k];
                const total = (i.price||0)*(i.qty||1);
                subtotal += total;
                return `<div style="display:flex;justify-content:space-between;margin:8px 0;"><span>${i.name} x ${i.qty}</span><span>₹${total}</span></div>`;
            }).join('');

            const delivery = subtotal >= 500? 0 : 49;
            document.getElementById('subtotal').innerText = '₹' + subtotal;
            document.getElementById('delivery').innerText = delivery===0?'FREE':'₹'+delivery;
            document.getElementById('total').innerText = '₹' + (subtotal+delivery);
        }

        // ✅ NEW: Place Order with OTP (har bar)
        async function placeOrderWithOTP() {
            const fullName = document.getElementById('fullName').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();

            if(!fullName || mobile.length!==10) return alert('Details bharo');
            if(Object.keys(cart).length===0) return alert('Cart khali');

            const btn = document.getElementById('placeOrderBtn');
            btn.disabled = true; btn.innerText = '⏳ Requesting OTP...';

            const orderId = 'ORD_' + mobile + '_' + Date.now();
            const subtotal = Object.values(cart).reduce((s,i)=>s+(i.price*i.qty),0);
            const total = subtotal + (subtotal>=500?0:49);

            const orderData = {
                orderId, customerName: fullName, customerMobile: mobile, customerEmail: email,
                items: Object.values(cart), subtotal, total, status: 'pending_otp',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // 1. Save order
                await db.collection('orders').doc(orderId).set(orderData);

                // 2. Create OTP request
                await db.collection('order_requests').doc(orderId).set({
                    mobile, orderId, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 3. WhatsApp admin
                const msg = `🛒 *ORDER OTP REQUEST*\n\nMobile: ${mobile}\nOrder: ${orderId}\nAmount: ₹${total}\n\nOTP bhejo customer ko.`;
                window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');

                alert('✅ OTP Request sent!\n\nAdmin aapko WhatsApp pe OTP bhejega.\n\nMy Orders page me OTP daalo.');
                localStorage.removeItem(CART_KEY);
                setTimeout(()=>location.href='orders.html?id='+orderId, 1500);

            } catch(e) {
                alert('Error: ' + e.message);
                btn.disabled = false; btn.innerText = '🛒 Place Order - OTP Verify';
            }
        }

        window.onload = loadCart;
    </script>
</body>
</html>
