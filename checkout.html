<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Complete Your Order Sold By Santra Mall - V26 FINAL Old Save</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<style>
body{margin:0;font-family:Roboto,sans-serif;background:#f5f5f5}
.header{background:#e91e63;color:#fff;padding:14px;text-align:center;font-weight:700;position:sticky;top:0;z-index:10}
.container{max-width:600px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.order-id{background:#fff9c4;padding:10px;border-radius:8px;font-size:13px;border:1px solid #f9e79f}
.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed #ddd}
.item img{width:85px;height:85px;border-radius:8px;object-fit:cover}
.item-details{flex:1;font-size:13px;line-height:1.6;word-break:break-word}
.grand-total{text-align:right;font-weight:800;font-size:18px;border-top:1px solid #eee;margin-top:10px;padding-top:10px}
.grand-sub{font-weight:400;font-size:12px;color:#666}
.form-group{margin-bottom:14px}.form-group label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:10px;font-size:14px}
.btn-send{width:100%;background:#00c853;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<!--
⚠️ OLD CODE BACKUP - V11+V12+V13+V20+V21+V22+V23+V24+V25 - SAFE - KUCH HATAYA NAHI
V24: ID Hide + Base ID Auto + Name auto update
V25: customerMobile add - Present Order fix
OLD END - AB V26 FINAL - Old Save + Update DNA - Present Fix + Product Link Fix + Symbol Remove
-? symbol hata diya - WhatsApp me? nahi ayega - Encoding fix
- *>> <<* wala line hata diya - PLEASE SEND OTP TO CONFIRM wala *>> <<* hata diya
- Product page wali link View: https://... hamesha dikhegi - Old wala message format
- Present order save hamesha - customerMobile + mobile + loginMobile + deliveryMobile
-->
<div class="header">🛒 Complete Your Order Sold By Santra Mall - V26</div>
<div class="container">
<div class="card">
<h3 style="font-size:16px;margin-bottom:8px">Order Summary - Sold By: Santra Mall</h3>
<div class="order-id">Order ID: <b id="orderId">SM000000</b> | Sold By: <b>Santra Mall</b></div>
<div id="orderItems"></div>
<div class="grand-total">Grand Total: ₹<span id="grandTotal">0</span><div class="grand-sub">Amount: ₹<span id="subTotal">0</span> + Delivery: <span id="deliveryCharge">FREE</span></div></div>
</div>
<div class="card">
<div style="font-weight:700;margin-bottom:12px">Delivery Address</div>
<div class="form-group"><label>Full Name *</label><input id="name" placeholder="Full Name"></div>
<div class="form-group"><label>Login mobile number *</label><input id="mobile" type="tel" placeholder="Login mobile" maxlength="10"></div>
<div class="form-group"><label>Extra mobile number for Delivery</label><input id="deliveryMobile" type="tel" placeholder="Extra mobile" maxlength="10"></div>
<div class="form-group"><label>Email *</label><input id="email" placeholder="Email"></div>
<div class="form-group"><label>House No / Building *</label><input id="house"></div>
<div class="form-group"><label>Area / Street / Colony *</label><input id="area"></div>
<div class="form-group"><label>Landmark *</label><input id="landmark"></div>
<div class="form-group"><label>Pincode *</label><input id="pincode" maxlength="6"></div>
<div class="form-group"><label>City *</label><input id="city"></div>
<div class="form-group"><label>State *</label><input id="state"></div>
<div class="form-group"><label>Payment Mode *</label><select id="payment"><option>Cash on Delivery</option><option>Online Payment</option></select></div>
<button class="btn-send" id="sendBtn" onclick="sendOrder()">SEND ORDER - Place Order</button>
</div>
</div>
<script>
var orderId="SM"+Date.now();
var BASE_URL="https://santramarketshoppingmall.web.app";
function getCart(){ try{ let r=localStorage.getItem("santraMallCart_v2")||localStorage.getItem("cart")||"{}"; let d=JSON.parse(r); if(Array.isArray(d)){let t={};d.forEach((it,i)=>{t[it.id||it.code||i]=it;});return t;} if(d.cart) return d.cart; return d; }catch(e){return {};} }
function getCleanImage(it){ let f=['image','imageUrl','productImage','thumbnail']; for(let k of f){ let v=it[k]; if(v&&typeof v==='string'&&v.startsWith('http')) return v; } return 'https://via.placeholder.com/85?text=No+Image'; }
function load(){
 document.getElementById("orderId").innerText=orderId;
 try{ let cust=JSON.parse(localStorage.getItem('santra_customer')||'{}'); if(cust.loginMobile) document.getElementById('mobile').value=cust.loginMobile; if(cust.deliveryMobile) document.getElementById('deliveryMobile').value=cust.deliveryMobile; if(cust.name) document.getElementById('name').value=cust.name; if(cust.email) document.getElementById('email').value=cust.email; }catch(e){}
 render();
}
function render(){
 let cart=getCart(); let cont=document.getElementById("orderItems"); let keys=Object.keys(cart);
 if(keys.length===0){ cont.innerHTML='<p style="text-align:center;color:#999">Cart empty</p>'; return; }
 let sub=0;
 cont.innerHTML=keys.map((k,i)=>{
  let it=cart[k]; let qty=parseInt(it.qty)||1; let price=parseFloat(it.price)||0; let tot=qty*price; sub+=tot;
  let size=it.size||'M'; let code=it.code||it.id||k; let name=it.name||'Product'; let img=getCleanImage(it);
  return `<div class="item"><img src="${img}"><div class="item-details"><b>${i+1}. ${name} (Size ${size})</b><br>Qty: ${qty} x ₹${price} = ₹${tot}<br>Code: ${code}</div></div>`;
 }).join("");
 let del=sub>=500?0:49; let grand=sub+del;
 document.getElementById("subTotal").innerText=sub; document.getElementById("grandTotal").innerText=grand;
 document.getElementById("deliveryCharge").innerText=del===0?"FREE":"₹"+del; window._tot={sub,del,grand};
}
function sendOrder(){
 let btn=document.getElementById('sendBtn');
 let name=document.getElementById('name').value.trim();
 let login=document.getElementById('mobile').value.replace(/\D/g,'').slice(-10);
 let extra=document.getElementById('deliveryMobile').value.replace(/\D/g,'').slice(-10);
 let email=document.getElementById('email').value.trim();
 let house=document.getElementById('house').value.trim();
 let area=document.getElementById('area').value.trim();
 let landmark=document.getElementById('landmark').value.trim();
 let pincode=document.getElementById('pincode').value.trim();
 let city=document.getElementById('city').value.trim();
 let state=document.getElementById('state').value.trim();
 let payment=document.getElementById('payment').value||'Cash on Delivery';
 if(!name) return alert('Full Name likho');
 if(login.length!==10) return alert('Login mobile 10 digit');
 if(!house) return alert('House No likho');
 if(!area) return alert('Area likho');
 if(!pincode) return alert('Pincode likho');
 btn.innerText="Sending..."; btn.disabled=true;
 let fullAddress=`${house}, ${area}${landmark?', '+landmark:''}, ${city}, ${state} - ${pincode}`;
 let dateStr=new Date().toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
 let cart=getCart(); let keys=Object.keys(cart); let subtotal=0; let productLines='';
 keys.forEach((k,i)=>{
   let it=cart[k]; let qty=parseInt(it.qty)||1; let price=parseFloat(it.price)||0; let tot=qty*price; subtotal+=tot;
   let size=it.size||it.variant||'M'; let code=it.code||it.id||k; let nameP=(it.name||'Product').replace(/\(Size.*?\)/gi,'').trim();
   let cleanId=(it.id||code||k).toString().trim();
   let link=BASE_URL+"/product.html?id="+encodeURIComponent(cleanId);
   // FIX - Old wala format - Size duplicate hata diya - View link hamesha
   productLines+=`${i+1}. ${nameP} (Size ${size})\nSize: ${size}\nQty: ${qty} x ₹${price} = ₹${tot}\nCode: ${code}\nView: ${link}\n\n`;
 });
 let delivery=subtotal>=500?0:49; let grand=subtotal+delivery;
 // FIX V26 -? symbol aur *>> <<* hata diya - Old wala message format
 let text=`*New Order - SANTRA MALL*\nOrder ID: ${orderId}\nDate: ${dateStr}\n\n${productLines}━━━━━━━━━━━━━━━━━━\nSubtotal: ₹${subtotal}\nDelivery: ${delivery===0?'FREE':'₹'+delivery}\n*GRAND TOTAL: ₹${grand}*\n━━━━━━━━━━━━━━━━━━\n\n*Customer Details:*\nName: ${name}\nMobile: ${login}\n${extra?`Extra: ${extra}\n`:''}Email: ${email||'-'}\nAddress: ${fullAddress}\nPayment: ${payment}`;
 try{
   let cust={name:name, loginMobile:login, mobile:login, deliveryMobile:extra, email:email, address:fullAddress, fullAddress:fullAddress};
   localStorage.setItem('santra_customer', JSON.stringify(cust));
   localStorage.setItem('santra_mobile', login);
 }catch(e){}
 localStorage.setItem('lastOrderId', orderId);
 localStorage.setItem('lastOrderGrandTotal', grand.toString());
 window.open(`https://wa.me/918769171078?text=${encodeURIComponent(text)}`,'_blank');
 try{
   let db = window.db || firebase.firestore();
   db.collection('orders').doc(orderId).set({
     orderId:orderId, id:orderId,
     mobile:login, customerMobile:login, loginMobile:login, deliveryMobile:extra, extraDeliveryMobile:extra,
     name:name, customerName:name, email:email, address:fullAddress, customerAddress:fullAddress, fullAddress:fullAddress,
     cart:Object.values(cart), items:Object.values(cart),
     paymentMethod:payment, total:grand, subtotal:subtotal, delivery:delivery,
     status:'Pending - OTP Wait - '+payment, dateStr:dateStr,
     createdAt: firebase.firestore.FieldValue.serverTimestamp(),
     presentTag:true
   },{merge:true});
 }catch(e){}
 setTimeout(()=>{ location.href=`share-otp-verify.html?mobile=${login}&delivery=${extra}&orderId=${orderId}&payment=${encodeURIComponent(payment)}`; }, 1200);
}
if(!firebase.apps.length){ firebase.initializeApp({apiKey:"AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",authDomain:"santramarketshoppingmall.firebaseapp.com",databaseURL:"https://santramarketshoppingmall-default-rtdb.firebaseio.com/",projectId:"santramarketshoppingmall",storageBucket:"santramarketshoppingmall.appspot.com",messagingSenderId:"398490252924",appId:"1:398490252924:web:d1b6348b549183b93b7bf9"}); }
document.addEventListener("DOMContentLoaded", load);
</script>
<script src="santra-all-url-one-file.js"></script>
</body>
</html>
