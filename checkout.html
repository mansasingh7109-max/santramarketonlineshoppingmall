<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - SANTRA MALL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {--accent: #e40046;--text: #212121;--green: #10b981;}
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: "Poppins", Arial, sans-serif;}
        body {background: #f1f3f6;padding-bottom: 85px;}
    .header {background: var(--accent);color: white;padding: 15px;display: flex;align-items: center;gap: 10px;position: sticky;top: 0;z-index: 100;}
    .back-btn {background: none;border: none;color: white;font-size: 22px;cursor: pointer;}
    .header h1 {font-size: 18px;flex: 1;}
    .container {max-width: 600px;margin: 15px auto;padding: 0 15px;}
    .section {background: white;border-radius: 12px;padding: 20px;margin-bottom: 15px;box-shadow: 0 2px 8px rgba(0,0,0,0.08);}
    .section h3 {font-size: 16px;margin-bottom: 15px;color: var(--text);display: flex;align-items: center;gap: 8px;}
    .form-group {margin-bottom: 15px;}
    .form-group label {display: block;margin-bottom: 6px;font-weight: 600;font-size: 14px;color: var(--text);}
    .form-group input,.form-group textarea {width: 100%;padding: 12px;border: 2px solid #e0e0;border-radius: 8px;font-size: 15px;}
    .form-group input:focus,.form-group textarea:focus {outline: none;border-color: var(--accent);}
    .form-group textarea {resize: vertical;min-height: 80px;}
    .summary-row {display: flex;justify-content: space-between;margin: 10px 0;font-size: 14px;}
    .total-row {font-weight: 700;font-size: 18px;border-top: 2px solid #e0e0e0;padding-top: 12px;margin-top: 12px;}
    .payment-option {border: 2px solid #e0e0e0;border-radius: 8px;padding: 15px;margin-bottom: 10px;cursor: pointer;display: flex;align-items: center;gap: 12px;}
    .payment-option.selected {border-color: var(--accent);background: #fff0f5;}
    .payment-option input[type="radio"] {width: 20px;height: 20px;}
    .place-order-btn {width: 100%;padding: 16px;background: var(--accent);color: white;border: none;border-radius: 8px;font-weight: 700;font-size: 16px;cursor: pointer;margin-top: 15px;}
    .place-order-btn:disabled {background: #ccc;cursor: not-allowed;}
    .error {background: #fee;padding: 12px;border-radius: 8px;color: #c00;font-size: 14px;margin-bottom: 15px;display: none;}
    .success {background: #efe;padding: 12px;border-radius: 8px;color: #060;font-size: 14px;margin-bottom: 15px;display: none;}
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="window.location.href = 'cart.html'">←</button>
        <h1>Checkout</h1>
    </div>

    <div class="container">
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>

        <!-- ==================== OLD CODE BACKUP - 25/06/2026 ==================== -->
        <!--
        <div class="section">
            <h3>Delivery Address</h3>
            <form id="addressForm">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="tel" id="phone" placeholder="Phone Number" required>
            </form>
        </div>
        -->
        <!-- ==================== OLD CODE BACKUP END ==================== -->

        <div class="section">
            <h3>📍 Delivery Address</h3>
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" id="mobile" placeholder="10-digit mobile number" maxlength="10" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Pincode *</label>
                <input type="text" id="pincode" placeholder="6-digit pincode" maxlength="6" required>
            </div>
            <div class="form-group">
                <label>House No, Building Name *</label>
                <input type="text" id="address1" placeholder="House/Flat No, Building" required>
            </div>
            <div class="form-group">
                <label>Road Name, Area, Colony *</label>
                <input type="text" id="address2" placeholder="Road, Area, Colony" required>
            </div>
            <div class="form-group">
                <label>Landmark (Optional)</label>
                <input type="text" id="landmark" placeholder="Near famous place">
            </div>
            <div class="form-group">
                <label>City *</label>
                <input type="text" id="city" placeholder="City" required>
            </div>
            <div class="form-group">
                <label>State *</label>
                <input type="text" id="state" placeholder="State" required>
            </div>
        </div>

        <div class="section">
            <h3>💰 Payment Method</h3>
            <div class="payment-option selected" onclick="selectPayment('cod')">
                <input type="radio" name="payment" value="cod" checked>
                <div>
                    <strong>Cash on Delivery</strong>
                    <p style="font-size: 13px;color: #666;margin-top: 3px;">Pay when you receive</p>
                </div>
            </div>
            <div class="payment-option" onclick="selectPayment('online')">
                <input type="radio" name="payment" value="online">
                <div>
                    <strong>Online Payment</strong>
                    <p style="font-size: 13px;color: #666;margin-top: 3px;">UPI, Card, Net Banking</p>
                </div>
            </div>
        </div>

        <div class="section">
            <h3>📦 Order Summary</h3>
            <div id="orderItems"></div>
            <div class="summary-row">
                <span>Subtotal</span><span id="subtotal">₹0</span>
            </div>
            <div class="summary-row">
                <span>Delivery Charges</span><span id="delivery" style="color: var(--green);font-weight: 600;">FREE</span>
            </div>
            <div class="summary-row total-row">
                <span>Total Amount</span><span id="total">₹0</span>
            </div>
        </div>

        <button class="place-order-btn" id="placeOrderBtn" onclick="placeOrder()">Place Order</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
          authDomain: "santramarketshoppingmall.firebaseapp.com",
          databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com/",
          projectId: "santramarketshoppingmall",
          storageBucket: "santramarketshoppingmall.appspot.com",
          messagingSenderId: "398490252924",
          appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
          measurementId: "G-ZW1ZR8HETY"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ✅ EmailJS Init - Apna Public Key daal
        emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); // TODO: Replace with your EmailJS public key

        const CART_KEY = "santrajet_cart";
        const ADMIN_WHATSAPP = "918769171078"; // Tera WhatsApp
        const ADMIN_EMAIL = "admin@santrajet.com"; // TODO: Replace with your admin email
        let cart = {};
        let selectedPayment = 'cod';

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.innerText = msg;
            el.style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }

        function loadCart() {
            auth.onAuthStateChanged(user => {
                if (user) {
                    rtdb.ref('users/' + user.uid + '/cart').once('value').then(snapshot => {
                        cart = {};
                        if (snapshot.exists()) {
                            snapshot.forEach(child => {
                                cart[child.key] = child.val();
                            });
                        }
                        renderOrderSummary();
                        autoFillAddress(user.uid);
                    });
                } else {
                    try {
                        let cartArray = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
                        cart = {};
                        cartArray.forEach(item => {
                            cart[item.id] = item;
                        });
                    } catch (e) {
                        cart = {};
                    }
                    renderOrderSummary();
                }
            });
        }

        async function autoFillAddress(uid) {
            try {
                const doc = await db.collection('customers').doc(uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.name) document.getElementById('fullName').value = data.name;
                    if (data.mobile) document.getElementById('mobile').value = data.mobile;
                    if (data.email) document.getElementById('email').value = data.email;
                }
            } catch (error) {
                console.error('Auto fill error:', error);
            }
        }

        function renderOrderSummary() {
            const container = document.getElementById('orderItems');
            const cartKeys = Object.keys(cart);

            if (cartKeys.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">Cart is empty</p>';
                document.getElementById('placeOrderBtn').disabled = true;
                return;
            }

            let subtotal = 0;
            container.innerHTML = cartKeys.map(key => {
                const item = cart[key];
                const qty = parseInt(item.qty) || 1;
                const price = parseFloat(item.price) || 0;
                const itemTotal = price * qty;
                subtotal += itemTotal;

                return `
                    <div style="display:flex;justify-content:space-between;margin:8px 0;font-size:14px;">
                        <span>${item.name} x ${qty}</span>
                        <span>₹${itemTotal}</span>
                    </div>
                `;
            }).join('');

            const delivery = subtotal >= 500? 0 : 49;
            const total = subtotal + delivery;

            document.getElementById('subtotal').innerText = '₹' + subtotal;
            document.getElementById('delivery').innerText = delivery === 0? 'FREE' : '₹' + delivery;
            document.getElementById('total').innerText = '₹' + total;
        }

        function selectPayment(method) {
            selectedPayment = method;
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            document.querySelector(`input[value="${method}"]`).checked = true;
        }

        // ✅ CORRECTION 1: Place Order - PERMISSION FIX + WHATSAPP + EMAIL
        async function placeOrder() {
            const fullName = document.getElementById('fullName').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const pincode = document.getElementById('pincode').value.trim();
            const address1 = document.getElementById('address1').value.trim();
            const address2 = document.getElementById('address2').value.trim();
            const landmark = document.getElementById('landmark').value.trim();
            const city = document.getElementById('city').value.trim();
            const state = document.getElementById('state').value.trim();

            if (!fullName ||!mobile ||!email ||!pincode ||!address1 ||!address2 ||!city ||!state) {
                return showError("Please fill all required fields");
            }

            if (mobile.length!== 10 ||!/^\d+$/.test(mobile)) {
                return showError("Please enter valid 10-digit mobile number");
            }

            if (pincode.length!== 6 ||!/^\d+$/.test(pincode)) {
                return showError("Please enter valid 6-digit pincode");
            }

            if (Object.keys(cart).length === 0) {
                return showError("Cart is empty");
            }

            const btn = document.getElementById('placeOrderBtn');
            btn.disabled = true;
            btn.innerText = "Placing Order...";

            try {
                const user = auth.currentUser;
                const orderId = "SM" + Date.now();
                const orderDate = new Date().toLocaleString('en-IN', {timeZone: 'Asia/Kolkata'});

                let subtotal = 0;
                const itemsArray = Object.keys(cart).map(key => {
                    const item = cart[key];
                    const qty = parseInt(item.qty) || 1;
                    const price = parseFloat(item.price) || 0;
                    subtotal += price * qty;
                    return {
                        id: item.id || key,
                        name: item.name,
                        price: price,
                        qty: qty,
                        total: price * qty,
                        image: item.image || '',
                        code: item.code || item.id || key
                    };
                });

                const delivery = subtotal >= 500? 0 : 49;
                const total = subtotal + delivery;
                const fullAddress = `${address1}, ${address2}, ${landmark? landmark + ', ' : ''}${city}, ${state} - ${pincode}`;

                const orderData = {
                    orderId: orderId,
                    userId: user? user.uid : 'guest_' + Date.now(),
                    customerName: fullName,
                    customerEmail: email,
                    customerMobile: mobile,
                    address: {
                        fullName: fullName,
                        mobile: mobile,
                        pincode: pincode,
                        address1: address1,
                        address2: address2,
                        landmark: landmark,
                        city: city,
                        state: state,
                        fullAddress: fullAddress
                    },
                    items: itemsArray,
                    subtotal: subtotal,
                    delivery: delivery,
                    total: total,
                    paymentMethod: selectedPayment === 'cod'? 'Cash on Delivery' : 'Online Payment',
                    status: 'Pending',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    date: orderDate
                };

                // ✅ 1. Save to Firestore - Permission Fix
                await db.collection('orders').doc(orderId).set(orderData);
                console.log('✅ Order saved to Firestore');

                // ✅ 2. Save to RTDB for Admin Panel
                await rtdb.ref('orders/' + orderId).set(orderData);
                console.log('✅ Order saved to RTDB');

                // ✅ 3. WhatsApp Message to Admin
                let whatsappMsg = `🔔 *New Order - SANTRA MALL* 🔔\n`;
                whatsappMsg += `Order ID: ${orderId}\n`;
                whatsappMsg += `Date: ${orderDate}\n\n`;

                itemsArray.forEach((item, index) => {
                    whatsappMsg += `${index + 1}. *${item.name}*\n`;
                    whatsappMsg += `Qty: ${item.qty} x ₹${item.price} = ₹${item.total}\n`;
                    whatsappMsg += `Code: ${item.code}\n`;
                    whatsappMsg += `Link: https://santramarketshoppingmall.firebaseapp.com/product.html?id=${item.id}\n\n`;
                });

                whatsappMsg += `━━━━━━━━━━━━━━━━━━\n`;
                whatsappMsg += `*Subtotal: ₹${subtotal}*\n`;
                whatsappMsg += `*Delivery: ${delivery === 0? 'FREE' : '₹' + delivery}*\n`;
                whatsappMsg += `*💰 GRAND TOTAL: ₹${total}*\n`;
                whatsappMsg += `━━━━━━━━━━━━━━━━━━\n\n`;
                whatsappMsg += `*👤 Customer Details:*\n`;
                whatsappMsg += `Name: ${fullName}\n`;
                whatsappMsg += `Mobile: ${mobile}\n`;
                whatsappMsg += `Email: ${email}\n`;
                whatsappMsg += `Address: ${fullAddress}\n`;
                whatsappMsg += `Payment: ${orderData.paymentMethod}\n\n`;
                whatsappMsg += `*>> IMPORTANT: PLEASE SEND OTP TO CONFIRM THIS ORDER <<*\n`;
                whatsappMsg += `*OTP ke bina order confirm nahi hoga*`;

                const whatsappURL = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(whatsappMsg)}`;
                window.open(whatsappURL, '_blank');
                console.log('✅ WhatsApp opened');

                // ✅ 4. Email to Admin via EmailJS
                const emailParams = {
                    to_email: ADMIN_EMAIL,
                    order_id: orderId,
                    customer_name: fullName,
                    customer_mobile: mobile,
                    customer_email: email,
                    customer_address: fullAddress,
                    order_total: total,
                    payment_method: orderData.paymentMethod,
                    items_list: itemsArray.map(i => `${i.name} x ${i.qty} = ₹${i.total}`).join('\n'),
                    order_date: orderDate
                };

                await emailjs.send("YOUR_EMAILJS_SERVICE_ID", "YOUR_EMAILJS_TEMPLATE_ID", emailParams);
                console.log('✅ Email sent to admin');

                // ✅ 5. Clear cart
                if (user) {
                    await rtdb.ref('users/' + user.uid + '/cart').remove();
                } else {
                    localStorage.removeItem(CART_KEY);
                }

                showSuccess("✅ Order Placed Successfully! Order ID: " + orderId);

                setTimeout(() => {
                    window.location.href = 'my-orders.html';
                }, 3000);

            } catch (error) {
                console.error("Order Error:", error);
                if (error.code === 'permission-denied') {
                    showError("Order failed: Firebase permission error. Please login first or check rules.");
                } else {
                    showError("Order failed: " + error.message);
                }
                btn.disabled = false;
                btn.innerText = "Place Order";
            }
        }

        window.onload = function() {
            if (typeof firebase === 'undefined' || typeof firebase.database === 'undefined') {
                console.error('Firebase not loaded properly');
                showError("Firebase Error: Refresh Page");
                return;
            }
            loadCart();
        };
    </script>
</body>
</html>
