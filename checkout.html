<div class="header">🛒 Complete Your Order Sold By Santra Mall - V24</div>
<div class="container">
<div class="card">
<h3 style="font-size:16px;margin-bottom:8px">Order Summary - Sold By: Santra Mall <span class="lock">🔒 Screenshot - No Edit</span></h3>
<div class="order-id">Order ID: <b id="orderId">SM000000</b> | Sold By: <b>Santra Mall - No Ref</b></div>
<div id="orderItems"></div>
<div class="grand-total">Grand Total: ₹<span id="grandTotal">0</span><div class="grand-sub">Amount: ₹<span id="subTotal">0</span> + Delivery: <span id="deliveryCharge">FREE</span> | Sold By: Santra Mall</div></div>
</div>

<div class="card">
<div style="font-weight:700;margin-bottom:12px">📍 Delivery Address - Name Auto Update in Profile</div>
<div class="form-group"><label>Full Name *</label><input id="name" placeholder="Full Name"></div>
<div class="form-group"><label>Login mobile number * (OTP isi pe)</label><input id="mobile" type="tel" placeholder="Login mobile number" maxlength="10"></div>
<div class="form-group"><label>Extra mobile number for Delivery</label><input id="deliveryMobile" type="tel" placeholder="Extra mobile number for Delivery" maxlength="10"></div>
<div class="form-group"><label>Email *</label><input id="email" placeholder="Email"></div>
<div class="form-group"><label>House No / Building *</label><input id="house"></div>
<div class="form-group"><label>Area / Street / Colony *</label><input id="area"></div>
<div class="form-group"><label>Landmark *</label><input id="landmark"></div>
<div class="form-group"><label>Pincode *</label><input id="pincode" maxlength="6"></div>
<div class="form-group"><label>City *</label><input id="city"></div>
<div class="form-group"><label>State *</label><input id="state"></div>
<div class="form-group"><label>Payment Mode *</label><select id="payment"><option>Cash on Delivery</option><option>Online Payment</option></select></div>
<button class="btn-send" id="sendBtn" onclick="sendOrder()">📱 SEND ORDER - Place Order</button>
</div>

<script>
var orderId="SM"+Date.now();
var BASE_URL="https://santramarketshoppingmall.web.app";
function getCart(){ try{ let r=localStorage.getItem("santraMallCart_v2")||localStorage.getItem("cart")||"{}"; let d=JSON.parse(r); if(Array.isArray(d)){let t={};d.forEach((it,i)=>{t[it.id||it.code||i]=it;});return t;} if(d.cart) return d.cart; return d; }catch(e){return {};} }
function getCleanImage(it){
  let ff=['image','imageUrl','productImage','thumbnail','firebaseImage'];
  for(let f of ff){ let v=it[f]; if(v && typeof v==='string' && v.includes('firebasestorage.googleapis.com') && v.startsWith('http')) return v; }
  let f2=['image','img','imageUrl','productImage','thumbnail','photo','picture','src','mainImage'];
  for(let k of f2){ let v=it[k]; if(v && typeof v==='string' && v.length>15 && v.startsWith('http') &&!v.includes('ibb.co')) return v; }
  try{
    let keys=[it.id,it.code,it.productId,(it.name||'').toLowerCase(), String(it.id||'').toLowerCase()];
    for(let key of keys){
      if(!key) continue;
      if(window.SANTRA_ALL_URLS && window.SANTRA_ALL_URLS[key]) return window.SANTRA_ALL_URLS[key];
      if(window.SANTRA_IMAGES && window.SANTRA_IMAGES[key]) return window.SANTRA_IMAGES[key];
      if(window.SANTRA_ALL_URL_MAP && window.SANTRA_ALL_URL_MAP[key]) return window.SANTRA_ALL_URL_MAP[key];
      if(window.getProductImageUrl){ let u=window.getProductImageUrl(key); if(u && u.startsWith('http')) return u; }
    }
    // V24 FIX - Base ID se bhi try karo - Dress_001_M -> Dress_001
    let full = String(it.id||'').trim();
    let base = full.replace(/[_-](XS|S|M|L|XL|XXL|XXXL)$/i,'');
    if(base && base!==full){
      if(window.SANTRA_ALL_URLS && window.SANTRA_ALL_URLS[base]) return window.SANTRA_ALL_URLS[base];
      if(window.SANTRA_IMAGES && window.SANTRA_IMAGES[base]) return window.SANTRA_IMAGES[base];
    }
  }catch(e){}
  return 'https://via.placeholder.com/85?text=No+Image';
}
function load(){
 document.getElementById("orderId").innerText=orderId;
 try{
  let cust=JSON.parse(localStorage.getItem('santra_customer')||'{}');
  if(cust.loginMobile) document.getElementById('mobile').value=cust.loginMobile;
  if(cust.extraMobileNumberForDelivery || cust.deliveryMobile) document.getElementById('deliveryMobile').value=cust.extraMobileNumberForDelivery||cust.deliveryMobile;
  if(cust.name) document.getElementById('name').value=cust.name;
  if(cust.email) document.getElementById('email').value=cust.email;
 }catch(e){}
 render();
}
function render(){
 let cart=getCart();
 let cont=document.getElementById("orderItems");
 let keys=Object.keys(cart);
 if(keys.length===0){ cont.innerHTML='<p style="text-align:center;color:#999">Cart empty</p>'; return; }
 let sub=0;
 cont.innerHTML=keys.map((k,i)=>{
  let it=cart[k]; if(!it) return '';
  let qty=parseInt(it.qty)||1; let price=parseFloat(it.price)||0; let tot=qty*price; sub+=tot;
  let size=it.size||it.variant||'M'; let code=it.code||it.id||k; let name=it.name||'Product';
  let img=getCleanImage(it);
  let fullId=(it.id||it.productId||code||k).toString().trim();
  let link=BASE_URL+"/product.html?id="+encodeURIComponent(fullId);
  return `<div class="item"><img src="${img}" onerror="this.src='https://via.placeholder.com/85'"><div class="item-details"><b>${i+1}. ${name} (Size ${size})</b><br>Qty: ${qty} x ₹${price} = ₹${tot}<br>Code: ${code} | Sold By: Santra Mall<br>Size: ${size}<br><a class="link" href="${link}" target="_blank" style="text-decoration:none;background:#e0f2fe;padding:4px 10px;border-radius:12px;display:inline-block;margin-top:4px">🔗 View Product - Home Image Wala</a></div></div>`;
 }).join("");
 let del=sub>=500?0:49; let grand=sub+del;
 document.getElementById("subTotal").innerText=sub;
 document.getElementById("grandTotal").innerText=grand;
 document.getElementById("deliveryCharge").innerText=del===0?"FREE":"₹"+del;
 window._tot={sub,del,grand};
}

function clearCartCompletely(){
  try{
    localStorage.setItem("santraMallCart_v2", JSON.stringify([]));
    localStorage.setItem("santraMallCart", JSON.stringify([]));
    localStorage.setItem("cart", JSON.stringify([]));
    localStorage.setItem("santraMallCart_v2", "[]");
    localStorage.removeItem("cartItems");
    localStorage.removeItem("CART_KEY");
    localStorage.removeItem("santra_cart");
    if(typeof window.clearCart==='function'){ window.clearCart(); }
    if(window.CART_KEY) localStorage.setItem(window.CART_KEY, JSON.stringify([]));
    document.querySelectorAll('#cartCount,.cart-count,[data-cart-count],#choiceBadge').forEach(el=>{ if(el.id!=='choiceBadge') el.textContent='0'; });
  }catch(e){}
}

function sendOrder(){
 let btn=document.getElementById('sendBtn');
 let name=document.getElementById('name').value.trim();
 let login=document.getElementById('mobile').value.replace(/\D/g,'').slice(-10);
 let extra=document.getElementById('deliveryMobile').value.replace(/\D/g,'').slice(-10);
 let email=document.getElementById('email').value.trim();
 let house=document.getElementById('house').value.trim();
 let area=document.getElementById('area').value.trim();
 let landmark=document.getElementById('landmark').value.trim();
 let pincode=document.getElementById('pincode').value.trim();
 let city=document.getElementById('city').value.trim();
 let state=document.getElementById('state').value.trim();
 let payment=document.getElementById('payment').value||'Cash on Delivery';

 if(!name) return alert('Full Name likho');
 if(login.length!==10) return alert('Login mobile number 10 digit');
 if(!house) return alert('House No likho');
 if(!area) return alert('Area likho');
 if(!pincode) return alert('Pincode likho');

 btn.innerText="⏳ Sending..."; btn.disabled=true;

 let fullAddress=`${house}, ${area}${landmark?', '+landmark:''}, ${city}, ${state} - ${pincode}`;
 let dateStr=new Date().toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
 let cart=getCart();
 let keys=Object.keys(cart);
 let subtotal=0;
 let productLines='';
 keys.forEach((k,i)=>{
   let it=cart[k]; if(!it) return;
   let qty=parseInt(it.qty)||1; let price=parseFloat(it.price)||0; let tot=qty*price; subtotal+=tot;
   let size=it.size||it.variant||'M'; let code=it.code||it.id||k; let nameP=it.name||'Product';
   let cleanId=(it.id||code||k).toString().trim();
   let link=BASE_URL+"/product.html?id="+encodeURIComponent(cleanId);
   productLines+=`${i+1}. ${nameP} (Size ${size})\nSize: ${size}\nQty: ${qty} x ₹${price} = ₹${tot}\nCode: ${code}\nView: ${link}\n\n`;
 });
 let delivery=subtotal>=500?0:49; let grand=subtotal+delivery;

 let text=`🛒 *New Order - SANTRA MALL* 🛒\nOrder ID: ${orderId}\nDate: ${dateStr}\n\n${productLines}━━━━━━━━━━━━━━━━━━\nSubtotal: ₹${subtotal}\nDelivery: ${delivery===0?'FREE':'₹'+delivery}\n*GRAND TOTAL: ₹${grand}*\n━━━━━━━━━━━━━━━━━━\n\n*Customer Details:*\nName: ${name}\nMobile: ${login}\n${extra?`Extra: ${extra}\n`:''}Email: ${email||'-'}\nAddress: ${fullAddress}\nPayment: ${payment}\n\n*>> PLEASE SEND OTP TO CONFIRM <<*`;

 try{
   let cust={name:name, loginMobile:login, mobile:login, extraMobileNumberForDelivery:extra, deliveryMobile:extra, email:email, address:fullAddress, fullAddress:fullAddress, house:house, area:area, landmark:landmark, pincode:pincode, city:city, state:state};
   localStorage.setItem('santra_customer', JSON.stringify(cust));
   localStorage.setItem('santra_mobile', login);
   localStorage.setItem('santra_deliveryMobile', extra);
   // V24 DNA - Name hamesha jo new add kare wo Profile me auto update
   if(window.db) window.db.collection('customers').doc(login).set({name:name, loginMobile:login, deliveryMobile:extra, address:fullAddress, email:email},{merge:true});
 }catch(e){}

 localStorage.setItem('lastOrderId', orderId);
 localStorage.setItem('lastOrderGrandTotal', grand.toString());
 try{
   let arr=Object.values(cart).map(it=>{ return {...it, image:getCleanImage(it), imageUrl:getCleanImage(it), productImage:getCleanImage(it)}; });
   localStorage.setItem('lastOrderCartBackup', JSON.stringify(arr));
 }catch(e){}

 window.open(`https://wa.me/918769171078?text=${encodeURIComponent(text)}`,'_blank');

 try{
   if(window.db || firebase.firestore){
     let db = window.db || firebase.firestore();
     db.collection('orders').doc(orderId).set({
       orderId:orderId, mobile:login, loginMobile:login, deliveryMobile:extra, extraDeliveryMobile:extra,
       name:name, customerName:name, email:email, address:fullAddress, customerAddress:fullAddress, fullAddress:fullAddress,
       cart:Object.values(cart).map(it=>{ return {...it, image:getCleanImage(it), imageUrl:getCleanImage(it), productImage:getCleanImage(it), thumbnail:getCleanImage(it)}; }),
       items:Object.values(cart).map(it=>{ return {...it, image:getCleanImage(it), imageUrl:getCleanImage(it), productImage:getCleanImage(it), thumbnail:getCleanImage(it)}; }),
       paymentMethod:payment, total:grand, subtotal:subtotal, delivery:delivery,
       status:'Pending - OTP Wait - '+payment, dateStr:dateStr,
       createdAt: firebase.firestore.FieldValue.serverTimestamp()
     },{merge:true});
   }
 }catch(e){}

 setTimeout(()=>{
   clearCartCompletely();
   btn.innerText="✅ Sent - Cart Khali";
 }, 500);

 setTimeout(()=>{ location.href=`share-otp-verify.html?mobile=${login}&delivery=${extra}&orderId=${orderId}&payment=${encodeURIComponent(payment)}`; }, 1200);
}
if(!firebase.apps.length){ firebase.initializeApp({apiKey:"AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",authDomain:"santramarketshoppingmall.firebaseapp.com",databaseURL:"https://santramarketshoppingmall-default-rtdb.firebaseio.com/",projectId:"santramarketshoppingmall",storageBucket:"santramarketshoppingmall.appspot.com",messagingSenderId:"398490252924",appId:"1:398490252924:web:d1b6348b549183b93b7bf9"}); }
document.addEventListener("DOMContentLoaded", load);
console.log("✅ Checkout.html V24 FINAL - Old Save + DNA - Bina Version - Fast - LAST LINE OK");
</script>
