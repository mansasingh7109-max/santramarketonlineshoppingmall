<!DOCTYPE html>
<html>

<body>
<div class="card">
  <h2>🏢 Company Details</h2>
  <p><b>Name:</b> <span id="companyName">SANTRA MALL</span></p>
  <p><b>Address:</b> <span id="address">Jaipur, Rajasthan</span></p>
  <p><b>Email:</b> <span id="email">mansasingh7109@gmail.com</span></p>

</div>

<script>
  // Step 1: Firebase Config - YAHAN APNI REAL KEY DAAL
  
  const firebaseConfig = {
    apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
  authDomain: "santramarketshoppingmall.firebaseapp.com",
  projectId: "santramarketshoppingmall",
  storageBucket: "santramarketshoppingmall.firebasestorage.app",
  messagingSenderId: "398490252924",
  appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
  measurementId: "G-ZW1ZR8HETY"
  };

alert("Config test: " + firebaseConfig.projectId);

  // Step 2: Firebase Initialize
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // Step 3: Data Load Kar Firebase Se
  db.collection("settings").doc("company").get().then((doc) => {
    if (doc.exists) {
      const data = doc.data();
      if(data.companyName) document.getElementById("companyName").innerText = data.companyName;
      if(data.address) document.getElementById("address").innerText = data.address;
      if(data.email) document.getElementById("email").innerText = data.email;
      if(data.phone) document.getElementById("phone").innerText = data.phone;
      if(data.businessType) document.getElementById("businessType").innerText = data.businessType;
    }
  }).catch((error) => {
    console.log("Firebase Error:", error);
  });
</script>
  <script src="theme.js"></script>
