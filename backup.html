<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 SANTRA MALL Backup - 5 June 2026</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#1e1e1e;color:#d4d4d4;padding:20px}
   .terminal{background:#000;border:2px solid #0f0;border-radius:8px;padding:20px;max-width:800px;margin:20px auto}
   .header{color:#0f0;font-size:18px;margin-bottom:15px;border-bottom:1px solid #0f0;padding-bottom:10px}
   .btn{background:#0f0;color:#000;border:none;padding:12px 24px;font-weight:bold;border-radius:5px;cursor:pointer;margin:5px;font-size:14px}
   .btn:hover{background:#00ff00}
   #log{background:#111;padding:15px;border-radius:5px;margin-top:15px;height:400px;overflow-y:auto;font-family:monospace;font-size:13px;line-height:1.6}
   .success{color:#0f0}
   .error{color:#f00}
   .info{color:#00bfff}
   .warn{color:#ffa500}
  </style>
</head>
<body>

<div class="terminal">
  <div class="header">🔒 SANTRA MALL BACKUP TERMINAL - 5 JUNE 2026</div>
  
  <button class="btn" onclick="backupFirebase()">📦 Backup Firebase Data</button>
  <button class="btn" onclick="backupLocalStorage()">💾 Backup LocalStorage</button>
  <button class="btn" onclick="createFullBackup()">🔄 Full Backup - All Data</button>
  <button class="btn" onclick="downloadBackup()">⬇️ Download Backup JSON</button>
  
  <div id="log"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// ===== FIREBASE CONFIG - APNA CONFIG DAAL ⚠️ =====
 const firebaseConfig = {
  apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
  authDomain: "santramarketshoppingmall.firebaseapp.com",
  projectId: "santramarketshoppingmall",
  storageBucket: "santramarketshoppingmall.firebasestorage.app",
  messagingSenderId: "398490252924",
  appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
  measurementId: "G-ZW1ZR8HETY"
}; 

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let backupData = {
  backup_date: '2026-06-05',
  backup_time: '',
  location: 'Baswa, Rajasthan',
  firebase: {},
  localStorage: {}
};

function log(msg, type = 'info') {
  const logDiv = document.getElementById('log');
  const time = new Date().toLocaleTimeString('en-IN');
  const className = type;
  logDiv.innerHTML += `<div class="${className}">[${time}] ${msg}</div>`;
  logDiv.scrollTop = logDiv.scrollHeight;
  console.log(msg);
}

async function backupFirebase() {
  log('🔄 Starting Firebase backup for 5 June 2026...', 'info');
  backupData.backup_time = new Date().toISOString();
  
  try {
    // 1. Backup Orders
    log('📦 Backing up orders...', 'info');
    const ordersSnap = await db.collection('orders').get();
    backupData.firebase.orders = [];
    ordersSnap.forEach(doc => {
      backupData.firebase.orders.push({id: doc.id, ...doc.data()});
    });
    log(`✅ Orders backed up: ${backupData.firebase.orders.length} records`, 'success');

    // 2. Backup Products
    log('🛍️ Backing up products...', 'info');
    const productsSnap = await db.collection('products').get();
    backupData.firebase.products = [];
    productsSnap.forEach(doc => {
      backupData.firebase.products.push({id: doc.id, ...doc.data()});
    });
    log(`✅ Products backed up: ${backupData.firebase.products.length} records`, 'success');

    // 3. Backup Counters
    log('🔢 Backing up counters...', 'info');
    const countersSnap = await db.collection('counters').get();
    backupData.firebase.counters = [];
    countersSnap.forEach(doc => {
      backupData.firebase.counters.push({id: doc.id, ...doc.data()});
    });
    log(`✅ Counters backed up: ${backupData.firebase.counters.length} records`, 'success');

    // 4. Backup Customers
    log('👥 Backing up customers...', 'info');
    const customersSnap = await db.collection('customers').get();
    backupData.firebase.customers = [];
    customersSnap.forEach(doc => {
      backupData.firebase.customers.push({id: doc.id, ...doc.data()});
    });
    log(`✅ Customers backed up: ${backupData.firebase.customers.length} records`, 'success');

    log('✅ Firebase backup complete!', 'success');
    log(`📊 Total Records: ${backupData.firebase.orders.length + backupData.firebase.products.length + backupData.firebase.customers.length}`, 'info');
    
  } catch(error) {
    log(`❌ Firebase backup error: ${error.message}`, 'error');
  }
}

function backupLocalStorage() {
  log('💾 Starting LocalStorage backup...', 'info');
  backupData.backup_time = new Date().toISOString();
  
  backupData.localStorage = {
    santra_customer: localStorage.getItem('santra_customer'),
    santra_cart: localStorage.getItem('santra_cart'),
    santra_wishlist: localStorage.getItem('santra_wishlist'),
    santra_orders: localStorage.getItem('santra_orders'),
    pending_orders: []
  };

  // Pending orders backup
  for(let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if(key.startsWith('pending_whatsapp_order_')) {
      backupData.localStorage.pending_orders.push({
        key: key,
        value: localStorage.getItem(key)
      });
    }
  }

  log(`✅ LocalStorage backed up`, 'success');
  log(`📦 Cart items: ${backupData.localStorage.santra_cart ? JSON.parse(backupData.localStorage.santra_cart).length || 0 : 0}`, 'info');
  log(`📦 Pending orders: ${backupData.localStorage.pending_orders.length}`, 'info');
}

async function createFullBackup() {
  log('🔄 ===== FULL BACKUP START - 5 JUNE 2026 =====', 'warn');
  await backupFirebase();
  backupLocalStorage();
  log('✅ ===== FULL BACKUP COMPLETE =====', 'success');
  log('⬇️ Click "Download Backup JSON" to save file', 'info');
}

function downloadBackup() {
  if(!backupData.backup_time) {
    log('⚠️ Pehle backup create karo!', 'warn');
    return;
  }
  
  const dataStr = JSON.stringify(backupData, null, 2);
  const dataBlob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(dataBlob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `santra-mall-backup-2026-06-05-${Date.now()}.json`;
  link.click();
  log(`✅ Backup downloaded: santra-mall-backup-2026-06-05.json`, 'success');
  log(`📊 File size: ${(dataBlob.size / 1024).toFixed(2)} KB`, 'info');
}

// Auto log on load
window.onload = function() {
  log('🔒 SANTRA MALL BACKUP TERMINAL READY', 'success');
  log('📅 Backup Date: 5 June 2026', 'info');
  log('📍 Location: Baswa, Rajasthan', 'info');
  log('⚠️ Click buttons to start backup', 'warn');
};
</script>

</body>
</html>
