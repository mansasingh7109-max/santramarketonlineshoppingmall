<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Order Verify - V27 FINAL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="config.js"></script>
</head><body>
<div><b>Order ID:</b> <span id="orderIdText"></span></div>
<div style="border:2px solid #e40046;padding:12px"><div>🔔 Add OTP - Admin OTP Match Only - 123 wala accept nahi</div>
<input id="orderIdInput" readonly><input id="otpInput" placeholder="6 Digit OTP" maxlength="6" style="text-align:center;letter-spacing:6px">
<button onclick="verifyOTP()">✅ Verify OTP - Admin Match Only</button>
<div id="statusText">Status: Pending - OTP Wait</div></div>

<div id="santrajetHelpCenter" style="border:1.5px solid #d81b60;border-radius:14px;padding:14px;margin:14px 0">
<div style="text-align:center;font-weight:800;color:#d81b60">🆘 Santrajet Mall Help Center - AI Help Box - Formally Product</div>
<select id="helpType"><option>Editing Message</option><option>Return Request</option><option>Exchange Request</option><option>Refund Request</option><option>Order Inquiry - Formally Product</option></select>
<textarea id="helpMsg" rows="3" placeholder="Inquiry / Editing likho"></textarea>
<input type="file" id="helpFile" accept="image/*,video/*" multiple><div id="filePreview"></div>
<button onclick="submitHelpCenter()">📲 WhatsApp - Help - 8769171078 + Firebase Save</button><div id="helpStatus"></div></div>

<div id="ordersPageBox" style="display:none">✅ OTP Verified - Go to Orders Page<br><button onclick="location.href='orders.html?mobile='+encodeURIComponent(mobile)+'&orderId='+encodeURIComponent(orderId)+'&verified=true'">Go to Orders</button></div>

<script>
let orderId=new URLSearchParams(location.search).get('orderId')||localStorage.getItem('lastOrderId')||'';
let mobile=new URLSearchParams(location.search).get('mobile')||localStorage.getItem('santra_mobile')||'9829508335';
document.getElementById('orderIdText').innerText=orderId;document.getElementById('orderIdInput').value=orderId;
async function verifyOTP(){
 let otp=document.getElementById('otpInput').value.replace(/\D/g,'').trim();
 if(otp.length!=6){alert('6 digit OTP likho - Admin ne jo diya wahi');return;}
 let ref=window.db.collection('orders').doc(orderId);let doc=await ref.get();if(!doc.exists){alert('Order nahi mila');return;}
 let data=doc.data();let adminOtp=(data.otp||data.adminOtp||'').toString().trim();
 let cDoc=await window.db.collection('customerOrderOtp').doc(orderId).get();if(cDoc.exists)adminOtp=adminOtp||(cDoc.data().otp||cDoc.data().adminOtp||'').toString().trim();
 let oDoc=await window.db.collection('order_otps').doc(orderId).get();if(oDoc.exists)adminOtp=adminOtp||(oDoc.data().otp||oDoc.data().adminOtp||'').toString().trim();
 let finalOtp=adminOtp;
 if(!finalOtp){alert('❌ Admin ne abhi Firebase me OTP save nahi kiya - admin-customer-order-otp.html me Generate karo - 123 accept nahi hoga');document.getElementById('statusText').innerText='❌ Admin OTP nahi hai - 123 accept nahi';return;}
 if(otp!==finalOtp){alert('❌ Wrong OTP - Admin OTP ('+finalOtp+') wahi dalo - '+otp+' galat hai - Save nahi hoga');document.getElementById('statusText').innerText='❌ Wrong OTP - '+finalOtp+' dalo';return;}
 await ref.set({status:'Confirmed - OTP Saved: '+otp+' - Present - Match Admin - WhatsApp Box Verified',otpVerified:true,customerOTP:otp,savedOTP:otp,presentTag:true,whatsappBox:'verified',lastWAMessage:'✅ WhatsApp Order OTP Saved - Date: '+new Date().toLocaleString('en-IN')},{merge:true});
 document.getElementById('statusText').innerText='✅ Confirmed - Match Admin - WhatsApp Box Hat Gaya';
 document.getElementById('ordersPageBox').style.display='block';
 setTimeout(()=>{location.href='orders.html?mobile='+encodeURIComponent(mobile)+'&orderId='+encodeURIComponent(orderId)+'&verified=true';},1000);
}
async function submitHelpCenter(){
 let type=document.getElementById('helpType').value;let msg=document.getElementById('helpMsg').value||type;
 let files=document.getElementById('helpFile').files;let names=[];let urls=[];
 try{if(files.length>0&&firebase.storage){for(let f of files){let r=firebase.storage().ref().child('helpRequests/'+orderId+'/'+Date.now()+'_'+f.name);await r.put(f);urls.push(await r.getDownloadURL());names.push(f.name);}}}catch(e){}
 await window.db.collection('orders').doc(orderId).set({helpRequested:true,helpRequestType:type,helpMessage:msg,helpFileNames:names,helpFileUrls:urls,presentTag:true},{merge:true});
 window.open("https://wa.me/918769171078?text="+encodeURIComponent(`*HELP - ${type}*\nOrder: ${orderId}\nMsg: ${msg}\nFiles: ${names.join(', ')}`),'_blank');
 document.getElementById('helpStatus').innerText='✅ Help Saved - '+type;
}
</script></body></html>
