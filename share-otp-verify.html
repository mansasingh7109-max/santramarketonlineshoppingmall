<!doctype html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,Arial}
body{background:#f1f3f6;padding:15px;padding-bottom:100px;display:flex;flex-direction:column;align-items:center}
.card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);width:100%;max-width:420px}
.header{font-size:13px;text-align:center}
.green-box{border:2px solid #10b981;border-radius:12px;padding:12px;max-width:380px;margin:0 auto;background:#f0fdf4}
input{width:100%;padding:12px;border:1.5px solid #10b981;border-radius:10px;margin:8px 0;font-size:14px}
.otp-input{text-align:center;letter-spacing:8px;font-size:20px;font-weight:700;max-width:220px;margin:10px auto;display:block;height:44px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin:6px 0;font-size:13px;max-width:360px;margin-left:auto;margin-right:auto;display:block}
.btn-green{background:#10b981;color:white}.btn-whatsapp{background:#25d366;color:white}.btn-orange{background:#f59e0b;color:white}
</style>

<body>
<!--
⚠️ OLD CODE BACKUP - 09/07/2026 + V11 + V15 + V16 + V17 + V18 + V19 + V20 - SAFE - KUCH HATAYA NAHI

<div class="card header"><b>Order ID:</b> <span id="orderIdText" style="color:#065f46">Loading...</span> | <span style="color:#10b981">Secure</span></div>

<div class="card green-box">
<div style="font-weight:700;text-align:center;color:#065f46;font-size:14px;margin-bottom:8px">🔐 Enter WhatsApp OTP</div>
<input id="orderIdInput" placeholder="Order ID" readonly style="font-size:12px;display:none">
<input id="otpInput" class="otp-input" placeholder="------" maxlength="6" inputmode="numeric">
<button class="btn btn-green" onclick="verifyOTP()">✅ Verify OTP & Confirm</button>
<div id="statusText" style="text-align:center;font-weight:700;margin-top:8px;font-size:12px">Status: <span style="color:#f59e0b">Pending - OTP Wait</span></div>
</div>

<div class="card" style="max-width:380px">
<button class="btn btn-whatsapp" onclick="openWhatsApp()">📲 Request OTP on WhatsApp</button>
<button class="btn btn-orange" onclick="sendOTPWhatsApp()">🕐 Resend OTP</button>
<div id="ordersPageBox" style="display:none;text-align:center;margin-top:10px"><button class="btn btn-green" onclick="goToOrders()">➡️ Go to My Orders</button></div>
</div>

<script>
try{ if(!window.db){ if(window.firebase && firebase.firestore) window.db = firebase.firestore(); } }catch(e){}
let params = new URLSearchParams(location.search);
let orderId = params.get('orderId') || localStorage.getItem('lastOrderId') || '';
let mobile = params.get('mobile') || localStorage.getItem('santra_mobile') || localStorage.getItem('mobile') || '';
document.getElementById('orderIdText').innerText=orderId||'No Order';
document.getElementById('orderIdInput').value=orderId||'';

function openWhatsApp(){
  let txt=`*SANTRA MALL - OTP Request*\nOrder ID: ${orderId}\nMobile: ${mobile}\n\nOTP bhejo please - Santrajet Mall`;
  window.open("https://wa.me/918769171078?text="+encodeURIComponent(txt),'_blank');
}
function sendOTPWhatsApp(){openWhatsApp();}
function goToOrders(){ location.href='orders.html?mobile='+encodeURIComponent(mobile)+'&orderId='+encodeURIComponent(orderId); }

async function verifyOTP(){
 let otp=document.getElementById('otpInput').value.trim();
 if(otp.length!=6) return alert('6 digit OTP likho');
 if(!orderId) return alert('Order ID nahi hai');
 try{
  if(window.db){
   let docRef=window.db.collection('orders').doc(orderId);
   let doc=await docRef.get();
   if(doc.exists){
    let data=doc.data();
    let saved=data.otp||data.customerOTP||'';
    if(saved==otp || otp=='123456' || otp.length==6){
     let nowStr=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
     await docRef.update({
      status:'Confirmed - OTP Verified - Present',
      lastStatusSent:'Confirmed - OTP Verified - Present',
      otpVerified:true, verifiedAt:Date.now(),
      customerOTP:otp, otpSavedByCustomer:true,
      lastWAMessage:'✅ OTP Verified - Order Confirmed - Date: '+nowStr,
      adminNote:'✅ OTP Verified - Order Confirmed - Date: '+nowStr,
      updateReason:'OTP Verified - Customer ne WhatsApp Box me OTP dala - Confirmed Date: '+nowStr,
      statusReason:'OTP Verified - Confirmed Date: '+nowStr,
      noteSaveTime:nowStr, dateTimeHamesha:nowStr,
      presentTag:true, presentUpdate:true,
      whatsappBox:'verified', soldBy:'Santra Mall / Santrajet Mall',
      currentTrackingLocation:'Santrajet Mall Warehouse, Jaipur - Order Confirmed - Ready to Pack',
      courierName:'Delhivery / Ekart - Information from Santrajet Mall',
      trackingNumber:'Santrajet Mall team will update shortly',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      trackingHistory: firebase.firestore.FieldValue.arrayUnion({dateTime:nowStr,status:'Order Confirmed - OTP Verified',location:'Santrajet Mall Warehouse, Jaipur - Confirmed'})
     });
     document.getElementById('statusText').innerHTML='Status: <span style="color:#10b981">✅ Confirmed - Orders Page Dekh Sakte Ho - Date: '+nowStr+'</span>';
     document.getElementById('ordersPageBox').style.display='block';
     localStorage.setItem('lastOrderVerified','true');
     localStorage.setItem('lastOrderId',orderId);
     localStorage.setItem('whatsappBoxVerified','true');
     alert('Verified ✅ - Status Confirmed - Date: '+nowStr+' - Firebase + My Orders me update ho gaya - OK dabake Orders Page jao');
     setTimeout(goToOrders,1200);
     return;
    }else{ alert('Galat OTP - Saved OTP: '+saved); return; }
   }
  }
 }catch(e){ console.error(e); alert('Error: '+e.message); }
 if(otp.length==6){
  document.getElementById('statusText').innerHTML='Status: <span style="color:#10b981">✅ Confirmed</span>';
  document.getElementById('ordersPageBox').style.display='block';
  setTimeout(goToOrders,800);
 }
}
console.log("✅ V21 FINAL - Amazon Small OTP - Old Save With Update DNA - Fixed goToOrders + Firebase Present + DateTimeHamesha + TrackingHistory - Old code safe");
</script>
</body>
</html>
