function getEffectiveCategory(p){
  let c = (p.category||p.type||p.subCategory||'').toString().trim();
  if(c) return c.toLowerCase();
  let n = (p.name||'').toLowerCase();
  if(n.includes('frock')) return 'frock';
  if(n.includes('gown')) return 'gown';
  if(n.includes('jeans')||n.includes('denim')) return 'jeans';
  if(n.includes('saree')) return 'saree dress';
  if(n.includes('soap')||n.includes('lux')) return 'soap';
  if(n.includes('jewellery')||n.includes('necklace')||n.includes('bangles')||n.includes('combo')) return 'jewellery';
  if(n.includes('oil')||n.includes('mustard')) return 'oil';
  if(n.includes('vegetable')||n.includes('brinjal')||n.includes('beet')) return 'vegetables';
  if(n.includes('plant')) return 'plant';
  if(n.includes('home wear')) return 'home wear';
  if(n.includes('sandle')) return 'sandle';
  if(n.includes('gallery')) return 'gallery';
  if(n.includes('fashion')) return 'fashion';
  if(n.includes('liquid')) return 'liquid';
  if(n.includes('western')) return 'western dress';
  return 'fashion';
}

  }
  rtdb.ref("categories").on('value', snap => { snap.forEach((child) => { const data = child.val(); addCat(data.name, data); }); allProducts.forEach(p => { addCat(getEffectiveCategory(p), p); if(p.category) addCat(p.category, p); }); allCategories = Array.from(catMap.values()); renderCategories(); });
  db.collection("categories").onSnapshot(snap => { snap.forEach((doc) => { const data = doc.data(); addCat(data.name, data); }); allProducts.forEach(p => { addCat(getEffectiveCategory(p), p); if(p.category) addCat(p.category, p); }); allCategories = Array.from(catMap.values()); renderCategories(); });

function renderCategories() {
  const catList = document.getElementById('catList'); if(!catList) return;

  if(unique.length===0) return;

function renderFilters() {
  const container = document.getElementById('dynamicFilters'); let html = '';

  Object.keys(appliedFilters.variants).forEach(key => { if(appliedFilters.variants[key].length > 0) { products = products.filter(p => { const val = p.variants?.[key] || p[key.toLowerCase()]; return appliedFilters.variants[key].includes(val); }); } });
  if(products.length === 0){ container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#999;padding:40px;">No products found in '+ (currentCategory||'All') +'</p>'; return; }
  container.innerHTML = '<p style="grid-column:1/-1;color:#e40046;font-weight:bold;margin-bottom:8px;">🛍️ '+currentCategory+' - '+products.length+' Products</p>';
  products.forEach(p => {
    const typeImg = categoryStructure.typeImages?.[p.type || p.subCategory];
    let finalImg = window.getBestImageAny(p) || window.getMasterPreviewImage(p.id, p.name) || typeImg || 'https://via.placeholder.com/140?text=No+Image';
    if(!window.isValidHttpImage(finalImg)) finalImg = window.getMasterPreviewImage(p.id, p.name) || 'https://via.placeholder.com/140?text='+encodeURIComponent(p.name||'Product');
    container.innerHTML += `<div class="product-card"><img src="${finalImg}" onerror="this.onerror=null; this.src=window.getMasterPreviewImage('${p.id}','${p.name}')||'https://via.placeholder.com/140?text=No+Image'" alt="${p.name}" onclick="window.location.href='product.html?id=${p.id}'"><h4>${p.name}</h4><div><span class="price">₹${p.price}</span> ${p.mrp > p.price? `<span class="mrp">₹${p.mrp}</span>` : ''}</div><p style="font-size:11px;color:#666;margin:4px 0;">Stock: ${p.stock}</p><button type="button" onclick="addToCart('${p.id}')">Add to Cart</button></div>`;
  });
}

function backToCategories(){ showAll = false; currentCategory = ''; appliedFilters = { type: [], variants: {} }; document.getElementById('productView').classList.add('hide'); document.getElementById('catView').classList.remove('hide'); document.getElementById('pageTitle').innerText = '📱 Categories'; document.getElementById('filtersSidebar').style.display = 'none'; document.getElementById('filterToggle').style.display = 'none'; history.pushState(null,'','category.html'); }
function toggleMobileFilter() { document.getElementById('filtersSidebar').classList.toggle('show'); document.getElementById('filterOverlay').classList.toggle('show'); }
function addToCart(pid){ const product = allProducts.find(p => p.id == pid); if(!product) return; let bestImg = window.getBestImageAny(product) || window.getMasterPreviewImage(product.id, product.name) || product.image; let productWithImg = {...product, image:bestImg, imageUrl:bestImg, httpsUrl:bestImg, imgbb:bestImg, cloudinary:bestImg, lux:bestImg}; let cart = JSON.parse(localStorage.getItem(CART_KEY_VAL) || "[]"); let existing = cart.find(item=> item && item.id==pid); if(existing){ existing.qty = (existing.qty||1)+1; existing.image=bestImg; } else { cart.push({...productWithImg, qty:1}); } localStorage.setItem(CART_KEY_VAL, JSON.stringify(cart)); localStorage.setItem('santra_cart', JSON.stringify(cart)); alert('✅ Added to cart!'); updateCartCount(); }
function updateCartCount(){ try{ let cart = JSON.parse(localStorage.getItem(CART_KEY_VAL) || localStorage.getItem('santra_cart') || "[]"); cart = cart.filter(item => item!== null && item!== undefined); let total = cart.reduce((sum, item) => sum + (item.qty || 1), 0); document.getElementById('cartCount').innerText = total; }catch(e){ document.getElementById('cartCount').innerText = '0'; } }
