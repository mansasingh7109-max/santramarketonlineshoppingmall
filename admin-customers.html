  // ✅ NEW CODE - Orders count bhi live calculate karega
  window.loadCustomers = async function() {
    const custSnap = await db.collection("customers").orderBy("loginTime", "desc").get();
    window.allCustomers = [];
    
    // Har customer ke orders count karo
    for(const doc of custSnap.docs) {
      const c = doc.data();
      let orderCount = 0;
      
      // Orders collection me is mobile ke kitne orders hain
      const orderSnap = await db.collection("orders").where("mobile", "==", c.mobile).get();
      orderCount = orderSnap.size;
      
      window.allCustomers.push({
        id: doc.id,
        ...c,
        orders: orderCount
      });
    }
    
    renderCustomersTable(window.allCustomers);
    document.getElementById('customerCount').innerText = `Total: ${window.allCustomers.length}`;
  }

  function renderCustomersTable(customers) {
    let html = '<table><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Orders</th><th>Total Spent</th><th>Joined</th><th>Last Login</th><th>Action</th></tr></thead><tbody>';
    
    customers.forEach(c => {
      html += `<tr>
        <td><b>${c.name||'N/A'}</b></td>
        <td>${c.mobile||'N/A'}</td>
        <td>${c.email||'N/A'}</td>
        <td><span class="badge-success">${c.orders||0}</span></td>
        <td><span class="badge-blue">₹${c.totalSpent||0}</span></td>
        <td>${c.createdAt? new Date(c.createdAt.seconds*1000).toLocaleDateString() : 'N/A'}</td>
        <td>${c.loginTime? new Date(c.loginTime.seconds*1000).toLocaleString() : 'N/A'}</td>
        <td><button class="btn-small" onclick="viewCustomerOrders('${c.mobile}')">View Orders</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('customersList').innerHTML = html || '<p>No customers found</p>';
  }

  window.viewCustomerOrders = function(mobile) {
    window.location.href = `admin-orders.html?mobile=${mobile}`;
  }

  window.debounceCustomerSearch = function() {
    clearTimeout(window.filterTimeout);
    window.filterTimeout = setTimeout(() => searchCustomers(), 300);
  }

  window.searchCustomers = function() {
    const query = document.getElementById('custSearch').value.toLowerCase();
    if(!query) {
      renderCustomersTable(window.allCustomers);
      document.getElementById('customerCount').innerText = `Total: ${window.allCustomers.length}`;
      return;
    }
    const filtered = window.allCustomers.filter(c => 
      (c.name||'').toLowerCase().includes(query) || 
      (c.mobile||'').includes(query) ||
      (c.email||'').toLowerCase().includes(query)
    );
    renderCustomersTable(filtered);
    document.getElementById('customerCount').innerText = `Total: ${filtered.length}`;
  }
