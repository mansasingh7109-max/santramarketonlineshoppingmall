<head>
  <meta charset="UTF-8">

  <title>👥 Customers - SANTRA MALL</title>
  <style>
    :root{--bg:#f1f3f6;--card:#ffffff;--accent:#e40046;--text:#212121;--border:#e0e0e0;--blue:#3b82f6;--green:#10b981}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:var(--bg);color:var(--text)}
    .header{background:var(--accent);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .header h1{font-size:18px}
    .back-btn{background:none;border:none;color:white;font-size:20px;cursor:pointer}
    .container{max-width:900px;margin:15px auto;padding:0 15px}
    .top-card{background:var(--card);padding:15px;border-radius:8px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
    .search-input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin:10px 0}
    .customer-card{background:var(--card);margin:15px 0;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
    .customer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:15px;border-bottom:2px solid var(--border)}
    .customer-stats{display:flex;gap:15px;margin:10px 0}
    .stat-box{background:#f0f9ff;padding:10px;border-radius:8px;text-align:center;flex:1}
    .stat-box h4{color:#0369a1;font-size:20px;margin:0}
    .stat-box p{color:#666;font-size:12px;margin:5px 0 0}
    .btn{padding:10px 16px;background:var(--accent);color:white;border:none;border-radius:8px;font-weight:bold;font-size:14px;margin:5px;cursor:pointer}
    .btn-blue{background:var(--blue)}
    .btn-green{background:var(--green)}
    .loader{text-align:center;padding:40px;color:var(--accent);font-weight:bold}
    .empty{text-align:center;padding:60px 20px;color:#999}
    .flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    /* Old table style backup */
    table{width:100%;border-collapse:collapse;background:#fff;margin-top:15px}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #dee2e6}
    th{background:#f8f9fa;color:#e40046}
    .badge-success{background:#10b981;color:white;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold}
    .badge-blue{background:#3b82f6;color:white;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold}
    .btn-small{background:#e94560;color:white;border:none;padding:6px 12px;border-radius:5px;cursor:pointer;font-size:12px}
  </style>
</head>
<body>

<div class="header">

</div>

<div class="container">

    <h3>📋 Customer Management</h3>

  // ✅ NEW CODE - Card format + totalSpent + lastOrder
  async function loadCustomers() {
    try {
      document.getElementById('customersList').innerHTML = '<div class="loader">⏳ Loading customers...</div>';
      
      const snapshot = await db.collection('customers').orderBy('lastOrder', 'desc').get();
      allCustomers = [];
      
      if(snapshot.empty) {
        document.getElementById('customersList').innerHTML = '<div class="empty">👥 No customers found<br><br>Customer jab order karega tab yahan dikhega</div>';
        document.getElementById('customerCount').innerText = 'Total: 0';
        return;
      }

      snapshot.forEach(doc => {
        allCustomers.push({id: doc.id, ...doc.data()});
      });
      
      renderCustomers(allCustomers);
    } catch(error) {
      document.getElementById('customersList').innerHTML = `<div class="empty">❌ Error: ${error.message}</div>`;
    }
  }

  function renderCustomers(customers) {
    let html = '';
    document.getElementById('customerCount').innerText = `Total: ${customers.length}`;
    
    if(customers.length === 0) {
      document.getElementById('customersList').innerHTML = '<div class="empty">👥 No customers found</div>';
      return;
    }

    customers.forEach(c => {
      let lastOrder = c.lastOrder ? c.lastOrder.toDate().toLocaleDateString('en-IN', {dateStyle:'medium', timeStyle:'short'}) : 'N/A';
      
      html += `
        <div class="customer-card">
          <div class="customer-header">
            <div>
              <h3>👤 ${c.name || 'Customer'}</h3>
              <p style="color:#666;font-size:13px">📱 ${c.mobile || 'N/A'} | 📧 ${c.email || 'N/A'}</p>
            </div>
          </div>

          <div class="customer-stats">
            <div class="stat-box">
              <h4>${c.totalOrders || 0}</h4>
              <p>Total Orders</p>
            </div>
            <div class="stat-box">
              <h4>₹${c.totalSpent || 0}</h4>
              <p>Total Spent</p>
            </div>
            <div class="stat-box">
              <h4>${c.pincode || 'N/A'}</h4>
              <p>Pincode</p>
            </div>
          </div>

          <p><b>📍 Address:</b> ${c.address || 'N/A'}</p>
          ${c.landmark ? `<p><b>📌 Landmark:</b> ${c.landmark}</p>` : ''}
          <p><b>🏙️ City:</b> ${c.city || 'N/A'}, ${c.state || 'N/A'}</p>
          <p><b>🕐 Last Order:</b> ${lastOrder}</p>

          <div class="flex" style="margin-top:15px">
            <button class="btn btn-blue" onclick="viewCustomerOrders('${c.mobile}')">📦 View Orders</button>
            <a href="https://wa.me/91${c.mobile}" target="_blank">
              <button class="btn btn-green">💬 WhatsApp</button>
            </a>
          </div>
        </div>
      `;
    });
    document.getElementById('customersList').innerHTML = html;
  }

  function searchCustomers() {
    const searchTerm = document.getElementById('searchCustomer').value.toLowerCase().trim();
    if(!searchTerm) {
      renderCustomers(allCustomers);
      return;
    }
    
    const filtered = allCustomers.filter(c =>
      (c.name && c.name.toLowerCase().includes(searchTerm)) ||
      (c.mobile && c.mobile.includes(searchTerm)) ||
      (c.email && c.email.toLowerCase().includes(searchTerm)) ||
      (c.city && c.city.toLowerCase().includes(searchTerm)) ||
      (c.pincode && c.pincode.includes(searchTerm))
    );
    renderCustomers(filtered);
  }

  // ✅ Customer ke sare orders dekhne ke liye
  async function viewCustomerOrders(mobile) {
    try {
      const snapshot = await db.collection('orders').where('mobile', '==', mobile).orderBy('createdAt', 'desc').get();
      
      if(snapshot.empty) {
        alert('No orders found for this customer');
        return;
      }
      
      let orderList = `📦 Orders for ${mobile}:\n\n`;
      let count = 1;
      snapshot.forEach(doc => {
        let o = doc.data();
        let date = o.createdAt ? o.createdAt.toDate().toLocaleDateString('en-IN') : 'N/A';
        orderList += `${count}. ${o.orderNumber || o.id} - ${date} - ₹${o.total || 0} - ${o.status}\n`;
        count++;
      });
      
      alert(orderList);
      // Yahan tu admin-orders.html pe redirect bhi kar sakta hai
      // window.location.href = `admin-orders.html?mobile=${mobile}`;
      
    } catch(error) {
      alert('Error: ' + error.message);
    }
  }

  window.debounceCustomerSearch = function() {
    clearTimeout(window.filterTimeout);
    window.filterTimeout = setTimeout(() => searchCustomers(), 300);
  }

  // Backup localStorage data
  backupLocalStorage: function() {
    const backup = {
      timestamp: new Date().toISOString(),
      orders: localStorage.getItem('santra_orders'),
      customer: localStorage.getItem('santra_customer'),
      cart: localStorage.getItem('santra_cart'),

    };
    
    localStorage.setItem('santra_backup_2026_06_04_1634', JSON.stringify(backup));
    console.log('✅ LocalStorage Backup Created:', backup.timestamp);
    return backup;
  },
  
  // Backup Firebase data before critical operations
  backupFirebaseOrder: function(orderData) {
    const backup = {
      timestamp: new Date().toISOString(),
      orderId: orderData.orderId,
      customer: orderData.customerName,
      mobile: orderData.mobile,
      total: orderData.totalAmount,
      status: orderData.status,
      serialNo: orderData.serialNo
    };
    
    let backups = JSON.parse(localStorage.getItem('santra_firebase_backups') || '[]');
    backups.unshift(backup);
    if(backups.length > 100) backups = backups.slice(0, 100); // Keep last 100
    localStorage.setItem('santra_firebase_backups', JSON.stringify(backups));
    console.log('✅ Firebase Order Backup:', orderData.orderId);
    return backup;
  },
  
  // Restore function
  restore: function() {
    const backup = localStorage.getItem('santra_backup_2026_06_04_1634');
    if(backup) {
      const data = JSON.parse(backup);
      if(confirm('⚠️ Restore backup from ' + data.timestamp + '?')) {
        if(data.orders) localStorage.setItem('santra_orders', data.orders);
        if(data.customer) localStorage.setItem('santra_customer', data.customer);
        if(data.cart) localStorage.setItem('santra_cart', data.cart);
        if(data.wishlist) localStorage.setItem('santra_wishlist', data.wishlist);
        alert('✅ Backup Restored! Reloading...');
        location.reload();
      }
    } else {
      alert('❌ No backup found for 4 June 2026, 4:34 PM');
    }
  },
  
  // View all backups
  viewBackups: function() {
    const backups = JSON.parse(localStorage.getItem('santra_firebase_backups') || '[]');
    console.table(backups);
    return backups;
  },
  
  // Export backup as JSON
  exportBackup: function() {
    const backup = {
      timestamp: '2026-06-04T16:34:00+05:30',
      localStorage: this.backupLocalStorage(),
      firebase: this.viewBackups()
    };
    
    const dataStr = JSON.stringify(backup, null, 2);
    const dataBlob = new Blob([dataStr], {type: 'application/json'});
    const url = URL.createObjectURL(dataBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `santra_mall_backup_2026-06-04_1634.json`;
    link.click();
    console.log('✅ Backup Exported');
  }
};

// Auto backup on page load
