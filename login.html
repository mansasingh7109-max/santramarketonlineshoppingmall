<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Password Reset</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reset-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        h2 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        .btn-email { background: #1976d2; color: white; }
        .btn-email:hover { background: #1565c0; }
        .btn-sms { background: #FF5722; color: white; }
        .btn-sms:hover { background: #E64A19; }
        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px; }
        .msg{padding:12px;border-radius:6px;margin:10px 0;text-align:center;font-weight:bold;font-size:14px}
        .msg-success{background:#d4edda;color:#155724}
        .msg-error{background:#f8d7da;color:#721c24}
    </style>
</head>
<body>
    <div class="reset-box">
        <h2>🔐 Admin Password Reset</h2>
        <p class="subtitle">Choose any one method</p>
        
        <button class="btn btn-email" onclick="resetViaEmail()">📧 Reset via Email Link</button>
        <button class="btn btn-sms" onclick="resetViaSMS()">📱 Reset via SMS OTP</button>
        
        <div id="recaptcha-container"></div>
        <div id="adminMsg"></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
      import { getAuth, sendPasswordResetEmail, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import { app } from './secrets.js';
      
      const auth = getAuth(app);
      const ADMIN_EMAIL = "mansasingh7109@gmail.com";
      const ADMIN_PHONE = "+919829508335";

      window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });

      window.resetViaEmail = async () => {
        const attempts = Number(localStorage.getItem('resetCountEmail') || 0);
        if(Date.now() - Number(localStorage.getItem('lastResetTimeEmail') || 0) > 3600000) localStorage.setItem('resetCountEmail', 0);
        if(attempts >= 3) return alert("Security: 1 ghante me 3 se zyada baar try nahi kar sakte.");
        if(!confirm(`Password reset link ${ADMIN_EMAIL} par bheja jayega?`)) return;
        
        try {
          await sendPasswordResetEmail(auth, ADMIN_EMAIL);
          localStorage.setItem('resetCountEmail', attempts + 1);
          localStorage.setItem('lastResetTimeEmail', Date.now());
          document.getElementById('adminMsg').innerHTML = '<div class="msg msg-success">✅ Email link bheja gaya! Inbox + Spam check karo.</div>';
        } catch (error) { 
          document.getElementById('adminMsg').innerHTML = '<div class="msg msg-error">❌ Error: ' + error.message + '</div>'; 
        }
      }

      window.resetViaSMS = async () => {
        const attempts = Number(localStorage.getItem('resetCountSMS') || 0);
        if(Date.now() - Number(localStorage.getItem('lastResetTimeSMS') || 0) > 3600000) localStorage.setItem('resetCountSMS', 0);
        if(attempts >= 3) return alert("Security: 1 ghante me 3 se zyada OTP nahi. Email use karo.");
        if(!confirm(`SMS OTP ${ADMIN_PHONE} par bheja jayega?`)) return;
        
        try {
          const confirmationResult = await signInWithPhoneNumber(auth, ADMIN_PHONE, window.recaptchaVerifier);
          localStorage.setItem('resetCountSMS', attempts + 1);
          localStorage.setItem('lastResetTimeSMS', Date.now());
          
          const otp = prompt("📱 Phone pe aaya 6 digit OTP daalo:");
          if(!otp) return;
          
          await confirmationResult.confirm(otp);
          document.getElementById('adminMsg').innerHTML = '<div class="msg msg-success">✅ OTP Verified! Ab tum login ho. Admin panel pe ja rahe...</div>';
          setTimeout(() => { window.location.href = 'admin-panel-final.html'; }, 2000);
          
        } catch (error) {
          window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
          document.getElementById('adminMsg').innerHTML = '<div class="msg msg-error">❌ Error: ' + error.message + '</div>';
        }
      }
    </script>
</body>
</html>
