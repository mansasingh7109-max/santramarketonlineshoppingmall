<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 Cart - SANTRA MALL</title>
  
  <!-- FIREBASE ZARURI HAI - BACKUP KE LIYE -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="secrets.js"></script>
  
  <style>
    :root{--bg:#f1f3f6;--card:#ffffff;--accent:#e40046;--text:#212121;--border:#e0e0e0}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:var(--bg);color:var(--text);padding-bottom:20px}
.header{background:var(--accent);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px}
.back-btn{background:none;border:none;color:white;font-size:20px;cursor:pointer}
.cart-item{background:var(--card);margin:10px 15px;border-radius:8px;padding:15px;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.cart-item img{width:80px;height:80px;object-fit:cover;border-radius:6px}
.item-info{flex:1}
.item-info h3{font-size:14px;margin-bottom:5px}
.item-price{color:var(--accent);font-weight:bold;font-size:16px}
.item-code{font-size:11px;color:#999;margin:3px 0}
.item-link{font-size:10px;color:#3b82f6;margin:3px 0;word-break:break-all}
.qty-control{display:flex;align-items:center;gap:8px;margin:8px 0}
.qty-btn{width:30px;height:30px;border:1px solid var(--border);background:white;border-radius:4px;font-size:18px;cursor:pointer}
.qty-btn:active{background:#f0f0f0}
.qty-num{font-weight:bold;min-width:20px;text-align:center}
.remove-btn{color:#ef4444;font-size:13px;cursor:pointer;font-weight:bold;background:none;border:none}
.summary{background:var(--card);margin:15px;border-radius:8px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.summary-row{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
.total-row{font-weight:bold;font-size:18px;border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.checkout-btn{width:calc(100% - 30px);padding:15px;background:#25D366;color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin:15px;cursor:pointer}
.empty{text-align:center;padding:60px 20px;color:#999}
.hide{display:none!important}
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="window.location.href='index.html'">←</button>
  <h1>🛒 My Cart</h1>
</div>

<div id="cartList"></div>

<div id="cartSummary" class="summary hide">
  <h3>Order Summary</h3>
  <div class="summary-row">
    <span>Subtotal:</span>
    <span id="subTotal">₹0</span>
  </div>
  <div class="summary-row">
    <span>Delivery:</span>
    <span style="color:#10b981;font-weight:bold">FREE</span>
  </div>
  <div class="summary-row total-row">
    <span>Total:</span>
    <span id="grandTotal">₹0</span>
  </div>
</div>

<button id="checkoutBtn" class="checkout-btn hide" onclick="placeOrderWhatsApp()">📱 Order on WhatsApp</button>

<script>
// ========== FIREBASE INIT ==========
if (typeof firebase!== 'undefined' && typeof firebaseConfig!== 'undefined') {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  window.firebaseDB = firebase.firestore();
} else {
  console.log('Firebase not connected - secrets.js check karo');
}

// ========== CART LOAD - 14/5/2026 ==========
let cart = [];
let currentCustomer = null;

document.addEventListener('DOMContentLoaded', function() {
  loadCustomer();
  loadCart();
});

function loadCustomer() {
  let cust = localStorage.getItem('santra_customer');
  if(cust) currentCustomer = JSON.parse(cust);
}

function loadCart() {
  cart = JSON.parse(localStorage.getItem('santra_cart') || '[]');
  renderCart();
}

function renderCart() {
  let container = document.getElementById('cartList');
  let summary = document.getElementById('cartSummary');
  let checkoutBtn = document.getElementById('checkoutBtn');

  if(cart.length === 0) {
    container.innerHTML = '<div class="empty">🛒 Your cart is empty<br><br><button class="checkout-btn" onclick="window.location.href=\'index.html\'">Continue Shopping</button></div>';
    summary.classList.add('hide');
    checkoutBtn.classList.add('hide');
    return;
  }

  // ✅ UPDATED - PHOTO + CODE + LINK + PLUS MINUS + REMOVE
  container.innerHTML = cart.map((item, index) => `
    <div class="cart-item">
      <img src="${item.image || 'https://via.placeholder.com/80?text=No+Image'}" onerror="this.src='https://via.placeholder.com/80?text=No+Image'">
      <div class="item-info">
        <h3>${item.name}</h3>
        <div class="item-price">₹${item.price} x ${item.qty} = ₹${item.price * item.qty}</div>
        <div class="item-code">Code: ${item.code || 'N/A'}</div>
        <div class="item-link">🔗 <a href="${item.link || '#'}" target="_blank">View Product</a></div>
        <div class="qty-control">
          <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeItem(${index})">🗑️ Remove</button>
      </div>
    </div>
  `).join('');

  let subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  document.getElementById('subTotal').innerText = '₹' + subtotal;
  document.getElementById('grandTotal').innerText = '₹' + subtotal;

  summary.classList.remove('hide');
  checkoutBtn.classList.remove('hide');
}

// ========== PLUS MINUS FIX - 14/5/2026 ==========
function updateQty(index, change) {
  cart[index].qty += change;
  if(cart[index].qty <= 0) {
    cart.splice(index, 1);
  }
  localStorage.setItem('santra_cart', JSON.stringify(cart));
  loadCart();
}

function removeItem(index) {
  if(confirm('Remove this item from cart?')) {
    cart.splice(index, 1);
    localStorage.setItem('santra_cart', JSON.stringify(cart));
    loadCart();
  }
}

// ========== WHATSAPP ORDER + FIREBASE BACKUP - UPDATED ==========
function placeOrderWhatsApp() {
  if(!currentCustomer) {
    alert('Please login first to order');
    window.location.href = 'index.html';
    return;
  }
  
  if(cart.length === 0) {
    alert('Cart khali hai');
    return;
  }
  
  let totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  let orderId = 'ORD' + Date.now();
  
  // 1. WHATSAPP MESSAGE - CODE + LINK KE SATH
  let message = `*🛍️ SANTRA MALL - New Order* %0A%0A`;
  message += `*Order ID:* ${orderId} %0A`;
  message += `*Date:* ${new Date().toLocaleString('en-IN')} %0A%0A`;
  message += `*Customer Details:* %0A`;
  message += `Name: ${currentCustomer.name} %0A`;
  message += `Phone: ${currentCustomer.mobile} %0A`;
  if(currentCustomer.email) message += `Email: ${currentCustomer.email} %0A`;
  message += `%0A*Order Items:* %0A`;
  
  cart.forEach((item, index) => {
    message += `${index+1}. ${item.name} %0A`;
    message += ` Code: ${item.code || 'N/A'} %0A`;
    message += ` Qty: ${item.qty} | Price: ₹${item.price} %0A`;
    message += ` Link: ${item.link || window.location.origin} %0A%0A`;
  });
  
  message += `*Total Amount: ₹${totalAmount}* %0A%0A`;
  message += `_Order from SANTRA MALL Website_`;
  
  // 2. FIREBASE ME ORDER SAVE KARO - PAST/FUTURE BACKUP
  let orderData = {
    orderId: orderId,
    customerName: currentCustomer.name,
    customerPhone: currentCustomer.mobile,
    customerEmail: currentCustomer.email || '',
    items: cart, // 👈 Poora cart save hoga - code + link ke sath
    totalAmount: totalAmount,
    orderDate: new Date().toISOString(),
    status: 'New'
  };
  
  if(window.firebaseDB) {
    window.firebaseDB.collection("orders").add(orderData).then((docRef) => {
      console.log('✅ Order saved to Firebase:', docRef.id);
    }).catch((error) => {
      console.log('❌ Firebase error:', error);
    });
  }
  
  // 3. AAPKE WHATSAPP PE BHEJO
  let yourNumber = "919829508335"; // 👈 Yahan apna WhatsApp number 91 ke saath
  let url = `https://wa.me/${yourNumber}?text=${message}`;
  window.open(url, '_blank');
  
  // 4. CART CLEAR KARO
  setTimeout(() => {
    localStorage.removeItem('santra_cart');
    alert('✅ Order place ho gaya! WhatsApp check karo.');
    window.location.href = 'index.html';
  }, 1000);
}
</script>

</body>
</html>
