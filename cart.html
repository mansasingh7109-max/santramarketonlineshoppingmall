<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 My Cart - SANTRA MALL</title>
  <style>
    :root{--bg:#f1f3f6;--card:#ffffff;--accent:#e40046;--text:#212121;--border:#e0e0e0}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:var(--bg);color:var(--text);padding-bottom:70px}
   .header{background:var(--accent);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
   .header h1{font-size:18px}
   .back-btn{background:none;border:none;color:white;font-size:20px;cursor:pointer}
   .tabs{display:flex;background:var(--card);margin:10px 15px;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
   .tab{flex:1;padding:12px;text-align:center;font-weight:bold;cursor:pointer;border:none;background:transparent;color:#666}
   .tab.active{background:var(--accent);color:white}
   .cart-item{background:var(--card);margin:10px 15px;border-radius:8px;padding:15px;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
   .cart-item img{width:80px;height:80px;object-fit:contain;background:#f9f9;border-radius:6px}
   .item-info{flex:1}
   .item-info h3{font-size:14px;margin-bottom:5px}
   .item-price{color:var(--accent);font-weight:bold;font-size:16px}
   .item-code{font-size:11px;color:#999;margin:3px 0}
   .qty-control{display:flex;align-items:center;gap:8px;margin:8px 0}
   .qty-btn{width:30px;height:30px;border:1px solid var(--border);background:white;border-radius:4px;font-size:18px;cursor:pointer}
   .qty-num{font-weight:bold;min-width:20px;text-align:center}
   .remove-btn{color:#ef4444;font-size:13px;cursor:pointer;font-weight:bold;background:none;border:none;margin-right:10px}
   .wish-btn{color:#ff6b6b;font-size:18px;cursor:pointer;background:none;border:none}
   .summary{background:var(--card);margin:15px;border-radius:8px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
   .summary-row{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
   .total-row{font-weight:bold;font-size:18px;border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
   .checkout-btn{width:100%;padding:15px;background:var(--accent);color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin:15px;cursor:pointer}
   .checkout-btn:disabled{background:#ccc;cursor:not-allowed}
   .empty{text-align:center;padding:60px 20px;color:#999}
   .hide{display:none!important}
    input,select,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:4px}
    label{display:block;margin-top:12px;font-size:14px;color:#333}
   .loader{display:none;text-align:center;padding:10px;color:#e40046;font-weight:bold}
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="window.location.href='index.html'">←</button>
  <h1 id="pageTitle">🛒 My Cart</h1>
</div>

<div class="tabs">
  <button class="tab active" id="cartTab" onclick="switchTab('cart')">🛒 Cart (<span id="cartCount">0</span>)</button>
  <button class="tab" id="wishTab" onclick="switchTab('wishlist')">😍 Wishlist (<span id="wishCount">0</span>)</button>
</div>

<div id="cartView">
  <div id="cartList"></div>
  <div id="cartSummary" class="summary hide">
    <h3>Order Summary</h3>
    <div class="summary-row">
      <span>Subtotal:</span>
      <span id="subTotal">₹0</span>
    </div>
    <div class="summary-row">
      <span>Delivery:</span>
      <span id="deliveryCharge" style="color:#10b981;font-weight:bold">FREE</span>
    </div>
    <div class="summary-row total-row">
      <span>Total:</span>
      <span id="grandTotal">₹0</span>
    </div>

    <h4 style="margin:20px 0 10px;">Delivery Details</h4>
    <label>Full Name *</label>
    <input type="text" id="custName" placeholder="Enter your name">
    <label>Mobile Number *</label>
    <input type="tel" id="custMobile" placeholder="10 digit mobile" maxlength="10">
    <label>Email (Optional)</label>
    <input type="email" id="custEmail" placeholder="your@email.com">
    <label>Complete Address *</label>
    <textarea id="custAddress" rows="3" placeholder="House no, Street, City, Pincode"></textarea>
    <label>Payment Mode *</label>
    <select id="custPayment">
      <option value="">Select Payment</option>
      <option value="COD">Cash on Delivery</option>
      <option value="Online">Online Payment - Pay After Confirmation</option>
    </select>

    <div class="loader" id="loader">⏳ Placing your order...</div>
  </div>
  <button id="checkoutBtn" class="checkout-btn hide" onclick="placeOrder()">📦 Place Order</button>
</div>

<div id="wishlistView" class="hide">
  <div id="wishList"></div>
</div>

<!-- FIREBASE SDK - COMPAT VERSION -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// ===== FIREBASE CONFIG - APNI KEY DAAL =====
const firebaseConfig = {
  apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
  authDomain: "santramarketshoppingmall.firebaseapp.com",
  projectId: "santramarketshoppingmall",
  storageBucket: "santramarketshoppingmall.firebasestorage.app",
  messagingSenderId: "398490252924",
  appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
  measurementId: "G-ZW1ZR8HETY"
};

// ===== FIREBASE INIT =====
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== TERA CODE =====
const WISHLIST_KEY = 'SANTRA_WISHLIST';
const CART_KEY = 'SANTRA_CART';

let cart = [];
let wishlist = [];
let currentTab = 'cart';

document.addEventListener('DOMContentLoaded', function() {
  let customer = localStorage.getItem('santra_customer');
  if(customer){
    let custData = JSON.parse(customer);
    document.getElementById('custName').value = custData.name || '';
    document.getElementById('custMobile').value = custData.mobile || '';
  }
  loadCart();
  loadWishlist();
  updateCounts();
});

function switchTab(tab){
  currentTab = tab;
  document.getElementById('cartTab').classList.toggle('active', tab === 'cart');
  document.getElementById('wishTab').classList.toggle('active', tab === 'wishlist');
  document.getElementById('cartView').classList.toggle('hide', tab!== 'cart');
  document.getElementById('wishlistView').classList.toggle('hide', tab!== 'wishlist');
  document.getElementById('pageTitle').innerText = tab === 'cart'? '🛒 My Cart' : '😍 My Wishlist';
}

function getImageUrl(item) {
  let img = item.imageUrl || item.img || item.mediaUrl || item.image || item.photo || item.thumbnail || item.src || '';
  img = String(img).trim();
  if(img.startsWith('data:image') && img.length > 50000) return '';
  if(img.length > 5) return img;
  return 'https://via.placeholder.com/80x80/e40046/ffffff?text=NO+IMAGE';
}

function loadCart() {
  cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
  cart = cart.filter(item => item && item.id && item.name && item.price > 0).map(item => ({
    id: item.id,
    name: item.name || 'Product',
    price: parseFloat(item.price) || 0,
    image: getImageUrl(item),
    code: item.code || item.sku || item.product_code || 'N/A',
    qty: parseInt(item.qty) || 1
  }));
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  renderCart();
  updateCounts();
}

function renderCart() {
  let container = document.getElementById('cartList');
  let summary = document.getElementById('cartSummary');
  let checkoutBtn = document.getElementById('checkoutBtn');

  if(cart.length === 0) {
    container.innerHTML = '<div class="empty">🛒 Your cart is empty<br><br><button class="checkout-btn" onclick="window.location.href=\'index.html\'">Continue Shopping</button></div>';
    summary.classList.add('hide');
    checkoutBtn.classList.add('hide');
    return;
  }

  container.innerHTML = cart.map((item, index) => {
    let imgSrc = getImageUrl(item);
    let productCode = item.code || 'N/A';
    let qty = item.qty || 1;
    let price = item.price || 0;

    return `
    <div class="cart-item">
      <img src="${imgSrc}" onerror="this.onerror=null;this.src='https://via.placeholder.com/80x80/e40046/ffffff?text=NO+IMAGE'">
      <div class="item-info">
        <h3>${item.name}</h3>
        <div class="item-price">₹${price} x ${qty} = ₹${price * qty}</div>
        <div class="item-code">Code: ${productCode}</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
        </div>
        <div>
          <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
          <button class="wish-btn" onclick="moveToWishlist(${index})" title="Move to Wishlist">😍</button>
        </div>
      </div>
    </div>
  `;
  }).join('');

  let subtotal = cart.reduce((sum, item) => sum + ((item.price || 0) * (item.qty || 1)), 0);
  let delivery = subtotal >= 500? 0 : 49;
  let total = subtotal + delivery;

  document.getElementById('subTotal').innerText = '₹' + subtotal;
  document.getElementById('deliveryCharge').innerText = delivery === 0? 'FREE' : '₹' + delivery;
  document.getElementById('grandTotal').innerText = '₹' + total;
  summary.classList.remove('hide');
  checkoutBtn.classList.remove('hide');
}

function updateQty(index, change) {
  cart[index].qty = (cart[index].qty || 1) + change;
  if(cart[index].qty <= 0) {
    cart.splice(index, 1);
  }
  saveCart();
  loadCart();
}

function removeItem(index) {
  if(confirm('Remove this item from cart?')) {
    cart.splice(index, 1);
    saveCart();
    loadCart();
  }
}

function moveToWishlist(index){
  let item = cart[index];
  let wishItem = wishlist.find(w => w.id === item.id);
  if(wishItem){
    wishItem.qty = (wishItem.qty || 1) + (item.qty || 1);
  } else {
    wishlist.push({...item, qty: item.qty || 1});
  }
  cart.splice(index, 1);
  saveCart();
  saveWishlist();
  loadCart();
  loadWishlist();
  alert('Moved to Wishlist 😍');
}

function saveCart(){
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCounts();
}

function loadWishlist() {
  wishlist = JSON.parse(localStorage.getItem(WISHLIST_KEY) || '[]');
  wishlist = wishlist.filter(item => item && item.id && item.name && item.price > 0).map(item => ({
    id: item.id,
    name: item.name || 'Product',
    price: parseFloat(item.price) || 0,
    image: getImageUrl(item),
    code: item.code || item.sku || item.product_code || 'N/A',
    qty: parseInt(item.qty) || 1
  }));
  localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
  renderWishlist();
  updateCounts();
}

function renderWishlist(){
  let container = document.getElementById('wishList');
  if(wishlist.length === 0) {
    container.innerHTML = '<div class="empty">😍 Your wishlist is empty<br><br><button class="checkout-btn" onclick="window.location.href=\'index.html\'">Browse Products</button></div>';
    return;
  }
  container.innerHTML = wishlist.map((item, index) => {
    let imgSrc = getImageUrl(item);
    let productCode = item.code || 'N/A';
    let qty = item.qty || 1;

    return `
    <div class="cart-item">
      <img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/80x80/e40046/ffffff?text=NO+IMAGE'">
      <div class="item-info">
        <h3>${item.name}</h3>
        <div class="item-price">₹${item.price || 0}</div>
        <div class="item-code">Code: ${productCode}</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="updateWishQty(${index}, -1)">-</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" onclick="updateWishQty(${index}, 1)">+</button>
        </div>
        <div>
          <button class="remove-btn" onclick="removeWishItem(${index})">Remove</button>
          <button class="wish-btn" onclick="moveToCart(${index})" title="Move to Cart" style="color:var(--accent)">🛒</button>
        </div>
      </div>
    </div>
  `;
  }).join('');
}

function updateWishQty(index, change) {
  wishlist[index].qty = (wishlist[index].qty || 1) + change;
  if(wishlist[index].qty <= 0) {
    wishlist.splice(index, 1);
  }
  saveWishlist();
  loadWishlist();
}

function removeWishItem(index) {
  if(confirm('Remove from wishlist?')) {
    wishlist.splice(index, 1);
    saveWishlist();
    loadWishlist();
  }
}

function moveToCart(index){
  let item = wishlist[index];
  let cartItem = cart.find(c => c.id === item.id);
  if(cartItem){
    cartItem.qty = (cartItem.qty || 1) + (item.qty || 1);
  } else {
    cart.push({
      id: item.id,
      name: item.name,
      price: item.price || 0,
      image: getImageUrl(item),
      code: item.code || 'N/A',
      qty: item.qty || 1
    });
  }
  wishlist.splice(index, 1);
  saveCart();
  saveWishlist();
  loadCart();
  loadWishlist();
  alert('Moved to Cart 🛒');
  switchTab('cart');
}

function saveWishlist(){
  localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
  updateCounts();
}

function updateCounts(){
  let cartCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
  let wishCount = wishlist.length;
  document.getElementById('cartCount').innerText = cartCount;
  document.getElementById('wishCount').innerText = wishCount;
}

async function placeOrder(){
  if(typeof db === 'undefined') {
    alert('❌ ERROR: Database connect nahi hua');
    console.error('db is undefined');
    return;
  }

  if(cart.length === 0){
    alert('Cart khali hai! Pehle product add karo.');
    return;
  }

  let name = document.getElementById('custName').value.trim();
  let mobile = document.getElementById('custMobile').value.trim();
  let address = document.getElementById('custAddress').value.trim();
  let payment = document.getElementById('custPayment').value;
  let email = document.getElementById('custEmail').value.trim();

  if(!name ||!mobile ||!address ||!payment){
    alert('Naam, Mobile, Address aur Payment mode bharna zaroori hai');
    return;
  }

  if(mobile.length!== 10 || isNaN(mobile)){
    alert('Please enter valid 10-digit mobile number!');
    return;
  }

  document.getElementById('loader').style.display = 'block';
  document.getElementById('loader').innerText = '⏳ Placing your order...';
  document.getElementById('checkoutBtn').disabled = true;
  document.getElementById('checkoutBtn').innerText = '⏳ Processing...';

  let subtotal = cart.reduce((sum, item) => sum + ((item.price || 0) * (item.qty || 1)), 0);
  let delivery = subtotal >= 500? 0 : 49;
  let total = subtotal + delivery;

  const orderId = 'SM' + Date.now();
  const orderDate = new Date().toLocaleString('en-IN', {timeZone: 'Asia/Kolkata'});

  const orderData = {
    orderId: orderId,
    customerName: name,
    customerMobile: mobile,
    customerEmail: email,
    customerAddress: address,
    items: cart,
    subtotal: subtotal,
    delivery: delivery,
    totalAmount: total,
    paymentMode: payment,
    status: "Placed",
    orderDate: firebase.firestore.FieldValue.serverTimestamp(),
    orderDateString: orderDate
  };

  try {
    await db.collection("orders").add(orderData);
    console.log('✅ Order saved to Firebase');

    localStorage.setItem(CART_KEY, JSON.stringify([]));

    document.getElementById('loader').style.display = 'none';
    document.getElementById('cartView').innerHTML = `
      <div style="text-align:center;padding:40px 20px;">
        <div style="font-size:60px;color:#25D366;margin-bottom:15px">✅</div>
        <h2 style="color:#25D366;margin-bottom:10px">Order Placed Successfully!</h2>
        <p style="color:#666;margin-bottom:5px">Order ID: <b>${orderId}</b></p>
        <p style="color:#666;margin-bottom:20px">We will contact you on <b>${mobile}</b> shortly.</p>
        <button class="checkout-btn" onclick="window.location.href='index.html'">Continue Shopping</button>
      </div>
    `;

    updateCounts();

  } catch (error) {
    console.error('Firebase Error:', error);
    alert('❌ Error placing order: ' + error.message);
    document.getElementById('loader').style.display = 'none';
    document.getElementById('checkoutBtn').disabled = false;
    document.getElementById('checkoutBtn').innerText = '📦 Place Order';
  }
}

window.addToWishlist = function(product){
  let item = wishlist.find(w => w.id === product.id);
  if(item){
    item.qty = (item.qty || 1) + 1;
  } else {
    wishlist.push({...product, qty: 1});
  }
  saveWishlist();
  alert('Added to Wishlist 😍');
}
</script>
</body>
</html>
