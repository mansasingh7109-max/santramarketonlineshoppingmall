<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 My Cart - SANTRA MALL</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">

</head>
<body>

<div class="header">
  <button class="back-btn" onclick="window.location.href='index.html'">←</button>
  <h1 id="pageTitle">🛒 My Cart</h1>
</div>

<div class="tabs">
  <button class="tab active" id="cartTab" onclick="switchTab('cart')">🛒 Cart (<span id="cartCount">0</span>)</button>
  <button class="tab" id="wishTab" onclick="switchTab('wishlist')">😍 Wishlist (<span id="wishCount">0</span>)</button>
</div>

<div id="cartView">
  <div id="cartList"></div>

  <!-- DELIVERY DETAILS FORM - FULL UPDATED -->
  <div class="delivery-details" id="deliveryForm">
    <div class="summary">
      <h3 style="color:var(--accent);margin-bottom:15px">📋 Delivery Details</h3>

      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="custName" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label>Mobile Number *</label>
        <input type="tel" id="custPhone" placeholder="10 digit mobile number" maxlength="10" required>
      </div>

      <div class="form-group">
        <label>Email (Optional)</label>
        <input type="email" id="custEmail" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label>House No. / Building *</label>
        <input type="text" id="houseNo" placeholder="Flat no, Building name" required>
      </div>

      <div class="form-group">
        <label>Area / Street *</label>
        <input type="text" id="area" placeholder="Area, Street" required>
      </div>

      <div class="form-group">
        <label>Landmark *</label>
        <input type="text" id="landmark" placeholder="Near temple, school, etc" required>
      </div>

      <div class="form-group">
        <label>Pincode *</label>
        <input type="tel" id="pincode" placeholder="6 digit pincode" maxlength="6" required>
      </div>

      <div class="form-group">
        <label>City *</label>
        <input type="text" id="city" placeholder="Your city name" required>
      </div>

      <div class="form-group">
        <label>State *</label>
        <input type="text" id="state" placeholder="Your state name" required>
      </div>

      <div class="form-group">
        <label>Special Instructions</label>
        <textarea id="instructions" rows="2" placeholder="Any delivery instructions"></textarea>
      </div>

      <div class="form-group">
        <label>Payment Mode *</label>
        <select id="payMode" required>
          <option value="">Select Payment</option>
          <option value="COD">Cash on Delivery (COD)</option>
          <option value="Online">Online Payment - OTP</option>
        </select>
      </div>
    </div>
  </div>

  <div id="cartSummary" class="summary hide">
    <h3>Order Summary</h3>
    <div class="summary-row">
      <span>Subtotal:</span>
      <span id="subTotal">₹0</span>
    </div>
    <div class="summary-row">
      <span>Delivery:</span>
      <span id="deliveryCharge" style="color:#10b981;font-weight:bold">FREE</span>
    </div>
    <div class="summary-row total-row">
      <span>Total:</span>
      <span id="grandTotal">₹0</span>
    </div>
  </div>

  <button id="checkoutBtn" class="checkout-btn hide" onclick="checkoutOrder()">
    📲 Order on WhatsApp + Email
  </button>

  <button id="oldBackupBtn" class="checkout-btn hide" onclick="sendOldFormatMessage()" style="background:#10b981;margin-top:8px;">📱 Old Format Backup</button>
</div>

<div id="wishlistView" class="hide">
  <div id="wishList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
 // Teri Firebase Config Yaha
   const firebaseConfig = {
  apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
  authDomain: "santramarketshoppingmall.firebaseapp.com",
  projectId: "santramarketshoppingmall",
  storageBucket: "santramarketshoppingmall.firebasestorage.app",
  messagingSenderId: "398490252924",
  appId: "1:398490252924:web:d1b6348b549183b93b7bf9",
  measurementId: "G-ZW1ZR8HETY"
};

let db;
try {
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  db = firebase.firestore();
  console.log('✅ Firebase Connected');
} catch(e) {
  console.log('⚠️ Firebase not connected');
}

const WISHLIST_KEY = 'SANTRA_WISHLIST';
const CART_KEY = 'SANTRA_CART';
const ADMIN_WHATSAPP = '918769171078';
const ADMIN_EMAIL = 'santramall@gmail.com'; // ← Apna Email Daal

let cart = [];
let wishlist = [];
let currentTab = 'cart';

document.addEventListener('DOMContentLoaded', function() {
  loadCart();
  loadWishlist();
  updateCounts();
  const urlParams = new URLSearchParams(window.location.search);
  if(urlParams.get('admin') === 'santra123'){
    document.getElementById('oldBackupBtn').classList.remove('hide');
  }
});

function switchTab(tab){
  currentTab = tab;
  document.getElementById('cartTab').classList.toggle('active', tab === 'cart');
  document.getElementById('wishTab').classList.toggle('active', tab === 'wishlist');
  document.getElementById('cartView').classList.toggle('hide', tab!== 'cart');
  document.getElementById('wishlistView').classList.toggle('hide', tab!== 'wishlist');
  document.getElementById('pageTitle').innerText = tab === 'cart'? '🛒 My Cart' : '😍 My Wishlist';
}

function getImageUrl(item) {
  let img = item.imageUrl || item.img || item.mediaUrl || item.image || item.photo || item.thumbnail || item.src || '';
  img = String(img).trim();
  if(img.startsWith('data:image') && img.length > 50000) return '';
  if(img.length > 5) return img;
  return 'https://via.placeholder.com/80x80/4CAF50/ffffff?text=NO+IMAGE';
}

function getProductLink(productId) {
  const baseUrl = window.location.origin;
  const pathName = window.location.pathname;
  let productPath = '/product.html';
  if(pathName.includes('/santramarketonlineshoppingmall')){
      productPath = '/santramarketonlineshoppingmall/product.html';
  }
  return `${baseUrl}${productPath}?id=${encodeURIComponent(productId)}`;
}

function loadCart() {
  cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
  cart = cart.filter(item => item && item.id && item.name && item.price > 0).map(item => ({
    id: item.id,
    name: item.name || 'Product',
    price: parseFloat(item.price) || 0,
    image: getImageUrl(item),
    code: item.code || item.sku || item.product_code || 'N/A',
    category: item.category || 'General',
    serial_no: item.serial_no || item.code || item.id || 'N/A',
    qty: parseInt(item.qty) || 1,
    variant: item.variant || 'Default'
  }));
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  renderCart();
  updateCounts();
}

function renderCart() {
  let container = document.getElementById('cartList');
  let summary = document.getElementById('cartSummary');
  let checkoutBtn = document.getElementById('checkoutBtn');
  let deliveryForm = document.getElementById('deliveryForm');

  if(cart.length === 0) {
    container.innerHTML = '<div class="empty">🛒 Your cart is empty<br><br><button class="checkout-btn" onclick="window.location.href=\'index.html\'">Continue Shopping</button></div>';
    summary.classList.add('hide');
    checkoutBtn.classList.add('hide');
    deliveryForm.classList.add('hide');
    return;
  }

  deliveryForm.classList.remove('hide');

  container.innerHTML = cart.map((item, index) => {
    let imgSrc = getImageUrl(item);
    let productCode = item.code || 'N/A';
    let qty = item.qty || 1;
    let price = item.price || 0;

    return `
    <div class="cart-item">
      <img src="${imgSrc}" onerror="this.onerror=null;this.src='https://via.placeholder.com/80x80/4CAF50/ffffff?text=NO+IMAGE'">
      <div class="item-info">
        <h3>${item.name}</h3>
        <div class="item-price">₹${price} x ${qty} = ₹${price * qty}</div>
        <div class="item-code">Code: ${productCode} | Series: ${item.serial_no} | Variant: ${item.variant}</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
        </div>
        <div>
          <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
          <button class="wish-btn" onclick="moveToWishlist(${index})" title="Move to Wishlist">😍</button>
        </div>
      </div>
    </div>
  `;
  }).join('');

  let subtotal = cart.reduce((sum, item) => sum + ((item.price || 0) * (item.qty || 1)), 0);
  let delivery = subtotal >= 500? 0 : 49;
  let total = subtotal + delivery;

  document.getElementById('subTotal').innerText = '₹' + subtotal;
  document.getElementById('deliveryCharge').innerText = delivery === 0? 'FREE' : '₹' + delivery;
  document.getElementById('grandTotal').innerText = '₹' + total;
  summary.classList.remove('hide');
  checkoutBtn.classList.remove('hide');
}

function updateQty(index, change) {
  cart[index].qty = (cart[index].qty || 1) + change;
  if(cart[index].qty <= 0) cart.splice(index, 1);
  saveCart();
  loadCart();
}

function removeItem(index) {
  if(confirm('Remove this item from cart?')) {
    cart.splice(index, 1);
    saveCart();
    loadCart();
  }
}

function moveToWishlist(index){
  let item = cart[index];
  let wishItem = wishlist.find(w => w.id === item.id && w.variant === item.variant);
  if(wishItem){
    wishItem.qty = (wishItem.qty || 1) + (item.qty || 1);
  } else {
    wishlist.push({...item, qty: item.qty || 1});
  }
  cart.splice(index, 1);
  saveCart();
  saveWishlist();
  loadCart();
  loadWishlist();
  alert('Moved to Wishlist 😍');
}

function saveCart(){
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCounts();
}

function loadWishlist() {
  wishlist = JSON.parse(localStorage.getItem(WISHLIST_KEY) || '[]');
  wishlist = wishlist.filter(item => item && item.id && item.name && item.price > 0).map(item => ({
    id: item.id,
    name: item.name || 'Product',
    price: parseFloat(item.price) || 0,
    image: getImageUrl(item),
    code: item.code || item.sku || item.product_code || 'N/A',
    category: item.category || 'General',
    serial_no: item.serial_no || item.code || item.id || 'N/A',
    qty: parseInt(item.qty) || 1,
    variant: item.variant || 'Default'
  }));
  localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
  renderWishlist();
  updateCounts();
}

function renderWishlist(){
  let container = document.getElementById('wishList');
  if(wishlist.length === 0) {
    container.innerHTML = '<div class="empty">😍 Your wishlist is empty<br><br><button class="checkout-btn" onclick="window.location.href=\'index.html\'">Browse Products</button></div>';
    return;
  }
  container.innerHTML = wishlist.map((item, index) => {
    let imgSrc = getImageUrl(item);
    let productCode = item.code || 'N/A';
    let qty = item.qty || 1;

    return `
    <div class="cart-item">
      <img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/80x80/4CAF50/ffffff?text=NO+IMAGE'">
      <div class="item-info">
        <h3>${item.name}</h3>
        <div class="item-price">₹${item.price || 0}</div>
        <div class="item-code">Code: ${productCode} | Series: ${item.serial_no} | Variant: ${item.variant}</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="updateWishQty(${index}, -1)">-</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" onclick="updateWishQty(${index}, 1)">+</button>
        </div>
        <div>
          <button class="remove-btn" onclick="removeWishItem(${index})">Remove</button>
          <button class="wish-btn" onclick="moveToCart(${index})" title="Move to Cart" style="color:var(--accent)">🛒</button>
        </div>
      </div>
    </div>
  `;
  }).join('');
}

function updateWishQty(index, change) {
  wishlist[index].qty = (wishlist[index].qty || 1) + change;
  if(wishlist[index].qty <= 0) wishlist.splice(index, 1);
  saveWishlist();
  loadWishlist();
}

function removeWishItem(index) {
  if(confirm('Remove from wishlist?')) {
    wishlist.splice(index, 1);
    saveWishlist();
    loadWishlist();
  }
}

function moveToCart(index){
  let item = wishlist[index];
  let cartItem = cart.find(c => c.id === item.id && c.variant === item.variant);
  if(cartItem){
    cartItem.qty = (cartItem.qty || 1) + (item.qty || 1);
  } else {
    cart.push({
      id: item.id,
      name: item.name,
      price: item.price || 0,
      image: getImageUrl(item),
      code: item.code || 'N/A',
      category: item.category || 'General',
      serial_no: item.serial_no || 'N/A',
      qty: item.qty || 1,
      variant: item.variant || 'Default'
    });
  }
  wishlist.splice(index, 1);
  saveCart();
  saveWishlist();
  loadCart();
  loadWishlist();
  alert('Moved to Cart 🛒');
  switchTab('cart');
}

function saveWishlist(){
  localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
  updateCounts();
}

function updateCounts(){
  let cartCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
  let wishCount = wishlist.length;
  document.getElementById('cartCount').innerText = cartCount;
  document.getElementById('wishCount').innerText = wishCount;
}

// ===== UPDATED CHECKOUT - SABHI FIELDS KE SAATH =====
function checkoutOrder(){
  if(cart.length === 0){
    alert('Cart khali hai!');
    return;
  }

  // SABHI FIELDS UTHAO
  let name = document.getElementById('custName').value.trim();
  let phone = document.getElementById('custPhone').value.trim();
  let email = document.getElementById('custEmail').value.trim();
  let houseNo = document.getElementById('houseNo').value.trim();
  let area = document.getElementById('area').value.trim();
  let landmark = document.getElementById('landmark').value.trim();
  let pincode = document.getElementById('pincode').value.trim();
  let city = document.getElementById('city').value.trim();
  let state = document.getElementById('state').value.trim();
  let instructions = document.getElementById('instructions').value.trim();
  let payment = document.getElementById('payMode').value;

  // VALIDATION
  if(!name ||!phone ||!houseNo ||!area ||!landmark ||!pincode ||!city ||!state ||!payment){
    alert('⚠️ Please fill all required fields!');
    return;
  }

  if(phone.length!== 10 ||!/^[6-9]\d{9}$/.test(phone)){
    alert('⚠️ Please enter valid 10 digit mobile number');
    return;
  }

  if(pincode.length!== 6 ||!/^\d{6}$/.test(pincode)){
    alert('⚠️ Please enter valid 6 digit pincode');
    return;
  }

  let orderId = 'SM' + Date.now();
  let date = new Date().toLocaleString('en-IN');
  let itemsText = '';
  let subtotal = 0;

  // SABHI PRODUCTS + SERIES + LINK
  cart.forEach((item, index) => {
    let itemTotal = item.price * item.qty;
    subtotal += itemTotal;
    let productLink = getProductLink(item.id);

    itemsText += `${index + 1}. ${item.id} | ${item.name} x ${item.qty} = Rs.${itemTotal}\n`;
    itemsText += `Variant: ${item.variant}\n`;
    itemsText += `Series: ${item.serial_no}\n`;
    itemsText += `Category: ${item.category}\n`;
    itemsText += `🔗 Product Link: ${productLink}\n\n`;
  });

  let delivery = subtotal >= 500? 0 : 49;
  let total = subtotal + delivery;

  // FINAL MESSAGE - SABHI DETAILS KE SAATH
  let message = `🛍️ *NEW ORDER REQUEST* #${orderId}\n`;
  message += `📅 *Date:* ${date}\n\n`;
  message += `*👤 CUSTOMER DETAILS:*\n`;
  message += `Name: ${name}\n`;
  message += `Phone: ${phone}\n`;
  if(email) message += `Email: ${email}\n`;
  message += `Address: ${houseNo}, ${area}, ${landmark}, ${city}, ${state} - ${pincode}\n`;
  if(instructions) message += `Instructions: ${instructions}\n`;
  message += `Payment: ${payment}\n\n`;
  message += `*📦 ORDER ITEMS:*\n`;
  message += `${itemsText}`;
  message += `💰 Subtotal: Rs.${subtotal}\n`;
  message += `🚚 Delivery: ${delivery === 0? 'FREE' : 'Rs.' + delivery}\n`;
  message += `💵 *Total Amount: Rs.${total}*\n\n`;
  message += `📍 ACTION: Confirm order & dispatch\n`;
  message += `🔔 Sent to SANTRA - Wait for confirmation`;

  // 1. WHATSAPP ME BHEJO
  let whatsappUrl = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(message)}`;
  window.open(whatsappUrl, '_blank');

  // 2. GMAIL ME BHI BHEJO - SAME MESSAGE
  setTimeout(() => {
    let subject = `New Order #${orderId} - SANTRA MALL`;
    let gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${ADMIN_EMAIL}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
    window.open(gmailUrl, '_blank');
  }, 1500);

  // FIREBASE + CART CLEAR
  saveOrderToFirebase(orderId, cart, total, {name, phone, email, houseNo, area, landmark, pincode, city, state, instructions, payment});
  clearCartAfterOrder();
}

function sendOldFormatMessage() {
  if(cart.length === 0){
    alert('Cart khali hai!');
    return;
  }
  let item = cart[0];
  let productLink = getProductLink(item.id);
  let message = `🛒 *ORDER REQUEST* - SANTRA MALL\n\n*Product:* ${item.name}\n*Price:* Rs.${item.price} x ${item.qty} = Rs.${item.price * item.qty}\n*Variant:* ${item.variant}\n*Code:* ${item.serial_no || item.id}\n*Link:* ${productLink}\n\n💰 Total: Rs.${item.price * item.qty}\n\n📍 Confirm this order`;
  let whatsappUrl = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(message)}`;
  window.open(whatsappUrl, '_blank');

  setTimeout(() => {
    let gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${ADMIN_EMAIL}&su=Old Format Order&body=${encodeURIComponent(message)}`;
    window.open(gmailUrl, '_blank');
  }, 1000);

  localStorage.removeItem(CART_KEY);
  cart = [];
  renderCart();
  updateCounts();
  alert('✅ Old format sent to WhatsApp + Gmail!\n\nCart cleared!');
}

function clearCartAfterOrder(){
  localStorage.removeItem(CART_KEY);
  cart = [];
  renderCart();
  updateCounts();
  alert('✅ Order sent to WhatsApp + Gmail!\n\nCart cleared successfully!');
}

function saveOrderToFirebase(orderId, cartItems, total, customer) {
  if(typeof db === 'undefined' ||!db) {
    console.log('⚠️ Firebase skip');
    return;
  }
  try {
    db.collection('orders').doc(orderId).set({
      orderId: orderId,
      customer: customer,
      items: cartItems,
      totalAmount: total,
      status: 'pending',
      source: 'cart.html',
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      console.log('✅ Order saved: ' + orderId);
    }).catch((error) => {
      console.log('❌ Firebase save failed:', error);
    });
  } catch(e) {
    console.log('Firebase error:', e);
  }
}

window.addToCart = function(product){
  let item = cart.find(c => c.id === product.id && c.variant === (product.variant || 'Default'));
  if(item){
    item.qty = (item.qty || 1) + 1;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      price: product.price || 0,
      image: getImageUrl(product),
      code: product.code || product.product_code || 'N/A',
      category: product.category || 'General',
      serial_no: product.serial_no || product.code || 'N/A',
      qty: 1,
      variant: product.variant || 'Default'
    });
  }
  saveCart();
  loadCart();
  alert('Added to Cart 🛒');
}

window.addToWishlist = function(product){
  let item = wishlist.find(w => w.id === product.id && w.variant === (product.variant || 'Default'));
  if(item){
    item.qty = (item.qty || 1) + 1;
  } else {
    wishlist.push({
      id: product.id,
      name: product.name,
      price: product.price || 0,
      image: getImageUrl(product),
      code: product.code || product.product_code || 'N/A',
      category: product.category || 'General',
      serial_no: product.serial_no || product.code || 'N/A',
      qty: 1,
      variant: product.variant || 'Default'
    });
  }
  saveWishlist();
  loadWishlist();
  alert('Added to Wishlist 😍');
}
</script>

</body>
