:root{--bg:#fff8e1;--accent:#ff5722;--green:#10b981;--orange:#ff9800}
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,Arial}
body{background:var(--bg);padding-bottom:180px}
.header{background:linear-gradient(90deg,#ff9800,#e91e63);color:#fff;padding:14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.header h1{font-size:14px;flex:1}.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:18px;padding:6px 10px;border-radius:8px;cursor:pointer}
.today-strip{background:#e8f5e9;border:1px solid #10b981;padding:6px 10px;border-radius:8px;margin:8px 15px;font-size:11px;font-weight:bold;text-align:center;color:#065f46}
.tabs{display:flex;background:#fff;margin:10px 15px;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tab{flex:1;padding:12px 6px;text-align:center;font-weight:600;cursor:pointer;border:none;background:transparent;font-size:13px}
.tab.active{background:var(--accent);color:#fff}
.cart-card{background:#fff!important;border-radius:12px;padding:15px;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:15px;border:1px solid #ffe0b2;position:relative}
.cart-card img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #eee;flex-shrink:0}
.item-info{flex:1;min-width:0}.item-info h3{font-size:14px}.item-price{color:var(--accent);font-weight:700;margin:5px 0}.item-code{font-size:11px;color:#666}
.qty-controls{display:flex;gap:8px;align-items:center;margin-top:10px}.qty-btn{background:#eee;border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px}
.item-actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}.btn-move-choice,.btn-remove{color:#fff;border:none;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;width:100%}
.btn-move-choice{background:var(--orange)}.btn-remove{background:#ef4444}
.summary{background:#fff;margin:15px;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.summary-row{display:flex;justify-content:space-between;margin:10px 0}.total-row{font-weight:700;font-size:18px;border-top:2px solid #e0e0e0;padding-top:12px;margin-top:12px}
.btn-send-all{background:linear-gradient(135deg,#25d366,#ff5722);padding:16px;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;width:100%;font-size:14px}
.btn-pdf{background:#7c3aed;padding:14px;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;width:100%;margin-top:10px;font-size:14px}
.checkout-btn{position:fixed;bottom:70px;left:15px;right:15px;background:var(--accent);color:#fff;border:none;padding:16px;border-radius:12px;font-weight:700;cursor:pointer;z-index:50;text-align:center;display:block;text-decoration:none}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 12px;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:999}
.nav-item{text-align:center;text-decoration:none;color:#666;flex:1;padding:5px;font-size:12px}
#myChoiceList,#cartList{display:flex!important;flex-direction:column!important;gap:15px!important;padding:15px!important}
.hide{display:none!important}
.top-select-bar{background:#fff;margin:0 15px 10px;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:10px}
.heart-btn-cart{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.95);font-size:16px;cursor:pointer;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.cart-popup-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:999999;display:none;align-items:center;justify-content:center;padding:12px}
.cart-popup-overlay.show{display:flex!important}
.cart-popup-box{background:#fff;border-radius:16px;padding:16px;max-width:480px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.6);border:3px solid #ff6a00;max-height:92vh;overflow-y:auto}
.cart-popup-input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;margin:6px 0;font-size:14px;box-sizing:border-box}
.cart-popup-label{font-size:12px;font-weight:bold;margin-top:8px;display:block;color:#333}
.cart-btn-wa{width:100%;padding:14px;background:#25D366;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:12px;font-size:15px}
.cart-btn-cancel{width:100%;padding:12px;background:#f3f4f6;color:#333;border:none;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}
</style>

function loadData(){
  try{
    let cartArray=JSON.parse(localStorage.getItem(window.CART_KEY)||"[]");

function renderMyChoice(){
  let c=document.getElementById("myChoiceList"), k=Object.keys(myChoice), topBar=document.getElementById("choiceTopBar");
  if(k.length===0){ c.innerHTML=`<div style='text-align:center;padding:60px 20px;color:#999'>❤️ My Choice Empty</div>`; if(topBar) topBar.style.display="none"; updateCounts(); return; }
  if(topBar) topBar.style.display="flex";
  c.innerHTML=k.map(key=>{
    let i=myChoice[key]; let p=parseFloat(i.price)||0;
    return `<div class="cart-card"><input type="checkbox" class="choice-check" data-key="${key}" style="width:18px;height:18px"><img src="${i.image||'https://via.placeholder.com/90?text=Food'}"><div class="item-info"><h3>${i.name||"Food"}</h3><div style="color:#e40046;font-weight:700;">₹${p}</div><div style="font-size:11px;color:#666">${i.category||'Food'}</div><div style="display:flex;gap:8px;margin-top:10px;"><button type="button" onclick="moveToCart('${key}')" style="background:#10b981;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;flex:1">🛒 Move to Cart</button><button type="button" onclick="removeFromChoice('${key}')" style="background:#ef4444;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;flex:1">🗑 Remove</button></div></div></div>`;
  }).join(""); updateCounts();
}
function toggleHeartFromCart(id){ try{ let item=cart[id]||myChoice[id]; if(!item) return; let fav=JSON.parse(localStorage.getItem(window.MYCHOICE_KEY)||"[]"); let idx=fav.findIndex(f=>f.id===id); if(idx>-1) fav.splice(idx,1); else fav.push({...item}); localStorage.setItem(window.MYCHOICE_KEY, JSON.stringify(fav)); loadData(); }catch(e){} }
function updateQty(id,ch){ if(!cart[id]) return; cart[id].qty=(parseInt(cart[id].qty)||1)+ch; if(cart[id].qty<1) delete cart[id]; saveCart(); renderCart(); }
function removeFromCart(id){ delete cart[id]; saveCart(); renderCart(); }
function moveToMyChoice(id){ let i=cart[id]; if(!i) return; delete cart[id]; saveCart(); myChoice[id]={...i}; delete myChoice[id].qty; saveMyChoice(); renderCart(); renderMyChoice(); }
function moveToCart(id){ let i=myChoice[id]; if(!i) return; delete myChoice[id]; saveMyChoice(); cart[id]={...i,qty:i.qty||1}; saveCart(); renderCart(); renderMyChoice(); }
function removeFromChoice(id){ delete myChoice[id]; saveMyChoice(); renderMyChoice(); }
function toggleAllCart(checked){ document.querySelectorAll(".cart-check").forEach(c=>c.checked=checked); }
function toggleAllChoice(checked){ document.querySelectorAll(".choice-check").forEach(c=>c.checked=checked); }
function moveSelectedToChoice(){ let checks=[...document.querySelectorAll(".cart-check:checked")]; if(!checks.length) return alert("Select item first"); checks.forEach(ch=>{ let key=ch.dataset.key; if(cart[key]){ myChoice[key]={...cart[key]}; delete cart[key]; } }); saveCart(); saveMyChoice(); renderCart(); renderMyChoice(); }
function removeSelectedCart(){ let checks=[...document.querySelectorAll(".cart-check:checked")]; if(!checks.length) return alert("Select item first"); checks.forEach(ch=>{ let key=ch.dataset.key; delete cart[key]; }); saveCart(); renderCart(); }
function moveSelectedToCart(){ let checks=[...document.querySelectorAll(".choice-check:checked")]; if(!checks.length) return alert("Select item first"); checks.forEach(ch=>{ let key=ch.dataset.key; if(myChoice[key]){ cart[key]={...myChoice[key],qty:1}; delete myChoice[key]; } }); saveCart(); saveMyChoice(); renderCart(); renderMyChoice(); }
function removeSelectedChoice(){ let checks=[...document.querySelectorAll(".choice-check:checked")]; if(!checks.length) return alert("Select item first"); checks.forEach(ch=>{ let key=ch.dataset.key; delete myChoice[key]; }); saveMyChoice(); renderMyChoice(); }
function saveCart(){ let arr=Object.values(cart); localStorage.setItem(window.CART_KEY, JSON.stringify(arr)); localStorage.setItem("restro_cart", JSON.stringify(arr)); localStorage.setItem("restroCart_v2", JSON.stringify(arr)); localStorage.setItem("santraMallCart_v2", JSON.stringify([])); localStorage.setItem("santra_cart", JSON.stringify([])); }
function saveMyChoice(){ localStorage.setItem(window.MYCHOICE_KEY, JSON.stringify(Object.values(myChoice))); }
function updateCounts(){ let c=Object.values(cart).reduce((a,i)=>a+(parseInt(i.qty)||1),0); document.getElementById("cartCount").innerText=c; document.getElementById("choiceCount").innerText=Object.keys(myChoice).length; }

function openCartPopup(){
  let arr=Object.values(cart); if(!arr.length){ alert("Cart empty"); return; }
  try{
    let customer={}; try{ customer=JSON.parse(localStorage.getItem('restro_customer')||localStorage.getItem('santra_customer')||'{}'); }catch(e){}
    document.getElementById('cartPopupName').value=customer.name||localStorage.getItem('popup_name')||'Manisha tak';
    document.getElementById('cartPopupMobile').value=customer.loginMobile||customer.mobile||localStorage.getItem('restro_mobile')||'9660834888';
    document.getElementById('cartPopupExtraMobile').value=customer.deliveryMobile||localStorage.getItem('restro_deliveryMobile')||'';
    document.getElementById('cartPopupEmail').value=customer.email||localStorage.getItem('popup_email')||'Manishatak07@gmail.com';
    document.getElementById('cartPopupFullAddr').value=customer.address||localStorage.getItem('popup_fulladdr')||'45, Sastrasardar, Lachu, JODHPUR';
    document.getElementById('cartPopupCity').value=customer.city||localStorage.getItem('popup_city')||'Jaipur, Rajasthan';
    document.getElementById('cartPopupPincode').value=customer.pincode||localStorage.getItem('popup_pincode')||'302012';
    let summary=arr.map(it=>`${it.name||'Food'} x${it.qty||1}`).join(', ');
    let sub=arr.reduce((a,i)=>a+(parseFloat(i.price)||0)*(parseInt(i.qty)||1),0);
    document.getElementById('cartPopupOrderSummary').innerText=summary;
    document.getElementById('cartPopupTotal').innerText='₹'+(sub+80);
  }catch(e){}
  let overlay=document.getElementById('cartPopupOverlay'); overlay.classList.add('show'); overlay.style.display='flex';
}

  }
}
