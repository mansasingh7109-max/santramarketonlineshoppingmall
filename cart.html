<script>
let cart={};let myChoice={};let t={presentDate:'',presentTime:''};
function initTimeFix(){try{if(typeof getISTNow==='function'){t=getISTNow();document.getElementById('todayBar').innerText=`Aaj: ${t.presentDate} ${t.presentTime}`;document.getElementById('clock').innerText=t.presentTime||'';document.getElementById('todayDateBar').innerText=t.presentDate;}}catch(e){}}
initTimeFix();setInterval(initTimeFix,60000);
window.switchTab=function(tab){document.getElementById("cartTab").classList.toggle("active",tab==="cart");document.getElementById("choiceTab").classList.toggle("active",tab==="choice");document.getElementById("cartView").classList.toggle("hide",tab!=="cart");document.getElementById("choiceView").classList.toggle("hide",tab!=="choice");if(tab==="choice")renderMyChoice();else renderCart();};
function loadData(){if(!window.CART_KEY){setTimeout(loadData,100);return;}loadFromLocal();}
function loadFromLocal(){
  try{
    let cartArray=[];let raw=localStorage.getItem(window.CART_KEY||'santraMallCart_v2');
    if(raw){try{let p=JSON.parse(raw);cartArray=Array.isArray(p)?p:Object.values(p);}catch(e){}}
    let allCache=[]; try{ ["santram_products_v1","santram_products_backup","santra_6way_backup","sm","santra_all_products_cache","allProductsCache","santra_all_products","allProducts"].forEach(function(k){ try{ let v=localStorage.getItem(k)||sessionStorage.getItem(k); if(v) allCache=allCache.concat(JSON.parse(v)); }catch(e){} }); if(window.allProducts) allCache=allCache.concat(window.allProducts); }catch(e){}
    cart={};let seen={};
    cartArray.forEach(function(item){
      if(!item) return;
      if(item.name==="Product" && (!item.price||item.price==0)) return;
      let id=(item.id||'').toString().trim(); if(!id||id.includes('[object Object]')) return;
      let baseId=window.getBaseId(id);
      let isBad=!item.image||!window.isValidHttpImage(item.image)||String(item.image).includes('blob:');
      if(isBad){
        let real=allCache.find(function(x){ return window.getBaseId(x.id||x.code||"")===baseId; });
        if(!real&&item.name) real=allCache.find(function(x){ return String(x.name||"").toLowerCase().includes(String(item.name||"").toLowerCase().split(' ')[0]); });
        if(real){ let good=window.getUniversalImage(real); if(window.isValidHttpImage(good)){ item.image=good; item.imageUrl=good; } }
      }
      if(seen[id]){ if(cart[id]) cart[id].qty=(parseInt(cart[id].qty)||1)+(parseInt(item.qty)||1); }
      else{ seen[id]=true; cart[id]=item; if(!cart[id].qty||cart[id].qty<1) cart[id].qty=1; }
    });
    try{ localStorage.setItem(window.CART_KEY||'santraMallCart_v2', JSON.stringify(Object.values(cart))); }catch(e){}
    let wishRaw=localStorage.getItem(window.MYCHOICE_KEY); let wishArray=[]; if(wishRaw){try{let p=JSON.parse(wishRaw);wishArray=Array.isArray(p)?p:[];}catch(e){}}
    myChoice={};let seenW={}; wishArray.forEach(function(item){ if(!item) return; let id=(item.id||item.code||'').toString().trim(); if(!id||seenW[id]) return; seenW[id]=true; myChoice[id]=item; });
  }catch(e){cart={};myChoice={};}
  renderCart();renderMyChoice();updateCounts();
}
function openProductPage(id){if(!id)return;let base=window.getBaseId(id);let url=`product.html?id=${base}`;try{window.top.location.href=url;}catch(e){window.open(url,'_blank');}}
function renderCart(){
 let c=document.getElementById("cartList"),s=document.getElementById("cartSummary"),b=document.getElementById("checkoutBtn"),k=Object.keys(cart),topBar=document.getElementById("cartTopBar");
 if(k.length===0){c.innerHTML="<div style='text-align:center;padding:80px 20px;color:#999'>🛒 Your cart is empty</div>";s.classList.add("hide");b.style.display="none";if(topBar)topBar.style.display="none";updateCounts();return;}
 b.style.display="block";if(topBar)topBar.style.display="flex";
 c.innerHTML=k.map(function(key){
  let i=cart[key],q=parseInt(i.qty)||1,p=parseFloat(i.price)||0,id=i.id||key;
  let img=window.getSafeImage(i);
  return `<div class="cart-card"><input type="checkbox" class="cart-check" data-key="${key}" style="width:18px;height:18px"><img src="${img}" alt="${i.name}" loading="lazy" onclick="openProductPage('${id}')" onerror="this.onerror=null;fetchImageFromDB('${id}',this)"><div class="item-info"><h3 onclick="openProductPage('${id}')">${i.name||"Product"}</h3><div class="item-price">₹${p} x ${q} = ₹${p*q}</div><div class="item-code">Code: ${i.productCode||i.code||key} | Size: ${i.size||'M'}</div><div class="qty-controls"><button class="qty-btn" onclick="updateQty('${key}',-1)">-</button><span class="qty-display">${q}</span><button class="qty-btn" onclick="updateQty('${key}',1)">+</button></div><div class="item-actions"><button class="btn-move-choice" onclick="moveToMyChoice('${key}')">😍 Move to My Choice</button><button class="btn-share" onclick="shareProduct('${id}')">🔗 Share</button><button class="btn-remove" onclick="removeFromCart('${key}')">🗑 Remove</button></div></div></div>`;
 }).join("");
 let sub=Object.values(cart).reduce(function(a,i){return a+(parseFloat(i.price)||0)*(parseInt(i.qty)||1);},0),del=sub>=500?0:49,tot=sub+del,items=Object.values(cart).reduce(function(a,i){return a+(parseInt(i.qty)||1);},0);
 document.getElementById("subTotal").innerText="₹"+sub;document.getElementById("deliveryCharge").innerText=del===0?"FREE":"₹"+del;document.getElementById("grandTotal").innerText="₹"+tot;document.getElementById("cartTotal").innerText=tot;document.getElementById("itemCount").innerText=items;s.classList.remove("hide");updateCounts();
 k.forEach(function(key){ let i=cart[key]; if(!window.isValidHttpImage(window.getUniversalImage(i))) fetchImageFromDB(i.id||key,null); });
}
function fetchImageFromDB(productId,imgEl){
  if(!productId) return;
  let base=window.getBaseId(productId);
  function setImg(url){
    if(!url||!window.isValidHttpImage(url)) return false;
    if(imgEl) imgEl.src=url;
    if(cart[productId]){cart[productId].image=url;cart[productId].imageUrl=url;saveCart();}
    return true;
  }
  let cached=window.getUniversalImage({id:productId})||window.getUniversalImage({id:base});
  if(cached&&setImg(cached)) return;
  if(window.db){
    window.db.collection('products').doc(productId).get().then(function(doc){
      if(doc.exists){let im=window.getUniversalImage(doc.data()); if(setImg(im)) return;}
      return window.db.collection('products').doc(base).get();
    }).then(function(doc2){
      if(doc2&&doc2.exists){ let im=window.getUniversalImage(doc2.data()); if(setImg(im)) return; }
      return window.db.collection('all_products_backup').doc(base).get();
    }).then(function(doc3){
      if(doc3&&doc3.exists){ let im=window.getUniversalImage(doc3.data()); setImg(im); }
    }).catch(function(){
      if(window.rtdb){ window.rtdb.ref('products/'+base).once('value').then(function(s){ if(s.exists()) setImg(window.getUniversalImage(s.val())); }); }
    });
  }
}
function renderMyChoice(){let c=document.getElementById("myChoiceList"),k=Object.keys(myChoice),topBar=document.getElementById("choiceTopBar");if(k.length===0){c.innerHTML=`<div style="text-align:center;padding:80px 20px;color:#999">😍 My Choice is Empty</div>`;if(topBar)topBar.style.display="none";updateCounts();return;}if(topBar)topBar.style.display="flex";c.innerHTML=k.map(function(key){let i=myChoice[key];if(!i)return"";let p=parseFloat(i.price)||0,id=i.id||key,img=window.getSafeImage(i);return`<div class="cart-card"><input type="checkbox" class="choice-check" data-key="${key}" style="width:18px;height:18px"><img src="${img}" onclick="openProductPage('${id}')" onerror="this.src='https://via.placeholder.com/90x90?text=No+Image'"><div class="item-info"><h3 onclick="openProductPage('${id}')">${i.name||"Product"}</h3><div style="color:#e40046;font-weight:700;">₹${p}</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;"><button onclick="moveToCart('${key}')" style="background:#10b981;color:white;border:none;padding:12px;border-radius:8px;font-weight:600;">🛒 Move to Cart</button><button onclick="removeFromChoice('${key}')" style="background:#ef4444;color:white;border:none;padding:12px;border-radius:8px;font-weight:600;">🗑 Remove</button></div></div></div>`;}).join("");updateCounts();}
function updateQty(id,ch){if(!cart[id])return;cart[id].qty=(parseInt(cart[id].qty)||1)+ch;if(cart[id].qty<1)delete cart[id];saveCart();renderCart();}
function removeFromCart(id){delete cart[id];saveCart();renderCart();}
function moveToMyChoice(id){let i=cart[id];if(!i)return;delete cart[id];saveCart();myChoice[id]={...i};delete myChoice[id].qty;saveMyChoice();renderCart();renderMyChoice();}
function moveToCart(id){let i=myChoice[id];if(!i)return;delete myChoice[id];saveMyChoice();cart[id]={...i,qty:i.qty||1};saveCart();renderCart();renderMyChoice();}
function removeFromChoice(id){delete myChoice[id];saveMyChoice();renderMyChoice();}
function toggleAllCart(checked){document.querySelectorAll(".cart-check").forEach(function(c){c.checked=checked;});}
function toggleAllChoice(checked){document.querySelectorAll(".choice-check").forEach(function(c){c.checked=checked;});}
function moveSelectedToChoice(){let checks=[...document.querySelectorAll(".cart-check:checked")];if(!checks.length)return alert("Select item first");checks.forEach(function(ch){let key=ch.dataset.key;if(cart[key]){myChoice[key]={...cart[key]};delete cart[key];}});saveCart();saveMyChoice();renderCart();renderMyChoice();}
function removeSelectedCart(){let checks=[...document.querySelectorAll(".cart-check:checked")];if(!checks.length)return alert("Select item first");checks.forEach(function(ch){let key=ch.dataset.key;delete cart[key];});saveCart();renderCart();}
function moveSelectedToCart(){let checks=[...document.querySelectorAll(".choice-check:checked")];if(!checks.length)return alert("Select item first");checks.forEach(function(ch){let key=ch.dataset.key;if(myChoice[key]){cart[key]={...myChoice[key],qty:1};delete myChoice[key];}});saveCart();saveMyChoice();renderCart();renderMyChoice();}
function removeSelectedChoice(){let checks=[...document.querySelectorAll(".choice-check:checked")];if(!checks.length)return alert("Select item first");checks.forEach(function(ch){let key=ch.dataset.key;delete myChoice[key];});saveMyChoice();renderMyChoice();}
function saveCart(){let arr=Object.values(cart);localStorage.setItem(window.CART_KEY||'santraMallCart_v2',JSON.stringify(arr));}
function saveMyChoice(){let arr=Object.values(myChoice);localStorage.setItem(window.MYCHOICE_KEY||'santraMallMyChoice_v2',JSON.stringify(arr));}
function updateCounts(){let c=Object.values(cart).reduce(function(a,i){return a+(parseInt(i.qty)||1);},0);document.getElementById("cartCount").innerText=c;document.getElementById("choiceCount").innerText=Object.keys(myChoice).length;}
function shareProduct(id){ let base=window.getBaseId(id); let item=cart[id]; if(!item){ for(let k in cart){ let cid=String(cart[k].id||"").trim(); if(cid===String(id).trim()||window.getBaseId(cid)===base){ item=cart[k]; id=k; break; } } } if(item&&typeof window.shareProductDirect==='function'){ window.shareProductDirect(item); } else if(typeof window.shareSingleProduct==='function'){ window.shareSingleProduct(id); } else { alert("Share not ready - "+id); } }
function sendOrderToAll(){ if(typeof window.shareCart==='function'){ window.shareCart(); return; } alert("share.js not loaded"); }
async function generateAndSharePDF(){ if(Object.keys(cart).length===0){ alert("Cart empty!"); return; } try{ if(!window.jspdf||!window.jspdf.jsPDF){ alert("PDF library not loading"); return; } const {jsPDF}=window.jspdf; let doc=new jsPDF(); let now=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}); let sub=Object.values(cart).reduce((a,i)=>a+(parseFloat(i.price)||0)*(parseInt(i.qty)||1),0); let del=sub>=500?0:49; let tot=sub+del; let orderId="SM"+Date.now(); let name=localStorage.getItem('santra_customer_name')||'Customer'; let mob=localStorage.getItem('santra_mobile')||''; doc.setFontSize(16); doc.setFont("helvetica","bold"); doc.text("SANTRA MALL - INVOICE",105,15,{align:"center"}); doc.setFontSize(10); doc.setFont("helvetica","normal"); doc.text("Date: "+now,10,25); doc.text("Order ID: "+orderId,10,30); doc.text("Customer: "+name+" | Mobile: "+mob,10,35); doc.setFontSize(11); doc.setFont("helvetica","bold"); doc.text("Items:",10,45); let y=52; let count=1; doc.setFontSize(10); doc.setFont("helvetica","normal"); Object.values(cart).forEach(item=>{ let qty=parseInt(item.qty)||1; let price=parseFloat(item.price)||0; let line=count+". "+(item.name||"Product")+" | Code: "+(item.productCode||item.code||"")+" | Qty: "+qty+" x Rs."+price+" = Rs."+(qty*price); if(line.length>95) line=line.substring(0,92)+"..."; doc.text(line,10,y); y+=7; count++; if(y>270){ doc.addPage(); y=20; } }); y+=5; doc.setFont("helvetica","bold"); doc.text("Subtotal: Rs."+sub,10,y); y+=7; doc.text("Delivery: "+(del===0?"FREE":"Rs."+del),10,y); y+=7; doc.text("Grand Total: Rs."+tot,10,y); y+=10; doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text("Thank you for shopping at SANTRA MALL!",10,y); doc.save("SANTRA_MALL_Invoice_"+orderId+".pdf"); }catch(e){ alert("PDF Error: "+e.message); } }
