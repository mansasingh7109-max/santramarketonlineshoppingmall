            function addToChoiceFromMessage(p) {
                if(typeof window.addToWishlist === 'function') window.addToWishlist(p);
                else {
                    let id = p.id || p.productId || p.code; if (!id) return;

            function loadData() {
                if(!window.CART_KEY) { setTimeout(loadData, 100); return; }
                if(window.auth && window.auth.currentUser && window.rtdb) {
                    window.auth.onAuthStateChanged(user => {
                        if (user) {
                            window.rtdb.ref("users/" + user.uid + "/cart").once("value").then(s => {
                                cart = {}; if (s.exists()) s.forEach(c => { cart[c.key] = c.val(); });
                                renderCart(); updateCounts();
                            });
                            window.rtdb.ref("users/" + user.uid + "/myChoice").once("value").then(s => {
                                myChoice = {}; if (s.exists()) s.forEach(c => { myChoice[c.key] = c.val(); });
                                updateCounts(); renderMyChoice();
                            });
                        } else { loadFromLocal(); }
                    });
                } else { loadFromLocal(); }
            }

            function loadFromLocal() {
                try {
                    let cartArray = typeof window.getSafeCart === 'function'? window.getSafeCart() : [];
                    if(cartArray.length === 0){
                        let raw = localStorage.getItem(window.CART_KEY) || localStorage.getItem('cart') || localStorage.getItem('santra_cart');
                        if(raw){ let parsed = JSON.parse(raw); if(Array.isArray(parsed)) cartArray = parsed; else if(typeof parsed === 'object') { cart = parsed; renderCart(); updateCounts(); return; } }
                    }
                    cart = {};
                    cartArray.forEach(item => {
                        let id = item.id || item.productId || item.code || Math.random().toString();
                        cart[id] = item;
                        if (!cart[id].qty || cart[id].qty < 1) cart[id].qty = 1;
                    });

                    let wishArray = typeof window.getSafeWishlist === 'function'? window.getSafeWishlist() : [];
                    if(wishArray.length === 0){
                        let rawWish = localStorage.getItem(window.MYCHOICE_KEY) || localStorage.getItem('santraMyChoice_v2') || localStorage.getItem('santrajet_mychoice');
                        if(rawWish){ let parsed = JSON.parse(rawWish); if(Array.isArray(parsed)){ wishArray = parsed; } else if(typeof parsed === 'object'){ myChoice = parsed; } }
                    }
                    if(Object.keys(myChoice).length === 0){
                        myChoice = {};
                        wishArray.forEach(item => {
                            let id = item.id || Math.random().toString();
                            myChoice[id] = item;
                        });
                    }
                } catch (e) { console.error("loadData error:", e); cart = {}; myChoice = {}; }
                renderCart(); renderMyChoice(); updateCounts();
            }

            function getProductThumbnail(p) {
                if (p && p.image && typeof p.image === "string" && p.image.trim()!=="") return p.image;
                if (p && p.images && Array.isArray(p.images) && p.images.length > 0) return p.images[0];
                return "https://via.placeholder.com/90x90?text=No+Image";
            }

            function renderCart() {
                let c = document.getElementById("cartList"), s = document.getElementById("cartSummary"), b = document.getElementById("checkoutBtn"), k = Object.keys(cart), topBar = document.getElementById("cartTopBar");
                if (k.length === 0) {
                    c.innerHTML = "<div class=\"empty\">🛒 Your cart is empty<br><button onclick=\"window.parent.postMessage('goHome', '*')\">Continue Shopping</button></div>";
                    s.classList.add("hide"); b.style.display = "none"; if(topBar) topBar.style.display="none"; updateCounts(); return;
                }
                b.style.display = "block";
                if(topBar) topBar.style.display="flex";
                c.innerHTML = k.map(key => {
                    let i = cart[key], q = parseInt(i.qty) || 1, p = parseFloat(i.price) || 0, id = i.id || key, img = getProductThumbnail(i);
                    let productLink = `product.html?id=${id}`;
                    return `<div class="cart-card">
                        <input type="checkbox" class="cart-check" data-key="${key}" style="width:18px;height:18px">
                        <img src="${img}" onclick="window.open('${productLink}', '_blank')">
                        <div class="item-info"><h3 onclick="window.open('${productLink}', '_blank')">${i.name || "Product"}</h3><div class="item-price">₹${p} x ${q} = ₹${p * q}</div><div class="item-code">Code: ${i.productCode || key}</div><div class="qty-controls"><button class="qty-btn" onclick="updateQty('${key}',-1)" ${q <= 1? "disabled" : ""}>-</button><span class="qty-display">${q}</span><button class="qty-btn" onclick="updateQty('${key}',1)">+</button></div><div class="item-actions"><button class="btn-move-choice" onclick="moveToMyChoice('${key}')">😍 Move to My Choice</button><button class="btn-share" onclick="shareProduct('${id}','${(i.name || "").replace(/'/g, "")}','${p}')">🔗 Share</button><button class="btn-remove" onclick="removeFromCart('${key}')">🗑 Remove</button></div></div></div>`;
                }).join("");
                let sub = Object.values(cart).reduce((a, i) => a + (parseFloat(i.price) || 0) * (parseInt(i.qty) || 1), 0), del = sub >= 500? 0 : 49, tot = sub + del, items = Object.values(cart).reduce((a, i) => a + (parseInt(i.qty) || 1), 0);
                document.getElementById("subTotal").innerText = "₹" + sub;
                document.getElementById("deliveryCharge").innerText = del === 0? "FREE" : "₹" + del;
                document.getElementById("grandTotal").innerText = "₹" + tot;
                document.getElementById("cartTotal").innerText = tot;
                document.getElementById("itemCount").innerText = items;
                s.classList.remove("hide"); updateCounts();
            }

            function renderMyChoice() {
                let c = document.getElementById("myChoiceList"), k = Object.keys(myChoice), topBar = document.getElementById("choiceTopBar");
                if (k.length === 0) {
                    c.innerHTML = `<div class="empty"><h3>😍 My Choice is Empty</h3><p>Home se ❤️ dabao</p><button onclick="window.parent.postMessage('goHome','*')">Browse</button></div>`;
                    if(topBar) topBar.style.display="none";
                    updateCounts(); return;
                }
                if(topBar) topBar.style.display="flex";
                c.innerHTML = k.map(key => {
                    let i = myChoice[key]; if (!i) return ""; let p = parseFloat(i.price) || 0, id = i.id || key, img = getProductThumbnail(i); let productLink = `product.html?id=${id}`;
                    return `<div class="cart-card">
                        <input type="checkbox" class="choice-check" data-key="${key}" style="width:18px;height:18px">
                        <img src="${img}" onclick="window.open('${productLink}', '_blank')">
                        <div class="item-info"><h3>${i.name || "Product"}</h3><div style="color:#e40046;font-weight:700;">₹${p}</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;"><button onclick="moveToCart('${key}')" style="background:#10b981;color:white;border:none;padding:12px;border-radius:8px;font-weight:600;">🛒 Move to Cart</button><button onclick="removeFromChoice('${key}')" style="background:#ef4444;color:white;border:none;padding:12px;border-radius:8px;font-weight:600;">🗑 Remove</button></div></div></div>`;
                }).join(""); updateCounts();
            }

            function updateQty(id, ch) { if (!cart[id]) return; cart[id].qty = (parseInt(cart[id].qty) || 1) + ch; if (cart[id].qty < 1) delete cart[id]; saveCart(); renderCart(); }
            function removeFromCart(id) { delete cart[id]; saveCart(); renderCart(); if(typeof santraToast!== 'undefined') santraToast("🗑 Removed"); }

            function moveToMyChoice(id){
                let i = cart[id]; if(!i) return;
                delete cart[id]; saveCart();

                let i = myChoice[id]; if(!i) return;

                renderCart(); renderMyChoice();
                if(typeof updateCartBadge==='function') updateCartBadge();

            }

            function removeFromChoice(id) { delete myChoice[id]; saveMyChoice(); renderMyChoice(); if(typeof santraToast!== 'undefined') santraToast("❌ Removed"); }

            // ===== NEW ECOMMERCE SELECT ALL FUNCTIONS =====
            function toggleAllCart(checked){ document.querySelectorAll(".cart-check").forEach(c=>c.checked=checked); }
            function toggleAllChoice(checked){ document.querySelectorAll(".choice-check").forEach(c=>c.checked=checked); }

                let checks=[...document.querySelectorAll(".cart-check:checked")];

                    let key=ch.dataset.key;
                    if(cart[key]){ myChoice[key]={...cart[key]}; delete cart[key]; }
                });
                saveCart(); saveMyChoice(); renderCart(); renderMyChoice();
            }
            function removeSelectedCart(){
                let checks=[...document.querySelectorAll(".cart-check:checked")];
                if(!checks.length) return alert("Select item first");
                checks.forEach(ch=>{ let key=ch.dataset.key; delete cart[key]; });
                saveCart(); renderCart();
            }
            function moveSelectedToCart(){
                let checks=[...document.querySelectorAll(".choice-check:checked")];
                if(!checks.length) return alert("Select item first");
                checks.forEach(ch=>{
                    let key=ch.dataset.key;

            function saveCart() {
                let u = window.auth? window.auth.currentUser : null;
                if (u && window.rtdb) { window.rtdb.ref("users/" + u.uid + "/cart").set(cart); }
                else {
                    let arr = Object.values(cart);

                    localStorage.setItem("cart", JSON.stringify(arr));
                    localStorage.setItem("santra_cart", JSON.stringify(arr));
                }

            function saveMyChoice() {
                let u = window.auth? window.auth.currentUser : null;
                if (u && window.rtdb) { window.rtdb.ref("users/" + u.uid + "/myChoice").set(myChoice); }
                else {
                    let arr = Object.values(myChoice);
                    localStorage.setItem(window.MYCHOICE_KEY, JSON.stringify(arr));
                    localStorage.setItem("santrajet_mychoice", JSON.stringify(arr));

            function updateCounts() {
                let c = Object.values(cart).reduce((a, i) => a + (parseInt(i.qty) || 1), 0);

                Object.keys(cart).forEach(key => {
                    let item = cart[key]; let qty = parseInt(item.qty) || 1; let price = parseFloat(item.price) || 0; let size = item.size || item.variant || "M";
                    text += `${count}. *${item.name}*\nSize: ${size}\nQty: ${qty} x ₹${price} = ₹${price * qty}\nCode: ${item.productCode || key}\nLink: ${baseURL}/product.html?id=${item.id || key}\n\n`; count++;
                });
                text += `━━━━━━━━━━━━━━━━━━\n*Subtotal: ₹${subtotal}*\n*Delivery: ${delivery === 0? "FREE" : "₹" + delivery}*\n*🧾 GRAND TOTAL: ₹${grandTotal}*\n━━━━━━━━━━━━━━━━━━\n\n`;
                text += `*📝 Customer Details:*\nName: ________________\nMobile: ________________\nAddress: ________________\n\nPlease confirm this order ✅\n\n`;
                text += `*>> IMPORTANT: PLEASE SEND OTP TO CONFIRM THIS ORDER <<*\n*OTP ke bina order confirm nahi hoga*`;
                return { text, grandTotal, orderId, subtotal, delivery };
            }
