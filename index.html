  let admin = SANTRA_DB.users.find(u => u.role === 'admin');

// FIREBASE + LOCAL PRODUCTS
async function loadAllProducts(){
  let container = document.getElementById('productList');
  container.innerHTML = '<p style="text-align:center;padding:40px;color:#999;grid-column:1/-1;">Loading products...</p>';

  allProducts = [];

  if(typeof SANTRA_DB!== 'undefined' && SANTRA_DB.products){
    SANTRA_DB.products.forEach(p => {
      allProducts.push({...p, source: 'local'});
    });
  }

  if(firebaseDB){
    try {
      const querySnapshot = await firebaseDB.collection('products').orderBy('created', 'desc').get();
      querySnapshot.forEach((doc) => {
        let p = doc.data();
        p.id = doc.id;
        p.source = 'firebase';
        allProducts.push(p);
      });
    } catch(err) {
      console.log('Firebase error:', err);
    }
  }

  container.innerHTML = '';
  if(allProducts.length === 0){
    container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#999;padding:40px;">No products yet. Add from Admin Panel.</p>';
    return;
  }

  allProducts.forEach(p => {
    let mediaHtml = '';
    let imgUrl = '';

    if(p.source === 'firebase'){
      imgUrl = p.images && p.images[0]? p.images[0] : 'https://via.placeholder.com/300x250?text=No+Image';
      if(p.images && p.images[0]){
        mediaHtml = `<img src="${p.images[0]}" alt="${p.name}" onclick="openProductDetail('${p.id}', 'firebase')">`;
      } else if(p.videos && p.videos[0]){
        mediaHtml = `<video src="${p.videos[0]}" controls></video>`;
      }
    } else {
      imgUrl = p.img || p.mediaUrl || 'https://via.placeholder.com/300x250?text=No+Image';
      if(p.mediaType === 'image' ||!p.mediaType){
        mediaHtml = `<img src="${imgUrl}" alt="${p.name}" onclick="openProductDetail('${p.id}', 'local')">`;
      } else if(p.mediaType === 'video'){
        mediaHtml = `<video src="${p.mediaUrl}" controls></video>`;
      } else if(p.mediaType === 'audio'){
        mediaHtml = `<audio src="${p.mediaUrl}" controls style="width:100%"></audio>`;
      } else if(p.mediaType === 'document'){
        mediaHtml = `<a href="${p.mediaUrl}" target="_blank">📄 View PDF</a>`;
      } else {
        mediaHtml = `<img src="${imgUrl}" alt="${p.name}" onclick="openProductDetail('${p.id}', 'local')">`;
      }
    }

    container.innerHTML += `
      <div class="product-card">
        ${mediaHtml}
        <h4>${p.name} ${p.source === 'firebase'? '<span class="firebase-badge">NEW</span>' : ''}</h4>
        <p><s style="font-size:12px;color:#999;">₹${p.mrp || ''}</s> ₹${p.price}</p>
        <div class="cat">Category: ${p.category || 'General'} | Stock: ${p.stock || 0}</div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button onclick="orderOnWhatsApp('${p.id}', '${p.name.replace(/'/g,"\\'")}', '${p.price}', '${imgUrl}', '${p.source || 'local'}')" style="width:100%; padding:15px; background:#25D366; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold;">
            💬 Order on WhatsApp
          </button>
        </div>
      </div>
    `;
  });
}

// PRODUCT DETAIL POPUP
function openProductDetail(productId, source){
  if(source === 'firebase' && firebaseDB){
    firebaseDB.collection('products').doc(productId).get().then(doc => {
      if(doc.exists){
        let p = doc.data();
        p.id = doc.id;
        showProductModal(p);
      }
    });
  } else {
    let p = SANTRA_DB.products.find(pr => pr.id == productId);
    if(p) showProductModal(p);
  }
}

function showProductModal(p){
  let modal = document.createElement('div');
  modal.className = 'modal';
  let imgHtml = '';
  if(p.images && p.images[0]){
    imgHtml = `<img src="${p.images[0]}" style="width:100%;max-height:300px;object-fit:contain;border-radius:8px;">`;
  } else if(p.img || p.mediaUrl){
    imgHtml = `<img src="${p.img || p.mediaUrl}" style="width:100%;max-height:300px;object-fit:contain;border-radius:8px;">`;
  }

  modal.innerHTML = `
    <div class="modal-content" style="max-width:500px;">
      <div class="modal-header">
        <h3>${p.name}</h3>
        <button class="close-btn" onclick="this.closest('.modal').remove()">×</button>
      </div>
      <div class="modal-body">
        ${imgHtml}
        <h4 style="color:var(--accent);margin:15px 0;">₹${p.price} <s style="font-size:14px;color:#999;">₹${p.mrp || ''}</s></h4>
        <p><b>Category:</b> ${p.category || 'General'}</p>
        <p><b>Stock:</b> ${p.stock || 0}</p>
        <p style="margin-top:10px;">${p.desc || p.description || 'No description'}</p>
        
        <div style="display:flex; gap:8px; margin-top:15px;">
          <button onclick="addToCart('${p.id}', '${p.source || 'local'}')" style="flex:1; padding:12px; background:#ff6b6b; color:white; border:none; border-radius:6px;">🛒 Add to Cart</button>
          <button onclick="openCheckoutDirect('${p.id}', '${p.source || 'local'}')" style="flex:1; padding:12px; background:#4CAF50; color:white; border:none; border-radius:6px;">⚡ Buy Now</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}
// DIRECT CHECKOUT
function openCheckoutDirect(productId, source){
  if(source === 'firebase' && firebaseDB){
    firebaseDB.collection('products').doc(productId).get().then(doc => {
      if(doc.exists){
        let product = doc.data();
        product.id = doc.id;
        openCheckoutForm(product);
      } else {
        alert('Product not found!');
      }
    });
  } else {
    let product = SANTRA_DB.products.find(p => p.id == productId);
    if(!product){
      alert('Product not found!');
      return;
    }
    openCheckoutForm(product);
  }
}

    .then(() => console.log('✅ Order saved to Firebase Backup'))
    .catch(err => console.log('Firebase save error:', err));
    
      // Customer profile bhi Firebase me save
      firebaseDB.collection('customers').doc(currentOrderData.mobile).set({
        name: currentOrderData.name,
        mobile: currentOrderData.mobile,
        email: currentOrderData.email,
        address: currentOrderData.address,
        updated: new Date().toISOString()
      }, {merge: true});
    }
    
    // 3. SEND TO ADMIN WHATSAPP - Customer ki sari details ke sath
    let msg = `New Order - SANTRA MALL
OTP Verified: ${generatedOTP}

CUSTOMER PROFILE:
Name: ${currentOrderData.name}
Mobile: ${currentOrderData.mobile}
Email: ${currentOrderData.email}

PRODUCT:
${currentOrderData.pname} - Rs.${currentOrderData.pprice}

Total: Rs.${currentOrderData.pprice}

  } else {

// ADD TO CART
function addToCart(productId, source) {
  let CART = JSON.parse(localStorage.getItem('santra_cart')) || [];
  
  let product = null;
  if(source === 'firebase') {
    product = allProducts.find(p => p.id == productId);
  } else {
    product = SANTRA_DB.products.find(p => p.id == productId);
  }
  
  if (!product) {
    alert("Product nahi mila!");
    return;
  }
  
  let item = CART.find(i => i.id == productId);
  if (item) {
    item.qty += 1;
  } else {
    CART.push({...product, qty: 1, source: source});
  }
  
  localStorage.setItem('santra_cart', JSON.stringify(CART));
  updateCartCount();
  alert(`✅ ${product.name} cart me add ho gaya!`);
}

function updateCartCount(){
  let CART = JSON.parse(localStorage.getItem('santra_cart')) || [];
  let count = CART.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById('cartCount').innerText = count;
}

window.addEventListener('load', () => {
  updateCartCount();
});

// TRACK ORDER - LOCAL + FIREBASE DONO SE
async function trackOrderByMobile(){
  let mobile = document.getElementById('trackMobile').value;
  if(!mobile){
    alert('Please enter mobile number');
    return;
  }
  
  let userOrders = [];
  
  // 1. Local orders
  if(SANTRA_DB.orders){
    userOrders = SANTRA_DB.orders.filter(o => o.mobile == mobile);
  }
  
  // 2. Firebase orders bhi check karo
  if(firebaseDB){
    try {
      const snapshot = await firebaseDB.collection('orders').where('mobile', '==', mobile).get();
      snapshot.forEach(doc => {
        userOrders.push(doc.data());
      });
    } catch(err) {
      console.log('Firebase track error:', err);
    }
  }
  
  // Sort by time
  userOrders.sort((a,b) => new Date(b.time) - new Date(a.time));
  
  let container = document.getElementById('ordersPopupList');

  if(userOrders.length === 0){
    container.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">No orders found for this number</p>';
  } else {
    container.innerHTML = userOrders.map(order => `
      <div class="order-box" style="background:#f9f9f9;padding:15px;border-radius:8px;margin-bottom:10px;">
        <h4>Order #${order.id}</h4>
        <p><b>Status:</b> ${order.status} ${order.otpVerified? '✅ Verified' : ''}</p>
        <p><b>Total:</b> ₹${order.total}</p>
        <p><b>Date:</b> ${new Date(order.time).toLocaleString()}</p>
      </div>
    `).join('');
  }
}

// ADMIN FIELDS
function loadAdminFields() {
  let fields = JSON.parse(localStorage.getItem('CUSTOMER_FORM_FIELDS')) || [];
  if(fields.length === 0) {
    document.getElementById('customerFieldsBox').innerHTML = '';
    return;
  }
  let html = '<hr style="margin:20px 0;border:1px solid #ddd;"><p style="color:#FF6B35;font-weight:bold;margin-bottom:10px;">Additional Details:</p>';
  fields.forEach(f => {
    html += `<label style="display:block;margin-top:12px;">${f.label} ${f.required? '*' : ''}</label>`;
    if(f.type === 'textarea') {
      html += `<textarea name="${f.name}" rows="3" placeholder="${f.placeholder}" ${f.required? 'required' : ''} style="width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:4px;"></textarea>`;
    } else if(f.type === 'select') {
      let opts = f.options? f.options.split(',') : [];
      html += `<select name="${f.name}" ${f.required? 'required' : ''} style="width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:4px;">
        <option value="">-- Select --</option>
        ${opts.map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('')}
      </select>`;
    } else {
      html += `<input type="${f.type}" name="${f.name}" placeholder="${f.placeholder}" ${f.required? 'required' : ''} style="width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:4px;">`;
    }
  });
  document.getElementById('customerFieldsBox').innerHTML = html;
}
