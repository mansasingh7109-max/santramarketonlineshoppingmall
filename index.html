        <script>
            // ✅ FIX 1: CART_KEY & MYCHOICE_KEY define kiye
            const CART_KEY = "santraMallCart_v2";
            const MYCHOICE_KEY = "santraMallMyChoice_v2";

            // ✅ FIX 2: Sirf 1 baar initialize karo
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            var rtdb = firebase.database();

        <script>
            let currentModalProduct = null;
            let allProducts = [];
            let currentSlideIndex = {};
            let currentUser = null;
            let loginOTP = null;
            let tempCustomerData = null;

            function customerLogout() {
                if (confirm("Logout karna hai?")) {
                    auth.signOut()
                        .then(() => {
                            localStorage.removeItem("santra_customer");
                            localStorage.removeItem(CART_KEY);
                            localStorage.removeItem("santrajet_mychoice");
                            localStorage.removeItem("pendingOTP");
                            showToast("Logged out successfully");
                            setTimeout(() => location.reload(), 500);
                        })
                        .catch(error => {
                            console.error("Logout error:", error);
                            localStorage.removeItem("santra_customer");
                            location.reload();
                        });
                }
            }

            // ✅ UPDATED CUSTOMER UI - 29-JUNE-2026
            function updateCustomerButton() {
                const customer = localStorage.getItem("santra_customer");
                const sidebarDiv = document.getElementById(
                    "sidebarCustomerSection"
                );
                const logoutBtn = document.getElementById("logoutBtn");
                const userInfo = document.getElementById("userInfo");
                const userName = document.getElementById("userName");

                if (!sidebarDiv) return;

                if (customer && JSON.parse(customer).isLoggedIn) {
                    const cust = JSON.parse(customer);
                    const firstName = (cust.name || "Customer").split(" ")[0];
                    const photo =
                        cust.photo ||
                        "https://cdn-icons-png.flaticon.com/128/1077/1077114.png";

                    sidebarDiv.innerHTML = `
                      <button class="sidebar-btn" onclick="window.location.href='customer-account.html'" style="background:linear-gradient(135deg,#10b981,#059669);">
                        <img src="${photo}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid white" alt="Profile">
                        ${firstName}<br>Profile
                      </button>
                    `;

                    if (logoutBtn) logoutBtn.classList.add("show");
                    if (userInfo) {
                        userInfo.classList.remove("hide");
                        if (userName) userName.innerText = firstName;
                    }
                } else {
                    sidebarDiv.innerHTML = `
                      <button class="sidebar-btn" onclick="window.location.href='customer-account.html'">
                        <img src="https://cdn-icons-png.flaticon.com/128/1077/1077114.png" style="width:24px;height:24px;" alt="Login">
                        Customer<br>Login
                      </button>
                    `;
                    if (logoutBtn) logoutBtn.classList.remove("show");
                    if (userInfo) userInfo.classList.add("hide");
                }
            }

            function checkCustomerLogin() {
                updateCustomerButton();

                const customerInfoBar =
                    document.getElementById("customerInfoBar");
                const customerNameDisplay = document.getElementById(
                    "customerNameDisplay"
                );
                const customerMobileDisplay = document.getElementById(
                    "customerMobileDisplay"
                );
                const oldCustomerBadge =
                    document.getElementById("oldCustomerBadge");
                const customer = JSON.parse(
                    localStorage.getItem("santra_customer") || "{}"
                );

                if (customerInfoBar) customerInfoBar.classList.add("hide");

                if (customer.name && customer.isLoggedIn === true) {
                    if (customerInfoBar)
                        customerInfoBar.classList.remove("hide");
                    if (customerNameDisplay)
                        customerNameDisplay.innerText = customer.name;
                    if (customerMobileDisplay)
                        customerMobileDisplay.innerText = customer.mobile;

                    if (customer.isOldCustomer && customer.totalOrders > 0) {
                        if (oldCustomerBadge) {
                            oldCustomerBadge.classList.remove("hide");
                            oldCustomerBadge.innerText = `🔥 ${customer.totalOrders} Orders`;
                        }
                    }
                }
            }

            document.addEventListener("DOMContentLoaded", function () {
                checkCustomerLogin();
                loadProducts();
                updateCartCount();
            });

            auth.onAuthStateChanged(user => {
                currentUser = user;
                checkCustomerLogin();
                updateCartCount();
            });

            function loadProducts() {
                allProducts = [];
                db.collection("products").onSnapshot(
                    firestoreSnap => {
                        let firestoreProducts = [];
                        firestoreSnap.forEach(doc => {
                            let p = doc.data();
                            p.id = doc.id;
                            p.price = parseFloat(p.price) || 0;
                            p.stock =
                                p.stock !== undefined && p.stock !== null
                                    ? parseInt(p.stock)
                                    : 0;
                            p.mrp = parseFloat(p.mrp) || p.price;
                            p.dbType = "firestore";
                            firestoreProducts.push(p);
                        });

                        rtdb.ref("products").on("value", rtdbSnap => {
                            let rtdbProducts = [];
                            if (rtdbSnap.exists()) {
                                rtdbSnap.forEach(child => {
                                    let p = child.val();
                                    p.id = child.key;
                                    p.price = parseFloat(p.price) || 0;
                                    p.stock =
                                        p.stock !== undefined &&
                                        p.stock !== null
                                            ? parseInt(p.stock)
                                            : 0;
                                    p.mrp = parseFloat(p.mrp) || p.price;
                                    p.dbType = "rtdb";
                                    rtdbProducts.push(p);
                                });
                            }

                            allProducts = [
                                ...firestoreProducts,
                                ...rtdbProducts
                            ];
                            renderProducts(allProducts);
                            generateAutoCategories();
                            generateCategoryDropdown();
                            localStorage.setItem(
                                "ALL_PRODUCTS",
                                JSON.stringify(allProducts)
                            );
                        });
                    },
                    error => {
                        console.error("Firebase error:", error);
                        renderProducts([]);
                    }
                );
            }

            function generateAutoCategories() {
                db.collection("categories")
                    .get()
                    .then(catSnap => {
                        let categories = [];
                        let catImages = {};
                        catSnap.forEach(doc => {
                            const data = doc.data();
                            categories.push(data.name);
                            catImages[data.name] = data.image || "";
                        });

                        const catsFromProducts = [
                            ...new Set(
                                allProducts.map(p => p.category).filter(c => c)
                            )
                        ];
                        catsFromProducts.forEach(c => {
                            if (!categories.includes(c)) categories.push(c);
                        });

                        if (categories.length === 0) {
                            document.getElementById("categoryList").innerHTML =
                                '<div class="loading">No categories found</div>';
                            return;
                        }

                        let html = "";
                        categories.forEach(catName => {
                            const catImage =
                                catImages[catName] ||
                                "https://via.placeholder.com/50?text=" +
                                    encodeURIComponent(catName);
                            html += `<div class="cat-item" onclick="filterByCategory('${catName}')"><img src="${catImage}" alt="${catName}"><p>${catName}</p></div>`;
                        });
                        document.getElementById("categoryList").innerHTML =
                            html;
                    })
                    .catch(err => {
                        console.error("Category load error:", err);
                        document.getElementById("categoryList").innerHTML =
                            '<div class="loading">Error loading categories</div>';
                    });
            }

            function generateCategoryDropdown() {
                const categories = [
                    ...new Set(allProducts.map(p => p.category).filter(c => c))
                ];
                let html = '<option value="">All Categories</option>';
                categories.forEach(cat => {
                    html += `<option value="${cat}">${cat}</option>`;
                });
                const categorySelect =
                    document.getElementById("categorySelect");
                if (categorySelect) categorySelect.innerHTML = html;
            }

            function getProductImage(p) {
                if (typeof getProductThumbnail !== "undefined") {
                    return getProductThumbnail(p);
                }
                if (
                    p.media &&
                    Array.isArray(p.media) &&
                    p.media.length > 0 &&
                    p.media[0].url
                )
                    return p.media[0].url;
                if (p.images && Array.isArray(p.images) && p.images.length > 0)
                    return p.images[0];
                if (p.image) return p.image;
                if (p.imageUrl) return p.imageUrl;
                return "https://via.placeholder.com/300x300/cccccc/ffffff?text=No+Image";
            }

            function renderProducts(products) {
                let html = "";
                products.forEach(p => {
                    currentSlideIndex[p.id] = 0;
                    let images = [];
                    if (
                        p.media &&
                        Array.isArray(p.media) &&
                        p.media.length > 0
                    ) {
                        images = p.media.map(m => m.url).filter(url => url);
                    }
                    if (
                        images.length === 0 &&
                        p.images &&
                        Array.isArray(p.images) &&
                        p.images.length > 0
                    ) {
                        images = p.images.filter(url => url);
                    }
                    if (images.length === 0) {
                        images = [getProductImage(p)];
                    }

                    const productData = JSON.stringify(p).replace(
                        /'/g,
                        "&apos;"
                    );

                    html += `
                      <div class="product-card">
                        ${p.stock < 5 && p.stock > 0 ? '<div class="new-badge">Low Stock</div>' : ""}
                        ${p.stock === 0 ? '<div class="new-badge" style="background:#999">Out of Stock</div>' : ""}
                        ${images.length > 1 ? `<div class="img-count">📷 ${images.length}</div>` : ""}

      <div class="image-slider" style="position:relative;">
  <button onclick="event.stopPropagation(); toggleMyChoice('${p.id}')" id="heart-${p.id}" style="position:absolute;top:8px;right:8px;background:white;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.2);z-index:999">🤍</button>
  ${images.map((img, idx) => `<img src="${img}" class="slide-img ${idx === 0 ? "active" : ""}" alt="${p.name}" style="display:${idx === 0 ? "block" : "none"};width:100%;height:140px;object-fit:contain;background:#f5f5f5;" onclick="window.location.href='product.html?id=${p.id}'" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">`).join("")}
                         ${images.map((img, idx) => `<img src="${img}" class="slide-img ${idx === 0 ? "active" : ""}" alt="${p.name}" style="display:${idx === 0 ? "block" : "none"};width:100%;height:140px;object-fit:contain;background:#f5f5;">`).join("")}
                          ${
                              images.length > 1
                                  ? `
                            <button class="prev-btn" onclick="changeSlide('${p.id}', -1, event)"><</button>
                            <button class="next-btn" onclick="changeSlide('${p.id}', 1, event)">></button>
                          `
                                  : ""
                          }
                        </div>
                        <div class="product-info" onclick="window.location.href='product.html?id=${p.id}'">
                          <h3>${p.name || "Product"}</h3>
                          <div>
                            <span class="price">₹${p.price}</span>
                          ${p.mrp && p.mrp > p.price ? `<span class="mrp" style="text-decoration:line-through;color:#999;margin-left:5px;">₹${p.mrp}</span>` : ""}
                          </div>
                          <p class="stock">Stock: ${p.stock}</p>
                        </div>
                        <div class="product-actions">
<div style="display:flex; gap:5px; margin:5px 0; flex-wrap:wrap; justify-content:center;">
  ${["S", "M", "L", "XL", "XXL"]
      .map(
          s => `
    <button type="button"
      class="size-btn-${p.id}"
      data-size="${s}"
      onclick="selectHomeSize('${p.id}','${s}',event)"
      style="padding:3px 8px; border:1px solid #ddd; border-radius:4px; background:${((window.homeSelectedSizes && window.homeSelectedSizes["${p.id}"]) || "M") === s ? "#e91e63" : "#fff"}; color:${((window.homeSelectedSizes && window.homeSelectedSizes["${p.id}"]) || "M") === s ? "#fff" : "#333"}; font-size:12px;">
      ${s}
    </button>
  `
      )
      .join("")}
</div>
<button class="add-to-cart-btn" onclick="addHomeToCart('${p.id}', '${p.name.replace(/'/g, "\\'")}', ${p.price},'${p.image || (p.images && p.images[0]) || ""}' );event.stopPropagation();">Add to Cart</button>
                         <button class="buy-now-btn" onclick="buyNow('${p.id}', event)">Buy Now</button>
                        </div>
                      </div>
                    `;
                });
                document.getElementById("productGrid").innerHTML =
                    html || '<div class="loading">No products found</div>';
            }

            function changeSlide(productId, direction, event) {
                event.stopPropagation();
                let product = allProducts.find(p => p.id === productId);
                if (!product) return;
                let images = [];
                if (product.media && product.media.length > 0)
                    images = product.media.map(m => m.url);
                else if (product.images && product.images.length > 0)
                    images = product.images;
                else images = [getProductImage(product)];
                currentSlideIndex[productId] =
                    (currentSlideIndex[productId] + direction + images.length) %
                    images.length;
                updateSlider(productId);
            }

            function updateSlider(productId) {
                let sliderCard = document.querySelector(
                    `.image-slider[onclick*="product.html?id=${productId}"]`
                );
                if (!sliderCard) return;
                let slides = sliderCard.querySelectorAll(".slide-img");
                slides.forEach((slide, idx) => {
                    slide.style.display =
                        idx === currentSlideIndex[productId] ? "block" : "none";
                });
            }

            function addToCart(product) {
                if (!product || !product.id) {
                    showToast("❌ Product data missing");
                    return;
                }

                let cartArray = [];
                try {
                    const saved = localStorage.getItem(CART_KEY);
                    cartArray = saved ? JSON.parse(saved) : [];
                    if (!Array.isArray(cartArray)) cartArray = [];
                } catch (e) {
                    cartArray = [];
                }
                let existingIndex = cartArray.findIndex(
                    item => item.id === product.id
                );

                if (existingIndex > -1) {
                    cartArray[existingIndex].qty += 1;
                } else {
                    cartArray.push({
                        id: product.id,
                        name: product.name || "Product",
                        price: parseFloat(product.price) || 0,
                        image: product.image || getProductImage(product),
                        productCode: product.code || product.id,
                        qty: 1
                    });
                }

                localStorage.setItem(CART_KEY, JSON.stringify(cartArray));
                showToast("✅ Added to Cart!");
                updateCartCount();
            }

            function updateCartCount() {
                let cartArray = JSON.parse(
                    localStorage.getItem(CART_KEY) || "[]"
                );
                let totalItems = cartArray.reduce(
                    (sum, item) => sum + (parseInt(item.qty) || 1),
                    0
                );
                let cartBottom = document.getElementById("cartCountBottom");
                if (cartBottom) cartBottom.innerText = totalItems;

                const choiceArray = JSON.parse(
                    localStorage.getItem("santrajet_mychoice") || "[]"
                );
                const choiceBadge = document.getElementById("choiceBadge");
                if (choiceBadge) {
                    choiceBadge.innerText = choiceArray.length;
                    choiceBadge.style.display =
                        choiceArray.length > 0 ? "flex" : "none";
                }
            }

            function buyNow(productId, event) {
                event.stopPropagation();
                let product = allProducts.find(p => p.id === productId);
                if (product) {
                    addToCart({
                        id: product.id,
                        name: product.name,
                        price: product.price,
                        image: getProductImage(product),
                        code: product.code || product.id
                    });
                    setTimeout(() => {
                        window.location.href = "cart.html";
                    }, 500);
                }
            }

            function searchProducts() {
                let query = document
                    .getElementById("searchInput")
                    .value.toLowerCase();
                let filtered = allProducts.filter(
                    p =>
                        p.name.toLowerCase().includes(query) ||
                        (p.category && p.category.toLowerCase().includes(query))
                );
                renderProducts(filtered);
            }

            function goHome() {
                window.scrollTo(0, 0);
            }
            function openCategories() {
                window.location.href = "category.html";
            }
            function openCart() {
                window.location.href = "cart.html";
            }
            function openOrders() {
                let customer = localStorage.getItem("santra_customer");
                if (!customer) {
                    alert("⚠️ Please login first to see your orders");
                    window.location.href = "customer-account.html";
                } else {
                    window.location.href = "orders.html";
                }
            }

            function onCategoryChange() {
                const cat = document.getElementById("categorySelect").value;
                if (cat === "") {
                    renderProducts(allProducts);
                    document.getElementById("dynamicFilters").innerHTML = "";
                } else {
                    let filtered = allProducts.filter(p => p.category === cat);
                    renderProducts(filtered);
                    generateDynamicFilters(filtered);
                }
            }

            function generateDynamicFilters(products) {
                let variants = new Set();
                let sizes = new Set();
                let colors = new Set();
                let features = new Set();
                let characters = new Set();
                let patterns = new Set();
                let materials = new Set();

                products.forEach(p => {
                    if (p.variants) {
                        if (Array.isArray(p.variants)) {
                            p.variants.forEach(v => variants.add(v));
                        } else if (typeof p.variants === "string") {
                            variants.add(p.variants);
                        }
                    }
                    if (p.size) sizes.add(p.size);
                    if (p.sizes && Array.isArray(p.sizes))
                        p.sizes.forEach(s => sizes.add(s));
                    if (p.color) colors.add(p.color);
                    if (p.colors && Array.isArray(p.colors))
                        p.colors.forEach(c => colors.add(c));
                    if (p.features) {
                        if (Array.isArray(p.features)) {
                            p.features.forEach(f => features.add(f));
                        } else if (typeof p.features === "string") {
                            features.add(p.features);
                        }
                    }
                    if (p.character) characters.add(p.character);
                    if (p.pattern) patterns.add(p.pattern);
                    if (p.material) materials.add(p.material);
                });

                let html = "";

                if (variants.size > 0) {
                    html += `<div class="filter-group"><label><b>Variants:</b></label>`;
                    html += `<select data-field="variants" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Variants</option>`;
                    variants.forEach(
                        v => (html += `<option value="${v}">${v}</option>`)
                    );
                    html += `</select></div>`;
                }

                if (characters.size > 0) {
                    html += `<div class="filter-group"><label><b>Character:</b></label>`;
                    html += `<select data-field="character" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Characters</option>`;
                    characters.forEach(
                        c => (html += `<option value="${c}">${c}</option>`)
                    );
                    html += `</select></div>`;
                }

                if (sizes.size > 0) {
                    html += `<div class="filter-group"><label><b>Size:</b></label>`;
                    html += `<select data-field="size" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Sizes</option>`;
                    sizes.forEach(
                        s => (html += `<option value="${s}">${s}</option>`)
                    );
                    html += `</select></div>`;
                }

                if (colors.size > 0) {
                    html += `<div class="filter-group"><label><b>Color:</b></label>`;
                    html += `<select data-field="color" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Colors</option>`;
                    colors.forEach(
                        c => (html += `<option value="${c}">${c}</option>`)
                    );
                    html += `</select></div>`;
                }

                if (patterns.size > 0) {
                    html += `<div class="filter-group"><label><b>Pattern:</b></label>`;
                    html += `<select data-field="pattern" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Patterns</option>`;
                    patterns.forEach(
                        p => (html += `<option value="${p}">${p}</option>`)
                    );
                    html += `</select></div>`;
                }

                if (materials.size > 0) {
                    html += `<div class="filter-group"><label><b>Material:</b></label>`;
                    html += `<select data-field="material" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Materials</option>`;
                    materials.forEach(
                        m => (html += `<option value="${m}">${m}</option>`)
                    );
                    html += `</select></div>`;
                }

                if (features.size > 0) {
                    html += `<div class="filter-group"><label><b>Features:</b></label>`;
                    html += `<select data-field="features" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Features</option>`;
                    features.forEach(
                        f => (html += `<option value="${f}">${f}</option>`)
                    );
                    html += `</select></div>`;
                }

                document.getElementById("dynamicFilters").innerHTML = html;
            }

            function applySmartFilters() {
                const cat = document.getElementById("categorySelect").value;
                let filtered = allProducts;

                if (cat !== "") {
                    filtered = filtered.filter(p => p.category === cat);
                }

                const dynamicFilters = document.querySelectorAll(
                    "#dynamicFilters select"
                );
                dynamicFilters.forEach(select => {
                    const field = select.dataset.field;
                    const value = select.value;
                    if (value) {
                        filtered = filtered.filter(p => {
                            if (Array.isArray(p[field])) {
                                return p[field].includes(value);
                            }
                            if (p[field] == value) return true;
                            if (
                                field === "size" &&
                                p.sizes &&
                                p.sizes.includes(value)
                            )
                                return true;
                            if (
                                field === "color" &&
                                p.colors &&
                                p.colors.includes(value)
                            )
                                return true;
                            if (
                                field === "variants" &&
                                (p.character == value ||
                                    p.pattern == value ||
                                    p.material == value)
                            )
                                return true;
                            return false;
                        });
                    }
                });

                renderProducts(filtered);
            }

            function clearSmartFilters() {
                document.getElementById("categorySelect").value = "";
                document.getElementById("dynamicFilters").innerHTML = "";
                renderProducts(allProducts);
            }

            function filterByCategory(catName) {
                document.getElementById("categorySelect").value = catName;
                let filtered = allProducts.filter(p => p.category === catName);
                renderProducts(filtered);
                generateDynamicFilters(filtered);
                document
                    .getElementById("productGrid")
                    .scrollIntoView({ behavior: "smooth" });
            }

            function showToast(message) {
                const toast = document.createElement("div");
                toast.innerText = message;
                toast.style.cssText =
                    "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 20px;border-radius:8px;z-index:9999;font-size:14px";
                document.body.appendChild(toast);
                setTimeout(() => document.body.removeChild(toast), 3000);
            }
        </script>
        <script>
                        // ✅ Home page me Cart + My Choice count dikhane ke liye
                        function updateHomeBadges() {
                            // Cart Count
                            const cartArray = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
                            let cartQty = cartArray.reduce((sum, item) => sum + (item.qty || 1), 0);
                            const cartBadge = document.getElementById('homeCartBadge');
                            if (cartBadge) {
                                cartBadge.innerText = cartQty;
                                cartBadge.style.display = cartQty > 0? 'flex' : 'none';
                            }

                            // My Choice Count
                            const choiceArray = JSON.parse(localStorage.getItem(MYCHOICE_KEY) || "[]");
                            const choiceBadge = document.getElementById('homeChoiceBadge');
                            if (choiceBadge) {
                                choiceBadge.innerText = choiceArray.length;
                                choiceBadge.style.display = choiceArray.length > 0? 'flex' : 'none';
                            }
                        }

                        // ✅ Page load hote hi count dikhao
                        window.addEventListener("load", updateHomeBadges);

                        // ✅ Agar dusre tab me item add hua to bhi update ho
                        window.addEventListener("storage", updateHomeBadges);
                        window.addEventListener("load", updateHomeBadges);
            });


            // ✅ NEW - Checkout se order ke baad cart khali karne ka signal
            window.addEventListener('message', (e)=>{
              if(e.data && e.data.type === 'cartCleared'){
                // My Cart iframe reload
                document.querySelectorAll('iframe[src*="cart"]').forEach(f=> f.contentWindow.location.reload());
                // cart count update
                if(typeof updateHomeBadges === 'function') updateHomeBadges();
                if(typeof updateHeaderBadges === 'function') updateHeaderBadges();
              }
            });
        </script>
        <script>
            // ✅ SAB PAGE ME YE FUNCTION ADD KAR - Header count update ke liye
            function updateHeaderBadges() {
                const cartArray = JSON.parse(
                    localStorage.getItem(CART_KEY) || "[]"
                );
                let cartQty = cartArray.reduce(
                    (sum, item) => sum + (item.qty || 1),
                    0
                );
                const cartBadge = document.getElementById("cartBadge");
                if (cartBadge) {
                    cartBadge.innerText = cartQty;
                    cartBadge.style.display = cartQty > 0 ? "flex" : "none";
                }

                const choiceArray = JSON.parse(
                    localStorage.getItem(MYCHOICE_KEY) || "[]"
                );
                const choiceBadge = document.getElementById("choiceBadge");
                if (choiceBadge) {
                    choiceBadge.innerText = choiceArray.length;
                    choiceBadge.style.display =
                        choiceArray.length > 0 ? "flex" : "none";
                }
            }

            // ✅ Page load pe call kar
            window.addEventListener("load", updateHeaderBadges);
            window.addEventListener("storage", updateHeaderBadges); // Dusre tab me change ho to bhi update
        </script>

        <script src="customer-account.js"></script>
        <script src="login.js"></script>
        <script>
            // ✅ SEARCH HISTORY SAVE - Firebase me
            function saveSearch(mobile, term) {
                if (!mobile || !term || term.length < 2) return;
                if (typeof firebase === "undefined" || !firebase.firestore)
                    return;
                firebase
                    .firestore()
                    .collection("search_history")
                    .add({
                        mobile: mobile,
                        search: term,
                        timestamp:
                            firebase.firestore.FieldValue.serverTimestamp()
                    })
                    .catch(e => console.log("search save error", e));
            }

            // ✅ Search box se call karo
            function handleSearchInput() {
                const input =
                    document.getElementById("searchInput") ||
                    document.getElementById("searchBox");
                if (!input) return;
                const term = input.value.trim();
                const customer = JSON.parse(
                    localStorage.getItem("santra_customer") || "{}"
                );
                if (customer.mobile && term) {
                    saveSearch(customer.mobile, term);
                }
            }
        </script>
        <script>
            window.homeSelectedSizes = window.homeSelectedSizes || {};
            function selectHomeSize(id, size, e) {
                e.stopPropagation();
                window.homeSelectedSizes[id] = size;
                // button ka color update karo
                document.querySelectorAll(`.size-btn-${id}`).forEach(btn => {
                    btn.style.background =
                        btn.dataset.size === size ? "#e91e63" : "#fff";
                    btn.style.color =
                        btn.dataset.size === size ? "#fff" : "#000";
                });
            }
            function addHomeToCart(id, name, price, image) {
                try {
                    const size =
                        (window.homeSelectedSizes &&
                            window.homeSelectedSizes[id]) ||
                        "M";

                    // Original addToCart ko hi use karo - ye sahi key pe save karega
                    const product = {
                        id: id + "_" + size,
                        name: name + " (Size " + size + ")",
                        price: Number(price) || 0,
                        image: image || "",
                        qty: 1,
                        size: size
                    };

                    if (typeof addToCart === "function") {
                        addToCart(product); // <-- ye teri site ka asli function hai
                    }

                    alert(name + " (Size " + size + ") cart me add ho gaya!");
                } catch (err) {
                    console.error(err);
                    alert("Error: " + err.message);
                }
            }
        </script>
