<script>
window.onload = function(){
  loadAllProducts();

// ===== PURANE + FIREBASE DONO PRODUCTS LOAD KARO =====
async function loadAllProducts(){
  let container = document.getElementById('productList');
  container.innerHTML = '<p style="text-align:center;padding:40px;color:#999;grid-column:1/-1;">Loading products...</p>';
  
  let allProducts = [];
  
  // 1. Purane products - db.js se
  if(typeof DB!== 'undefined' && DB.products){
    DB.products.forEach(p => {
      allProducts.push({...p, source: 'local'});
    });
  }
  
  // 2. Firebase products
  try {
    const querySnapshot = await firebaseDB.collection('products').orderBy('created', 'desc').get();
    querySnapshot.forEach((doc) => {
      let p = doc.data();
      p.id = doc.id;
      p.source = 'firebase';
      allProducts.push(p);
    });
  } catch(err) {
    console.log('Firebase error:', err);
  }
  
  // Display karo sab
  container.innerHTML = '';
  if(allProducts.length === 0){
    container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#999;padding:40px;">No products yet. Add from Admin Panel.</p>';
    return;
  }
  
  allProducts.forEach(p => {
    let mediaHtml = '';
    let imgUrl = '';
    
    // Firebase product
    if(p.source === 'firebase'){
      imgUrl = p.images && p.images[0]? p.images[0] : 'https://via.placeholder.com/300x250?text=No+Image';
      if(p.images && p.images[0]){
        mediaHtml = `<img src="${p.images[0]}" alt="${p.name}">`;
      } else if(p.videos && p.videos[0]){
        mediaHtml = `<video src="${p.videos[0]}" controls></video>`;
      }
    } 
    // Local product - purana
    else {
      imgUrl = p.img || 'https://via.placeholder.com/300x250?text=No+Image';
      if(p.mediaType === 'image'){
        mediaHtml = `<img src="${p.mediaUrl || p.img}" alt="${p.name}">`;
      } else if(p.mediaType === 'video'){
        mediaHtml = `<video src="${p.mediaUrl}" controls></video>`;
      } else if(p.mediaType === 'audio'){
        mediaHtml = `<audio src="${p.mediaUrl}" controls style="width:100%"></audio>`;
      } else if(p.mediaType === 'document'){
        mediaHtml = `<a href="${p.mediaUrl}" target="_blank">📄 View PDF</a>`;
      } else {
        mediaHtml = `<img src="${p.img}" alt="${p.name}">`;
      }
    }
    
    container.innerHTML += `
      <div class="product-card">
        ${mediaHtml}
        <h4>${p.name} ${p.source === 'firebase'? '<span class="firebase-badge">FIREBASE</span>' : ''}</h4>
        <p><s style="font-size:12px;color:#999;">₹${p.mrp || ''}</s> ₹${p.price}</p>
        <div class="cat">Category: ${p.category || 'General'} | Stock: ${p.stock || 0}</div>
        <button onclick="addToCart('${p.id}', '${p.source}')">Add to Cart</button>
      </div>
    `;
  });
}

function addToCart(productId, source){
  let userId = localStorage.getItem('currentUserId');
  if(!userId){
    alert('Please login first!');
    window.location.href = 'customer-account.html';
    return;
  }
  
  // Firebase product
  if(source === 'firebase'){
    firebaseDB.collection('products').doc(productId).get().then((doc) => {
      if(!doc.exists){
        alert('Product not found!');
        return;
      }
      let product = doc.data();
      addToCartLocal({
        pid: productId,
        name: product.name,
        price: product.price,
        img: product.images? product.images[0] : ''
      }, userId);
    });
  } 
  // Local product
  else {
    let product = DB.products.find(p => p.id == productId);
    if(!product){
      alert('Product not found!');
      return;
    }
    addToCartLocal(product, userId);
  }
}

function addToCartLocal(product, userId){
  if(!DB.cart) DB.cart = [];
  let cartItem = DB.cart.find(c => c.pid == product.pid && c.uid == userId);
  if(cartItem){
    cartItem.qty += 1;
  } else {
    DB.cart.push({
      id: Date.now(),
      uid: parseInt(userId), 
      pid: product.pid || product.id,
      name: product.name,
      price: product.price,
      img: product.img,
      qty: 1
    });
  }
  saveDB();
  updateCartCount();
  alert('✅ Added to cart!');
}

function updateCartCount(){
  let userId = localStorage.getItem('currentUserId');
  if(!userId) {
    document.getElementById('cartCount').innerText = '0';
    return;
  }
  if(!DB.cart) DB.cart = [];
  let userCart = DB.cart.filter(c => c.uid == parseInt(userId));
  let total = userCart.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById('cartCount').innerText = total;
}

function updateLoginStatus(){
  let userId = localStorage.getItem('currentUserId');
  if(userId && DB.users){
    let user = DB.users.find(u => u.id == parseInt(userId));
    if(user){
      document.getElementById('loginText').innerHTML = 'ACCOUNT';
    }
  }
}



function trackOrderPopup(orderId){
  let order = DB.orders.find(o => o.id == orderId);
  if(!order) return;
  let statusMsg = {
    'Confirmed': 'Your order is confirmed and will be shipped soon',
    'Shipped': 'Your order is on the way! Expected delivery in 2-3 days',
    'Delivered': 'Your order has been delivered successfully',
    'Canceled': 'This order has been cancelled',
    'Returned': 'Return request is being processed',
    'Refunded': 'Refund has been initiated to your account',
    'Exchange': 'Exchange request is being processed'
  };
  alert('📍 Order Tracking\n\nOrder ID: #' + order.id + '\nStatus: ' + order.status + '\n\n' + statusMsg[order.status]);
}

function requestActionPopup(orderId, type){
  let reason = prompt(`Please provide reason for ${type} request:`);
  if(!reason) return;
  let order = DB.orders.find(o => o.id == orderId);
  if(!order) return;
  let newStatus = type + 'ed';
  if(type === 'Exchange') newStatus = 'Exchange';
  if(type === 'Cancel') newStatus = 'Canceled';
  order.status = newStatus;
  order.requestReason = reason;
  order.requestTime = new Date().toISOString();
  saveCustomerForm(parseInt(localStorage.getItem('currentUserId')), type.toLowerCase() + '_request', {
    orderId: order.id,
    reason: reason,
    orderTotal: order.total,
    items: order.items.length,
    requestTime: new Date().toISOString()
  });
  saveDB();
  alert('✅ ' + type + ' request submitted successfully!\n\nAdmin will review and contact you soon.');
  openOrdersPopup();
}
</script>
