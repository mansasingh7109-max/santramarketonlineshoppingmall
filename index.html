        <script>

            function customerLogout() {
                if (confirm("Logout karna hai?")) {
                    auth.signOut().then(() => {
                        localStorage.removeItem("santra_customer");
                        localStorage.removeItem("santra_cart");
                        localStorage.removeItem("santra_wishlist");
                        localStorage.removeItem("pendingOTP");
                        showToast("Logged out successfully");
                        setTimeout(() => location.reload(), 500);
                    }).catch((error) => {
                        console.error("Logout error:", error);
                        localStorage.removeItem("santra_customer");
                        location.reload();
                    });
                }
            }

            // ✅ NEW CODE - FIX: Sirf 2 button Logic - E-commerce jaisa
            function checkCustomerLogin() {
                const customer = JSON.parse(localStorage.getItem("santra_customer") || "{}");
                const pendingOTP = localStorage.getItem("pendingOTP");

                const loginBtn = document.getElementById("loginBtn");
                const logoutBtn = document.getElementById("logoutBtn");
                const verifyOtpBtn = document.getElementById("verifyOtpBtn");
                const userInfo = document.getElementById("userInfo");
                const userName = document.getElementById("userName");
                const customerInfoBar = document.getElementById("customerInfoBar");
                const customerNameDisplay = document.getElementById("customerNameDisplay");
                const customerMobileDisplay = document.getElementById("customerMobileDisplay");
                const oldCustomerBadge = document.getElementById("oldCustomerBadge");

                // Pehle sab hide
                loginBtn.classList.add("hide");
                logoutBtn.classList.add("hide");
                verifyOtpBtn.classList.add("hide");
                if (userInfo) userInfo.classList.add("hide");
                if (customerInfoBar) customerInfoBar.classList.add("hide");

                // CASE 1: Login hai
                if (customer.name && customer.isLoggedIn === true) {
                    if (customerInfoBar) customerInfoBar.classList.remove("hide");
                    if (customerNameDisplay) customerNameDisplay.innerText = customer.name;
                    if (customerMobileDisplay) customerMobileDisplay.innerText = customer.mobile;
                    if (logoutBtn) logoutBtn.classList.remove("hide");
                    if (userInfo) userInfo.classList.remove("hide");
                    if (userName) userName.innerText = customer.name;

                    if (customer.isOldCustomer && customer.totalOrders > 0) {
                        if (oldCustomerBadge) {
                            oldCustomerBadge.classList.remove("hide");
                            oldCustomerBadge.innerText = `🔥 ${customer.totalOrders} Orders`;
                        }
                    }
                }
                // CASE 2: OTP Pending hai
                else if (pendingOTP) {
                    if (verifyOtpBtn) verifyOtpBtn.classList.remove("hide");
                }
                // CASE 3: Login nahi hai
                else {
                    if (loginBtn) loginBtn.classList.remove("hide");
                }
            }

            document.addEventListener("DOMContentLoaded", function() {
                checkCustomerLogin();
            });

            auth.onAuthStateChanged(user => {
                currentUser = user;
                checkCustomerLogin();
                updateCartCount();
            });

            window.onload = function () {
                loadProducts();
                updateCartCount();
                checkCustomerLogin();
            };

            function loadProducts() {
                allProducts = [];
                db.collection("products").onSnapshot(firestoreSnap => {
                    let firestoreProducts = [];
                    firestoreSnap.forEach(doc => {
                        let p = doc.data();
                        p.id = doc.id;
                        p.price = parseFloat(p.price) || 0;
                        p.stock = p.stock!== undefined && p.stock!== null? parseInt(p.stock) : 0;
                        p.mrp = parseFloat(p.mrp) || p.price;
                        p.dbType = "firestore";
                        firestoreProducts.push(p);
                    });

                    rtdb.ref("products").on("value", rtdbSnap => {
                        let rtdbProducts = [];
                        if (rtdbSnap.exists()) {
                            rtdbSnap.forEach(child => {
                                let p = child.val();
                                p.id = child.key;
                                p.price = parseFloat(p.price) || 0;
                                p.stock = p.stock!== undefined && p.stock!== null? parseInt(p.stock) : 0;
                                p.mrp = parseFloat(p.mrp) || p.price;
                                p.dbType = "rtdb";
                                rtdbProducts.push(p);
                            });
                        }

                        allProducts = [...firestoreProducts,...rtdbProducts];
                        renderProducts(allProducts);
                        generateAutoCategories();
                        generateCategoryDropdown();
                        localStorage.setItem("ALL_PRODUCTS", JSON.stringify(allProducts));
                    });
                });
            }

            function generateAutoCategories() {
                db.collection("categories").get().then(catSnap => {
                    let categories = [];
                    let catImages = {};
                    catSnap.forEach(doc => {
                        const data = doc.data();
                        categories.push(data.name);
                        catImages[data.name] = data.image || "";
                    });

                    const catsFromProducts = [...new Set(allProducts.map(p => p.category).filter(c => c))];
                    catsFromProducts.forEach(c => {
                        if (!categories.includes(c)) categories.push(c);
                    });

                    if (categories.length === 0) {
                        document.getElementById("categoryList").innerHTML = '<div class="loading">No categories found</div>';
                        return;
                    }

                    let html = "";
                    categories.forEach(catName => {
                        const catImage = catImages[catName] || "https://via.placeholder.com/50?text=" + encodeURIComponent(catName);
                        html += `<div class="cat-item" onclick="filterByCategory('${catName}')"><img src="${catImage}" alt="${catName}"><p>${catName}</p></div>`;
                    });
                    document.getElementById("categoryList").innerHTML = html;
                }).catch(err => {
                    console.error("Category load error:", err);
                    document.getElementById("categoryList").innerHTML = '<div class="loading">Error loading categories</div>';
                });
            }

            function generateCategoryDropdown() {
                const categories = [...new Set(allProducts.map(p => p.category).filter(c => c))];
                let html = '<option value="">All Categories</option>';
                categories.forEach(cat => {
                    html += `<option value="${cat}">${cat}</option>`;
                });
                document.getElementById("categorySelect").innerHTML = html;
            }

            function getProductImage(p) {
                if (typeof getProductThumbnail!== "undefined") {
                    return getProductThumbnail(p);
                }
                if (p.media && Array.isArray(p.media) && p.media.length > 0 && p.media[0].url) return p.media[0].url;
                if (p.images && Array.isArray(p.images) && p.images.length > 0) return p.images[0];
                if (p.image) return p.image;
                if (p.imageUrl) return p.imageUrl;
                return "https://via.placeholder.com/300x300/cccccc/ffffff?text=No+Image";
            }

            function renderProducts(products) {
                let html = "";
                products.forEach(p => {
                    currentSlideIndex[p.id] = 0;
                    let images = [];
                    if (p.media && Array.isArray(p.media) && p.media.length > 0) {
                        images = p.media.map(m => m.url).filter(url => url);
                    }
                    if (images.length === 0 && p.images && Array.isArray(p.images) && p.images.length > 0) {
                        images = p.images.filter(url => url);
                    }
                    if (images.length === 0) {
                        images = [getProductImage(p)];
                    }
                    html += `
                      <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                        ${p.stock < 5 && p.stock > 0? '<div class="new-badge">Low Stock</div>' : ""}
                        ${p.stock === 0? '<div class="new-badge" style="background:#999">Out of Stock</div>' : ""}
                        ${images.length > 1? `<div class="img-count">📷 ${images.length}</div>` : ""}
                        <div class="image-slider" style="position:relative;">
                         ${images.map((img, idx) => `<img src="${img}" class="slide-img ${idx === 0? "active" : ""}" alt="${p.name}" style="display:${idx === 0? "block" : "none"};width:100%;height:200px;object-fit:cover;">`).join("")}
                          ${images.length > 1? `
                            <button class="prev-btn" onclick="changeSlide('${p.id}', -1, event)"><</button>
                            <button class="next-btn" onclick="changeSlide('${p.id}', 1, event)">></button>
                          ` : ""}
                        </div>
                        <div class="product-info">
                          <h3>${p.name || "Product"}</h3>
                          <div>
                            <span class="price">₹${p.price}</span>
                          ${p.mrp && p.mrp > p.price? `<span class="mrp" style="text-decoration:line-through;color:#999;margin-left:5px;">₹${p.mrp}</span>` : ""}
                          </div>
                          <p class="stock">Stock: ${p.stock}</p>
                        </div>
                        <div class="product-actions">
                         <button class="add-to-cart-btn" onclick="addToCart({id: '${p.id}', name: '${p.name}', price: ${p.price}, image: '${getProductImage(p)}', code: '${p.code || p.id}'});event.stopPropagation();">Add to Cart</button>
                         <button class="buy-now-btn" onclick="buyNow('${p.id}', event)">Buy Now</button>
                        </div>
                      </div>
                    `;
                });
                document.getElementById("productGrid").innerHTML = html || '<div class="loading">No products found</div>';
            }

            function changeSlide(productId, direction, event) {
                event.stopPropagation();
                let product = allProducts.find(p => p.id === productId);
                if (!product) return;
                let images = [];
                if (product.media && product.media.length > 0)
                    images = product.media.map(m => m.url);
                else if (product.images && product.images.length > 0)
                    images = product.images;
                else images = [getProductImage(product)];
                currentSlideIndex[productId] =
                    (currentSlideIndex[productId] + direction + images.length) %
                    images.length;
                updateSlider(productId);
            }

            function updateSlider(productId) {
                let sliderCard = document.querySelector(
                    `[onclick*="product.html?id=${productId}"]`
                );
                if (!sliderCard) return;
                let slides = sliderCard.querySelectorAll(".slide-img");
                slides.forEach((slide, idx) => {
                    slide.style.display =
                        idx === currentSlideIndex[productId]? "block" : "none";
                });
            }

            function addToCart(product) {
                let cart = JSON.parse(localStorage.getItem("santra_cart") || "{}");
                if (cart.cart) cart = cart.cart;
                if (cart[product.id]) {
                    cart[product.id].qty += 1;
                } else {
                    cart[product.id] = {
                        id: product.id,
                        name: product.name,
                        price: product.price,
                        image: product.image,
                        productCode: product.code || product.id,
                        qty: 1
                    };
                }
                localStorage.setItem("santra_cart", JSON.stringify(cart));
                showToast("✅ Added to Cart!");
                updateCartCount();
            }

            function updateCartCount() {
                let cart = JSON.parse(localStorage.getItem("santra_cart") || "{}");
                let totalItems = Object.values(cart).reduce((sum, item) => sum + (parseInt(item.qty) || 1), 0);
                let cartBottom = document.getElementById("cartCountBottom");
                if (cartBottom) cartBottom.innerText = totalItems;
            }

            function buyNow(productId, event) {
                event.stopPropagation();
                let product = allProducts.find(p => p.id === productId);
                if (product) {
                    addToCart({
                        id: product.id,
                        name: product.name,
                        price: product.price,
                        image: getProductImage(product),
                        code: product.code || product.id
                    });
                    setTimeout(() => {
                        window.location.href = "cart.html";
                    }, 500);
                }
            }

            function searchProducts() {
                let query = document.getElementById("searchInput").value.toLowerCase();
                let filtered = allProducts.filter(p => p.name.toLowerCase().includes(query) || (p.category && p.category.toLowerCase().includes(query)));
                renderProducts(filtered);
            }

            function goHome() { window.scrollTo(0, 0); }
            function openCategories() { window.location.href = "category.html"; }
            function openCart() { window.location.href = "cart.html"; }
            function openOrders() {
                let customer = localStorage.getItem("santra_customer");
                if (!customer) {
                    alert("⚠️ Please login first to see your orders");
                    window.location.href = "customer-login.html";
                } else {
                    window.location.href = "orders.html";
                }
            }

            // ✅ FIX 2: Variants/Features/Size/Color/Character Auto Load - Pehle jaisa
            function onCategoryChange() {
                const cat = document.getElementById("categorySelect").value;
                if (cat === "") {
                    renderProducts(allProducts);
                    document.getElementById("dynamicFilters").innerHTML = "";
                } else {
                    let filtered = allProducts.filter(p => p.category === cat);
                    renderProducts(filtered);
                    generateDynamicFilters(filtered);
                }
            }

            function generateDynamicFilters(products) {
                let variants = new Set();
                let sizes = new Set();
                let colors = new Set();
                let features = new Set();
                let characters = new Set();
                let patterns = new Set();
                let materials = new Set();

                products.forEach(p => {
                    if (p.variants) {
                        if (Array.isArray(p.variants)) {
                            p.variants.forEach(v => variants.add(v));
                        } else if (typeof p.variants === 'string') {
                            variants.add(p.variants);
                        }
                    }
                    if (p.size) sizes.add(p.size);
                    if (p.sizes && Array.isArray(p.sizes)) p.sizes.forEach(s => sizes.add(s));
                    if (p.color) colors.add(p.color);
                    if (p.colors && Array.isArray(p.colors)) p.colors.forEach(c => colors.add(c));
                    if (p.features) {
                        if (Array.isArray(p.features)) {
                            p.features.forEach(f => features.add(f));
                        } else if (typeof p.features === 'string') {
                            features.add(p.features);
                        }
                    }
                    if (p.character) characters.add(p.character);
                    if (p.pattern) patterns.add(p.pattern);
                    if (p.material) materials.add(p.material);
                });

                let html = '';

                if (variants.size > 0) {
                    html += `<div class="filter-group"><label><b>Variants:</b></label>`;
                    html += `<select data-field="variants" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Variants</option>`;
                    variants.forEach(v => html += `<option value="${v}">${v}</option>`);
                    html += `</select></div>`;
                }

                if (characters.size > 0) {
                    html += `<div class="filter-group"><label><b>Character:</b></label>`;
                    html += `<select data-field="character" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Characters</option>`;
                    characters.forEach(c => html += `<option value="${c}">${c}</option>`);
                    html += `</select></div>`;
                }

                if (sizes.size > 0) {
                    html += `<div class="filter-group"><label><b>Size:</b></label>`;
                    html += `<select data-field="size" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Sizes</option>`;
                    sizes.forEach(s => html += `<option value="${s}">${s}</option>`);
                    html += `</select></div>`;
                }

                if (colors.size > 0) {
                    html += `<div class="filter-group"><label><b>Color:</b></label>`;
                    html += `<select data-field="color" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Colors</option>`;
                    colors.forEach(c => html += `<option value="${c}">${c}</option>`);
                    html += `</select></div>`;
                }

                if (patterns.size > 0) {
                    html += `<div class="filter-group"><label><b>Pattern:</b></label>`;
                    html += `<select data-field="pattern" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Patterns</option>`;
                    patterns.forEach(p => html += `<option value="${p}">${p}</option>`);
                    html += `</select></div>`;
                }

                if (materials.size > 0) {
                    html += `<div class="filter-group"><label><b>Material:</b></label>`;
                    html += `<select data-field="material" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Materials</option>`;
                    materials.forEach(m => html += `<option value="${m}">${m}</option>`);
                    html += `</select></div>`;
                }

                if (features.size > 0) {
                    html += `<div class="filter-group"><label><b>Features:</b></label>`;
                    html += `<select data-field="features" onchange="applySmartFilters()" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:5px;">`;
                    html += `<option value="">All Features</option>`;
                    features.forEach(f => html += `<option value="${f}">${f}</option>`);
                    html += `</select></div>`;
                }

                document.getElementById("dynamicFilters").innerHTML = html;
            }

            function applySmartFilters() {
                const cat = document.getElementById("categorySelect").value;
                let filtered = allProducts;

                if (cat!== "") {
                    filtered = filtered.filter(p => p.category === cat);
                }

                const dynamicFilters = document.querySelectorAll("#dynamicFilters select");
                dynamicFilters.forEach(select => {
                    const field = select.dataset.field;
                    const value = select.value;
                    if (value) {
                        filtered = filtered.filter(p => {
                            if (Array.isArray(p[field])) {
                                return p[field].includes(value);
                            }
                            if (p[field] == value) return true;
                            if (field === 'size' && p.sizes && p.sizes.includes(value)) return true;
                            if (field === 'color' && p.colors && p.colors.includes(value)) return true;
                            if (field === 'variants' && (p.character == value || p.pattern == value || p.material == value)) return true;
                            return false;
                        });
                    }
                });

                renderProducts(filtered);
            }

            function clearSmartFilters() {
                document.getElementById("categorySelect").value = "";
                document.getElementById("dynamicFilters").innerHTML = "";
                renderProducts(allProducts);
            }

            function filterByCategory(catName) {
                document.getElementById("categorySelect").value = catName;
                let filtered = allProducts.filter(p => p.category === catName);
                renderProducts(filtered);
                generateDynamicFilters(filtered);
                document.getElementById("productGrid").scrollIntoView({ behavior: "smooth" });
            }

            function showToast(message) {
                const toast = document.createElement("div");
                toast.innerText = message;
                toast.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 20px;border-radius:8px;z-index:9999;font-size:14px";
                document.body.appendChild(toast);
                setTimeout(() => document.body.removeChild(toast), 3000);
            }
            function openVerifyOtpPopup() { alert("OTP Verify feature - Add code"); }
        </script>
    </body>
</html>
