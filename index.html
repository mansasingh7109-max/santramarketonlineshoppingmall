<script>
// ✅ OLD CODE SAVED - DELETE NAHI KIYA
// const CART_KEY = "santraMallCart_v2"; // ab constants.js me hai
// const MYCHOICE_KEY = "santraMallMyChoice_v2"; // ab constants.js me hai
// if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); // secrets.js karega
// OLD: var rtdb = firebase.database(); var auth = firebase.auth(); var db = firebase.firestore(); // ab window.rtdb

// FIXED - Duplicate error khatam
var rtdb = window.rtdb || firebase.database();
var auth = window.auth || firebase.auth();
var db = window.db || firebase.firestore();
var storage = firebase.storage? firebase.storage() : null;
function getCartKey(){ return window.CART_KEY || (window.SANTRA && window.SANTRA.KEYS.CART) || "santraMallCart_v2"; }
function getChoiceKey(){ return window.MYCHOICE_KEY || (window.SANTRA && window.SANTRA.KEYS.CHOICE) || "santraMallMyChoice_v2"; }

let allProducts=[]; let currentSlideIndex={}; let currentUser=null;
function customerLogout(){
 if(confirm("Logout karna hai?")){
  const CART=getCartKey(); const CHOICE=getChoiceKey();
  (window.auth||firebase.auth()).signOut().then(()=>{
    localStorage.removeItem("santra_customer");
    localStorage.removeItem(CART);
    localStorage.removeItem(CHOICE);
    // OLD SAVED: localStorage.removeItem("santrajet_mychoice");
    location.reload();
  });
 }
}
function updateCustomerButton(){
 const customer=localStorage.getItem("santra_customer");
 const sidebarDiv=document.getElementById("sidebarCustomerSection");
 const logoutBtn=document.getElementById("logoutBtn");
 const userInfo=document.getElementById("userInfo");
 const userName=document.getElementById("userName");
 if(!sidebarDiv) return;
 if(customer && JSON.parse(customer).isLoggedIn){
  const cust=JSON.parse(customer); const firstName=(cust.name||"Customer").split(" ")[0];
  const photo=cust.photo||"https://cdn-icons-png.flaticon.com/128/1077/1077114.png";
  sidebarDiv.innerHTML=`<button class="sidebar-btn" onclick="window.location.href='customer-account.html'" style="background:linear-gradient(135deg,#10b981,#059669);"><img src="${photo}" style="width:24px;height:24px;border-radius:50%;border:2px solid white">${firstName}<br>Profile</button>`;
  if(logoutBtn) logoutBtn.classList.add("show");
  if(userInfo){ userInfo.classList.remove("hide"); if(userName) userName.innerText=firstName; }
 } else {
  sidebarDiv.innerHTML=`<button class="sidebar-btn" onclick="window.location.href='customer-account.html'"><img src="https://cdn-icons-png.flaticon.com/128/1077/1077114.png" style="width:24px;height:24px">Customer<br>Login</button>`;
  if(logoutBtn) logoutBtn.classList.remove("show");
  if(userInfo) userInfo.classList.add("hide");
 }
}
function checkCustomerLogin(){ updateCustomerButton(); }
document.addEventListener("DOMContentLoaded", function(){ checkCustomerLogin(); loadProducts(); updateCartCount(); });
function loadProducts(){
 allProducts=[];
 const fdb=window.db||firebase.firestore(); const rdb=window.rtdb||firebase.database();
 fdb.collection("products").onSnapshot(firestoreSnap=>{
  let fps=[]; firestoreSnap.forEach(doc=>{let p=doc.data(); p.id=doc.id; p.price=parseFloat(p.price)||0; fps.push(p);});
  rdb.ref("products").on("value", rtdbSnap=>{
   let rps=[]; if(rtdbSnap.exists()){ rtdbSnap.forEach(child=>{let p=child.val(); p.id=child.key; p.price=parseFloat(p.price)||0; rps.push(p);});}
   allProducts=[...fps,...rps]; renderProducts(allProducts); generateAutoCategories(); generateCategoryDropdown();
  });
 });
}
function getProductImage(p){ if(p.media&&p.media[0]?.url) return p.media[0].url; if(p.images&&p.images[0]) return p.images[0]; if(p.image) return p.image; return "https://via.placeholder.com/300?text=No+Image"; }
</script>

<script>
function generateAutoCategories(){
 const fdb=window.db||firebase.firestore();
 fdb.collection("categories").get().then(catSnap=>{
  let categories=[]; let catImages={};
  catSnap.forEach(doc=>{const d=doc.data(); categories.push(d.name); catImages[d.name]=d.image||"";});
  const catsFromProducts=[...new Set(allProducts.map(p=>p.category).filter(c=>c))];
  catsFromProducts.forEach(c=>{ if(!categories.includes(c)) categories.push(c); });
  if(categories.length===0){ document.getElementById("categoryList").innerHTML='<div>No categories</div>'; return; }
  let html=""; categories.forEach(catName=>{
   const img=catImages[catName]||"https://via.placeholder.com/50?text="+encodeURIComponent(catName);
   html+=`<div class="cat-item" onclick="filterByCategory('${catName}')"><img src="${img}" alt="${catName}"><p>${catName}</p></div>`;
  });
  document.getElementById("categoryList").innerHTML=html;
 }).catch(err=>{
  let cats=[...new Set(allProducts.map(p=>p.category).filter(c=>c))];
  let html=""; cats.forEach(cat=>{ html+=`<div class="cat-item" onclick="filterByCategory('${cat}')"><p>${cat}</p></div>`; });
  document.getElementById("categoryList").innerHTML=html||'<div>No categories</div>';
 });
}
function generateCategoryDropdown(){
 const categories=[...new Set(allProducts.map(p=>p.category).filter(c=>c))];
 let html='<option value="">All Categories</option>'; categories.forEach(cat=>{ html+=`<option value="${cat}">${cat}</option>`; });
 const sel=document.getElementById("categorySelect"); if(sel) sel.innerHTML=html;
}
function filterByCategory(catName){ document.getElementById("categorySelect").value=catName; renderProducts(allProducts.filter(p=>p.category===catName)); generateDynamicFilters(allProducts.filter(p=>p.category===catName)); }
function onCategoryChange(){
 const cat=document.getElementById("categorySelect").value;
 if(cat===""){ renderProducts(allProducts); document.getElementById("dynamicFilters").innerHTML=""; }
 else { let filtered=allProducts.filter(p=>p.category===cat); renderProducts(filtered); generateDynamicFilters(filtered); }
}
function generateDynamicFilters(products){
 // ✅ SMART VARIANT LOGIC - Liquid = Liter, Fabric = Size
 let sizes=new Set(); let colors=new Set(); let materials=new Set(); let variants=new Set();
 let isLiquid = products.some(p=> (p.category||"").toLowerCase().includes("soap") || (p.category||"").toLowerCase().includes("liquid") || (p.name||"").toLowerCase().includes("oil"));
 products.forEach(p=>{
  if(p.size) sizes.add(p.size);
  if(p.sizes) p.sizes.forEach(s=>sizes.add(s));
  if(p.color) colors.add(p.color);
  if(p.material) materials.add(p.material);
  if(p.variants) (Array.isArray(p.variants)?p.variants:[p.variants]).forEach(v=>variants.add(v));
 });
 let html="";
 if(isLiquid){
  html+=`<div class="filter-group"><label>Volume:</label><select data-field="volume" onchange="applySmartFilters()"><option value="">All</option><option>500 ml</option><option>1 Liter</option><option>2 Liter</option></select></div>`;
 } else if(sizes.size>0){
  html+=`<div class="filter-group"><label>Size:</label><select data-field="size" onchange="applySmartFilters()"><option value="">All Sizes</option>`; sizes.forEach(s=>html+=`<option>${s}</option>`); html+=`</select></div>`;
 }
 if(colors.size>0){ html+=`<div class="filter-group"><label>Color:</label><select data-field="color" onchange="applySmartFilters()"><option>All Colors</option>`; colors.forEach(c=>html+=`<option>${c}</option>`); html+=`</select></div>`; }
 if(materials.size>0){ html+=`<div class="filter-group"><label>Material:</label><select data-field="material" onchange="applySmartFilters()"><option>All Materials</option>`; materials.forEach(m=>html+=`<option>${m}</option>`); html+=`</select></div>`; }
 document.getElementById("dynamicFilters").innerHTML=html;
}
function applySmartFilters(){ onCategoryChange(); }
function clearSmartFilters(){ document.getElementById("categorySelect").value=""; document.getElementById("dynamicFilters").innerHTML=""; renderProducts(allProducts); }
function renderProducts(products){
 let html="";
 products.forEach(p=>{
  currentSlideIndex[p.id]=0;
  let images=p.images||[getProductImage(p)];
  // ✅ VARIANT BUTTON - Liquid vs Fabric
  let variantButtons="";
  if((p.category||"").toLowerCase().includes("soap")||(p.category||"").toLowerCase().includes("liquid")||(p.name||"").toLowerCase().includes("oil")){
   variantButtons=["500 ml","1 L","2 L"].map(s=>`<button type="button" class="size-btn-${p.id}" data-size="${s}" onclick="selectHomeSize('${p.id}','${s}',event)" style="padding:3px 8px;border:1px solid #ddd;border-radius:4px;background:${((window.homeSelectedSizes&&window.homeSelectedSizes[p.id])||"1 L")===s?"#e91e63":"#fff"};color:${((window.homeSelectedSizes&&window.homeSelectedSizes[p.id])||"1 L")===s?"#fff":"#333"};font-size:10px;">${s}</button>`).join("");
  } else {
   variantButtons=["S","M","L","XL","XXL"].map(s=>`<button type="button" class="size-btn-${p.id}" data-size="${s}" onclick="selectHomeSize('${p.id}','${s}',event)" style="padding:3px 8px;border:1px solid #ddd;border-radius:4px;background:${((window.homeSelectedSizes&&window.homeSelectedSizes[p.id])||"M")===s?"#e91e63":"#fff"};color:${((window.homeSelectedSizes&&window.homeSelectedSizes[p.id])||"M")===s?"#fff":"#333"};font-size:12px;">${s}</button>`).join("");
  }
  html+=`<div class="product-card">
   <div class="image-slider" style="position:relative;">
    <button onclick="event.stopPropagation(); toggleMyChoice('${p.id}')" id="heart-${p.id}" style="position:absolute;top:8px;right:8px;background:white;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;z-index:999">🤍</button>
    ${images.map((img,idx)=>`<img src="${img}" style="display:${idx===0?"block":"none"};width:100%;height:140px;object-fit:contain;" onclick="window.location.href='product.html?id=${p.id}'">`).join("")}
   </div>
   <div class="product-info"><h3>${p.name}</h3><span class="price">₹${p.price}</span><p>Stock: ${p.stock}</p></div>
   <div class="product-actions"><div style="display:flex;gap:5px;flex-wrap:wrap;">${variantButtons}</div><button class="add-to-cart-btn" onclick="addHomeToCart('${p.id}','${p.name.replace(/'/g,"\\'")}',${p.price},'${p.image||""}');event.stopPropagation();">Add to Cart</button><button class="buy-now-btn" onclick="buyNow('${p.id}',event)">Buy Now</button></div>
  </div>`;
 });
 document.getElementById("productGrid").innerHTML=html||'<div>No products</div>';
 updateHeartIcons(); updateCartCount();
}
</script>

<script>
function addToCart(product){
 if(window._addingToCart) return;
 window._addingToCart=true; setTimeout(()=>window._addingToCart=false,700);
 if(!product||!product.id){ showToast("❌ Product data missing"); return; }
 const CART=getCartKey();
 let cartArray=JSON.parse(localStorage.getItem(CART)||"[]");
 let idx=cartArray.findIndex(item=>item.id===product.id);
 if(idx>-1){ cartArray[idx].qty+=1; } else { cartArray.push({id:product.id,name:product.name,price:parseFloat(product.price)||0,image:product.image||getProductImage(product),qty:1}); }
 localStorage.setItem(CART, JSON.stringify(cartArray));
 showToast("✅ Added to Cart!"); updateCartCount();
}
function updateCartCount(){
 const CART=getCartKey(); const CHOICE=getChoiceKey();
 let cartArray=JSON.parse(localStorage.getItem(CART)||"[]");
 let total=cartArray.reduce((s,i)=>s+(parseInt(i.qty)||1),0);
 const el=document.getElementById("cartCountBottom"); if(el) el.innerText=total;
 const choiceArray=JSON.parse(localStorage.getItem(CHOICE)||"[]");
 const badge=document.getElementById("choiceBadge");
 if(badge){ badge.innerText=choiceArray.length; badge.style.display=choiceArray.length>0?"flex":"none"; }
 updateHeartIcons();
}
function buyNow(id,e){ e.stopPropagation(); let p=allProducts.find(x=>x.id===id); if(p){ addToCart({id:p.id,name:p.name,price:p.price,image:getProductImage(p)}); setTimeout(()=>location.href="cart.html",500);} }
function goHome(){window.scrollTo(0,0);} function openCategories(){location.href="category.html";} function openCart(){location.href="cart.html";} function openOrders(){let c=localStorage.getItem("santra_customer"); if(!c){alert("Login first"); location.href="customer-account.html";} else location.href="orders.html";}
function showToast(m){let t=document.createElement("div"); t.innerText=m; t.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 20px;border-radius:8px;z-index:9999"; document.body.appendChild(t); setTimeout(()=>t.remove(),2500);}
function toggleMyChoice(productId){
 const CHOICE=getChoiceKey();
 let choiceArray=JSON.parse(localStorage.getItem(CHOICE)||"[]");
 let idx=choiceArray.findIndex(i=>i.id===productId || i.productId===productId);
 if(idx>-1){ choiceArray.splice(idx,1); showToast("💔 Removed from My Choice"); }
 else { let prod=allProducts.find(p=>p.id===productId); if(!prod){ showToast("Product not found"); return; } choiceArray.push({id:prod.id,productId:prod.id,name:prod.name,price:prod.price,image:getProductImage(prod)}); showToast("😍 Added to My Choice"); }
 localStorage.setItem(CHOICE, JSON.stringify(choiceArray));
 // OLD SAVED
 // localStorage.setItem("santrajet_mychoice", JSON.stringify(choiceArray));
 // localStorage.setItem("choice", JSON.stringify(choiceArray));
 updateCartCount();
}
function updateHeartIcons(){
 const CHOICE=getChoiceKey();
 const arr=JSON.parse(localStorage.getItem(CHOICE)||"[]");
 arr.forEach(item=>{ const h=document.getElementById(`heart-${item.id||item.productId}`); if(h) h.innerText="❤️"; });
}
window.homeSelectedSizes=window.homeSelectedSizes||{};
function selectHomeSize(id,size,e){ e.stopPropagation(); window.homeSelectedSizes[id]=size; document.querySelectorAll(`.size-btn-${id}`).forEach(btn=>{ btn.style.background=btn.dataset.size===size?"#e91e63":"#fff"; btn.style.color=btn.dataset.size===size?"#fff":"#000"; });}
function addHomeToCart(id,name,price,image){
 const size=(window.homeSelectedSizes&&window.homeSelectedSizes[id])||"M";
 const product={id:id+"_"+size,name:name+" (Size "+size+")",price:Number(price)||0,image:image||"",qty:1,size:size};
 addToCart(product);
}
function searchProducts(){ let q=document.getElementById("searchInput").value.toLowerCase(); let f=allProducts.filter(p=>p.name.toLowerCase().includes(q)); renderProducts(f); }
window.addEventListener("load", updateCartCount);
window.addEventListener("storage", updateCartCount);

<script>
// ✅ LEFT PATTI HATANE KA FINAL FIX
function fixLeftPatti(){
  // Sabhi fixed left wali patti dhoondo aur hatao
  document.querySelectorAll('*').forEach(function(el){
    try{
      var s = window.getComputedStyle(el);
      var w = parseInt(s.width);
      // Jo bhi left:0 pe fixed hai aur width 120px se kam hai (aapki pink patti 80px ki hai) usko hide karo
      if(s.position === 'fixed' && s.left === '0px' && w > 10 && w < 150 && s.height !== 'auto'){
        if(el.innerHTML.includes('Customer') || el.innerHTML.includes('HELP') || w < 120){
          el.style.display = 'none';
          el.style.left = '-100%';
          el.style.transform = 'translateX(-100%)';
          console.log('✅ Left patti removed:', el);
        }
      }
    }catch(e){}
  });

  // Product grid ko full width do
  var grids = document.querySelectorAll('#productGrid, .product-grid, #hotDealsGrid, .products-wrapper, main');
  grids.forEach(function(g){
    g.style.marginLeft = '0';
    g.style.width = '100%';
    g.style.paddingLeft = '8px';
    g.style.left = '0';
  });
  document.body.style.overflow = 'auto';
  document.body.style.marginLeft = '0';
}

// Page load pe 3 baar chalao taaki pakka hat jaye
window.addEventListener('load', function(){
  fixLeftPatti();
  setTimeout(fixLeftPatti, 500);
  setTimeout(fixLeftPatti, 1500);
});
document.addEventListener('DOMContentLoaded', fixLeftPatti);
</script>
